<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Category – Eatswada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  
  <style>
  :root{
    --ew-green:#159447;
    --ew-green-dark:#08783a;
    --ew-text:#171717;
    --ew-muted:#777;
    --ew-border:#eeeeee;
    --ew-soft:#f7f8f8;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    background:#fff;
    color:var(--ew-text);
    padding-bottom:84px;
    font-family:var(--font);
    -webkit-font-smoothing:antialiased;
  }

  .cat-header{
    position:sticky;top:0;z-index:50;
    background:rgba(255,255,255,.96);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    padding:11px 16px;
    display:flex;justify-content:space-between;align-items:center;
    border-bottom:1px solid rgba(0,0,0,.055);
    box-shadow:0 5px 18px rgba(0,0,0,.035);
  }
  .cat-header-left{display:flex;align-items:center;gap:11px;min-width:0}
  .icon-btn-round{
    width:40px;height:40px;display:grid;place-items:center;
    border-radius:13px;background:#f6f7f7;border:1px solid #f0f1f1;
    cursor:pointer;color:#2c2c2c;flex:0 0 40px;
    transition:transform .15s ease,background .15s ease;
  }
  .icon-btn-round:active{transform:scale(.94);background:#eef0ef}
  .cat-title{
    margin:0;font-size:18px;font-weight:800;color:#151515;line-height:1.2;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis
  }
  .cat-sub{
    margin:3px 0 0;font-size:10px;font-weight:700;color:#999;
    text-transform:uppercase;letter-spacing:.09em
  }

  .filter-bar{
    display:flex;overflow-x:auto;gap:8px;padding:10px 16px;
    background:rgba(250,250,250,.92);
    border-bottom:1px solid #f1f2f2;
    scrollbar-width:none;
    position:sticky;top:63px;z-index:40;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  }
  .filter-bar::-webkit-scrollbar{display:none}
  .filter-pill{
    display:inline-flex;align-items:center;gap:5px;padding:7px 13px;
    border:1px solid #e4e6e5;border-radius:999px;
    font-family:var(--font);font-size:11px;font-weight:800;
    color:#626665;background:#fff;white-space:nowrap;cursor:pointer;
    transition:all .15s ease;box-shadow:0 2px 7px rgba(0,0,0,.025)
  }
  .filter-pill:active{transform:scale(.97)}
  .filter-pill.active{
    border-color:var(--ew-green);background:var(--ew-green);color:#fff;
    box-shadow:0 5px 14px rgba(21,148,71,.16)
  }

  .results-container{padding:18px 16px 24px}
  .res-count{
    margin:0 0 12px;font-size:11px;font-weight:800;color:#8b8f8d;
    text-transform:uppercase;letter-spacing:.09em
  }

  .res-card{
    display:flex;gap:13px;margin-bottom:17px;text-decoration:none;
    color:inherit;transition:transform .15s ease
  }
  .res-card:active{transform:scale(.985)}
  .res-img-wrap{
    position:relative;width:108px;height:108px;flex:0 0 108px;
    border-radius:17px;overflow:hidden;background:#f3f5f4
  }
  .res-img-wrap img{
    width:100%;height:100%;object-fit:cover;display:block;
    border-radius:17px;box-shadow:0 4px 14px rgba(0,0,0,.07)
  }
  .res-offer{
    position:absolute;bottom:0;left:0;right:0;
    background:linear-gradient(transparent,rgba(0,0,0,.72));
    color:#fff;font-size:8px;font-weight:800;text-align:left;
    padding:17px 8px 7px;border-radius:0 0 17px 17px
  }
  .res-info{flex:1;min-width:0;padding-top:2px}
  .res-top{
    display:flex;justify-content:space-between;align-items:flex-start;
    gap:8px;margin-bottom:6px
  }
  .res-name{
    margin:0;font-size:15px;font-weight:800;color:#171717;line-height:1.3;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis
  }
  .res-meta-row{
    display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:6px
  }
  .res-rating{
    display:inline-flex;align-items:center;gap:3px;background:#198f43;color:#fff;
    font-size:10px;font-weight:800;padding:4px 6px;border-radius:7px
  }
  .res-time{font-size:11px;font-weight:700;color:#3f4442}
  .res-cuisine{
    margin:0;color:#777;font-size:11px;line-height:1.45;font-weight:600;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis
  }
  .res-loc{
    margin:5px 0 0;font-size:11px;color:#969a98;
    display:flex;align-items:center;gap:4px;font-weight:600
  }
  .res-loc i{color:var(--ew-green)!important}

  .skel-card{display:flex;gap:13px;margin-bottom:20px}
  .skel-img{width:108px;height:108px;border-radius:17px;flex-shrink:0}
  .skel-info{flex:1;padding-top:4px;display:flex;flex-direction:column;gap:8px}
  .skel-line{border-radius:6px}

  .empty-state{text-align:center;padding:76px 28px 90px}
  .empty-icon-wrap{
    width:82px;height:82px;background:#f5f7f6;border:1px solid #eef0ef;
    border-radius:50%;display:grid;place-items:center;margin:0 auto 18px
  }
  .empty-icon-wrap i{font-size:28px;color:#c5cbc8}
  .empty-title{font-size:18px;font-weight:800;color:#222;margin:0 0 7px}
  .empty-sub{font-size:12px;font-weight:600;color:#7f8582;line-height:1.55;margin:0 0 24px}
  .btn-back-home{
    background:var(--ew-green);color:#fff;font-family:var(--font);
    font-size:12px;font-weight:800;padding:11px 26px;border-radius:13px;
    border:0;box-shadow:0 5px 15px rgba(21,148,71,.18);cursor:pointer;
    transition:transform .15s ease
  }
  .btn-back-home:active{transform:scale(.97)}
  .res-img-wrap.no-image,.res-img-fallback{
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#f1f3f3,#e5e9e7);
    color:#b7bfbb;font-size:20px;width:100%;height:100%
  }

  @media (min-width:600px){
    .cat-header{padding-left:24px;padding-right:24px}
    .filter-bar{padding-left:24px;padding-right:24px}
    .results-container{max-width:760px;margin:0 auto}
  }
</style>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="cat-header">
  <div class="cat-header-left">
    <button onclick="window.nearbiteSafeBack()" class="icon-btn-round" aria-label="Go back">
      <i class="fa-solid fa-arrow-left"></i>
    </button>
    <div>
      <h1 id="category-title" class="cat-title">Category</h1>
      <p class="cat-sub">Restaurants near you</p>
    </div>
  </div>
  <button onclick="window.location.href='search.html'" class="icon-btn-round" aria-label="Search">
    <i class="fa-solid fa-magnifying-glass"></i>
  </button>
</div>

<div class="filter-bar" id="cat-filter-bar" hidden>
  <button type="button" onclick="toggleCategorySort()" id="sort-cat-btn" class="filter-pill" hidden>
    Top rated first
  </button>
  <button type="button" onclick="toggleCategoryRating()" id="rating-cat-btn" class="filter-pill" hidden>Ratings 4.0+</button>
  <button type="button" onclick="toggleCategoryVeg()" id="veg-cat-btn" class="filter-pill" hidden>Pure Veg</button>
</div>

<div id="results-list" class="results-container">
  
  <div id="cat-skeleton">
    <div class="skel-card">
      <div class="skeleton skel-img"></div>
      <div class="skel-info">
        <div class="skeleton skel-line" style="height:20px; width:75%;"></div>
        <div class="skeleton skel-line" style="height:12px; width:50%;"></div>
        <div class="skeleton skel-line" style="height:12px; width:100%;"></div>
      </div>
    </div>
    <div class="skel-card">
      <div class="skeleton skel-img"></div>
      <div class="skel-info">
        <div class="skeleton skel-line" style="height:20px; width:66%;"></div>
        <div class="skeleton skel-line" style="height:12px; width:50%;"></div>
        <div class="skeleton skel-line" style="height:12px; width:100%;"></div>
      </div>
    </div>
  </div>

  <div id="cat-results" style="display:none;"></div>
</div>



<script src="config.js"></script>
<script src="safe-html.js"></script>
<script src="api.js"></script>
<script src="restaurant-card.js"></script>
<script>
/* ================================================================
   CATEGORY RESULTS
   Loads real restaurants from the shared API layer. Previously this
   page read a global `restaurants` array from a home.js file that no
   longer exists, so it threw on load and the skeleton never cleared.
   ================================================================ */
(function () {
  'use strict';

  var read = window.RestaurantCard.read;
  var esc = window.RestaurantCard.escape;

  var state = {
    restaurants: [],
    category: '',
    sortByRating: false,
    ratingOnly: false,
    vegOnly: false,
    status: 'loading'
  };

  function el(id) { return document.getElementById(id); }

  function matchesCategory(res) {
    var term = state.category.toLowerCase();
    if (!term) return true;

    if (String(read.name(res)).toLowerCase().indexOf(term) !== -1) return true;
    if (String(read.cuisine(res)).toLowerCase().indexOf(term) !== -1) return true;

    if (Array.isArray(res.menu)) {
      return res.menu.some(function (item) {
        return item && String(item.name || '').toLowerCase().indexOf(term) !== -1;
      });
    }
    return false;
  }

  function visible() {
    var list = state.restaurants.filter(function (res) {
      if (!matchesCategory(res)) return false;
      if (state.ratingOnly) {
        var rating = read.rating(res);
        if (rating == null || rating < 4) return false;
      }
      if (state.vegOnly && read.pureVeg(res) !== true) return false;
      return true;
    });

    if (state.sortByRating) {
      list = list.slice().sort(function (a, b) {
        return (read.rating(b) || 0) - (read.rating(a) || 0);
      });
    }
    return list;
  }

  /* Only show a control the loaded data can actually answer. */
  function syncFilterBar() {
    var bar = el('cat-filter-bar');
    if (!bar) return;

    var hasRating = state.restaurants.some(function (r) { return read.rating(r) != null; });
    var hasVeg = state.restaurants.some(function (r) { return read.pureVeg(r) !== null; });

    el('sort-cat-btn').hidden = !hasRating;
    el('rating-cat-btn').hidden = !hasRating;
    el('veg-cat-btn').hidden = !hasVeg;

    bar.hidden = !(hasRating || hasVeg);
  }

  function stateBlock(icon, title, sub, buttonHtml) {
    return '<div class="empty-state">' +
      '<div class="empty-icon-wrap"><i class="fa-solid ' + icon + '"></i></div>' +
      '<h2 class="empty-title">' + esc(title) + '</h2>' +
      '<p class="empty-sub">' + esc(sub) + '</p>' +
      (buttonHtml || '') +
      '</div>';
  }

  function render() {
    var skeleton = el('cat-skeleton');
    var container = el('cat-results');
    if (!container) return;

    if (skeleton) skeleton.style.display = 'none';
    container.style.display = 'block';

    if (state.status === 'error') {
      container.innerHTML = stateBlock(
        'fa-plug-circle-xmark',
        "Couldn't load restaurants",
        state.errorMessage || 'Please try again.',
        '<button type="button" class="btn-back-home" id="cat-retry">Try Again</button>'
      );
      var retry = el('cat-retry');
      if (retry) {
        retry.addEventListener('click', function () {
          retry.disabled = true;
          retry.textContent = 'Retrying…';
          load();
        });
      }
      return;
    }

    var list = visible();

    if (!list.length) {
      container.innerHTML = stateBlock(
        'fa-utensils',
        'No restaurants found',
        state.category
          ? 'We couldn\u2019t find any places serving "' + state.category + '" nearby.'
          : 'Nothing available here right now.',
        '<button type="button" onclick="window.nearbiteSafeBack()" class="btn-back-home">Go Back</button>'
      );
      return;
    }

    container.innerHTML =
      '<p class="res-count">' + list.length + ' restaurant' + (list.length !== 1 ? 's' : '') + ' found</p>' +
      list.map(function (res) {
        var id = read.id(res);
        var name = read.name(res);
        var images = read.images(res);
        var rating = read.rating(res);
        var time = read.deliveryTime(res);
        var cuisine = read.cuisine(res);
        var offer = read.offer(res);
        var distance = window.RestaurantCard.formatDistance(window.RestaurantCard.getDistanceKm(res));

        var meta = [];
        if (rating != null) {
          meta.push('<div class="res-rating"><i class="fa-solid fa-star" style="font-size:8px;"></i> ' +
            esc(rating.toFixed(1)) + '</div>');
        }
        if (time) meta.push('<span class="res-time">' + esc(time.text) + '</span>');

        return '<a href="restaurant.html?id=' + encodeURIComponent(id) + '" class="res-card">' +
          '<div class="res-img-wrap">' +
            (images.length
              ? '<img src="' + esc(images[0]) + '" alt="' + esc(name) +
                '" loading="lazy" onerror="this.closest(\'.res-img-wrap\').classList.add(\'no-image\'); this.remove();">'
              : '<div class="res-img-fallback"><i class="fa-solid fa-utensils"></i></div>') +
            (offer ? '<div class="res-offer">' + esc(offer) + '</div>' : '') +
          '</div>' +
          '<div class="res-info">' +
            '<div class="res-top"><h3 class="res-name">' + esc(name) + '</h3></div>' +
            (meta.length ? '<div class="res-meta-row">' + meta.join(' · ') + '</div>' : '') +
            (cuisine ? '<p class="res-cuisine">' + esc(cuisine) + '</p>' : '') +
            (distance
              ? '<p class="res-loc"><i class="fa-solid fa-location-dot" style="color:#159447; font-size:9px;"></i> ' +
                esc(distance) + '</p>'
              : '') +
          '</div>' +
        '</a>';
      }).join('');
  }

  function load() {
    var cached = window.API.cache.readList(window.API.CACHE_KEYS.restaurants, 10 * 60 * 1000);

    if (cached) {
      state.restaurants = cached;
      state.status = 'ready';
      syncFilterBar();
      render();
    }

    return window.API.getList(window.API.routes.restaurants)
      .then(function (data) {
        state.restaurants = data.filter(function (res) {
          return res && (res._id || res.id || res.slug);
        });
        state.status = 'ready';
        window.API.cache.writeList(window.API.CACHE_KEYS.restaurants, state.restaurants);
        syncFilterBar();
        render();
      })
      .catch(function (error) {
        console.error('[category] load failed:', error);
        if (!state.restaurants.length) {
          state.status = 'error';
          state.errorMessage = error && error.message ? error.message : 'Please try again.';
          render();
        }
      });
  }

  window.toggleCategorySort = function () {
    state.sortByRating = !state.sortByRating;
    el('sort-cat-btn').classList.toggle('active', state.sortByRating);
    render();
  };

  window.toggleCategoryRating = function () {
    state.ratingOnly = !state.ratingOnly;
    el('rating-cat-btn').classList.toggle('active', state.ratingOnly);
    render();
  };

  window.toggleCategoryVeg = function () {
    state.vegOnly = !state.vegOnly;
    el('veg-cat-btn').classList.toggle('active', state.vegOnly);
    render();
  };

  document.addEventListener('DOMContentLoaded', function () {
    state.category = new URLSearchParams(window.location.search).get('type') || '';
    var titleEl = el('category-title');
    if (state.category && titleEl) titleEl.innerText = state.category;
    load();
  });
})();
</script>

<script src="navigation.js"></script>
<script src="cart-bar.js"></script>
<script src="bottom-tab-bar.js"></script>
</body>
</html>
