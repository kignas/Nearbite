<!DOCTYPE html>
<html lang="en"><head>
<meta name="color-scheme" content="light dark"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>(function(){try{var t=localStorage.getItem('eatswada_theme');if(t==='dark')document.documentElement.dataset.ewTheme='dark';var h=localStorage.getItem('eatswada_header_theme');var ok=['raspberry'];document.documentElement.dataset.ewHeader=ok.indexOf(h)>-1?h:'raspberry';}catch(e){document.documentElement.dataset.ewHeader='raspberry';}})();</script>
<script src="https://cdn.jsdelivr.net/npm/darkreader@4.9.133/darkreader.js" data-ew-dark-reader></script>
<script src="eatswada-theme.js"></script>
<script src="eatswada-header-theme.js"></script>
<title>Payment Failed – Eatswada | EatSwada</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap" rel="stylesheet">
<script src="https://checkout.razorpay.com/v1/checkout.js"></script><script src="config.js"></script>
<link rel="stylesheet" href="css/eatswada-payment.css?v=20261004-pay1">
<link rel="stylesheet" href="eatswada-theme.css">
<link rel="stylesheet" href="eatswada-header-theme.css">

<meta name="description" content="Explore EatSwada, your local food ordering platform in Maynaguri, West Bengal."/>
<meta name="robots" content="noindex, nofollow"/>

<meta property="og:type" content="website"/>
<meta property="og:site_name" content="EatSwada"/>
<meta property="og:title" content="Payment Failed – Eatswada | EatSwada"/>
<meta property="og:description" content="Explore EatSwada, your local food ordering platform in Maynaguri, West Bengal."/>
<meta property="og:url" content="https://eatswada.com/payment-failed.html"/>
<meta name="twitter:card" content="summary"/>
</head>
<body><main class="ew-result ew-fail">

<div class="ew-icon-wrap">
  <span class="ew-halo" aria-hidden="true"></span>
  <div class="ew-icon" aria-hidden="true">
    <svg class="ew-svg" viewBox="0 0 48 48" fill="none" aria-hidden="true">
      <circle class="ew-ring" cx="24" cy="24" r="20" stroke="currentColor" stroke-width="2.5"/>
      <path class="ew-draw" d="M17 17l14 14" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>
      <path class="ew-draw" style="animation-delay:.66s" d="M31 17 17 31" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>
    </svg>
  </div>
</div>

<h1 class="ew-title">Payment not completed</h1>
<p class="ew-copy">Your cart is still saved. You can safely try the payment again.</p>

<div class="ew-error" id="ew-error" hidden></div>

<div class="ew-actions">
  <button class="ew-btn ew-btn-primary" id="ew-retry">Try payment again</button>
  <button class="ew-btn ew-btn-ghost" id="ew-cart">Return to cart</button>
</div>

<p class="ew-note">If your bank shows a debit, don't pay again immediately. Use My Orders or wait for the payment status to update.</p>

</main>
<script>
(function(){
const KEY='nearbite_payment_context',token=localStorage.getItem('nearbite_token')||localStorage.getItem('token');let ctx=null;try{ctx=JSON.parse(localStorage.getItem(KEY)||'null')}catch(_){}
const errEl=document.getElementById('ew-error'),retry=document.getElementById('ew-retry');
function showError(m){errEl.textContent=m||'Payment could not be completed.';errEl.hidden=false}
function busy(on,text){retry.disabled=on;retry.textContent=on?(text||'Opening secure payment…'):'Try payment again';retry.style.opacity=on?'.75':'1';retry.classList.toggle('is-busy',on)}
async function status(){if(!ctx?.orderId||!token)return null;try{const r=await fetch(`${CONFIG.API_BASE_URL}/payments/${encodeURIComponent(ctx.orderId)}/status`,{headers:{Authorization:`Bearer ${token}`},cache:'no-store'});const j=await r.json();return r.ok&&j.success?j.data:null}catch(_){return null}}
function success(){
  try {
    if(ctx?.multiple && ctx.deliveryOtps){
      Object.keys(ctx.deliveryOtps).forEach(id=>{
        if(ctx.deliveryOtps[id]) localStorage.setItem('nearbite_delivery_otp_'+id,ctx.deliveryOtps[id]);
      });
    } else if(ctx?.orderId && ctx.deliveryOtp) {
      localStorage.setItem('nearbite_delivery_otp_'+ctx.orderId,ctx.deliveryOtp);
    }
    localStorage.removeItem(KEY);
  } catch(_) {}
  if(!ctx?.orderId){location.href='orders.html';return}
  location.href=ctx.multiple?'orders.html':'track-order.html?id='+encodeURIComponent(ctx.orderId);
}
async function retryPayment(){
if(!ctx?.orderId){location.href='cart.html';return}if(!token){location.href='login.html';return}
busy(true);errEl.hidden=true;
try{
const response=await fetch(`${CONFIG.API_BASE_URL}/payments/retry`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},body:JSON.stringify({orderId:ctx.orderId})});
const result=await response.json();if(result?.alreadyPaid||result?.paymentStatus==='paid'){success();return}
if(!response.ok||!result.success||!result.payment?.orderId)throw new Error(result?.message||'Retry is temporarily unavailable.');
const rzp=new Razorpay({key:result.payment.keyId,amount:result.payment.amount,currency:result.payment.currency||'INR',name:'Eatswada',description:ctx.multiple?'Eatswada multi-restaurant order':`Eatswada order ${ctx.orderNumber||''}`,order_id:result.payment.orderId,theme:{color:(window.EatswadaHeaderTheme&&window.EatswadaHeaderTheme.primary())||'#E9546B'},modal:{ondismiss:()=>busy(false)},handler:async function(p){
busy(true,'Verifying payment…');try{
const vr=await fetch(`${CONFIG.API_BASE_URL}/payments/verify`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},body:JSON.stringify({orderId:ctx.orderId,razorpayPaymentId:p.razorpay_payment_id,razorpayOrderId:p.razorpay_order_id,razorpaySignature:p.razorpay_signature})});
const v=await vr.json();if(v?.success&&v.paymentStatus==='paid'){success();return}
if(vr.status===409||vr.status>=500){const s=await status();if(s?.paymentStatus==='paid'){success();return}}
throw new Error(v?.message||'Payment verification is still pending.')
}catch(e){const s=await status();if(s?.paymentStatus==='paid'){success();return}showError(e.message||'Payment verification failed. Please wait before trying again.');busy(false)}
}});
rzp.on('payment.failed',f=>{showError(f?.error?.description||'Payment was not completed. Your cart is still saved.');busy(false)});rzp.open()
}catch(e){showError(e.message||'Could not start payment.');busy(false)}
}
retry.addEventListener('click',retryPayment);document.getElementById('ew-cart').addEventListener('click',()=>location.href='cart.html');
if(!ctx?.orderId)showError('Payment session details were not found. Your cart may still be available.')
})();
</script></body></html>
