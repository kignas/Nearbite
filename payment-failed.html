<body><main class="ew-result ew-fail">

<div class="ew-icon-wrap">
  <span class="ew-halo" aria-hidden="true"></span>
  <div class="ew-icon" aria-hidden="true">
    <svg class="ew-svg" viewBox="0 0 48 48" fill="none" aria-hidden="true">
      <circle class="ew-ring" cx="24" cy="24" r="20" stroke="currentColor" stroke-width="2.5"/>
      <path class="ew-draw" d="M17 17l14 14" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>
      <path class="ew-draw" style="animation-delay:.66s" d="M31 17 17 31" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>
    </svg>
  </div>
</div>

<h1 class="ew-title">Payment not completed</h1>
<p class="ew-copy">Your cart is still saved. You can safely try the payment again.</p>

<div class="ew-error" id="ew-error" hidden></div>

<div class="ew-actions">
  <button class="ew-btn ew-btn-primary" id="ew-retry">Try payment again</button>
  <button class="ew-btn ew-btn-ghost" id="ew-cart">Return to cart</button>
</div>

<p class="ew-note">If your bank shows a debit, don't pay again immediately. Use My Orders or wait for the payment status to update.</p>

</main>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script src="js/auth-token.js?v=20261025"></script>
<script src="config.js"></script>
<script src="js/payment-state.js?v=20261025"></script>
<script src="js/checkout-key.js?v=20261025"></script>
<script src="js/payment-verify.js?v=20261025"></script>
<script>
(function(){
const KEY='nearbite_payment_context',token=window.EWAuth?window.EWAuth.getToken():(localStorage.getItem('nearbite_token')||localStorage.getItem('token'));let ctx=null;try{ctx=JSON.parse(localStorage.getItem(KEY)||'null')}catch(_){}
const errEl=document.getElementById('ew-error'),retry=document.getElementById('ew-retry');
function showError(m){errEl.textContent=m||'Payment could not be completed.';errEl.hidden=false}
function busy(on,text){retry.disabled=on;retry.textContent=on?(text||'Opening secure payment…'):'Try payment again';retry.style.opacity=on?'.75':'1';retry.classList.toggle('is-busy',on)}
/* The server decides whether the payment is actually settled. A partial-COD
   advance reported as paid, or any paid/refunded order, counts as success. */
function isPaid(data){
  if(window.EWPayment)return window.EWPayment.state(data||{}).isPaid===true;
  const st=String(data?.paymentStatus||'').toLowerCase();return st==='paid'||st==='refunded';
}
function success(){
  /* The server has authoritatively confirmed payment, so the cart and the
     checkout attempt key are finished with. Nothing is cleared on an
     uncertain or genuinely failed state.
     The delivery OTP is read from the owner-scoped order response, never
     persisted here. */
  try {
    localStorage.removeItem('nearbite_cart');
    localStorage.removeItem(KEY);
    if (window.EWCheckout) window.EWCheckout.clearKey();
    else {localStorage.removeItem('nearbite_checkout_key');localStorage.removeItem('nearbite_checkout_fp');localStorage.removeItem('nearbite_checkout_fp_ts');}
  } catch(_) {}
  if(!ctx?.orderId){location.href='orders.html';return}
  location.href=ctx.multiple?'orders.html':'track-order.html?id='+encodeURIComponent(ctx.orderId);
}
async function retryPayment(){
if(!ctx?.orderId){location.href='cart.html';return}if(!token){location.href='login.html';return}
busy(true);errEl.hidden=true;
try{
const response=await fetch(`${CONFIG.API_BASE_URL}/payments/retry`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},body:JSON.stringify({orderId:ctx.orderId})});
let result=null;try{result=await response.json()}catch(_){}
if(result?.alreadyPaid||isPaid(result)){success();return}
if(!response.ok||!result?.success||!result.payment?.orderId){
  /* No second payment can be started. If the server is merely unsure, the
     pending screen reconciles; only a definitive server failure stays here. */
  if(response.ok===false&&response.status<500&&window.EWPayment&&window.EWPayment.state(result||{}).isFailed===true){
    throw new Error(result?.message||'This payment could not be retried.');
  }
  location.href='payment-pending.html';return;
}
const rzp=new Razorpay({key:result.payment.keyId,amount:result.payment.amount,currency:result.payment.currency||'INR',name:'Eatswada',description:ctx.multiple?'Eatswada multi-restaurant order':`Eatswada order ${ctx.orderNumber||''}`,order_id:result.payment.orderId,theme:{color:(window.EatswadaHeaderTheme&&window.EatswadaHeaderTheme.primary())||'#E9546B'},modal:{ondismiss:()=>busy(false)},handler:async function(p){
busy(true,'Verifying payment…');
/* The outcome decision is the same tested module the checkout uses. An
   unconfirmed result is never shown as a failure: it goes to the pending
   screen, which reconciles against the authoritative backend. */
try{
if(window.EWPaymentVerify){
  const outcome=await window.EWPaymentVerify.run({fetchImpl:fetch,apiBase:CONFIG.API_BASE_URL,token:token,orderId:ctx.orderId,verifyBody:{orderId:ctx.orderId,razorpayPaymentId:p.razorpay_payment_id,razorpayOrderId:p.razorpay_order_id,razorpaySignature:p.razorpay_signature},onError:e=>console.error('[PAYMENT] retry verification:',e)});
  if(outcome.verdict==='paid'){success();return}
  if(outcome.verdict==='failed'){showError((outcome.data&&outcome.data.message)||'Payment was not completed. Your cart is still saved.');busy(false);return}
  location.href='payment-pending.html';return;
}
const vr=await fetch(`${CONFIG.API_BASE_URL}/payments/verify`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},body:JSON.stringify({orderId:ctx.orderId,razorpayPaymentId:p.razorpay_payment_id,razorpayOrderId:p.razorpay_order_id,razorpaySignature:p.razorpay_signature})});
let v=null;try{v=await vr.json()}catch(_){}
if(v?.success&&isPaid(v)){success();return}
if(vr.ok===false&&window.EWPayment&&window.EWPayment.state(v||{}).isFailed===true){showError((v&&v.message)||'Payment was not completed. Your cart is still saved.');busy(false);return}
location.href='payment-pending.html';
}catch(e){location.href='payment-pending.html'}
}});
rzp.on('payment.failed',f=>{showError(f?.error?.description||'Payment was not completed. Your cart is still saved.');busy(false)});rzp.open()
}catch(e){showError(e.message||'Could not start payment.');busy(false)}
}
retry.addEventListener('click',retryPayment);document.getElementById('ew-cart').addEventListener('click',()=>location.href='cart.html');
if(!ctx?.orderId)showError('Payment session details were not found. Your cart may still be available.')
})();
</script></body></html>
