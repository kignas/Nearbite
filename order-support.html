<!DOCTYPE html>
<html lang="en">
<head>
<meta name="color-scheme" content="light">
<meta charset="UTF-8">

<script defer src="https://cdn.jsdelivr.net/npm/darkreader@4.9.133/darkreader.js" data-ew-dark-reader></script>

<title>Order help – EatSwada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
/* ============================================================
   EATSWADA · ORDER SUPPORT
   Same tokens as Orders and Order Tracking: Manrope, the active
   header theme colour, #F1F0F5 page, white 14 px cards, 1 px borders.
   ============================================================ */
:root{
  --brand:var(--hd-on-light,#C13A50); --brand-press:var(--hd-active,#C13A50); --brand-tint:var(--hd-soft,#FDEBEE); --brand-soft:var(--hd-accent,#E9546B);
  --ink-900:#16191E; --ink-800:#1F232A; --ink-700:#3E414A; --ink-500:#68696B;
  --ink-400:#8E8F91; --ink-300:#B6B8BD; --ink-200:#D9DADC;
  --line:#E5E7E6; --line-soft:#F0F0F2; --paper:#F1F0F5; --card:#FFFFFF; --icon-bg:#F2F2F4;
  --success:var(--ew-success,#23956D); --success-bg:var(--ew-success-soft,#E7F6EE);
  --danger:#C8453B; --danger-bg:#FBEDEB;
  --info:var(--ew-info,#4C7FF0); --info-bg:#EEF3FE;
  --amber:#B26A12; --amber-bg:#FFF6E8;
  --shadow-xs:0 1px 2px rgba(16,24,40,.04);
  --shadow-sm:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.03);
  --shadow-pop:0 8px 28px rgba(16,24,40,.16);
  --r-lg:14px; --r-md:12px; --r-sm:10px;
  --ease-out:cubic-bezier(.16,1,.3,1); --ease:cubic-bezier(.4,0,.2,1);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  font-family:'Manrope',system-ui,-apple-system,sans-serif;
  background:var(--paper);color:var(--ink-900);margin:0;line-height:1.45;
  -webkit-tap-highlight-color:transparent;overflow-x:hidden;
}
h1,h2,h3,h4,p,ul{margin:0;padding:0;}
button,input,textarea{font-family:inherit;color:inherit;}
a{color:inherit;}
img{max-width:100%;display:block;}
[hidden]{display:none!important;}
.tap{transition:transform .14s var(--ease-out),opacity .14s var(--ease-out),background-color .14s;cursor:pointer;}
.tap:active{transform:scale(.97);opacity:.9;}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px;}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

@keyframes cardIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
@keyframes shimmer{0%{background-position:-600px 0;}100%{background-position:600px 0;}}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes bubbleIn{from{opacity:0;transform:translateY(6px) scale(.98);}to{opacity:1;transform:none;}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;}}

/* ---------- shell + app bar ---------- */
.shell{max-width:640px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;}
.bar{position:sticky;top:0;z-index:60;background:#fff;border-bottom:1px solid #EAEAEC;padding:calc(4px + var(--safe-t)) 10px 0 8px;}
.bar-row{display:flex;align-items:center;gap:6px;height:54px;}
.bar-btn{width:40px;height:40px;flex:none;border:0;border-radius:50%;background:transparent;color:#131313;display:grid;place-items:center;font-size:17px;cursor:pointer;}
.bar-btn:active{background:rgba(0,0,0,.05);}
.bar-title{flex:1;min-width:0;padding-left:2px;}
.bar-title h1{font-size:15px;line-height:20px;font-weight:800;letter-spacing:-.2px;color:var(--ink-900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bar-title p{font-size:12px;line-height:16px;font-weight:500;color:var(--ink-500);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bar-link{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;flex:none;border:1px solid var(--ink-200);border-radius:999px;font-size:13px;font-weight:700;color:var(--brand);text-decoration:none;}

#view{flex:1;min-height:0;padding:12px 14px calc(28px + var(--safe-b));}
.screen{animation:cardIn .36s var(--ease-out) both;}
.screen:focus,[tabindex="-1"]:focus,[tabindex="-1"]:focus-visible{outline:none;}
h2.screen-title{font-size:20px;line-height:26px;font-weight:800;letter-spacing:-.4px;margin:6px 2px 4px;}
.screen-sub{font-size:13px;color:var(--ink-500);margin:0 2px 14px;}

/* ---------- cards ---------- */
.card{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow-xs);margin-bottom:12px;overflow:hidden;}
.sec-title{font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-500);margin:18px 4px 8px;}

/* order summary */
.ord{padding:14px;}
.ord-head{display:flex;gap:12px;align-items:center;}
.logo{width:46px;height:46px;border-radius:12px;flex:none;background:var(--brand-tint);color:var(--brand);display:grid;place-items:center;font-weight:800;font-size:18px;object-fit:cover;overflow:hidden;}
.ord-main{flex:1;min-width:0;}
.ord-name{font-size:15px;font-weight:800;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ord-sub{font-size:12.5px;color:var(--ink-500);font-weight:500;margin-top:1px;}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:800;background:var(--icon-bg);color:var(--ink-700);white-space:nowrap;flex:none;}
.chip.good{background:var(--success-bg);color:var(--success);}
.chip.bad{background:var(--danger-bg);color:var(--danger);}
.chip.info{background:var(--info-bg);color:var(--info);}
.chip.warn{background:var(--amber-bg);color:var(--amber);}
.ord-items{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);font-size:13px;color:var(--ink-700);display:grid;gap:3px;}
.ord-items .q{font-weight:800;color:var(--ink-900);margin-right:4px;}
.ord-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:12.5px;color:var(--ink-500);}
.ord-foot a{color:var(--brand);font-weight:800;text-decoration:none;}

/* category rows */
.cat{display:flex;align-items:center;gap:12px;width:100%;padding:14px;background:transparent;border:0;border-bottom:1px solid var(--line-soft);text-align:left;min-height:68px;}
.cat:last-child{border-bottom:0;}
.cat:active{background:#FAFAFB;}
.ico{width:42px;height:42px;border-radius:12px;flex:none;display:grid;place-items:center;font-size:17px;background:var(--icon-bg);color:var(--ink-700);}
.ico.amber{background:var(--amber-bg);color:var(--amber);} .ico.danger{background:var(--danger-bg);color:var(--danger);}
.ico.info{background:var(--info-bg);color:var(--info);} .ico.brand{background:var(--brand-tint);color:var(--brand);}
.ico.success{background:var(--success-bg);color:var(--success);}
.cat-body{flex:1;min-width:0;}
.cat-title{font-size:14.5px;font-weight:800;letter-spacing:-.15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.cat-desc{font-size:12.5px;color:var(--ink-500);margin-top:1px;}
.cat-tag{font-size:10.5px;font-weight:800;color:var(--ink-500);background:var(--icon-bg);border-radius:999px;padding:2px 8px;letter-spacing:.2px;}
.cat > .fa-chevron-right{color:var(--ink-300);font-size:12px;flex:none;}

/* order picker */
.pick{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;background:transparent;border:0;border-bottom:1px solid var(--line-soft);text-align:left;}
.pick:last-child{border-bottom:0;}
.pick:active{background:#FAFAFB;}
.pick .logo{width:40px;height:40px;font-size:16px;}

/* contextual panels */
.ctx{padding:14px;display:grid;gap:10px;}
.ctx-row{display:flex;gap:12px;align-items:flex-start;}
.ctx-title{font-size:14px;font-weight:800;}
.ctx-text{font-size:13px;color:var(--ink-700);margin-top:2px;}
.ctx-meta{font-size:12px;color:var(--ink-500);word-break:break-all;}
.ctx-actions{display:flex;gap:8px;flex-wrap:wrap;}
.btn-mini{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--ink-200);background:#fff;font-size:13px;font-weight:700;color:var(--ink-800);text-decoration:none;}
.btn-mini i{color:var(--brand);font-size:12px;}
.ph-card{padding:12px}.ph-row{display:flex;flex-wrap:wrap;gap:10px}.ph-hint{margin-top:10px;font-size:12px;color:var(--ink-500)}
.ph-thumb{position:relative;width:76px;height:76px;border-radius:12px;overflow:hidden;background:#F3F4F6}.ph-thumb img{width:100%;height:100%;object-fit:cover;display:block}.ph-thumb.uploading img{opacity:.5}.ph-thumb.error{outline:2px solid #D64545}
.ph-state{position:absolute;inset:0;display:grid;place-items:center;font-weight:800}.ph-state.err{color:#fff;background:rgba(214,69,69,.55);font-size:22px}
.ph-rm{position:absolute;top:3px;right:3px;width:24px;height:24px;border:0;border-radius:50%;background:rgba(17,24,39,.72);color:#fff;display:grid;place-items:center;font-size:11px;cursor:pointer}
.ph-add{width:76px;height:76px;border-radius:12px;border:1.5px dashed var(--ink-200);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--ink-500);font-size:11px;font-weight:700;cursor:pointer}.ph-add i{color:var(--brand);font-size:18px}
.tk .ctx-meta{margin-top:4px}
.safety{display:flex;gap:10px;padding:12px 14px;border-radius:var(--r-md);background:var(--amber-bg);color:var(--amber);font-size:13px;font-weight:600;margin-bottom:12px;}

/* options (radio/checkbox) */
.opt{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--line-soft);cursor:pointer;font-size:14px;font-weight:600;min-height:52px;}
.opt:last-child{border-bottom:0;}
.opt input{position:absolute;opacity:0;pointer-events:none;}
.mark{width:22px;height:22px;flex:none;border-radius:50%;border:2px solid var(--ink-300);display:grid;place-items:center;transition:border-color .15s,background-color .15s;}
.mark.sq{border-radius:7px;}
.mark::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--brand);transform:scale(0);transition:transform .18s var(--ease-out);}
.mark.sq::after{width:11px;height:11px;border-radius:3px;}
.opt input:checked + .mark{border-color:var(--brand);}
.opt input:checked + .mark::after{transform:scale(1);}
.opt input:focus-visible + .mark{outline:2px solid var(--brand);outline-offset:2px;}
.item{border-bottom:1px solid var(--line-soft);}
.item:last-child{border-bottom:0;}
.item .opt{border-bottom:0;}
.item.on{background:var(--brand-tint);}
.item .nm{flex:1;min-width:0;}
.item .ordered{font-size:12px;color:var(--ink-500);font-weight:600;}
.stepper{display:none;align-items:center;justify-content:space-between;padding:0 14px 12px 48px;font-size:13px;font-weight:700;color:var(--ink-700);}
.item.on.multi .stepper{display:flex;}
.step-ctl{display:inline-flex;align-items:center;gap:2px;background:#fff;border:1px solid var(--ink-200);border-radius:999px;padding:2px;}
.step-ctl button{width:32px;height:32px;border:0;border-radius:50%;background:transparent;font-size:16px;font-weight:800;color:var(--brand);cursor:pointer;}
.step-ctl button:disabled{color:var(--ink-300);cursor:default;}
.step-ctl output{min-width:26px;text-align:center;font-weight:800;color:var(--ink-900);}

.field{padding:12px 14px 10px;}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:8px;}
.field textarea{width:100%;min-height:96px;resize:vertical;border:1px solid var(--ink-200);border-radius:var(--r-md);padding:12px;font-size:16px;line-height:1.4;background:#fff;}
.field textarea:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:transparent;}
.count{text-align:right;font-size:11.5px;color:var(--ink-400);margin-top:4px;}

/* sticky CTA */
.cta-bar{position:sticky;bottom:0;margin:16px -14px calc(-28px - var(--safe-b));padding:12px 14px calc(12px + var(--safe-b));background:linear-gradient(to top,var(--paper) 78%,rgba(241,240,245,0));}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;height:50px;border:0;border-radius:var(--r-md);font-size:15px;font-weight:800;letter-spacing:-.1px;cursor:pointer;text-decoration:none;}
.btn-primary{background:var(--brand);color:var(--hd-ink,#fff);box-shadow:0 6px 16px rgba(193,58,80,.22);}
.btn-primary:disabled{background:var(--ink-200);color:#fff;box-shadow:none;cursor:not-allowed;}
.btn-ghost{background:#fff;color:var(--ink-800);border:1px solid var(--ink-200);}
.cta-hint{text-align:center;font-size:12px;color:var(--ink-500);margin-bottom:8px;min-height:16px;}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;animation:spin .7s linear infinite;}

/* states + skeleton */
.state{text-align:center;padding:40px 22px;}
.state .ico{margin:0 auto 14px;width:56px;height:56px;border-radius:16px;font-size:22px;}
.state h2{font-size:18px;font-weight:800;letter-spacing:-.3px;margin-bottom:6px;}
.state p{font-size:13.5px;color:var(--ink-500);margin-bottom:18px;}
.state .btn{max-width:260px;margin:0 auto 10px;}
.skel{background:linear-gradient(90deg,#E9E9ED 0,#E0E0E5 50%,#E9E9ED 100%);background-size:1200px 100%;animation:shimmer 1.3s linear infinite;border-radius:8px;}

/* ---------- chat ---------- */
body.chat-mode{overflow:hidden;}
body.chat-mode .shell{height:var(--vh,100dvh);min-height:0;}
body.chat-mode #view{padding:0;display:flex;flex-direction:column;overflow:hidden;}
.chat{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;background:var(--paper);}
.msgs{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:14px 14px 8px;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch;}
.day{align-self:center;font-size:11.5px;font-weight:700;color:var(--ink-500);background:rgba(0,0,0,.05);padding:3px 10px;border-radius:999px;margin:6px 0;}
.row{display:flex;flex-direction:column;max-width:84%;animation:bubbleIn .22s var(--ease-out) both;}
.row.me{align-self:flex-end;align-items:flex-end;}
.row.agent{align-self:flex-start;align-items:flex-start;}
.row.system{align-self:center;align-items:center;max-width:92%;}
.bubble{padding:9px 13px;border-radius:18px;font-size:14.5px;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere;}
.me .bubble{background:var(--brand);color:var(--hd-ink,#fff);border-bottom-right-radius:6px;}
.agent .bubble{background:#fff;border:1px solid var(--line);border-bottom-left-radius:6px;box-shadow:var(--shadow-xs);}
.system .bubble{background:var(--icon-bg);color:var(--ink-500);font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:999px;text-align:center;}
.meta{font-size:11px;color:var(--ink-400);margin:3px 4px 0;font-weight:500;}
.meta.fail{color:var(--danger);font-weight:700;}
.meta button{border:0;background:none;color:var(--danger);font-weight:800;font-size:11px;padding:0;text-decoration:underline;cursor:pointer;}
.demo-tag{font-size:10px;font-weight:800;background:var(--amber-bg);color:var(--amber);border-radius:6px;padding:1px 6px;margin-left:6px;}
.issue-card{align-self:stretch;background:#fff;border-radius:var(--r-lg);border:1px solid var(--line);padding:14px;display:grid;gap:8px;box-shadow:var(--shadow-xs);}
.issue-card .ic-head{display:flex;gap:12px;align-items:center;}
.issue-card .ic-title{font-size:14px;font-weight:800;}
.issue-card .ic-sub{font-size:12.5px;color:var(--ink-500);}
.issue-card ul{list-style:none;font-size:13px;color:var(--ink-700);display:grid;gap:2px;}
.issue-card .ic-note{font-size:13px;color:var(--ink-700);background:var(--icon-bg);border-radius:var(--r-sm);padding:8px 10px;white-space:pre-wrap;overflow-wrap:anywhere;}
.welcome{align-self:stretch;text-align:center;padding:26px 16px 10px;}
.welcome .ico{margin:0 auto 12px;width:52px;height:52px;font-size:20px;border-radius:16px;}
.welcome h2{font-size:17px;font-weight:800;letter-spacing:-.3px;}
.welcome p{font-size:13px;color:var(--ink-500);margin-top:4px;}
.jump{position:absolute;left:50%;bottom:86px;transform:translateX(-50%);z-index:5;border:0;border-radius:999px;background:var(--ink-900);color:#fff;font-size:12.5px;font-weight:800;padding:8px 14px;box-shadow:var(--shadow-pop);cursor:pointer;}
.chat-note{margin:0 12px 8px;padding:10px 12px;border-radius:var(--r-md);font-size:12.5px;font-weight:600;display:flex;gap:9px;align-items:flex-start;background:var(--amber-bg);color:var(--amber);}
.chat-note.err{background:var(--danger-bg);color:var(--danger);}
.chat-note.info{background:var(--info-bg);color:var(--info);}
.composer{display:flex;align-items:flex-end;gap:8px;padding:10px 12px calc(10px + var(--safe-b));background:#fff;border-top:1px solid #EAEAEC;}
.composer textarea{flex:1;min-width:0;max-height:120px;min-height:44px;resize:none;border:1px solid var(--ink-200);border-radius:22px;padding:11px 16px;font-size:16px;line-height:1.35;background:#F8F8FA;}
.composer textarea:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:transparent;background:#fff;}
.composer textarea:disabled{opacity:.6;}
.send{width:44px;height:44px;flex:none;border:0;border-radius:50%;background:var(--brand);color:var(--hd-ink,#fff);display:grid;place-items:center;font-size:16px;cursor:pointer;}
.send:disabled{background:var(--ink-200);cursor:not-allowed;}
.skel-bubble{height:38px;border-radius:18px;}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(24px + var(--safe-b));transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:200;background:var(--ink-900);color:#fff;font-size:13px;font-weight:700;padding:11px 16px;border-radius:12px;box-shadow:var(--shadow-pop);max-width:calc(100vw - 32px);text-align:center;transition:opacity .22s,transform .22s var(--ease-out);}
.toast.show{opacity:1;transform:translate(-50%,0);}
.dev-banner{margin:0 0 12px;padding:10px 12px;border-radius:var(--r-md);background:#16191E;color:#fff;font-size:12px;line-height:1.5;}
.dev-banner code{background:rgba(255,255,255,.14);border-radius:4px;padding:0 4px;}
</style>

<body>

<div class="shell">
  <header class="bar">
    <div class="bar-row">
      <button type="button" class="bar-btn tap" id="bar-back" aria-label="Go back"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i></button>
      <div class="bar-title">
        <h1 id="bar-title">Help &amp; support</h1>
        <p id="bar-sub"></p>
      </div>
      <a class="bar-link tap" id="bar-track" href="orders.html" hidden><i class="fa-solid fa-location-dot" aria-hidden="true"></i>Track</a>
    </div>
  </header>
  <main id="view" aria-live="polite"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<script src="push.js"></script>
<script src="customer-upload.js?v=20261023"></script>

<script>
/* ================================================================
   SUPPORT BACKEND ADAPTER  —  THE ONLY PART THAT NEEDS YOUR BACKEND DETAILS
   ----------------------------------------------------------------
   Neither orders.html, track-order.html nor order-status.js contains a
   single support/ticket/chat request, so the real endpoints, request
   bodies and response shapes could not be read from the supplied files
   and have deliberately NOT been guessed. Fill in the functions below
   (copy the calls from your existing support.html / support backend).

   `api.call(path, { method, body })` is provided for you. It sends the
   same Bearer token the other pages use, prefixes CONFIG.API_BASE_URL,
   sends/parses JSON, sends the user to login.html on a 401 (same as
   orders.html), and throws an Error with .status and .body on any
   other non-2xx response. It returns the parsed JSON body.

   Required (chat stays disabled until all four exist):

   createTicket({ api, orderId, orderNumber, category:{id,label},
                  issue:{id,label}|null, items:[{name,quantity,
                  orderedQuantity,menuItemId?}], note, message })
        -> { ticketId: string, messages?: [raw, ...] }
        `message` is the customer's first free-text message (only set
        when they start a chat without picking an issue). `note` is the
        optional description from the issue form.

   listMessages({ api, ticketId })
        -> [raw, ...]            (all messages of the ticket, oldest first or any order)

   sendMessage({ api, ticketId, text })
        -> { message?: raw }     (return the saved message if the backend does)

   normalizeMessage(raw)
        -> { id: string, from: 'user'|'agent'|'system', text: string, at: Date|ISO string|ms }
        Map your backend's message fields here. Return null to skip a message.

   Optional:

   getTicket({ api, ticketId })
        -> { orderId?: string, closed?: boolean }
        Needed only to open  order-support.html?ticketId=ID  with NO
        order in the URL (to learn which order the ticket belongs to),
        and to lock the composer on a closed ticket.
   ================================================================ */
var SUPPORT_ADAPTER = {
  // Matches the Eatswada customer support routes mounted at /api/support.
  // Keep request/response mapping here so the UI does not depend on backend internals.
  createTicket: async function (a) {
    var catId = a.category && a.category.id || 'other';
    var issueId = a.issue && a.issue.id || '';
    var category = catId;
    if (catId === 'missing_wrong') category = issueId === 'wrong_items' ? 'wrong_item' : 'missing_item';
    else if (catId === 'spilled') category = 'spilled_order';
    else if (catId === 'late_delivery') category = 'late_order';
    else if (catId === 'payment_refund') category = /refund|charged_cancelled/i.test(issueId) ? 'refund' : 'payment';
    else if (catId === 'other') category = 'other';

    var details = [];
    if (a.category && a.category.label) details.push('Issue: ' + a.category.label);
    if (a.issue && a.issue.label) details.push('Details: ' + a.issue.label);
    if (Array.isArray(a.items) && a.items.length) {
      details.push('Affected items: ' + a.items.map(function (it) {
        return String(it.name || 'Item') + ' × ' + String(it.quantity || 1);
      }).join(', '));
    }
    if (a.note) details.push('Customer note: ' + String(a.note).trim());
    if (a.message) details.push(String(a.message).trim());
    var message = details.filter(Boolean).join('\n');
    if (!message) message = 'I need help with my order.';

    var body = {
      orderId: a.orderId,
      category: category,
      subject: [a.category && a.category.label, a.issue && a.issue.label, a.orderNumber ? 'Order ' + a.orderNumber : ''].filter(Boolean).join(' — ').slice(0, 160),
      message: message.slice(0, 2000),
      items: (Array.isArray(a.items) ? a.items : []).map(function (it) { return String(it.name || '').slice(0, 80); }).filter(Boolean)
    };
    // Order-linked refund workflow fields (additive; older backends ignore them).
    if (a.issueCategory) body.issueCategory = a.issueCategory;
    if (Array.isArray(a.evidencePhotos) && a.evidencePhotos.length) body.evidencePhotos = a.evidencePhotos.slice(0, 3);
    var res = await a.api.call('/support/tickets', { method: 'POST', body: body });
    var ticket = res && res.data;
    if (!ticket || !ticket._id) throw new Error('Support API did not return a ticket ID');
    return { ticketId: String(ticket._id), messages: Array.isArray(ticket.messages) ? ticket.messages : [] };
  },
  listMessages: async function (a) {
    var path = '/support/tickets/' + encodeURIComponent(a.ticketId);
    if (a.since) path += '?since=' + encodeURIComponent(a.since);
    var res = await a.api.call(path);
    var ticket = res && res.data;
    if (!ticket) throw new Error('Support ticket was not returned');
    return Array.isArray(ticket.messages) ? ticket.messages : [];
  },
  sendMessage: async function (a) {
    var res = await a.api.call('/support/tickets/' + encodeURIComponent(a.ticketId) + '/messages', {
      method: 'POST', body: { message: a.text }
    });
    var ticket = res && res.data;
    var messages = ticket && Array.isArray(ticket.messages) ? ticket.messages : [];
    return { message: messages.length ? messages[messages.length - 1] : null };
  },
  normalizeMessage: function (raw) {
    if (!raw || typeof raw !== 'object') return null;
    var role = String(raw.senderRole || raw.from || '').toLowerCase();
    var from = role === 'user' ? 'user' : (role === 'system' ? 'system' : 'agent');
    var at = raw.at || raw.createdAt || raw.timestamp || '';
    var text = raw.message != null ? raw.message : raw.text;
    if (text == null || !String(text).trim()) return null;
    // Message subdocuments have no _id, so derive a stable dedupe key from their contents.
    var id = raw._id || raw.id || [role, at, String(text)].join('|');
    return { id: String(id), from: from, text: String(text), at: at };
  },
  getTicket: async function (a) {
    var res = await a.api.call('/support/tickets/' + encodeURIComponent(a.ticketId));
    var ticket = res && res.data;
    if (!ticket) throw new Error('Support ticket was not returned');
    var order = ticket.order;
    var orderId = order && typeof order === 'object' ? order._id : order;
    return { orderId: orderId ? String(orderId) : undefined, closed: ticket.status === 'closed' };
  }
};
</script>

<script>
(function () {
  'use strict';

  var OS = window.EatswadaOrderStatus;
  var cfg = (typeof CONFIG !== 'undefined') ? CONFIG : window.CONFIG;

  /* ---------- UI-only limits (not backend rules; adjust freely) ---------- */
  var UI = { NOTE_MAX: 500, MSG_MAX: 1000, CHAT_POLL_MS: 8000, PICKER_LIMIT: 10 };

  /* ---------- helpers ---------- */
  var esc = window.esc || function (v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  var safeUrl = window.safeUrl || function (v) {
    if (!v) return '';
    try { var u = new URL(String(v), location.href); return /^https?:$/.test(u.protocol) ? u.href : ''; } catch (e) { return ''; }
  };
  function $(id) { return document.getElementById(id); }
  var view = $('view');

  function getToken() {
    var t = localStorage.getItem('nearbite_token') || localStorage.getItem('token') || sessionStorage.getItem('nearbite_token') || '';
    return (t === 'undefined' || t === 'null') ? '' : t;
  }
  var token = getToken();
  if (!token) { location.replace('login.html'); return; }

  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(t._t); t._t = setTimeout(function () { t.classList.remove('show'); }, 2800);
  }

  /* ---------- transport (reuses the existing auth + base URL pattern) ---------- */
  function onUnauthorized() { localStorage.clear(); location.href = 'login.html'; }
  async function call(path, opts) {
    opts = opts || {};
    var headers = { 'Authorization': 'Bearer ' + token };
    if (opts.body !== undefined) headers['Content-Type'] = 'application/json';
    var res = await fetch(cfg.API_BASE_URL + path, {
      method: opts.method || 'GET', headers: headers,
      body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined
    });
    if (res.status === 401) { onUnauthorized(); var u = new Error('Unauthorised'); u.status = 401; throw u; }
    var data = await res.json().catch(function () { return null; });
    if (!res.ok) {
      var err = new Error((data && data.message) || 'Request failed'); err.status = res.status; err.body = data; throw err;
    }
    return data;
  }
  var api = { call: call };

  /* ---------- URL params ---------- */
  var qs = new URLSearchParams(location.search);
  var P = {
    orderId: (qs.get('order') || qs.get('orderId') || '').trim(),
    ticketId: (qs.get('ticketId') || '').trim(),
    openChat: qs.get('view') === 'chat',
    debug: qs.get('debug') === '1'
  };

  /* ---------- local-only demo adapter (localhost / file:// + ?mock=1) ----------
     Lets you preview the chat UI before the real backend is wired. It is
     never active on a real domain and its agent replies are tagged "Demo". */
  var isLocalHost = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname) || location.protocol === 'file:';
  var MOCK = isLocalHost && qs.get('mock') === '1';
  if (MOCK) {
    var mk = 'ew_support_demo';
    var mread = function () { try { return JSON.parse(sessionStorage.getItem(mk) || '{}'); } catch (e) { return {}; } };
    var mwrite = function (d) { try { sessionStorage.setItem(mk, JSON.stringify(d)); } catch (e) {} };
    var madd = function (d, id, from, text) { (d[id] = d[id] || []).push({ id: 'm' + Date.now() + Math.random().toString(16).slice(2, 6), from: from, text: text, at: new Date().toISOString(), demo: from === 'agent' }); };
    SUPPORT_ADAPTER = {
      createTicket: async function (a) {
        var d = mread(), id = 'DEMO' + Date.now().toString(36).toUpperCase(); d[id] = [];
        var bits = [a.category.label, a.issue && a.issue.label].filter(Boolean).join(' — ');
        if (a.message) madd(d, id, 'user', a.message);
        setTimeout(function () { var x = mread(); madd(x, id, 'agent', 'Demo reply: this is a simulated message, not real support. Received: ' + (bits || 'general help') + '.'); mwrite(x); }, 1500);
        mwrite(d); return { ticketId: id };
      },
      listMessages: async function (a) { return (mread()[a.ticketId] || []).slice(); },
      sendMessage: async function (a) {
        var d = mread(); madd(d, a.ticketId, 'user', a.text); mwrite(d);
        setTimeout(function () { var x = mread(); madd(x, a.ticketId, 'agent', 'Demo reply: this is a simulated message, not real support.'); mwrite(x); }, 1500);
        return {};
      },
      normalizeMessage: function (r) { return { id: r.id, from: r.from, text: r.text, at: r.at, demo: r.demo }; },
      getTicket: async function (a) { return { orderId: P.orderId || undefined }; }
    };
  }
  var ADAPTER = SUPPORT_ADAPTER || {};
  function missingPieces() {
    return ['createTicket', 'listMessages', 'sendMessage', 'normalizeMessage'].filter(function (k) { return typeof ADAPTER[k] !== 'function'; });
  }
  function chatConnected() { return missingPieces().length === 0; }
  if (!chatConnected()) {
    console.warn('[order-support] Support chat is not connected. Missing SUPPORT_ADAPTER functions: ' + missingPieces().join(', ') + '. See the comment above SUPPORT_ADAPTER in order-support.html.');
  }

  /* ---------- issue catalogue (UI copy only) ---------- */
  function isDelivered(o) { return OS.info(o).group === 'delivered'; }
  function isCancelled(o) { return OS.info(o).group === 'cancelled'; }
  function hasRefundData(o) { return !!((o.refund && o.refund.status && OS.norm(o.refund.status) !== 'none') || OS.norm(o.paymentStatus) === 'refunded'); }

  var CATS = [
    { id: 'missing_wrong', label: 'Missing or wrong items', desc: 'Something is missing or not what you ordered', icon: 'fa-box-open', tone: 'amber', needsItems: true, afterDelivery: true,
      subs: [
        { id: 'missing_items', label: 'Item(s) missing from my order' },
        { id: 'wrong_items', label: 'I received a different item' }
      ] },
    { id: 'food_quality', label: 'Food quality', desc: 'Cold, stale, poor taste or portion size', icon: 'fa-utensils', tone: 'danger', afterDelivery: true, itemsOptional: true,
      subs: [
        { id: 'cold', label: 'Food was cold' },
        { id: 'poor_quality', label: 'Taste or quality was not good' },
        { id: 'stale', label: 'Food seemed stale or spoiled' },
        { id: 'portion', label: 'Quantity or portion was too small' },
        { id: 'unwell', label: 'I felt unwell after eating', safety: 'If you feel seriously unwell, please get medical help right away.' }
      ] },
    { id: 'spilled', label: 'Spilled or damaged order', desc: 'Spills, leaks or damaged packaging', icon: 'fa-droplet', tone: 'info', afterDelivery: true, itemsOptional: true,
      subs: [
        { id: 'spilled_bag', label: 'Food or drink spilled in the bag' },
        { id: 'leaking', label: 'Container was leaking or broken' },
        { id: 'unsealed', label: 'Packaging was open or looked tampered with' }
      ] },
    { id: 'late_delivery', label: 'Late delivery', desc: 'Your order is late or taking too long', icon: 'fa-clock', tone: 'brand',
      subs: [
        { id: 'running_late', label: 'My order is taking too long', when: function (o) { return OS.isActive(o); } },
        { id: 'rider_unreachable', label: 'I can\u2019t reach my delivery partner', when: function (o) { return OS.riderAssigned(o); } },
        { id: 'arrived_late', label: 'My order arrived late', when: function (o) { return isDelivered(o); } }
      ] },
    { id: 'payment_refund', label: 'Payment and refund', desc: 'Charges, failed payments and refunds', icon: 'fa-indian-rupee-sign', tone: 'success',
      subs: [
        { id: 'charged_cancelled', label: 'I was charged for a cancelled order', when: function (o) { return isCancelled(o); } },
        { id: 'payment_failed', label: 'Payment failed or is still pending' },
        { id: 'refund_delayed', label: 'My refund hasn\u2019t arrived', when: function (o) { return isCancelled(o) || hasRefundData(o); } },
        { id: 'wrong_amount', label: 'I was charged the wrong amount' },
        { id: 'double_charge', label: 'I was charged more than once' }
      ] },
    { id: 'other', label: 'Something else', desc: 'Anything not covered above', icon: 'fa-headset', tone: '', noteRequired: true, subs: [] }
  ];
  function catById(id) { for (var i = 0; i < CATS.length; i++) if (CATS[i].id === id) return CATS[i]; return null; }
  function subsFor(cat, o) {
    var all = cat.subs.slice();
    if (!o) return all;
    var f = all.filter(function (s) { return !s.when || s.when(o); });
    return f.length ? f : all;
  }
  function orderedCats(o) {
    var ids = isDelivered(o) ? ['missing_wrong', 'food_quality', 'spilled', 'late_delivery', 'payment_refund', 'other']
      : isCancelled(o) ? ['payment_refund', 'late_delivery', 'missing_wrong', 'food_quality', 'spilled', 'other']
      : ['late_delivery', 'payment_refund', 'missing_wrong', 'food_quality', 'spilled', 'other'];
    return ids.map(catById);
  }

  /* ---------- state ---------- */
  var S = {
    screen: '', depth: 0,
    orders: [], order: null, ticketId: P.ticketId || '', closed: false, ticketOrderMissing: false,
    cat: null, sub: '', picked: {}, note: '', submitting: false, photos: [], photoSeq: 0, tickets: [],
    server: [], local: [], seq: 0, summary: null,
    pollFails: 0, polling: false, loadedOnce: false, unseen: false, notFound: false
  };

  /* ---------- order helpers ---------- */
  function orderLabel(o) { return o.orderNumber || String(o._id || '').slice(-6).toUpperCase(); }
  function initials(n) { return n ? String(n).charAt(0).toUpperCase() : 'E'; }
  function logoHtml(o) {
    var src = safeUrl(o.restaurantImage);
    return src ? '<img class="logo" src="' + esc(src) + '" alt="" loading="lazy">'
               : '<div class="logo" aria-hidden="true">' + esc(initials(o.restaurantName)) + '</div>';
  }
  function statusTone(o) { var g = OS.info(o).group; return g === 'delivered' ? 'good' : g === 'cancelled' ? 'bad' : 'info'; }
  function trackUrl(o) { return 'track-order.html?id=' + encodeURIComponent(o._id); }
  function ticketLabel() { return S.ticketId ? String(S.ticketId).slice(-6).toUpperCase() : ''; }

  async function loadOrders() {
    var res = await call('/orders');
    if (!(res && res.success && Array.isArray(res.data))) throw new Error('Could not load orders');
    S.orders = res.data;
    if (P.orderId) S.order = S.orders.filter(function (o) { return o._id === P.orderId; })[0] || null;
  }

  function orderCard(o, opts) {
    opts = opts || {};
    var items = Array.isArray(o.items) ? o.items : [];
    var lines = opts.noItems ? '' : items.slice(0, 3).map(function (i) {
      return '<div><span class="q">' + esc(i.quantity || 1) + '×</span>' + esc(i.name || 'Item') + '</div>';
    }).join('') + (items.length > 3 ? '<div>+ ' + (items.length - 3) + ' more</div>' : '');
    var placed = OS.fmtDateTime(o.createdAt);
    return '<section class="card ord">' +
      '<div class="ord-head">' + logoHtml(o) +
        '<div class="ord-main"><div class="ord-name">' + esc(o.restaurantName || 'Eatswada partner') + '</div>' +
        '<div class="ord-sub">Order #' + esc(orderLabel(o)) + (o.total != null ? ' · ₹' + esc(o.total) : '') + '</div></div>' +
        '<span class="chip ' + statusTone(o) + '">' + esc(OS.info(o).label) + '</span></div>' +
      (lines ? '<div class="ord-items">' + lines + '</div>' : '') +
      (opts.noFoot ? '' : '<div class="ord-foot"><span>' + (placed ? 'Placed ' + esc(placed) : '') + '</span><a href="' + trackUrl(o) + '">View order <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></a></div>') +
    '</section>';
  }

  /* ---------- app bar + navigation ---------- */
  function setBar(title, sub, showTrack) {
    $('bar-title').textContent = title; $('bar-sub').textContent = sub || '';
    var t = $('bar-track');
    if (showTrack && S.order && OS.isActive(S.order)) { t.hidden = false; t.href = trackUrl(S.order); } else t.hidden = true;
  }
  function fit() {
    var h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    document.documentElement.style.setProperty('--vh', Math.round(h) + 'px');
    if (S.screen === 'chat') { window.scrollTo(0, 0); stickBottomSoon(); }
  }
  if (window.visualViewport) { window.visualViewport.addEventListener('resize', fit); window.visualViewport.addEventListener('scroll', function () { if (S.screen === 'chat') window.scrollTo(0, 0); }); }
  window.addEventListener('resize', fit); fit();

  function nav(screen, replace) {
    var st = { s: screen, d: replace ? S.depth : S.depth + 1 };
    if (replace) history.replaceState(st, ''); else history.pushState(st, '');
    S.depth = st.d; show(screen);
  }
  window.addEventListener('popstate', function (e) {
    var st = e.state; if (!st || !st.s) return;
    S.depth = st.d || 0;
    var s = st.s;
    if (s === 'detail' && !S.cat) s = 'home';
    if ((s === 'home' || s === 'detail') && !S.order) s = 'picker';
    show(s);
  });
  function exitPage() {
    var sameOrigin = false;
    try { sameOrigin = !!document.referrer && new URL(document.referrer).origin === location.origin; } catch (e) {}
    if (sameOrigin && history.length > 1) history.back();
    else location.href = S.order ? trackUrl(S.order) : 'orders.html';
  }
  $('bar-back').addEventListener('click', function () { if (S.depth > 0) history.back(); else exitPage(); });

  function show(screen) {
    S.screen = screen;
    document.body.classList.toggle('chat-mode', screen === 'chat');
    ({ picker: renderPicker, home: renderHome, detail: renderDetail, chat: renderChat })[screen]();
    window.scrollTo(0, 0);
    var h = view.querySelector('[data-focus]'); if (h) h.focus({ preventScroll: true });
  }

  function renderState(o) {
    S.screen = 'state'; document.body.classList.remove('chat-mode');
    setBar('Help & support', '', false);
    view.innerHTML = '<div class="screen"><div class="card state">' +
      '<div class="ico ' + (o.tone || 'danger') + '"><i class="fa-solid ' + (o.icon || 'fa-circle-exclamation') + '" aria-hidden="true"></i></div>' +
      '<h2 tabindex="-1" data-focus>' + esc(o.title) + '</h2><p>' + esc(o.text) + '</p>' +
      (o.actions || []).map(function (a) { return '<button type="button" class="btn ' + (a.ghost ? 'btn-ghost' : 'btn-primary') + ' tap" data-act="' + a.act + '">' + esc(a.label) + '</button>'; }).join('') +
    '</div></div>';
  }
  function renderLoading() {
    S.screen = 'loading'; document.body.classList.remove('chat-mode');
    view.innerHTML = '<div class="screen" aria-busy="true"><div class="card ord"><div class="ord-head"><div class="skel logo"></div><div class="ord-main"><div class="skel" style="height:14px;width:55%;margin-bottom:8px"></div><div class="skel" style="height:12px;width:35%"></div></div></div></div>' +
      '<div class="card" style="padding:14px;display:grid;gap:14px">' + [1, 2, 3, 4].map(function () { return '<div class="skel" style="height:44px"></div>'; }).join('') + '</div></div>';
  }

  /* ---------- screen: order picker ---------- */
  function renderPicker() {
    setBar('Help & support', 'Choose an order', false);
    var list = S.orders.slice().sort(function (a, b) {
      var x = new Date(b.createdAt).getTime() || 0, y = new Date(a.createdAt).getTime() || 0; return x - y;
    }).slice(0, UI.PICKER_LIMIT);
    if (!list.length) {
      renderState({ tone: 'brand', icon: 'fa-receipt', title: 'No orders yet', text: 'Once you place an order, you can get help with it here.', actions: [{ label: 'Browse restaurants', act: 'home-page' }] });
      return;
    }
    view.innerHTML = '<div class="screen">' +
      '<h2 class="screen-title" tabindex="-1" data-focus>' + (S.notFound ? 'We couldn\u2019t find that order' : 'Which order do you need help with?') + '</h2>' +
      '<p class="screen-sub">' + (S.notFound ? 'Pick one of your recent orders instead.' : 'Your most recent orders are shown below.') + '</p>' +
      '<div class="card">' + list.map(function (o) {
        var placed = OS.fmtDateTime(o.createdAt);
        return '<button type="button" class="pick tap" data-act="pick" data-id="' + esc(o._id) + '">' + logoHtml(o) +
          '<div class="ord-main"><div class="ord-name">' + esc(o.restaurantName || 'Eatswada partner') + '</div>' +
          '<div class="ord-sub">#' + esc(orderLabel(o)) + (placed ? ' · ' + esc(placed) : '') + (o.total != null ? ' · ₹' + esc(o.total) : '') + '</div></div>' +
          '<span class="chip ' + statusTone(o) + '">' + esc(OS.info(o).label) + '</span></button>';
      }).join('') + '</div></div>';
  }

  /* ---------- screen: issue selection ---------- */
  /* ---------- issue category slug + evidence photos ---------- */
  var PHOTO_MAX = 3;
  function issueSlug(cat, subId) {
    if (!cat) return '';
    if (cat.id === 'missing_wrong') return subId === 'wrong_items' ? 'wrong_item' : (subId === 'missing_items' ? 'missing_item' : '');
    if (cat.id === 'spilled') return 'spilled_packaging';
    if (cat.id === 'food_quality') return 'quality_issue';
    if (cat.id === 'late_delivery') return 'late_delivery';
    if (cat.id === 'payment_refund') return 'payment_issue';
    return '';
  }
  function photoRequired() { var g = issueSlug(S.cat, S.sub); return g === 'missing_item' || g === 'wrong_item' || g === 'spilled_packaging'; }
  function photoAllowed() { return photoRequired() || issueSlug(S.cat, S.sub) === 'quality_issue'; }
  function donePhotos() { return S.photos.filter(function (p) { return p.status === 'done'; }); }
  function photoSectionHtml() {
    if (!S.cat || !photoAllowed()) return '';
    var req = photoRequired();
    var thumbs = S.photos.map(function (p) {
      return '<div class="ph-thumb ' + p.status + '"><img src="' + esc(p.preview) + '" alt="Evidence photo">' +
        (p.status === 'uploading' ? '<span class="ph-state"><span class="spin" aria-hidden="true"></span></span>' : '') +
        (p.status === 'error' ? '<span class="ph-state err" title="Upload failed">!</span>' : '') +
        '<button type="button" class="ph-rm" data-act="ph-rm" data-id="' + p.id + '" aria-label="Remove photo"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button></div>';
    }).join('');
    var add = S.photos.length < PHOTO_MAX
      ? '<label class="ph-add tap"><input type="file" accept="image/*" id="ph-input" multiple hidden><i class="fa-solid fa-camera" aria-hidden="true"></i><span>Add photo</span></label>' : '';
    return '<div class="sec-title">Photos ' + (req ? '(1–3 required)' : '(optional, up to 3)') + '</div>' +

  /* ---------- existing tickets on this order ---------- */
  function ticketStatus(t) {
    // Real SupportTicket enums: status open | waiting_vendor | waiting_admin |

    // partial_refund | coupon_issued | rejected.
    var st = OS.norm(t.status), rt = OS.norm(t.resolutionType);

  /* ---------- start chat from the issue form ---------- */
  async function startChatFromIssue() {
    if (S.submitting || validity()) return;
    var o = S.order, cat = S.cat;
    var sub = subsFor(cat, o).filter(function (s) { return s.id === S.sub; })[0] || null;
    var items = Object.keys(S.picked).map(function (i) {
      var it = o.items[i], mid = it.menuItem && (typeof it.menuItem === 'object' ? it.menuItem._id : it.menuItem);
      var x = { name: it.name, quantity: S.picked[i], orderedQuantity: Number(it.quantity) || 1 };
      if (mid) x.menuItemId = String(mid);

    });

        items: items, note: S.note.trim(), message: '',

      });
      if (!res || !res.ticketId) throw new Error('No ticket id returned');
      adoptTicket(String(res.ticketId));

  function adoptTicket(id) {

    var u = new URL(location.href); u.searchParams.set('ticketId', id);
    if (S.order) u.searchParams.set('order', S.order._id);

  /* ---------- chat: data ---------- */
  function normalize(raw) {
    try {
      var m = ADAPTER.normalizeMessage(raw); if (!m) return null;
      var text = String(m.text == null ? '' : m.text); if (!text.trim()) return null;
      var d = new Date(m.at); if (!isFinite(d.getTime())) d = new Date();
      return { id: String(m.id), from: m.from === 'user' ? 'user' : (m.from === 'system' ? 'system' : 'agent'), text: text, at: d, demo: !!m.demo };
    } catch (e) { console.error('[order-support] normalizeMessage failed', e); return null; }
  }
  function ingest(rawList, merge) {
    var seen = {}, out = [];
    if (merge) S.server.forEach(function (m) { if (m && m.id && !seen[m.id]) { seen[m.id] = 1; out.push(m); } });
    (Array.isArray(rawList) ? rawList : []).forEach(function (r) { var m = normalize(r); if (m && !seen[m.id]) { seen[m.id] = 1; out.push(m); } });
    out.sort(function (a, b) { return a.at - b.at; });
    S.server = out;
    // drop optimistic copies the server now echoes back
    var used = {};
    S.local = S.local.filter(function (l) {
      if (l.state !== 'sent') return true;
      var hit = S.server.filter(function (m) { return m.from === 'user' && m.text === l.text && !used[m.id] && m.at >= l.at - 60000; })[0];
      if (hit) { used[hit.id] = 1; return false; }
      return true;
    });
  }
  async function refreshMessages(force) {
    if (!S.ticketId || !chatConnected() || S.polling) return;
    S.polling = true;
    try {
      var before = S.server.length;
      // Request only messages newer than the last one already rendered. This
      // prevents retransmitting the entire conversation on each 8-second poll.
      var newest = S.server.length ? new Date(S.server[S.server.length - 1].at.getTime() - 1).toISOString() : '';
      var fresh = await ADAPTER.listMessages({ api: api, ticketId: S.ticketId, since: newest });
      ingest(fresh, !!newest);
      S.pollFails = 0; S.loadedOnce = true;
      if (S.screen === 'chat') {
        var grew = S.server.length > before && S.server.slice(before).some(function (m) { return m.from !== 'user'; });
        renderMsgs(force || !grew || nearBottom());
        if (grew && !nearBottom()) { S.unseen = true; $('jump') && ($('jump').hidden = false); }
        renderNote();
      }
    } catch (e) {
      S.pollFails++; console.error('[order-support] listMessages failed', e);
      if (S.screen === 'chat') { if (!S.loadedOnce) renderMsgs(true); renderNote(); }
    } finally { S.polling = false; }
  }
  setInterval(function () {
    if (S.screen === 'chat' && S.ticketId && !document.hidden) refreshMessages(false);
  }, UI.CHAT_POLL_MS);
  document.addEventListener('visibilitychange', function () { if (!document.hidden && S.screen === 'chat') refreshMessages(false); });

  /* ---------- chat: screen ---------- */
  function renderChat() {
    var o = S.order;
    setBar('Support chat', (o ? 'Order #' + orderLabel(o) : '') + (S.ticketId ? (o ? ' · ' : '') + 'Ticket #' + ticketLabel() : ''), false);

      ? '<div class="dev-banner">' + (MOCK ? '<b>Demo mode</b> — simulated backend on this device only.' : '<b>Developer notice</b> — support chat not connected. Missing: ' + missingPieces().map(function (k) { return '<code>' + k + '</code>'; }).join(' ')) + '</div>' : '';
    view.innerHTML = '<div class="chat">' + (devBanner ? '<div style="padding:12px 14px 0">' + devBanner + '</div>' : '') +
      '<div class="msgs" id="msgs" role="log" aria-live="polite" aria-label="Support conversation" tabindex="-1" data-focus></div>' +
      '<button type="button" class="jump" id="jump" hidden data-act="jump"><i class="fa-solid fa-arrow-down" aria-hidden="true"></i> New messages</button>' +
      '<div id="chat-note"></div>' +
      '<form class="composer" id="composer" autocomplete="off">' +
        '<label class="sr" for="msg">Message</label>' +
        '<textarea id="msg" rows="1" maxlength="' + UI.MSG_MAX + '" placeholder="Type your message"></textarea>' +
        '<button type="submit" class="send tap" id="send" aria-label="Send message" disabled><i class="fa-solid fa-paper-plane" aria-hidden="true"></i></button>' +
      '</form></div>';
    var msgs = $('msgs');
    msgs.addEventListener('scroll', function () { if (nearBottom()) { S.unseen = false; var j = $('jump'); if (j) j.hidden = true; } }, { passive: true });
    wireComposer(); renderMsgs(true); renderNote();
    if (S.ticketId && chatConnected()) refreshMessages(true);
  }
  function chatBlocked() { return !chatConnected() || S.closed; }
  function renderNote() {
    var box = $('chat-note'); if (!box) return; var html = '';
    if (!chatConnected()) html = '<div class="chat-note err" role="alert"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i><span>Support chat isn\u2019t available right now. Please try again later.</span></div>';
    else if (S.closed) html = '<div class="chat-note info"><i class="fa-solid fa-circle-info" aria-hidden="true"></i><span>This conversation has been closed.</span></div>';
    else if (S.pollFails >= 3) html = '<div class="chat-note"><i class="fa-solid fa-wifi" aria-hidden="true"></i><span>Reconnecting… new messages may be delayed.</span></div>';
    box.innerHTML = html;

    syncSend();

  function nearBottom() { var m = $('msgs'); return !m || (m.scrollHeight - m.scrollTop - m.clientHeight) < 90; }
  function stickBottomSoon() { requestAnimationFrame(function () { var m = $('msgs'); if (m) m.scrollTop = m.scrollHeight; }); }
  function sameDay(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
  function dayLabel(d) {
    var n = new Date(), y = new Date(Date.now() - 864e5);
    return sameDay(d, n) ? 'Today' : sameDay(d, y) ? 'Yesterday' : d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
  }
  function summaryCard() {
    var s = S.summary; if (!s) return '';
    return '<div class="issue-card"><div class="ic-head"><span class="ico ' + s.cat.tone + '"><i class="fa-solid ' + s.cat.icon + '" aria-hidden="true"></i></span>' +
      '<div><div class="ic-title">' + esc(s.cat.label) + '</div><div class="ic-sub">' + (s.sub ? esc(s.sub.label) : '') + (S.order ? (s.sub ? ' · ' : '') + 'Order #' + esc(orderLabel(S.order)) : '') + '</div></div></div>' +
      (s.items.length ? '<ul>' + s.items.map(function (i) { return '<li>' + esc(i.quantity) + '× ' + esc(i.name) + '</li>'; }).join('') + '</ul>' : '') +
      (s.note ? '<div class="ic-note">' + esc(s.note) + '</div>' : '') + '</div>';
  }
  function renderMsgs(stick) {
    var box = $('msgs'); if (!box) return;
    var prevTop = box.scrollTop, html = '';
    var all = S.server.concat(S.local.map(function (l) { return { local: l, from: 'user', text: l.text, at: l.at }; }));
    if (S.ticketId && !S.loadedOnce && chatConnected() && !all.length) {
      html = '<div class="skel skel-bubble" style="width:60%"></div><div class="skel skel-bubble" style="width:45%;align-self:flex-end"></div><div class="skel skel-bubble" style="width:70%"></div>';
    } else {
      html += summaryCard();
      if (!all.length && !S.summary) {
        html += '<div class="welcome"><span class="ico brand"><i class="fa-regular fa-comments" aria-hidden="true"></i></span><h2>How can we help' + (S.order ? ' with order #' + esc(orderLabel(S.order)) : '') + '?</h2><p>Send us a message and our support team will take it from here.</p></div>';
      }
      var last = null;
      all.forEach(function (m) {
        if (!last || !sameDay(last, m.at)) html += '<div class="day">' + esc(dayLabel(m.at)) + '</div>';
        last = m.at;
        var l = m.local, meta = '';
        if (l) {
          if (l.state === 'sending') meta = '<div class="meta">Sending…</div>';
          else if (l.state === 'failed') meta = '<div class="meta fail">Not sent · <button type="button" data-act="retry" data-lid="' + l.id + '">Retry</button></div>';
          else meta = '<div class="meta">' + esc(OS.fmtTime(m.at)) + '</div>';
        } else meta = '<div class="meta">' + esc(OS.fmtTime(m.at)) + (m.demo ? '<span class="demo-tag">Demo</span>' : '') + '</div>';
        html += '<div class="row ' + (m.from === 'user' ? 'me' : m.from) + '"><div class="bubble">' + esc(m.text) + '</div>' + (m.from === 'system' ? '' : meta) + '</div>';
      });
    }
    box.innerHTML = html;
    if (stick) box.scrollTop = box.scrollHeight; else box.scrollTop = prevTop;
  }

  /* ---------- chat: composer + sending ---------- */
  function syncSend() { var ta = $('msg'), b = $('send'); if (b) b.disabled = chatBlocked() || !(ta && ta.value.trim()); }
  function autosize(ta) { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 120) + 'px'; }
  function wireComposer() {
    var ta = $('msg'), form = $('composer');
    ta.addEventListener('input', function () { autosize(ta); syncSend(); });
    ta.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && window.matchMedia('(pointer:fine)').matches) { e.preventDefault(); form.requestSubmit(); }
    });
    ta.addEventListener('focus', function () { setTimeout(function () { window.scrollTo(0, 0); stickBottomSoon(); }, 250); });
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var text = ta.value.trim(); if (!text || chatBlocked()) return;
      var l = { id: 'l' + (++S.seq), text: text, at: new Date(), state: 'sending' };
      S.local.push(l); ta.value = ''; autosize(ta); syncSend(); renderMsgs(true); ta.focus();
      deliver(l);
    });
  }
  async function deliver(l) {
    l.state = 'sending'; renderMsgs(false);
    try {
      if (!S.ticketId) {
        var o = S.order;
        var res = await ADAPTER.createTicket({
          api: api, orderId: o ? o._id : undefined, orderNumber: o && o.orderNumber || undefined,
          category: { id: 'other', label: 'General help' }, issue: null, items: [], note: '', message: l.text
        });
        if (!res || !res.ticketId) throw new Error('No ticket id returned');
        adoptTicket(String(res.ticketId));
        var bar = $('bar-sub'); if (bar) bar.textContent = (o ? 'Order #' + orderLabel(o) + ' · ' : '') + 'Ticket #' + ticketLabel();
        l.state = 'sent'; if (Array.isArray(res.messages)) ingest(res.messages);
      } else {
        var r = await ADAPTER.sendMessage({ api: api, ticketId: S.ticketId, text: l.text });
        l.state = 'sent';
        if (r && r.message) {
          var m = normalize(r.message);
          if (m && !S.server.some(function (x) { return x.id === m.id; })) { S.server.push(m); S.server.sort(function (a, b) { return a.at - b.at; }); S.local = S.local.filter(function (x) { return x !== l; }); }
        }
      }
      renderMsgs(true); refreshMessages(true);
    } catch (e) {
      console.error('[order-support] send failed', e);
      l.state = 'failed'; renderMsgs(true);
    }
  }

  /* ---------- delegated events ---------- */
  view.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act],[data-step]'); if (!t || !view.contains(t)) return;
    if (t.dataset.step) {
      var item = t.closest('.item'), i = item.dataset.i, max = Number(S.order.items[i].quantity) || 1;
      var v = Math.max(1, Math.min(max, (S.picked[i] || 1) + Number(t.dataset.step)));
      S.picked[i] = v; item.querySelector('output').textContent = v; syncStepper(item, max); return;
    }
    switch (t.dataset.act) {
      case 'pick':
        S.order = S.orders.filter(function (o) { return o._id === t.dataset.id; })[0] || null; S.notFound = false;
        if (!S.order) return;
        P.orderId = S.order._id;
        var u = new URL(location.href); u.searchParams.set('order', S.order._id); u.searchParams.delete('orderId');
        history.replaceState(history.state, '', u.pathname + u.search);
        nav('home', true); break;
      case 'cat':
        S.cat = catById(t.dataset.id); S.sub = ''; S.picked = {}; S.note = ''; S.photos = []; nav('detail'); break;
      case 'ph-rm': removePhoto(t.dataset.id); break;
      case 'open-ticket': adoptTicket(String(t.dataset.id)); S.loadedOnce = false; nav('chat'); break;
      case 'start-chat': startChatFromIssue(); break;
      case 'open-chat': nav('chat'); break;
      case 'retry':
        var l = S.local.filter(function (x) { return x.id === t.dataset.lid; })[0]; if (l) deliver(l); break;
      case 'jump': var m = $('msgs'); if (m) m.scrollTop = m.scrollHeight; t.hidden = true; break;
      case 'orders': location.href = 'orders.html'; break;
      case 'home-page': location.href = 'index.html'; break;
      case 'reload': location.reload(); break;
    }
  });
  function syncStepper(item, max) {
    var out = Number(item.querySelector('output').textContent), b = item.querySelectorAll('.step-ctl button');
    b[0].disabled = out <= 1; b[1].disabled = out >= max;
  }
  view.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'ph-input') { addPhotos(t.files); t.value = ''; return; }
    if (t.name === 'sub') { S.sub = t.value; syncSubSafety(); syncPhotoSection(); syncCta(); }
    else if (t.dataset && t.dataset.item != null) {
      var item = t.closest('.item'), i = t.dataset.item;
      if (t.checked) { S.picked[i] = S.picked[i] || 1; item.classList.add('on'); item.querySelector('output') && (item.querySelector('output').textContent = S.picked[i]); }
      else { delete S.picked[i]; item.classList.remove('on'); }
      if (item.classList.contains('multi')) syncStepper(item, Number(S.order.items[i].quantity) || 1);
      syncCta();
    }
  });
  view.addEventListener('input', function (e) {
    if (e.target.id === 'note') { S.note = e.target.value; var c = $('note-count'); if (c) c.textContent = S.note.length; syncCta(); }
  });

  /* ---------- boot ---------- */
  async function boot() {
    if (!cfg || !cfg.API_BASE_URL || !OS) {
      renderState({ title: 'Something went wrong', text: 'This page couldn\u2019t start. Please reload and try again.', actions: [{ label: 'Reload', act: 'reload' }] });
      return;
    }
    renderLoading();
    try { await loadOrders(); }
    catch (e) {
      if (e && e.status === 401) return;
      console.error('[order-support] loading orders failed', e);
      renderState({ title: 'Couldn\u2019t load your orders', text: 'Check your connection and try again.', actions: [{ label: 'Try again', act: 'reload' }, { label: 'Back to orders', act: 'orders', ghost: true }] });
      return;
    }

    // Ticket deep link: learn the order (and closed state) from the backend when it offers that.
    if (S.ticketId && typeof ADAPTER.getTicket === 'function') {
      try {
        var t = await ADAPTER.getTicket({ api: api, ticketId: S.ticketId }) || {};
        S.closed = !!t.closed;
        if (!P.orderId && t.orderId) {
          P.orderId = String(t.orderId);
          S.order = S.orders.filter(function (o) { return o._id === P.orderId; })[0] || null;
        }
      } catch (e) {
        console.error('[order-support] getTicket failed', e);
        if (!P.orderId) {
          renderState({ icon: 'fa-comment-slash', title: 'We couldn\u2019t open that conversation', text: 'It may have been removed, or you may not have access to it.', actions: [{ label: 'Back to orders', act: 'orders' }] });
          return;
        }
      }
    }

    var first;
    if (S.ticketId) {
      if (!S.order && !P.orderId && typeof ADAPTER.getTicket !== 'function') {
        console.warn('[order-support] ?ticketId=… without ?order=… needs SUPPORT_ADAPTER.getTicket to find the order; opening the chat without order context.');
      }
      first = 'chat';
    } else if (P.orderId && !S.order) { S.notFound = true; first = 'picker'; }
    else if (!S.order) first = 'picker';
    else first = P.openChat ? 'chat' : 'home';

    history.replaceState({ s: first, d: 0 }, '');
    S.depth = 0; show(first);
    if (S.order && first === 'home') loadTickets().then(function () { if (S.screen === 'home' && S.tickets.length) renderHome(); });
  }
  boot();
})();
</script>
