<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f6fb">
  <title>Restaurant Information – Eatswada</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300,0,0&display=swap">
  <style>
    :root{
      --green:#159A62;--ink:#232833;--ink-2:#3a4150;--muted:#8b929d;--muted-2:#9aa1ab;
      --line:#e9ecf1;--dash:#e2e6ec;--bg:#f5f6fb;--card:#fff;--coral:#e4565c;--coral-soft:#fff4f2;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;background:var(--bg);color:var(--ink);
      font-family:'Manrope', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing:antialiased;
      padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));
    }
    button{font:inherit;cursor:pointer}
    a{text-decoration:none;color:inherit}
    .material-symbols-outlined{
      font-family:'Material Symbols Outlined';
      font-weight:300;
      font-style:normal;
      font-size:inherit;
      line-height:1;
      letter-spacing:normal;
      text-transform:none;
      display:inline-block;
      white-space:nowrap;
      word-wrap:normal;
      direction:ltr;
      -webkit-font-feature-settings:'liga';
      -webkit-font-smoothing:antialiased;
      font-feature-settings:'liga';
    }

    /* ---- floating top nav ---- */
    .topbar{
      display:flex;align-items:center;justify-content:space-between;
      padding:calc(10px + env(safe-area-inset-top,0px)) 18px 6px;
    }
    .nav-ic{
      width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
      background:transparent;border:0;color:var(--ink);font-size:21px;
      font-weight:500;
    }
    .nav-ic:active{transform:scale(.94)}
    .nav-right{display:flex;gap:2px}

    .wrap{max-width:760px;margin:0 auto;padding:8px 20px 0}

    /* ---- main restaurant card ---- */
    .rcard{
      background:var(--card);
      border-radius:24px;
      padding:24px 26px 8px;
      box-shadow:0 4px 18px rgba(20,28,44,.035);
    }
    h1{
      font-size:27px;
      line-height:1.18;
      margin:0 0 4px;
      font-weight:700;
      letter-spacing:-.45px;
      color:var(--ink);
    }
    .cuisine{
      margin:0;
      color:var(--muted);
      font-size:15px;
      font-weight:400;
      line-height:1.35;
    }
    .address{
      margin:11px 0 0;
      font-size:15px;
      line-height:1.4;
      color:#303640;
      font-weight:400;
    }

    /* ---- action row ---- */
    .actions{
      display:flex;
      align-items:center;
      gap:12px;
      margin:19px 0 2px;
      flex-wrap:wrap;
    }
    .act-circle{
      width:50px;height:50px;border-radius:50%;background:#fff;border:1px solid #e6e8ed;
      display:grid;place-items:center;color:var(--coral);font-size:21px;
      box-shadow:0 1px 2px rgba(20,28,44,.02);
    }
    .act-circle:active{transform:scale(.95)}
    .act-pill{
      display:inline-flex;align-items:center;gap:9px;height:52px;padding:0 22px;
      border-radius:999px;background:#fff;border:1px solid var(--line);
      color:var(--ink);font-size:16px;font-weight:600;
    }
    .act-pill i{color:var(--coral);font-size:17px}

    .divider{height:1px;background:#e4e7ec;margin:30px 0 4px}

    /* ---- opening hours ---- */
    .hours-head{
      display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;
      padding:16px 0;text-align:left;color:var(--ink);
    }
    .hours-head .clock{
      color:var(--ink);font-size:23px;flex:0 0 auto;width:24px;text-align:center;
    }
    .hours-title{
      flex:1 1 auto;font-size:16px;font-weight:500;line-height:1.3;min-width:0;
    }
    .hours-title .open{color:var(--green);font-weight:600}
    .hours-title .closed{color:var(--coral);font-weight:600}
    .chev{flex:0 0 auto;color:var(--muted);font-size:15px;transition:transform .25s ease}
    .hours-head[aria-expanded="false"] .chev{transform:rotate(180deg)}

    .hours-list{overflow:hidden;transition:max-height .3s ease;padding-left:40px}
    .hours-list[hidden]{display:block!important;max-height:0}
    .hrow{
      display:grid;
      grid-template-columns:96px 1fr;
      align-items:baseline;
      gap:10px;
      padding:5px 0;
      font-size:15px;
      line-height:1.3;
    }
    .hrow .d{color:var(--muted);font-weight:400}
    .hrow .t{color:#343a45;font-weight:500;white-space:nowrap}
    .hrow.is-today .d,.hrow.is-today .t{color:var(--ink);font-weight:700}
    .hrow .t.closed{color:var(--muted-2)}

    /* ---- services (dashed dividers) ---- */
    .svc{
      display:flex;
      align-items:center;
      gap:13px;
      padding:13px 0;
      font-size:16px;
      line-height:1.3;
      color:var(--ink);
      font-weight:400;
      border-top:1px dashed var(--dash);
    }
    .svc .si{
      width:24px;
      text-align:center;
      color:#5a626d;
      font-size:21px;
      flex:0 0 auto;
    }
    #services{margin-top:2px}

    /* ---- FSSAI (on background, outside card) ---- */
    .fssai{padding:18px 10px 4px}
    .fssai .lbl{font-size:14px;color:#858c98;font-weight:400}
    .fssai .val{font-size:15px;color:#9299a4;margin-top:3px;letter-spacing:.1px;font-weight:400}

    /* ---- bottom CTA ---- */
    .cta-bar{
      position:fixed;left:0;right:0;bottom:0;z-index:30;
      background:linear-gradient(180deg,rgba(245,246,251,0) 0%,var(--bg) 34%);
      padding:12px 20px calc(14px + env(safe-area-inset-bottom,0px));
    }
    .cta-btn{
      width:100%;height:58px;border:0;border-radius:17px;background:var(--coral);color:#fff;
      font-size:18px;font-weight:600;letter-spacing:-.1px;box-shadow:0 8px 20px rgba(228,86,92,.22);
    }
    .cta-btn:active{transform:translateY(1px)}

    /* ---- toast ---- */
    .toast{
      position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(10px);
      background:#232833;color:#fff;font-size:13px;font-weight:600;padding:10px 16px;border-radius:12px;
      opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:40;
    }
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    /* ---- skeleton / states ---- */
    .skeleton{background:linear-gradient(90deg,#eceef3 25%,#f6f7fb 50%,#eceef3 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;border-radius:10px}
    .sk-line{height:16px;margin:12px 0}.sk-line.w70{width:70%}.sk-line.w45{width:45%}.sk-line.w90{width:90%}
    @keyframes shimmer{to{background-position:-200% 0}}
    .state-card{background:#fff;border-radius:18px;padding:18px;margin-top:6px}
    .error{color:var(--coral);font-weight:800;margin-bottom:6px}
    .muted{font-size:13px;color:var(--muted)}

    @media(max-width:372px){
      h1{font-size:25px}
      .rcard{padding-left:20px;padding-right:20px}
      .act-pill{padding:0 16px}
      .hrow{grid-template-columns:88px 1fr;font-size:14px}
      .actions{gap:10px}
    }
  </style>
</head>
<body>

<header class="topbar">
  <button class="nav-ic" id="back-btn" aria-label="Back"><span class="material-symbols-outlined">arrow_back</span></button>
  <div class="nav-right">
    <button class="nav-ic" id="share-btn" aria-label="Share"><span class="material-symbols-outlined">ios_share</span></button>
  </div>
</header>

<main class="wrap">
  <div id="loading">
    <section class="rcard">
      <div class="skeleton sk-line w70" style="height:26px"></div>
      <div class="skeleton sk-line w45"></div>
      <div class="skeleton sk-line w90"></div>
      <div class="skeleton sk-line w70" style="height:46px;border-radius:999px;margin-top:18px"></div>
    </section>
  </div>

  <div id="content" hidden>
    <section class="rcard">
      <h1 id="name">Restaurant</h1>
      <p class="cuisine" id="cuisine"></p>
      <p class="address" id="address"></p>

      <div class="actions" id="actions"></div>

      <div class="divider"></div>

      <button class="hours-head" id="hours-head" aria-expanded="true" aria-controls="hours-list">
        <span class="clock"><span class="material-symbols-outlined">schedule</span></span>
        <span class="hours-title" id="hours-status">Opening hours</span>
        <span class="chev"><span class="material-symbols-outlined">keyboard_arrow_up</span></span>
      </button>
      <div class="hours-list" id="hours-list"></div>

      <div id="services"></div>
    </section>

    <div class="fssai" id="fssai" hidden>
      <div class="lbl">FSSAI Lic No</div>
      <div class="val" id="fssai-val"></div>
    </div>
  </div>

  <section class="state-card" id="error-card" hidden>
    <div class="error">Unable to load restaurant</div>
    <div class="muted" id="error-text">Please try again.</div>
  </section>
</main>

<div class="cta-bar">
  <button class="cta-btn" id="menu-btn">Go back to menu</button>
</div>

<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="safe-html.js"></script>
<script src="api.js"></script>
<script>
(function(){
  const id = new URLSearchParams(location.search).get('id');
  const $ = s => document.querySelector(s);
  const esc = v => String(v ?? '').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const num = v => { const n = Number(v); return Number.isFinite(n) ? n : null; };

  let currentRestaurant = null;

  $('#back-btn').addEventListener('click', () => history.back());
  $('#menu-btn').addEventListener('click', () => {
    location.href = id ? 'restaurant.html?id=' + encodeURIComponent(id) : 'index.html';
  });

  function toast(msg){
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1800);
  }
  /* ---- Share (real Web Share API, clipboard fallback) ---- */
  function initShare(){
    $('#share-btn').addEventListener('click', async () => {
      const name = (currentRestaurant && currentRestaurant.name) || 'this restaurant';
      const url = location.href;
      try {
        if (navigator.share) { await navigator.share({ title: name, url }); return; }
        await navigator.clipboard.writeText(url); toast('Link copied');
      } catch(e){ /* user dismissed or unsupported */ }
    });
  }

  function cuisineText(r){
    if (Array.isArray(r.cuisine) && r.cuisine.length) return r.cuisine.join(' · ');
    if (Array.isArray(r.cuisines) && r.cuisines.length) return r.cuisines.join(' · ');
    return r.cuisineDisplay || (typeof r.cuisine === 'string' ? r.cuisine : '');
  }

  function costForOne(r){
    return num(r.costForOne ?? r.priceForOne ?? r.averageCostForOne ?? r.avgCostForOne ?? r.costPerPerson);
  }

  function coords(r){
    const c = r && r.location && r.location.coordinates;
    if (Array.isArray(c) && c.length >= 2) {
      const lng = Number(c[0]), lat = Number(c[1]);
      if (Number.isFinite(lat) && Number.isFinite(lng)) return { lat, lng };
    }
    return null;
  }

  function renderActions(r){
    const el = $('#actions'); const parts = [];
    // CALL — only when a real phone number exists
    const phone = (r.phone || r.contactNumber || '').toString().trim();
    if (phone) parts.push('<a class="act-circle" href="tel:'+esc(phone)+'" aria-label="Call restaurant"><span class="material-symbols-outlined">call</span></a>');
    // DIRECTIONS — real maps deep link from coordinates, else address
    const c = coords(r);
    const addr = r.address || (r.location && r.location.address) || '';
    let dest = c ? (c.lat+','+c.lng) : (addr ? addr : '');
    if (dest) {
      const url = 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(dest);
      parts.push('<a class="act-circle" href="'+esc(url)+'" target="_blank" rel="noopener" aria-label="Directions"><span class="material-symbols-outlined">directions</span></a>');
    }
    // NOTE: no "View dining page" — Eatswada has no dining-page feature.
    if (!parts.length) { el.hidden = true; return; }
    el.innerHTML = parts.join('');
  }

  function timeStr(h){
    if (!h) return null;
    const o = h.opensAt || h.open || h.from, cl = h.closesAt || h.close || h.to;
    if (h.closed === true) return { closed:true };
    if (o && cl) return { open:esc(o), close:esc(cl) };
    return null;
  }

  function renderHours(r){
    const src = r.openingHours || r.hours || {};
    const days = [['monday','Monday'],['tuesday','Tuesday'],['wednesday','Wednesday'],['thursday','Thursday'],['friday','Friday'],['saturday','Saturday'],['sunday','Sunday']];
    const todayKey = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'][new Date().getDay()];

    let anyHours = false;
    const rows = days.map(([key,label]) => {
      const t = timeStr(src[key]);
      let time = 'Hours not available', cls = 'closed';
      if (t && t.closed) { time = 'Closed'; }
      else if (t) { time = t.open + ' - ' + t.close; cls = ''; anyHours = true; }
      return '<div class="hrow '+(key===todayKey?'is-today':'')+'"><span class="d">'+label+'</span><span class="t '+cls+'">'+time+'</span></div>';
    }).join('');
    $('#hours-list').innerHTML = rows;

    // Status line uses the real open/closed flag + today's real closing/opening time.
    const open = (r.availability && typeof r.availability.isOpen === 'boolean') ? r.availability.isOpen
               : (typeof r.isOpen === 'boolean' ? r.isOpen : true);
    const todayT = timeStr(src[todayKey]);
    let html;
    if (open) {
      html = '<span class="open">Open now</span>' + (todayT && todayT.close ? ' • Closes ' + todayT.close : '');
    } else {
      html = '<span class="closed">Closed now</span>' + (todayT && todayT.open ? ' • Opens ' + todayT.open : '');
    }
    $('#hours-status').innerHTML = html;

    // If the backend supplied no usable hours at all, hide the list but keep the status line.
    if (!anyHours) { $('#hours-list').innerHTML = ''; }
  }

  function renderServices(r){
    const el = $('#services'); const rows = [];
    // Every Eatswada restaurant provides delivery (core platform function).
    rows.push(['fa-solid fa-bag-shopping','Provides delivery']);
    if (r.freeDeliveryEnabled !== false && num(r.freeDeliveryAbove) && num(r.freeDeliveryAbove) > 0)
      rows.push(['fa-solid fa-motorcycle','Free delivery on orders above ₹'+num(r.freeDeliveryAbove).toFixed(0)]);
    if (num(r.deliveryRadiusKm) && num(r.deliveryRadiusKm) > 0)
      rows.push(['fa-solid fa-location-dot','Delivers within '+num(r.deliveryRadiusKm)+' km']);
    if (r.codEnabled === true)
      rows.push(['fa-solid fa-indian-rupee-sign','Cash on delivery available']);
    el.innerHTML = rows.map(([ic,txt]) => '<div class="svc"><span class="si"><i class="'+ic+'"></i></span><span>'+esc(txt)+'</span></div>').join('');
  }

  function renderFssai(r){
    const v = (r.fssaiLicenseNumber || r.fssai || '').toString().trim();
    if (!v) return;                         // hide gracefully when unavailable
    $('#fssai-val').textContent = v;
    $('#fssai').hidden = false;
  }

  function render(r){
    currentRestaurant = r;
    document.title = (r.name || 'Restaurant') + ' – Eatswada';
    $('#name').textContent = r.name || 'Restaurant';

    const cu = cuisineText(r), cost = costForOne(r);
    const sub = [cu, cost ? '₹'+cost.toFixed(0)+' for one' : ''].filter(Boolean).join(' · ');
    if (sub) $('#cuisine').textContent = sub; else $('#cuisine').hidden = true;

    const addr = r.address || (r.location && r.location.address) || '';
    if (addr) $('#address').textContent = addr; else $('#address').hidden = true;

    renderActions(r);
    renderHours(r);
    renderServices(r);
    renderFssai(r);
  }

  // collapsible opening hours
  $('#hours-head').addEventListener('click', () => {
    const head = $('#hours-head'), list = $('#hours-list');
    const open = head.getAttribute('aria-expanded') === 'true';
    head.setAttribute('aria-expanded', open ? 'false' : 'true');
    if (open) { list.style.maxHeight = '0'; }
    else { list.style.maxHeight = list.scrollHeight + 'px'; }
  });

  async function init(){
initShare();
    if (!id){
      $('#loading').hidden = true; $('#error-card').hidden = false;
      $('#error-text').textContent = 'Restaurant ID is missing.';
      return;
    }
    try{
      const r = await window.API.getObject(window.API.routes.restaurant(id));
      render(r);
      $('#loading').hidden = true;
      $('#content').hidden = false;
      const list = $('#hours-list'); list.style.maxHeight = list.scrollHeight + 'px';
    }catch(e){
      $('#loading').hidden = true;
      $('#error-card').hidden = false;
      $('#error-text').textContent = (e && e.message) || 'Please try again.';
    }
  }
  document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
