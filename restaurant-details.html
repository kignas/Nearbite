<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Restaurant Information – Eatswada</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    *{box-sizing:border-box} body{margin:0;background:#f4f5f7;color:#20232b;font-family:Poppins,sans-serif;padding-bottom:30px}
    .top{height:74px;background:#fff;border-bottom:1px solid #eceef1;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:5}
    .icon{width:44px;height:44px;border:0;border-radius:50%;background:#f4f5f7;color:#20232b;font-size:17px;display:grid;place-items:center}
    .title{font-weight:800;font-size:17px}.wrap{max-width:720px;margin:18px auto;padding:0 16px}
    .card{background:#fff;border:1px solid #e9ebef;border-radius:22px;padding:20px;margin-bottom:14px;box-shadow:0 4px 18px rgba(15,23,42,.04)}
    h1{font-size:26px;margin:0 0 4px}.sub{color:#7b8490;font-size:13px;margin:0 0 16px}.address{font-size:14px;line-height:1.5}
    .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.pill{padding:9px 12px;border:1px solid #eceef1;border-radius:12px;font-size:12px;font-weight:700}
    .pill i{margin-right:6px}.green{color:#168a55}.orange{color:#e67e22}.section-title{font-size:19px;font-weight:800;margin:0 0 14px}.line{display:flex;justify-content:space-between;gap:18px;padding:11px 0;border-bottom:1px solid #eef0f2;font-size:13px}.line:last-child{border-bottom:0}.label{color:#7c8490}.value{text-align:right;font-weight:600}
    .review{border-top:1px solid #eef0f2;padding:14px 0}.review:first-child{border-top:0;padding-top:0}.review-head{display:flex;justify-content:space-between;gap:10px}.review-name{font-weight:700;font-size:13px}.rating{color:#168a55;font-weight:800;font-size:12px}.review-text{color:#5f6874;font-size:13px;line-height:1.5;margin:7px 0 0}.review-photo{display:block;width:96px;height:96px;object-fit:cover;border-radius:12px;margin-top:10px}
    .back{width:100%;height:52px;border:0;border-radius:15px;background:#111827;color:#fff;font:800 15px Poppins,sans-serif}
    .muted{color:#9299a3;font-size:13px}.error{color:#c53d4b}
  </style>
</head>
<body>
  <header class="top"><button class="icon" onclick="history.back()" aria-label="Back"><i class="fa-solid fa-chevron-left"></i></button><div class="title">Restaurant information</div><div style="width:44px"></div></header>
  <main class="wrap">
    <section class="card" id="main-card"><h1 id="name">Loading…</h1><p class="sub" id="cuisine"></p><div class="address" id="address"></div><div class="row" id="quick"></div></section>
    <section class="card"><h2 class="section-title">Restaurant details</h2><div id="details"><div class="muted">Loading details…</div></div></section>
    <section class="card" id="reviews-card" hidden><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><h2 class="section-title" style="margin:0">Customer reviews</h2><span class="muted" id="review-count"></span></div><div id="reviews" style="margin-top:14px"></div></section>
    <button class="back" onclick="goMenu()">Go back to menu</button>
  </main>
  <script src="config.js"></script><script src="api.js"></script>
  <script>
    function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
    function goMenu(){const id=new URLSearchParams(location.search).get('id');location.href=id?'restaurant.html?id='+encodeURIComponent(id):'index.html'}
    function cuisine(r){return r.cuisineDisplay||r.cuisine||(Array.isArray(r.cuisines)?r.cuisines.join(' · '):'')}
    function render(r){
      document.title=(r.name||'Restaurant')+' – Information';
      document.getElementById('name').textContent=r.name||'Restaurant';
      document.getElementById('cuisine').textContent=cuisine(r);
      document.getElementById('address').textContent=r.address||(r.location&&r.location.address)||'Address not available';
      const q=[]; if(Number.isFinite(Number(r.rating))) q.push('<span class="pill green"><i class="fa-solid fa-star"></i>'+Number(r.rating).toFixed(1)+' · '+(Number(r.ratingCount)||0)+' ratings</span>');
      if(Number.isFinite(Number(r.estimatedDeliveryMin))) q.push('<span class="pill orange"><i class="fa-regular fa-clock"></i>'+Number(r.estimatedDeliveryMin)+'-'+Number(r.estimatedDeliveryMax||r.estimatedDeliveryMin)+' mins</span>');
      q.push('<span class="pill"><i class="fa-solid fa-motorcycle"></i>'+((r.freeDeliveryEnabled===false)?'Delivery available':'Free delivery')+'</span>'); document.getElementById('quick').innerHTML=q.join('');
      const rows=[]; const radius=Number(r.deliveryRadiusKm); if(cuisine(r)) rows.push(['Cuisine',cuisine(r)]); if(r.phone) rows.push(['Phone',r.phone]); if(Number.isFinite(radius)&&radius>0) rows.push(['Delivery radius',radius+' km']);
      if(r.availability){if(r.availability.opensAt) rows.push(['Opens at',r.availability.opensAt]);if(r.availability.closesAt) rows.push(['Closes at',r.availability.closesAt]);}
      if(r.isActive!==undefined) rows.push(['Status',r.isActive?'Active':'Unavailable']);
      document.getElementById('details').innerHTML=rows.length?rows.map(x=>'<div class="line"><span class="label">'+esc(x[0])+'</span><span class="value">'+esc(x[1])+'</span></div>').join(''):'<div class="muted">No additional details available.</div>';
    }
    async function loadReviews(id){
      try{const payload=await window.API.request('/restaurants/'+encodeURIComponent(id)+'/reviews');const d=window.API.unwrap(payload);const list=Array.isArray(d)?d:(d&&Array.isArray(d.reviews)?d.reviews:[]);if(!list.length)return;document.getElementById('reviews-card').hidden=false;document.getElementById('review-count').textContent=list.length+(list.length===1?' review':' reviews');document.getElementById('reviews').innerHTML=list.slice(0,10).map(r=>{const n=(r.user&&(r.user.name||r.user.fullName))||r.userName||r.name||'Customer';const score=Number(r.score||r.rating||r.foodRating);const text=r.comment||r.text||r.review||'';const photo=r.image||r.photo||r.foodImage||r.imageUrl||'';return '<article class="review"><div class="review-head"><span class="review-name">'+esc(n)+'</span><span class="rating">'+(Number.isFinite(score)?'★ '+score.toFixed(1):'')+'</span></div>'+(text?'<p class="review-text">'+esc(text)+'</p>':'')+(photo?'<img class="review-photo" src="'+esc(photo)+'" alt="Customer food photo" loading="lazy">':'')+'</article>'}).join('')}catch(e){}}
    async function init(){const id=new URLSearchParams(location.search).get('id');if(!id){document.getElementById('name').textContent='Restaurant not found';return}try{const r=await window.API.getObject(window.API.routes.restaurant(id));render(r);loadReviews(id)}catch(e){document.getElementById('name').textContent='Unable to load restaurant';document.getElementById('address').innerHTML='<span class="error">'+esc(e.message||'Please try again.')+'</span>'}}
    document.addEventListener('DOMContentLoaded',init);
  </script>
</body>
</html>
