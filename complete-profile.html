<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F1F5F9">
  <title>Complete your profile · Eatswada</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="config.js"></script>
  <style>
    :root{
      --brand:#FC8019;
      --brand-dark:#e96f0a;
      --brand-soft:#FFCBB7;
      --band:#F1F5F9;
      --ink:#1A1D21;
      --label:#9AA1AB;
      --muted:#6B7280;
      --line:#E2E4E8;
      --green:#16A34A;
      --danger:#DC2626;
      --font:'Manrope',system-ui,-apple-system,sans-serif;
    }

    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

    html{background:var(--band)}

    body{
      background:#fff;
      color:var(--ink);
      font-family:var(--font);
      font-weight:500;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      overflow-x:hidden;
    }

    button,input{font-family:inherit}

    .page{
      display:flex;
      flex-direction:column;
      min-height:100dvh;
      max-width:520px;
      margin:0 auto;
      background:#fff;
    }

    /* ---------------- header band ---------------- */
    .topbar{
      background:var(--band);
      padding:12px 30px 24px;
    }

    .back{
      display:flex;
      align-items:center;
      justify-content:flex-start;
      width:42px;height:42px;
      margin-left:-11px;
      border:0;background:none;
      color:var(--ink);
      font-size:20px;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }
    .back:active{opacity:.5}
    .back:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}

    .topbar h1{
      margin-top:4px;
      font-size:25px;
      line-height:1.18;
      font-weight:800;
      letter-spacing:-.6px;
      color:var(--ink);
    }

    .topbar p{
      margin-top:6px;
      font-size:14px;
      line-height:1.5;
      font-weight:500;
      color:var(--muted);
      max-width:32ch;
    }

    /* ---------------- form ---------------- */
    .form{
      flex:1;
      padding:28px 30px 0;
    }

    .field{margin-bottom:26px}
    .field:last-of-type{margin-bottom:0}

    label{
      display:block;
      font-size:13px;
      line-height:1.3;
      font-weight:600;
      color:var(--label);
      margin-bottom:7px;
    }

    .control{position:relative}

    .input{
      display:block;
      width:100%;
      min-height:50px;
      border:0;
      border-bottom:1.5px solid var(--line);
      border-radius:0;
      background:transparent;
      padding:8px 0 12px;
      font-size:17px;
      line-height:1.4;
      font-weight:600;
      color:var(--ink);
      outline:0;
      -webkit-appearance:none;
      transition:border-color .15s ease;
    }
    .input::placeholder{color:#B4B9C0;font-weight:500}
    .input:focus{border-bottom-color:var(--brand)}

    .control.has-icon .input{padding-right:40px}

    /* the verified number never behaves like an editable field */
    .input[readonly]{color:#1F2937;letter-spacing:.2px}
    .input[readonly]:focus{border-bottom-color:var(--line)}

    .input.invalid,
    .input.invalid:focus{border-bottom-color:var(--danger)}

    .tick{
      position:absolute;right:2px;bottom:12px;
      color:var(--green);font-size:16px;
      pointer-events:none;
    }

    .toggle{
      position:absolute;right:-10px;bottom:-5px;
      width:42px;height:42px;
      border:0;background:none;
      color:var(--label);font-size:16px;
      display:grid;place-items:center;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }
    .toggle:active{opacity:.5}
    .toggle:focus-visible{outline:2px solid var(--brand);outline-offset:-6px;border-radius:10px}

    .hint{
      margin-top:8px;
      font-size:11.5px;line-height:1.5;font-weight:500;
      color:var(--label);
    }

    .field-error{
      display:none;
      margin-top:8px;
      font-size:11.5px;line-height:1.45;font-weight:600;
      color:var(--danger);
    }
    .field-error.show{display:block}

    .form-error{
      display:none;
      margin-bottom:22px;
      font-size:12.5px;line-height:1.5;font-weight:600;
      color:var(--danger);
    }
    .form-error i{margin-right:7px}

    /* ---------------- CTA ---------------- */
    .cta-wrap{
      padding:30px 30px calc(22px + env(safe-area-inset-bottom));
    }

    .cta{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:9px;
      width:100%;
      min-height:52px;
      border:0;
      border-radius:9px;
      background:var(--brand-soft);
      color:#fff;
      font-size:14px;
      font-weight:800;
      letter-spacing:.09em;
      text-transform:uppercase;
      cursor:not-allowed;
      transition:background .15s ease;
      -webkit-tap-highlight-color:transparent;
    }
    .cta i{font-size:12px}
    .cta:not(:disabled){background:var(--brand);cursor:pointer}
    .cta:not(:disabled):active{background:var(--brand-dark)}
    .cta:focus-visible{outline:2px solid var(--brand-dark);outline-offset:3px}

    /* ---------------- loading ---------------- */
    .loading{
      display:none;
      position:fixed;inset:0;
      background:rgba(255,255,255,.95);
      z-index:200;
      align-items:center;justify-content:center;flex-direction:column;
    }
    .spinner{
      width:30px;height:30px;
      border:3px solid #EDEFF2;
      border-top-color:var(--brand);
      border-radius:50%;
      animation:spin .8s linear infinite;
    }
    .loading span{
      margin-top:13px;
      font-size:12.5px;font-weight:600;color:var(--muted);
    }
    @keyframes spin{to{transform:rotate(360deg)}}

    @media (prefers-reduced-motion:reduce){
      *{animation-duration:.01ms !important;transition-duration:.01ms !important}
    }

    /* 360px */
    @media(max-width:365px){
      .topbar{padding:11px 22px 22px}
      .topbar h1{font-size:23px;letter-spacing:-.5px}
      .topbar p{font-size:13.5px}
      .form{padding:24px 22px 0}
      .field{margin-bottom:23px}
      .input{font-size:16px;min-height:48px}
      .cta-wrap{padding:26px 22px calc(20px + env(safe-area-inset-bottom))}
    }

    /* short viewport / keyboard open */
    @media(max-height:700px){
      .topbar{padding-bottom:20px}
      .topbar h1{font-size:23px}
      .form{padding-top:24px}
      .field{margin-bottom:22px}
      .cta-wrap{padding-top:26px}
    }
  </style>
</head>
<body>
  <div class="page">

    <header class="topbar">
      <button class="back" onclick="safeBack()" aria-label="Go back"><i class="fa-solid fa-arrow-left"></i></button>
      <h1>Complete your profile</h1>
      <p>Create your Eatswada account for faster checkout.</p>
    </header>

    <main class="form">

      <div class="form-error" id="errorBox" role="alert"></div>

      <div class="field">
        <label for="phone">Mobile Number</label>
        <div class="control has-icon">
          <input class="input" id="phone" type="tel" readonly aria-readonly="true" autocomplete="tel">
          <i class="fa-solid fa-check tick" aria-hidden="true"></i>
        </div>
        <div class="hint">Verified with OTP</div>
      </div>

      <div class="field">
        <label for="name">Full Name *</label>
        <div class="control">
          <input class="input" id="name" type="text" maxlength="60" placeholder="Enter your full name" autocomplete="name" autocapitalize="words">
        </div>
        <div class="field-error" id="err_name"></div>
      </div>

      <div class="field">
        <label for="password">Password *</label>
        <div class="control has-icon">
          <input class="input" id="password" type="password" minlength="6" maxlength="72" placeholder="Create password" autocomplete="new-password">
          <button type="button" class="toggle" id="pwToggle" onclick="togglePassword()" aria-label="Show password" aria-pressed="false">
            <i class="fa-solid fa-eye" id="pwIcon"></i>
          </button>
        </div>
        <div class="field-error" id="err_password"></div>
      </div>

      <div class="field">
        <label for="email">Email Address (Optional)</label>
        <div class="control">
          <input class="input" id="email" type="email" maxlength="120" placeholder="you@example.com" autocomplete="email" inputmode="email">
        </div>
        <div class="field-error" id="err_email"></div>
      </div>

    </main>

    <div class="cta-wrap">
      <button class="cta" id="saveBtn" disabled onclick="completeProfile()">
        Continue <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
      </button>
    </div>

  </div>

  <div class="loading" id="loading">
    <div class="spinner"></div>
    <span>Saving your details…</span>
  </div>

<script>
  const API = CONFIG.API_BASE_URL;
  const token = localStorage.getItem('nearbite_token') || localStorage.getItem('token');

  if (!token) window.location.replace('login.html');

  const $ = id => document.getElementById(id);

  /* Where the customer goes after the account is saved:
     Complete Profile → Location map → Address → Checkout.
     The address step is handed to the map as the destination so the
     confirmed coordinates carry straight into the address form. */
  const ADDRESS_STEP  = 'address.html?add=1';
  const LOCATION_STEP = 'location-onboarding.html?from=complete-profile'
                      + '&next=' + encodeURIComponent(ADDRESS_STEP)
                      + '&return=' + encodeURIComponent(ADDRESS_STEP);

  function safeBack(){
    if (typeof window.nearbiteSafeBack === 'function') window.nearbiteSafeBack();
    else if (history.length > 1) history.back();
    else window.location.replace('index.html');
  }

  /* ---------------- display helpers ---------------- */

  function formatPhone(raw){
    const digits = String(raw || '').replace(/\D/g, '');
    if (!digits) return '';
    const ten = digits.length > 10 ? digits.slice(-10) : digits;
    if (ten.length === 10) return '+91 ' + ten.slice(0, 5) + ' ' + ten.slice(5);
    return String(raw).trim();
  }

  function togglePassword(){
    const input = $('password');
    const shown = input.type === 'text';
    input.type = shown ? 'password' : 'text';
    $('pwIcon').className = shown ? 'fa-solid fa-eye' : 'fa-solid fa-eye-slash';
    $('pwToggle').setAttribute('aria-label', shown ? 'Show password' : 'Hide password');
    $('pwToggle').setAttribute('aria-pressed', shown ? 'false' : 'true');
    const end = input.value.length;
    input.focus({ preventScroll:true });
    try { input.setSelectionRange(end, end); } catch {}
  }

  /* ---------------- validation ---------------- */

  function showError(message){
    const box = $('errorBox');
    box.innerHTML = message ? '<i class="fa-solid fa-circle-exclamation"></i>' + message : '';
    box.style.display = message ? 'block' : 'none';
  }

  function setFieldError(id, message){
    const box = $('err_' + id), input = $(id);
    if (box){ box.textContent = message || ''; box.classList.toggle('show', !!message); }
    if (input) input.classList.toggle('invalid', !!message);
  }

  function nameValid(){
    return $('name').value.trim().length >= 2;
  }

  function passwordValid(){
    return $('password').value.length >= 6;
  }

  /* Email is only checked when the customer actually types one. */
  function emailValid(){
    const v = $('email').value.trim();
    return !v || /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
  }

  /* CTA unlocks on name + password. An empty email never blocks it. */
  function syncCta(){
    $('saveBtn').disabled = !(nameValid() && passwordValid());
  }

  $('name').addEventListener('input', () => { setFieldError('name',''); showError(''); syncCta(); });
  $('password').addEventListener('input', () => { setFieldError('password',''); showError(''); syncCta(); });
  $('email').addEventListener('input', () => { setFieldError('email',''); showError(''); });
  $('email').addEventListener('blur', () => { if (!emailValid()) setFieldError('email','Enter a valid email address, or leave it empty.'); });

  /* With the Android keyboard open, bring the focused field into view. The
     CTA sits in normal flow, so it moves with the page instead of covering it. */
  ['name','password','email'].forEach(id => {
    $(id).addEventListener('focus', () => {
      setTimeout(() => $(id).scrollIntoView({ block:'center', behavior:'smooth' }), 240);
    });
  });

  /* ---------------- load ---------------- */

  async function loadExistingProfile(){
    let cached = {};
    try { cached = JSON.parse(localStorage.getItem('nearbite_user') || '{}'); } catch {}

    $('phone').value = formatPhone(cached.phone);

    try {
      const res = await fetch(`${API}/users/profile`, { headers:{ Authorization:`Bearer ${token}` } });
      const result = await res.json();
      if (!res.ok || !result.success) return;

      const user = result.data || {};
      $('phone').value = formatPhone(user.phone || cached.phone || '');

      // Placeholder names created by signup are not shown as a real name.
      if (user.name && user.name !== 'Nearbite User' && user.name !== 'Eatswada User') $('name').value = user.name;
      if (user.email) $('email').value = user.email;
    } catch (e){
      console.warn('Could not load existing profile', e);
    } finally {
      syncCta();
    }
  }

  /* ---------------- save ---------------- */

  async function completeProfile(){
    showError('');

    if (!nameValid()){
      setFieldError('name', 'Enter your full name.');
      $('name').focus();
      return;
    }
    if (!passwordValid()){
      setFieldError('password', 'Create a password with at least 6 characters.');
      $('password').focus();
      return;
    }
    if (!emailValid()){
      setFieldError('email', 'Enter a valid email address, or leave it empty.');
      $('email').focus();
      return;
    }

    $('saveBtn').disabled = true;
    $('loading').style.display = 'flex';

    try {
      const payload = {
        name: $('name').value.trim(),
        email: $('email').value.trim() || undefined,
        password: $('password').value
      };

      const res = await fetch(`${API}/users/profile`, {
        method:'PUT',
        headers:{ 'Content-Type':'application/json', Authorization:`Bearer ${token}` },
        body: JSON.stringify(payload)
      });
      const result = await res.json();
      if (!res.ok || !result.success){
        throw new Error(result.message || 'Could not save your details. Please try again.');
      }

      // Session state only. The auth token and nearbite_after_login are left
      // exactly as they are for the later steps to use.
      let cached = {};
      try { cached = JSON.parse(localStorage.getItem('nearbite_user') || '{}'); } catch {}
      localStorage.setItem('nearbite_user', JSON.stringify(
        result.data || { ...cached, name: payload.name, email: payload.email || cached.email }
      ));

      // Next step is the map, not the address form.
      window.location.href = LOCATION_STEP;

    } catch (error){
      console.error(error);
      showError(error.message || 'Something went wrong. Please try again.');
      $('errorBox').scrollIntoView({ block:'center', behavior:'smooth' });
      $('loading').style.display = 'none';
      syncCta();
    }
  }

  document.addEventListener('DOMContentLoaded', loadExistingProfile);
</script>

<script src="navigation.js"></script>
</body>
</html>
