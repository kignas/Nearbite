<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F1F5F9">
  <title>Complete your profile · Eatswada</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="config.js"></script>
  <style>
    /* ===== Eatswada onboarding design system — identical in login.html,
       complete-profile.html, location-onboarding.html and address.html ===== */
    :root{
      --brand:#FC8019;
      --brand-dark:#E96F0A;
      --brand-tint:#FFF4EC;
      --brand-ink:#C85E0D;
      --brand-soft:#FFCBB7;
      --bg:#F1F5F9;
      --ink:#1A1D21;
      --ink-2:#4B5563;
      --label:#8E959F;
      --muted:#6B7280;
      --line:#E6E9ED;
      --field:#FBFCFD;
      --green:#16A34A;
      --danger:#DC2626;
      --font:'Manrope',system-ui,-apple-system,sans-serif;
    }
    html,body,button,input,textarea,select{font-family:var(--font)}

    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

    html{background:var(--bg)}

    body{
      background:var(--bg);
      color:var(--ink);
      font-weight:500;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      overflow-x:hidden;
    }

    .page{
      display:flex;flex-direction:column;
      min-height:100dvh;max-width:520px;margin:0 auto;
    }

    /* ---------------- header ---------------- */
    .topbar{
      background:var(--bg);
      padding:12px 14px 22px;
      padding-top:calc(12px + env(safe-area-inset-top));
    }

    .back{
      display:flex;align-items:center;justify-content:center;
      width:38px;height:38px;margin-left:-2px;
      border:0;border-radius:12px;background:#fff;
      border:1px solid var(--line);
      color:var(--ink);font-size:14px;cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }
    .back:active{opacity:.6}
    .back:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

    .topbar h1{
      margin-top:16px;
      font-size:24px;line-height:1.18;font-weight:800;letter-spacing:-.6px;color:var(--ink);
    }
    .topbar p{
      margin-top:7px;font-size:13.5px;line-height:1.5;font-weight:500;
      color:var(--muted);max-width:34ch;
    }

    /* ---------------- form ---------------- */
    .form{flex:1;padding:0 14px}

    .sec-head{
      display:flex;align-items:center;gap:7px;margin:0 2px 9px;
    }
    .sec-title{font-size:13.5px;font-weight:800;letter-spacing:-.3px;color:var(--ink)}

    .panel{
      background:#fff;border:1px solid var(--line);border-radius:20px;
      box-shadow:0 1px 2px rgba(17,24,39,.04);
      padding:14px 13px;
    }

    .field{margin-bottom:12px}
    .field:last-child{margin-bottom:0}

    label{
      display:block;font-size:12.5px;line-height:1.3;font-weight:600;
      color:var(--label);margin:0 0 7px;
    }
    label .req{color:var(--brand)}

    .control{position:relative}

    input{
      display:block;width:100%;min-height:48px;
      border:1.5px solid var(--line);background:var(--field);border-radius:14px;
      padding:13px;outline:0;
      font-size:15px;font-weight:600;line-height:1.35;color:var(--ink);
      -webkit-appearance:none;
      transition:border-color .15s ease,background .15s ease,box-shadow .15s ease;
    }
    input::placeholder{color:#AEB4BC;font-weight:500}
    input:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px rgba(252,128,25,.10)}
    input.invalid,input.invalid:focus{border-color:#F0A5A5;background:#FFFAFA}

    /* verified mobile number */
    .control.verified input{padding-right:44px;background:#F1F3F6;color:var(--ink-2)}
    .control.verified input:focus{border-color:var(--line);box-shadow:none}
    .tick{
      position:absolute;right:14px;top:50%;transform:translateY(-50%);
      color:var(--green);font-size:15px;pointer-events:none;
    }

    /* password reveal */
    .control.has-toggle input{padding-right:48px}
    .toggle{
      position:absolute;right:3px;top:50%;transform:translateY(-50%);
      width:42px;height:42px;border:0;border-radius:11px;background:transparent;
      color:var(--label);font-size:15px;display:grid;place-items:center;cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }
    .toggle:active{opacity:.5}
    .toggle:focus-visible{outline:2px solid var(--brand);outline-offset:-4px}

    .hint{margin-top:7px;font-size:11.5px;line-height:1.5;font-weight:500;color:var(--label)}

    .field-error{
      display:none;margin-top:7px;
      font-size:11.5px;line-height:1.45;font-weight:600;color:var(--danger);
    }
    .field-error.show{display:block}

    .form-error{
      display:none;margin:0 2px 14px;
      font-size:12.5px;line-height:1.5;font-weight:600;color:var(--danger);
    }
    .form-error i{margin-right:7px}

    .reassure{
      display:flex;align-items:center;gap:9px;
      margin:12px 2px 0;
      font-size:11.5px;font-weight:500;color:var(--muted);line-height:1.45;
    }
    .reassure i{color:var(--green);font-size:12px;flex:none}

    /* ---------------- CTA ---------------- */
    .cta-wrap{padding:26px 14px calc(16px + env(safe-area-inset-bottom))}

    .cta{
      display:flex;align-items:center;justify-content:center;gap:8px;
      width:100%;min-height:50px;
      border:0;border-radius:14px;
      background:var(--brand-soft);color:#fff;
      font-size:15px;font-weight:800;letter-spacing:-.2px;
      cursor:not-allowed;transition:background .15s ease;
      -webkit-tap-highlight-color:transparent;
    }
    .cta i{font-size:12px}
    .cta:not(:disabled){background:var(--brand);cursor:pointer}
    .cta:not(:disabled):active{background:var(--brand-dark)}
    .cta:focus-visible{outline:2px solid var(--brand-dark);outline-offset:3px}

    /* ---------------- loading ---------------- */
    .loading{
      display:none;position:fixed;inset:0;
      background:rgba(241,245,249,.95);z-index:200;
      align-items:center;justify-content:center;flex-direction:column;
    }
    .spinner{
      width:30px;height:30px;border:3px solid #E2E6EA;border-top-color:var(--brand);
      border-radius:50%;animation:spin .8s linear infinite;
    }
    .loading span{margin-top:13px;font-size:12.5px;font-weight:600;color:var(--muted)}
    @keyframes spin{to{transform:rotate(360deg)}}

    @media (prefers-reduced-motion:reduce){
      *{animation-duration:.01ms !important;transition-duration:.01ms !important}
    }

    @media(max-width:365px){
      .topbar h1{font-size:22px}
      .topbar p{font-size:13px}
    }

    @media(max-height:700px){
      .topbar{padding-bottom:18px}
      .topbar h1{margin-top:12px;font-size:22px}
      .cta-wrap{padding-top:20px}
    }
  </style>
</head>
<body>
  <div class="page">

    <header class="topbar">
      <button class="back" onclick="safeBack()" aria-label="Go back"><i class="fa-solid fa-arrow-left"></i></button>
      <h1>Complete your profile</h1>
      <p>Create your Eatswada account for faster checkout.</p>
    </header>

    <main class="form">

      <div class="form-error" id="errorBox" role="alert"></div>

      <div class="sec-head"><span class="sec-title">Account details</span></div>

      <div id="googleIdentity" style="display:none;align-items:center;gap:12px;margin-bottom:14px;padding:12px 13px;border:1px solid #E5E7EB;border-radius:16px;background:#FAFAFA">
        <img id="googleAvatar" src="" alt="" style="width:48px;height:48px;border-radius:50%;object-fit:cover;background:#E5E7EB">
        <div style="min-width:0">
          <div id="googleName" style="font-size:14px;font-weight:800;color:#111827;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div>
          <div id="googleEmail" style="font-size:12px;color:#6B7280;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div>
        </div>
      </div>

      <div class="panel">
        <div class="field">
          <label for="phone">Mobile Number</label>
          <div class="control">
            <input id="phone" type="tel" maxlength="10" inputmode="numeric" placeholder="10-digit mobile number" autocomplete="tel-national">
          </div>
          <div class="hint">Used for delivery contact. No SMS verification required.</div>
        </div>

        <div class="field">
          <label for="name">Full Name <span class="req">*</span></label>
          <div class="control">
            <input id="name" type="text" maxlength="60" placeholder="Enter your full name" autocomplete="name" autocapitalize="words">
          </div>
          <div class="field-error" id="err_name"></div>
        </div>

        <div class="field">
          <label for="password">Password <span class="req">*</span></label>
          <div class="control has-toggle">
            <input id="password" type="password" minlength="6" maxlength="72" placeholder="Create password" autocomplete="new-password">
            <button type="button" class="toggle" id="pwToggle" onclick="togglePassword()" aria-label="Show password" aria-pressed="false">
              <i class="fa-solid fa-eye" id="pwIcon"></i>
            </button>
          </div>
          <div class="field-error" id="err_password"></div>
        </div>

        <div class="field">
          <label for="email">Google Email</label>
          <div class="control">
            <input id="email" type="email" maxlength="120" placeholder="you@example.com" autocomplete="email" inputmode="email">
          </div>
          <div class="field-error" id="err_email"></div>
        </div>
      </div>

      <div class="reassure" id="reassureText">
        <i class="fa-solid fa-circle-check"></i>
        <span>Your Google account will be linked to this Eatswada profile.</span>
      </div>
    </main>

    <div class="cta-wrap">
      <button class="cta" id="saveBtn" disabled onclick="completeProfile()">
        Continue <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
      </button>
    </div>

  </div>

  <div class="loading" id="loading">
    <div class="spinner"></div>
    <span>Saving your details…</span>
  </div>

<script>
  const API = CONFIG.API_BASE_URL;
  const $ = id => document.getElementById(id);
  const googleMode = new URLSearchParams(location.search).get('google') === '1';
  const pendingGoogleToken = sessionStorage.getItem('nearbite_google_pending_token') || '';
  const ADDRESS_STEP='address.html?add=1';
  const LOCATION_STEP='location-onboarding.html?from=complete-profile'
    + '&next=' + encodeURIComponent(ADDRESS_STEP)
    + '&return=' + encodeURIComponent(ADDRESS_STEP);

  if(!googleMode && !(localStorage.getItem('nearbite_token')||localStorage.getItem('token'))) window.location.replace('login.html');
  if(googleMode && !pendingGoogleToken) window.location.replace('login.html');

  function formatPhone(raw){
    const d=String(raw||'').replace(/\D/g,'').slice(-10);
    return d;
  }
  function showError(message){
    const box=$('errorBox'); box.innerHTML=message?'<i class="fa-solid fa-circle-exclamation"></i>'+message:''; box.style.display=message?'block':'none';
  }
  function setFieldError(id,message){ const box=$('err_'+id),input=$(id); if(box){box.textContent=message||'';box.classList.toggle('show',!!message)} if(input)input.classList.toggle('invalid',!!message); }
  function nameValid(){return $('name').value.trim().length>=2}
  function phoneValid(){return /^[6-9]\d{9}$/.test($('phone').value.replace(/\D/g,''))}
  function passwordValid(){return $('password').value.length>=8}
  function emailValid(){return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test($('email').value.trim())}
  function syncCta(){$('saveBtn').disabled=!(nameValid()&&phoneValid()&&passwordValid()&&emailValid())}
  ['name','phone','password','email'].forEach(id=>$(id)?.addEventListener('input',()=>{setFieldError(id,'');showError('');syncCta()}));

  function paintGoogleProfile(){
    let profile={}; try{profile=JSON.parse(sessionStorage.getItem('nearbite_google_pending_profile')||'{}')}catch{}
    if(profile.name && !/^(Nearbite|Eatswada) User$/i.test(profile.name)) $('name').value=profile.name;
    if(profile.email) $('email').value=profile.email;
    if(profile.phone) $('phone').value=formatPhone(profile.phone);
    $('email').readOnly=true;
    $('email').setAttribute('aria-readonly','true');
    const identity=$('googleIdentity');
    if(identity){ identity.style.display='flex'; $('googleName').textContent=profile.name||'Google account'; $('googleEmail').textContent=profile.email||''; if(profile.avatar){$('googleAvatar').src=profile.avatar;} else {$('googleAvatar').style.display='none';} }
    syncCta();
  }
  async function loadExistingProfile(){
    if(googleMode){ paintGoogleProfile(); return; }
    const token=localStorage.getItem('nearbite_token')||localStorage.getItem('token');
    try{const r=await fetch(`${API}/users/profile`,{headers:{Authorization:`Bearer ${token}`}});const d=await r.json();if(!r.ok||!d.success)return;const u=d.data||{};$('phone').value=formatPhone(u.phone);if(u.name&&!/^(Nearbite|Eatswada) User$/i.test(u.name))$('name').value=u.name;if(u.email)$('email').value=u.email;}catch(e){console.warn(e)}finally{syncCta()}
  }
  function togglePassword(){const i=$('password'),shown=i.type==='text';i.type=shown?'password':'text';if($('pwIcon'))$('pwIcon').className=shown?'fa-solid fa-eye':'fa-solid fa-eye-slash';}
  async function completeProfile(){
    showError('');
    if(!nameValid()){setFieldError('name','Enter your full name.');$('name').focus();return}
    if(!phoneValid()){setFieldError('phone','Enter a valid 10-digit mobile number.');$('phone').focus();return}
    if(!emailValid()){setFieldError('email','A valid email address is required.');$('email').focus();return}
    if(!passwordValid()){setFieldError('password','Create a password with at least 8 characters.');$('password').focus();return}
    $('saveBtn').disabled=true;$('loading').style.display='flex';
    try{
      let result;
      if(googleMode){
        const res=await fetch(`${CONFIG.API_BASE_URL}/auth/firebase/complete-profile`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({idToken:pendingGoogleToken,name:$('name').value.trim(),phone:'+91'+$('phone').value.replace(/\D/g,''),password:$('password').value})});
        result=await res.json().catch(()=>({}));
        if(!res.ok||!result.success)throw new Error(result.message||'Unable to create your Eatswada account.');
        localStorage.setItem('nearbite_token',result.data.token);localStorage.setItem('token',result.data.token);localStorage.setItem('nearbite_user',JSON.stringify(result.data.user||{}));
        sessionStorage.removeItem('nearbite_google_pending_token');sessionStorage.removeItem('nearbite_google_pending_profile');
      }else{
        const token=localStorage.getItem('nearbite_token')||localStorage.getItem('token');
        const res=await fetch(`${API}/users/profile`,{method:'PUT',headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},body:JSON.stringify({name:$('name').value.trim(),phone:'+91'+$('phone').value.replace(/\D/g,''),email:$('email').value.trim(),password:$('password').value})});
        result=await res.json().catch(()=>({}));if(!res.ok||!result.success)throw new Error(result.message||'Could not save your details. Please try again.');
        localStorage.setItem('nearbite_user',JSON.stringify(result.data||{}));
      }
      const requested=localStorage.getItem('nearbite_after_login')||'index.html';localStorage.setItem('nearbite_after_login',requested);window.location.href=LOCATION_STEP;
    }catch(e){console.error(e);showError(e.message||'Something went wrong. Please try again.');$('loading').style.display='none';syncCta()}
  }
  document.addEventListener('DOMContentLoaded',loadExistingProfile);
</script>

<script src="navigation.js"></script>
</body>
</html>
