<!DOCTYPE html>
<html lang="en"><head>
<meta name="color-scheme" content="light dark"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>(function(){try{var t=localStorage.getItem('eatswada_theme');if(t==='dark')document.documentElement.dataset.ewTheme='dark';var h=localStorage.getItem('eatswada_header_theme');var ok=['green','pink','red'];document.documentElement.dataset.ewHeader=ok.indexOf(h)>-1?h:'green';}catch(e){document.documentElement.dataset.ewHeader='green';}})();</script>
<script src="https://cdn.jsdelivr.net/npm/darkreader@4.9.133/darkreader.js" data-ew-dark-reader></script>
<script src="eatswada-theme.js"></script>
<script src="eatswada-header-theme.js"></script>
<title>Verifying Payment – Eatswada | EatSwada</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap" rel="stylesheet">
<script src="config.js"></script>
<link rel="stylesheet" href="css/eatswada-payment.css?v=20261004-pay1">
<link rel="stylesheet" href="eatswada-theme.css">
<link rel="stylesheet" href="eatswada-header-theme.css">

<meta name="description" content="Explore EatSwada, your local food ordering platform in Maynaguri, West Bengal."/>
<meta name="robots" content="noindex, nofollow"/>
<link rel="canonical" href="https://eatswada.com/payment-pending.html"/>
<meta property="og:type" content="website"/>
<meta property="og:site_name" content="EatSwada"/>
<meta property="og:title" content="Verifying Payment – Eatswada | EatSwada"/>
<meta property="og:description" content="Explore EatSwada, your local food ordering platform in Maynaguri, West Bengal."/>
<meta property="og:url" content="https://eatswada.com/payment-pending.html"/>
<meta name="twitter:card" content="summary"/>
</head>
<body><main class="ew-result ew-pending" aria-live="polite">

<div class="ew-icon-wrap">
  <span class="ew-halo" aria-hidden="true"></span>
  <div class="ew-icon" aria-hidden="true">
    <svg class="ew-svg" viewBox="0 0 48 48" fill="none" aria-hidden="true">
      <circle cx="24" cy="24" r="19" stroke="currentColor" stroke-opacity=".16" stroke-width="3"/>
      <circle class="ew-arc" cx="24" cy="24" r="19" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-dasharray="30 90"/>
      <circle class="ew-arc ew-arc--b" cx="24" cy="24" r="12" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="12 63"/>
    </svg>
  </div>
</div>

<h1 class="ew-title">Checking your payment</h1>
<p class="ew-copy">Your payment may have reached the bank already. We're checking Eatswada's server before asking you to pay again.</p>

<div class="ew-order" id="ew-order" hidden>
  <div class="ew-order-row">
    <span class="ew-order-label">Order number</span>
    <span class="ew-order-value" id="ew-order-number"></span>
  </div>
</div>

<ol class="ew-steps" aria-label="Payment verification steps">
  <li class="is-done">
    <span class="ew-step-dot"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <span class="ew-step-label">Payment attempted</span>
  </li>
  <li class="is-active">
    <span class="ew-step-dot"><span class="ew-step-pulse" aria-hidden="true"></span></span>
    <span class="ew-step-label">Verifying your payment</span>
  </li>
  <li>
    <span class="ew-step-dot"></span>
    <span class="ew-step-label">Order confirmed</span>
  </li>
</ol>

<div class="ew-actions">
  <button class="ew-btn ew-btn-primary" id="ew-orders">View My Orders</button>
  <button class="ew-btn ew-btn-ghost" id="ew-refresh">Check again</button>
</div>

<p class="ew-note">Keep this page open for a moment if you just completed UPI payment.</p>

</main>
<script>
(function(){
const KEY='nearbite_payment_context',token=localStorage.getItem('nearbite_token')||localStorage.getItem('token');let ctx=null;try{ctx=JSON.parse(localStorage.getItem(KEY)||'null')}catch(_){}
if(ctx?.orderNumber){document.getElementById('ew-order-number').textContent=ctx.orderNumber;document.getElementById('ew-order').hidden=false}
function goToOrder(){
  try {
    if(ctx?.multiple && ctx.deliveryOtps){
      Object.keys(ctx.deliveryOtps).forEach(id=>{
        if(ctx.deliveryOtps[id]) localStorage.setItem('nearbite_delivery_otp_'+id,ctx.deliveryOtps[id]);
      });
    } else if(ctx?.orderId && ctx.deliveryOtp) {
      localStorage.setItem('nearbite_delivery_otp_'+ctx.orderId,ctx.deliveryOtp);
    }
    localStorage.removeItem(KEY);
  } catch(_) {}
  if(!ctx?.orderId){location.href='orders.html';return}
  location.href=ctx.multiple?'orders.html':'track-order.html?id='+encodeURIComponent(ctx.orderId);
}
async function check(){
  if(!ctx?.orderId||!token)return;
  try{
    const r=await fetch(`${CONFIG.API_BASE_URL}/payments/${encodeURIComponent(ctx.orderId)}/status`,{headers:{Authorization:`Bearer ${token}`},cache:'no-store'});
    const j=await r.json();if(!r.ok||!j.success)return;
    const s=String(j.data?.paymentStatus||'').toLowerCase();
    if(s==='paid'){goToOrder();return}
    if(s==='failed'){location.href='payment-failed.html'}
  }catch(_){}
}
const refreshBtn=document.getElementById('ew-refresh');
refreshBtn.addEventListener('click',()=>{refreshBtn.disabled=true;refreshBtn.classList.add('is-busy');Promise.resolve(check()).finally(()=>{refreshBtn.disabled=false;refreshBtn.classList.remove('is-busy')})});
document.getElementById('ew-orders').addEventListener('click',()=>location.href=ctx?.multiple?'orders.html':(ctx?.orderId?'track-order.html?id='+encodeURIComponent(ctx.orderId):'orders.html'));
check();const timer=setInterval(check,3000);setTimeout(()=>clearInterval(timer),30000)
})();
</script></body></html>
