<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F7F7F9">
<title>My Orders – Nearbite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
/* ============================================================
   EATSWADA · ORDERS
   Same tokens as the Address flow (address-flow.css): Manrope,
   #367E34 green, #F1F0F5 page, white 14 px cards, 1 px borders.
   ============================================================ */
:root{
  --brand:#367E34; --brand-press:#2C6A2B; --brand-tint:#EEF5EE; --brand-soft:#74B054;
  --ink-900:#16191E; --ink-800:#1F232A; --ink-700:#3E414A; --ink-500:#68696B;
  --ink-400:#8E8F91; --ink-300:#B6B8BD; --ink-200:#D9DADC;
  --line:#E5E7E6; --paper:#F1F0F5; --card:#FFFFFF; --icon-bg:#F2F2F2;
  --success:#367E34; --success-bg:#EEF5EE;
  --danger:#C8453B; --danger-bg:#FBEDEB;
  --info:#2F6FEB; --info-bg:#EEF3FE;
  --amber:#B26A12; --amber-bg:#FFF6E8;
  --shadow-xs:0 1px 2px rgba(16,24,40,.04);
  --shadow-sm:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.03);
  --shadow-pop:0 8px 28px rgba(16,24,40,.16);
  --r-lg:14px; --r-md:12px; --r-sm:10px; --r-xs:8px;
  --ease-out:cubic-bezier(.16,1,.3,1); --ease:cubic-bezier(.4,0,.2,1);
}
*,*::before,*::after{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
html body{
  font-family:'Manrope',system-ui,-apple-system,sans-serif;
  background:var(--paper); color:var(--ink-900); margin:0;
  padding-bottom:calc(104px + env(safe-area-inset-bottom));
  -webkit-tap-highlight-color:transparent; overscroll-behavior-y:contain; line-height:1.45;
  overflow-x:hidden;
}
button{font-family:inherit;}
img{max-width:100%;display:block;}
.tap{transition:transform .14s var(--ease-out),opacity .14s var(--ease-out);cursor:pointer;}
.tap:active{transform:scale(.97);opacity:.88;}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px;}

@keyframes cardIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
@keyframes pulseDot{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.6);opacity:.35;}}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes shimmer{0%{background-position:-600px 0;}100%{background-position:600px 0;}}
@keyframes textIn{from{opacity:0;transform:translateY(3px);}to{opacity:1;transform:none;}}

/* ---------- Pull to refresh ---------- */
#ptr-indicator{height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;transition:height .2s var(--ease);}
.ptr-ring{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--brand);}
.ptr-spinning .ptr-ring{animation:spin .7s linear infinite;}

/* ---------- Header ---------- */
.orders-header{
  position:sticky;top:0;z-index:50;background:#fff;
  padding:calc(8px + env(safe-area-inset-top)) 14px 0;border-bottom:1px solid #EAEAEC;
}
.header-top{display:flex;align-items:center;gap:10px;height:48px;max-width:640px;margin:0 auto;}
.header-back-btn{
  width:36px;height:36px;margin-left:-8px;border:0;border-radius:50%;background:transparent;color:#131313;
  display:grid;place-items:center;font-size:18px;
}
.header-back-btn:active{background:rgba(0,0,0,.05);}
.header-titles{flex:1;min-width:0;}
.header-titles h1{margin:0;font-size:18px;line-height:24px;font-weight:800;letter-spacing:-.3px;color:var(--ink-900);}
.header-stats{
  display:flex;align-items:center;gap:8px;max-width:640px;margin:0 auto;
  font-size:12px;font-weight:600;color:var(--ink-500);
}
.header-stats .sep{display:none;}
.stat-live{display:inline-flex;align-items:center;gap:6px;color:var(--brand);font-weight:700;}
.stat-live::before{content:'';width:3px;height:3px;border-radius:50%;background:var(--ink-300);margin-right:2px;}
.pulse-dot-sm{width:6px;height:6px;border-radius:50%;background:var(--brand);animation:pulseDot 1.8s ease-in-out infinite;flex:none;}

.search-bar{
  display:flex;align-items:center;gap:10px;height:43px;max-width:640px;margin:10px auto 0;
  padding:0 14px 0 15px;border:1px solid var(--ink-200);border-radius:999px;background:#fff;
}
.search-bar:focus-within{border-color:#B9BBBF;}
.search-bar>i{color:#737476;font-size:15px;flex:none;}
.search-bar input{
  flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;padding:0;
  font:500 13px/1.3 'Manrope',system-ui,sans-serif;color:var(--ink-900);-webkit-appearance:none;
}
.search-bar input::placeholder{color:var(--ink-400);}
.search-clear{
  display:none;width:24px;height:24px;border-radius:50%;background:#F1F1F3;color:#6B6D72;
  place-items:center;font-size:11px;flex:none;
}
.search-bar.has-value .search-clear{display:grid;}

/* Filter pills (same pill pattern as the Home filter bar; style.css
   forces .chip geometry with !important, so this page scopes over it).
   The green pill behind the active filter slides between filters. */
.filter-chips{
  position:relative;display:flex;gap:8px;max-width:640px;margin:10px auto 0;padding:0 0 12px;
  overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.filter-chips::-webkit-scrollbar{display:none;}
.filter-chips .chip{
  position:relative;z-index:1;flex:none;display:inline-flex;align-items:center;min-height:34px;
  padding:0 14px !important;border:1px solid var(--ink-200) !important;border-radius:999px !important;
  background:transparent;color:var(--ink-700) !important;font-family:'Manrope',system-ui,sans-serif !important;
  font-size:13px !important;font-weight:600 !important;box-shadow:none !important;white-space:nowrap;user-select:none;
  transition:color .2s var(--ease),border-color .2s var(--ease);
}
.filter-chips .chip.active{color:var(--brand) !important;border-color:var(--brand-soft) !important;font-weight:700 !important;}
.filter-chips .chip::after{content:attr(data-count);margin-left:6px;font-size:11px;font-weight:700;color:var(--ink-400);}
.filter-chips .chip.active::after{color:var(--brand);}
.filter-chips .chip[data-count=""]::after,.filter-chips .chip:not([data-count])::after{content:"";margin:0;}
.chip-indicator{
  position:absolute;left:0;top:0;height:34px;width:0;border-radius:999px;background:var(--brand-tint);
  transform:translateX(0);transition:transform .32s var(--ease-out),width .32s var(--ease-out);
}

/* ---------- Content ---------- */
.orders-content{max-width:640px;margin:0 auto;padding:14px 14px 0;}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 10px;}
.st-left{
  display:flex;align-items:center;gap:7px;font-size:11px;line-height:14px;font-weight:700;
  letter-spacing:.02em;text-transform:uppercase;color:#84888B;
}
.st-count{font-size:12px;font-weight:600;color:var(--ink-400);}

.order-card{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow-xs);overflow:hidden;}
.order-card.is-new,.swipe-container.is-new{animation:cardIn .36s var(--ease-out) both;}

/* Restaurant row shared by live + past cards */
.oc-head{display:flex;align-items:center;gap:12px;padding:14px 14px 12px;}
.oc-logo{
  width:48px;height:48px;flex:none;border-radius:var(--r-sm);object-fit:cover;background:var(--icon-bg);
  display:grid;place-items:center;font-size:17px;font-weight:800;color:var(--ink-500);
}
.oc-title{flex:1;min-width:0;}
.oc-name{margin:0;font-size:15px;line-height:20px;font-weight:700;letter-spacing:-.15px;color:var(--ink-900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.oc-sub{margin-top:1px;font-size:12px;line-height:16px;font-weight:500;color:var(--ink-500);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* ---------- Live order card ---------- */
.track-card{margin-bottom:12px;}
.live-state{
  display:flex;align-items:center;gap:12px;margin:0 14px;padding:12px;border-radius:var(--r-md);background:var(--brand-tint);
  text-decoration:none;color:inherit;
}
.live-state-ico{
  width:36px;height:36px;flex:none;border-radius:var(--r-sm);background:#fff;color:var(--brand);
  display:grid;place-items:center;font-size:15px;
}
.live-state-text{flex:1;min-width:0;}
.live-state-title{font-size:14px;line-height:19px;font-weight:700;color:var(--ink-900);}
.live-state-detail{font-size:13px;line-height:18px;font-weight:600;color:var(--brand);animation:textIn .3s var(--ease-out);}
.live-state-note{font-size:12px;line-height:16px;font-weight:500;color:var(--ink-500);margin-top:1px;}
.live-state.is-late .live-state-detail{color:var(--amber);}
.live-state.is-late{background:var(--amber-bg);}
.live-state.is-late .live-state-ico{color:var(--amber);}

.mini-progress{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:12px 14px 0;}
.mini-seg{height:4px;border-radius:2px;background:#E7E8EA;overflow:hidden;}
.mini-seg i{display:block;height:100%;width:100%;background:var(--brand);transform-origin:left;transform:scaleX(0);transition:transform .5s var(--ease-out);}
.mini-seg.on i{transform:scaleX(1);}
.mini-labels{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:6px 14px 0;font-size:11px;font-weight:600;color:var(--ink-400);}
.mini-labels span.on{color:var(--ink-700);}

.live-meta{margin:12px 14px 0;padding-top:12px;border-top:1px dashed var(--line);display:grid;gap:6px;}
.meta-row{display:flex;align-items:flex-start;gap:8px;font-size:12px;line-height:17px;color:var(--ink-500);font-weight:500;min-width:0;}
.meta-row i{width:14px;flex:none;text-align:center;margin-top:2px;font-size:11px;color:var(--ink-400);}
.meta-row span{min-width:0;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}

.live-actions{display:flex;align-items:center;gap:8px;padding:12px 14px 14px;}
.track-btn{
  flex:1;display:flex;align-items:center;justify-content:center;gap:8px;height:42px;border:0;border-radius:999px;
  background:var(--brand);color:#fff;font-size:14px;font-weight:800;letter-spacing:-.1px;text-decoration:none;
}
.track-btn:active{background:var(--brand-press);}
.icon-btn{
  width:42px;height:42px;flex:none;border-radius:50%;border:1px solid var(--ink-200);background:#fff;color:var(--ink-700);
  display:grid;place-items:center;font-size:15px;text-decoration:none;
}
.icon-btn.call{color:var(--brand);}

/* ---------- Past order card ---------- */
.swipe-container{position:relative;border-radius:var(--r-lg);margin-bottom:12px;overflow:hidden;content-visibility:auto;contain-intrinsic-size:280px;}
.swipe-actions{position:absolute;inset:0 0 0 auto;display:flex;align-items:stretch;background:var(--paper);}
.swipe-btn{
  width:58px;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  color:#fff;font-size:15px;
}
.swipe-btn span{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
.btn-invoice{background:#55575C;}
.btn-support{background:var(--brand);}
.btn-delete{background:var(--danger);}
.past-card{position:relative;z-index:1;transition:transform .28s var(--ease-out);}
.past-card.swiped{transform:translateX(-116px);}
.past-card.swiped.has-delete{transform:translateX(-174px);}

.past-items{list-style:none;margin:0;padding:12px 14px 2px;border-top:1px solid #F0F0F2;}
.past-items li{display:flex;align-items:baseline;gap:8px;font-size:13px;line-height:18px;font-weight:500;color:var(--ink-700);padding:0 0 8px;min-width:0;}
.past-items .q{flex:none;min-width:22px;font-weight:700;color:var(--ink-900);}
.past-items .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.past-items li.more{color:var(--ink-500);font-weight:600;}

.past-summary{
  display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 14px 0;padding:12px 0;
  border-top:1px dashed var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:calc(100% - 28px);
  text-align:left;color:inherit;cursor:pointer;
}
.past-when{font-size:12px;line-height:16px;font-weight:500;color:var(--ink-500);}
.past-status{margin-top:3px;font-size:13px;line-height:18px;font-weight:700;}
.past-status.delivered{color:var(--brand);}
.past-status.cancelled{color:var(--danger);}
.past-status.refunded{color:var(--info);}
.past-status small{font-weight:600;color:var(--ink-500);}
.past-total{display:flex;align-items:center;gap:6px;flex:none;font-size:15px;font-weight:800;color:var(--ink-900);font-variant-numeric:tabular-nums;}
.past-total i{font-size:11px;color:var(--ink-400);}

.past-footer{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px 14px;border-top:1px solid #F0F0F2;}
.ghost-row{display:flex;align-items:center;gap:2px;min-width:0;flex-wrap:wrap;}
.ghost-btn{
  display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 8px;border:0;border-radius:8px;background:transparent;
  font-size:12px;font-weight:700;color:var(--ink-700);white-space:nowrap;
}
.ghost-btn i{font-size:12px;color:var(--ink-400);}
.ghost-btn.rate i{color:#E5A100;}
.ghost-btn:active{background:#F4F4F6;}
.btn-reorder{
  display:inline-flex;align-items:center;gap:7px;flex:none;height:36px;padding:0 16px;border:0;border-radius:999px;
  background:var(--brand);color:#fff;font-size:13px;font-weight:800;
}
.btn-reorder:active{background:var(--brand-press);}

/* ---------- Load more ---------- */
.load-more-wrap{display:flex;justify-content:center;padding:4px 0 20px;}
.load-more-btn{
  display:flex;align-items:center;gap:8px;height:40px;padding:0 18px;border:1px solid var(--ink-200);border-radius:999px;
  background:#fff;color:var(--ink-700);font-size:13px;font-weight:700;
}
#scroll-sentinel{height:1px;}

/* ---------- Empty ---------- */
#empty-orders{display:none;}
.empty-card{background:#fff;border-radius:var(--r-lg);padding:32px 22px 26px;text-align:center;}
.empty-illustration{width:88px;height:88px;margin:0 auto 14px;}
.empty-illustration .spark{display:none;}
.empty-card h4{margin:0 0 4px;font-size:16px;font-weight:800;color:var(--ink-900);}
.empty-card p{margin:0;font-size:13px;line-height:19px;color:var(--ink-500);}
.explore-btn{margin-top:16px;height:40px;padding:0 20px;border:0;border-radius:999px;background:var(--brand);color:#fff;font-size:14px;font-weight:800;}

/* ---------- Skeleton ---------- */
.sk-wrapper{display:grid;gap:12px;}
.sk-card{background:#fff;border-radius:var(--r-lg);overflow:hidden;padding:14px;}
.sk{background:linear-gradient(90deg,#F1F1F3 0,#E8E8EC 50%,#F1F1F3 100%);background-size:1200px 100%;animation:shimmer 1.3s linear infinite;border-radius:6px;}
.sk-cover{display:none;}
.sk-body{display:grid;gap:10px;}
.sk-avatar{width:48px;height:48px;border-radius:var(--r-sm);}
.sk-text-1{height:14px;width:55%;margin-bottom:8px;}
.sk-text-2{height:12px;width:35%;margin-bottom:10px;}
.sk-box{height:56px;border-radius:var(--r-md);}
.sk-line{height:12px;width:90%;margin-bottom:8px;}

/* ---------- Invoice modal ---------- */
.invoice-overlay{position:fixed;inset:0;z-index:1000;display:none;align-items:flex-end;justify-content:center;background:rgba(17,18,20,.5);}
.invoice-overlay.open{display:flex;}
.invoice-sheet{
  position:relative;width:100%;max-width:560px;max-height:92vh;overflow:auto;background:#fff;
  border-radius:20px 20px 0 0;padding:22px 16px calc(16px + env(safe-area-inset-bottom,0));
}
.inv-close{position:absolute;top:12px;right:12px;width:36px;height:36px;border:0;border-radius:50%;background:#F4F4F6;font-size:20px;line-height:1;color:var(--ink-500);cursor:pointer;}
.inv-head{display:flex;align-items:center;justify-content:space-between;padding-right:44px;}
.inv-brand{font-size:18px;font-weight:800;color:var(--ink-900);letter-spacing:-.3px;}
.inv-status{font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;background:#F2F2F4;color:var(--ink-700);}
.inv-status.paid,.inv-status.good{background:var(--success-bg);color:var(--success);}
.inv-status.warn{background:var(--amber-bg);color:var(--amber);}
.inv-status.bad{background:var(--danger-bg);color:var(--danger);}
.inv-sub{font-size:14px;font-weight:700;color:var(--ink-900);margin-top:6px;}
.inv-meta{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--ink-500);margin:6px 0 12px;}
.inv-addr{font-size:12px;line-height:17px;color:var(--ink-500);background:var(--paper);padding:9px 11px;border-radius:10px;margin-bottom:12px;}
.inv-table{width:100%;border-collapse:collapse;margin-bottom:10px;}
.inv-table td{padding:8px 0;font-size:13px;color:var(--ink-800);border-bottom:1px solid var(--line);}
.inv-table td.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
.inv-line{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-700);padding:4px 0;}
.inv-line.disc{color:var(--brand);}
.inv-total{display:flex;justify-content:space-between;font-size:15px;font-weight:800;color:var(--ink-900);border-top:1px solid var(--ink-200);margin-top:8px;padding-top:10px;font-variant-numeric:tabular-nums;}
.inv-foot{text-align:center;font-size:12px;color:var(--ink-400);margin-top:14px;}
.inv-actions{display:flex;gap:10px;margin-top:16px;}
.inv-btn{flex:1;height:46px;border-radius:999px;font-weight:800;font-size:14px;border:0;cursor:pointer;}
.inv-btn.ghost{background:#fff;border:1px solid var(--ink-200);color:var(--ink-700);}
.inv-btn.solid{background:var(--brand);color:#fff;}

/* ---------- Toast ---------- */
.od-toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(12px);background:#1B1C1F;color:#fff;font-size:13px;font-weight:600;padding:10px 14px;border-radius:10px;z-index:1100;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:88%;text-align:center;}
.od-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

@media (max-width:374px){
  .orders-header{padding-left:12px;padding-right:12px;}
  .orders-content{padding-left:12px;padding-right:12px;}
  .chip{padding-left:8px;padding-right:8px;font-size:12.5px;}
  .ghost-btn{padding:0 6px;}
  .btn-reorder{padding:0 13px;}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important;}
}
/* ---------- Print only the invoice ---------- */
@media print{
  body{visibility:hidden;}
  .invoice-overlay,.invoice-overlay *{visibility:visible;}
  .invoice-overlay{position:absolute;inset:0;display:block!important;background:#fff;}
  .invoice-sheet{max-width:none;max-height:none;border-radius:0;}
  .no-print{display:none!important;}
}
</style>

<script src="push.js"></script>
<script src="order-status.js?v=20260923-1"></script>

<body>

<div id="ptr-indicator"><div class="ptr-ring"></div></div>

<header class="orders-header">
  <div class="header-top">
    <button onclick="window.nearbiteSafeBack()" class="header-back-btn tap" aria-label="Go back"><i class="fa-solid fa-arrow-left"></i></button>
    <div class="header-titles">
      <h1>My Orders</h1>
    </div>
  </div>

  <div class="header-stats">
    <span id="stat-total">0 orders</span>
    <span class="sep"></span>
    <span class="stat-live" id="stat-live" style="display:none;"><span class="pulse-dot-sm"></span><span id="stat-live-text">0 live</span></span>
  </div>

  <div class="search-bar" id="search-bar">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input type="search" id="order-search" placeholder="Search restaurant, item, or Order ID" autocomplete="off" enterkeyhint="search" aria-label="Search orders">
    <div class="search-clear tap" id="search-clear" role="button" aria-label="Clear search"><i class="fa-solid fa-xmark"></i></div>
  </div>

  <div class="filter-chips" id="filter-chips" role="tablist" aria-label="Filter orders">
    <div class="chip-indicator" id="chip-indicator"></div>
    <div class="chip active tap" data-filter="all">All</div>
    <div class="chip tap" data-filter="active">Active</div>
    <div class="chip tap" data-filter="delivered">Delivered</div>
    <div class="chip tap" data-filter="cancelled">Cancelled</div>
    <div class="chip tap" data-filter="refunded">Refunded</div>
  </div>
</header>

<div class="orders-content">

  <div id="loading-state" class="sk-wrapper">
    <div class="sk-card"><div class="sk sk-cover"></div><div class="sk-body"><div class="sk sk-avatar"></div><div class="sk sk-text-1"></div><div class="sk sk-text-2"></div><div class="sk sk-box"></div></div></div>
    <div class="sk-card" style="border-radius:24px;"><div style="padding:16px;"><div style="display:flex;gap:12px;margin-bottom:16px;"><div class="sk" style="width:52px;height:52px;border-radius:14px;flex-shrink:0;"></div><div style="flex:1;"><div class="sk sk-text-1"></div><div class="sk sk-text-2" style="margin-bottom:0;"></div></div></div><div class="sk sk-line"></div><div class="sk sk-line" style="width:70%;"></div></div></div>
  </div>

  <div id="live-orders-container"></div>
  <div id="past-orders-container"></div>
  <div id="load-more-wrap" class="load-more-wrap" style="display:none;">
    <button class="load-more-btn tap" id="load-more-btn"><i class="fa-solid fa-chevron-down"></i> Load more orders</button>
  </div>
  <div id="scroll-sentinel"></div>

  <div id="empty-orders">
    <div class="empty-card">
      <div class="empty-illustration">
        <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="60" cy="103" rx="34" ry="7" fill="#367E34" opacity="0.08"/>
          <path d="M32 46 L36 30 C37 26 40 24 44 24 L76 24 C80 24 83 26 84 30 L88 46 Z" fill="#DDEBDC"/>
          <rect x="28" y="46" width="64" height="46" rx="12" fill="#367E34"/>
          <rect x="28" y="46" width="64" height="14" rx="7" fill="#2C6A2B"/>
          <circle cx="60" cy="72" r="12" fill="#EEF5EE"/>
          <path d="M55 72 L58.5 76 L66 68" stroke="#367E34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="spark s1"></span><span class="spark s2"></span><span class="spark s3"></span>
      </div>
      <h4 id="empty-title">No orders found</h4>
      <p id="empty-desc">Looks like you haven't placed<br>any orders yet.</p>
      <button id="empty-btn" class="explore-btn tap">Explore Restaurants</button>
    </div>
  </div>

</div>
<script>
document.addEventListener('DOMContentLoaded', () => {
  let token = localStorage.getItem('nearbite_token') || localStorage.getItem('token');
  if (token === 'undefined' || token === 'null') token = null;

  const loader = document.getElementById('loading-state');
  const liveContainer = document.getElementById('live-orders-container');
  const pastContainer = document.getElementById('past-orders-container');
  const emptyState = document.getElementById('empty-orders');
  const loadMoreWrap = document.getElementById('load-more-wrap');
  const loadMoreBtn = document.getElementById('load-more-btn');
  const sentinel = document.getElementById('scroll-sentinel');

  let allOrdersData = [];
  let currentSearch = '';
  let currentFilter = 'all';
  let hasRenderedOnce = false;

  // Infinite-scroll state for Past Orders (all data is already fetched; we
  // simply paginate the render so long histories don't paint hundreds of DOM nodes at once)
  const PAGE_SIZE = 6;
  let pastRenderLimit = PAGE_SIZE;
  let lastSearchKey = null;

  // Client-side "hide from device" for cancelled orders (Delete swipe action).
  // We never call the backend to delete — cancelled orders remain in the
  // account's history server-side, this only removes the card from view here.
  const HIDDEN_KEY = 'nb_hidden_orders';
  const getHidden = () => { try { return JSON.parse(localStorage.getItem(HIDDEN_KEY) || '[]'); } catch(e){ return []; } };
  const hideOrderLocally = (id) => {
    const set = new Set(getHidden()); set.add(id);
    localStorage.setItem(HIDDEN_KEY, JSON.stringify([...set]));
  };

  // One shared status mapping with track-order.html (order-status.js).
  // Includes picked_up, which the old local list missed — those orders
  // used to fall into "Past Orders" with a raw status badge.
  const OS = window.EatswadaOrderStatus;
  const liveStatuses = OS.ACTIVE;
  const esc = window.esc || (v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])));
  const safeUrl = window.safeUrl || (v => { if (!v) return ''; try { const u = new URL(String(v), location.href); return /^https?:$/.test(u.protocol) ? u.href : ''; } catch (e) { return ''; } });
  const orderLabel = o => o.orderNumber || String(o._id || '').slice(-6).toUpperCase();

  // Cards animate in once, the first time they appear — not on every
  // 10-second refresh.
  // (A card keeps the class for the first 600 ms: the infinite-scroll
  // observer re-renders once right after load.)
  const seenCards = new Map();
  const enterClass = key => {
    const t = performance.now();
    if (!seenCards.has(key)) seenCards.set(key, t);
    return t - seenCards.get(key) < 600 ? ' is-new' : '';
  };

  const requireLogin = () => {
    loader.style.display = 'none';
    liveContainer.innerHTML = '';
    pastContainer.innerHTML = '';
    loadMoreWrap.style.display = 'none';
    emptyState.style.display = 'block';
    document.getElementById('empty-title').innerText = "Please log in";
    document.getElementById('empty-desc').innerHTML = `Log in to view your premium orders.`;
    const btn = document.getElementById('empty-btn');
    btn.innerText = "LOGIN NOW";
    btn.onclick = () => {
        localStorage.clear();
        window.location.href = 'login.html';
    };
  };

  if (!token) return requireLogin();

  // Default empty-state action (was previously a dead button with no handler)
  document.getElementById('empty-btn').onclick = () => { window.location.href = 'index.html'; };

  // Formatting Helper — shows the item's actual menu image (returned by
  // the API, live where available). Falls back to an initials badge if no
  // image exists for that item; never an emoji, never a stand-in photo.
  const initials = (name) => (name ? String(name).charAt(0).toUpperCase() : 'E');

  // First item + count, as plain escaped text.
  const itemsSummary = (items) => {
    if (!Array.isArray(items) || !items.length) return '';
    const first = items[0];
    const more = items.length > 1 ? ` + ${items.length - 1} more` : '';
    return `${esc(first.quantity || 1)} × ${esc(first.name || 'Item')}${more}`;
  };

  // Full item list for past orders (up to 3 lines, then "+N more").
  const itemsList = (items) => {
    if (!Array.isArray(items) || !items.length) return '';
    const shown = items.slice(0, 3).map(i =>
      `<li><span class="q">${esc(i.quantity || 1)} ×</span><span class="n">${esc(i.name || 'Item')}</span></li>`).join('');
    const rest = items.length > 3 ? `<li class="more">+ ${items.length - 3} more item${items.length - 3 > 1 ? 's' : ''}</li>` : '';
    return `<ul class="past-items">${shown}${rest}</ul>`;
  };

  const logoHtml = (order) => {
    const src = safeUrl(order.restaurantImage);
    return src
      ? `<img src="${esc(src)}" class="oc-logo" loading="lazy" alt="">`
      : `<div class="oc-logo" aria-hidden="true">${esc(initials(order.restaurantName))}</div>`;
  };

  // Reuses the exact same defensive address-parsing rules as track-order.html
  const getDeliveryAddressText = (order) => {
    if (!order) return '';
    if (typeof order.deliveryAddress === 'string' && order.deliveryAddress.trim()) return order.deliveryAddress.trim();
    if (order.deliveryAddress && typeof order.deliveryAddress === 'object') {
      return order.deliveryAddress.formatted || order.deliveryAddress.fullAddress || order.deliveryAddress.addressLine || order.deliveryAddress.line1 || '';
    }
    if (typeof order.address === 'string' && order.address.trim()) return order.address.trim();
    return '';
  };

  function renderLiveSection(liveOrders) {
    if (liveOrders.length === 0) { liveContainer.innerHTML = ''; return; }

    liveContainer.innerHTML = `
      <div class="section-title">
        <div class="st-left">Active orders <span class="pulse-dot-sm"></span></div>
        <div class="st-count">${liveOrders.length} active</div>
      </div>` + liveOrders.map(order => {
      // Real status + real timing only (order-status.js): live rider ETA,
      // then estimatedDelivery. No per-status guesses, never "0 min".
      const info = OS.info(order);
      const head = OS.headline(order);
      const moving = OS.riderMoving(order);
      const seg = Math.min(4, info.stage <= 0 ? 1 : info.stage <= 2 ? 2 : info.stage === 3 ? 3 : 4);
      const labels = ['Placed', 'Preparing', 'Partner', 'On the way'];
      const addr = getDeliveryAddressText(order);
      const riderTel = OS.riderPhone(order);
      const items = itemsSummary(order.items);
      const id = esc(order._id);
      const trackUrl = `track-order.html?id=${encodeURIComponent(order._id)}`;

      return `
        <div class="order-card track-card${enterClass('live:' + order._id)}">
          <div class="oc-head">
            ${logoHtml(order)}
            <div class="oc-title">
              <h3 class="oc-name">${esc(order.restaurantName || 'Eatswada partner')}</h3>
              <div class="oc-sub">Order #${esc(orderLabel(order))}${order.total != null ? ' · ₹' + esc(order.total) : ''}</div>
            </div>
          </div>
          <a class="live-state${head.overdue ? ' is-late' : ''}" href="${trackUrl}">
            <span class="live-state-ico"><i class="fa-solid ${info.icon}" aria-hidden="true"></i></span>
            <span class="live-state-text">
              <span class="live-state-title">${esc(head.title)}</span>
              <span class="live-state-detail" style="display:block">${esc(head.detail)}</span>
              ${head.note ? `<span class="live-state-note" style="display:block">${esc(head.note)}</span>` : ''}
            </span>
          </a>
          <div class="mini-progress" aria-hidden="true">
            ${[1, 2, 3, 4].map(n => `<div class="mini-seg${n <= seg ? ' on' : ''}"><i></i></div>`).join('')}
          </div>
          <div class="mini-labels" aria-hidden="true">${labels.map((l, n) => `<span class="${n < seg ? 'on' : ''}">${l}</span>`).join('')}</div>
          ${(items || addr) ? `<div class="live-meta">
            ${items ? `<div class="meta-row"><i class="fa-solid fa-bag-shopping" aria-hidden="true"></i><span>${items}</span></div>` : ''}
            ${addr ? `<div class="meta-row"><i class="fa-solid fa-location-dot" aria-hidden="true"></i><span>${esc(addr)}</span></div>` : ''}
          </div>` : ''}
          <div class="live-actions">
            <a class="track-btn tap" href="${trackUrl}">${moving ? 'Track live' : 'View live tracking'} <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></a>
            ${riderTel ? `<a href="tel:${esc(riderTel)}" class="icon-btn call tap" aria-label="Call delivery partner"><i class="fa-solid fa-phone"></i></a>` : ''}
            <button class="icon-btn tap" aria-label="Help with this order" onclick="window.location.href='support.html?order=${id}'"><i class="fa-solid fa-headset"></i></button>
          </div>
        </div>
      `;
    }).join('');
  }

  // 'refunded' is a payment outcome (a cancelled order whose money came back),
  // not an order status — detect it from the real refund data so the Refunded
  // badge / filter / count actually work instead of keying off a status value
  // that never exists.
  function isOrderRefunded(o) { return OS.isRefunded(o); }

  function renderPastSection(pastOrders) {
    if (pastOrders.length === 0) { pastContainer.innerHTML = ''; loadMoreWrap.style.display = 'none'; return; }

    const visible = pastOrders.slice(0, pastRenderLimit);

    pastContainer.innerHTML = `
      <div class="section-title" style="margin-top:${liveContainer.innerHTML ? '20px' : '4px'}">
        <div class="st-left">Past orders</div>
        <div class="st-count">${pastOrders.length} total</div>
      </div>` + visible.map(order => {
      const placed = OS.fmtDateTime(order.createdAt);
      const statusLower = OS.norm(order.status);
      const isDelivered = statusLower === 'delivered';
      const isCancelled = statusLower === 'cancelled';
      const isRefunded = isOrderRefunded(order);
      const statusClass = isDelivered ? 'delivered' : (isRefunded ? 'refunded' : (isCancelled ? 'cancelled' : ''));
      const statusLabel = isRefunded ? 'Refunded' : (isCancelled ? 'Order cancelled' : OS.info(order).label);
      const pay = OS.payment(order);
      const cuisine = order.cuisine || order.restaurantCuisine || '';
      const id = esc(order._id);
      const detailsUrl = `track-order.html?id=${encodeURIComponent(order._id)}`;

      return `
        <div class="swipe-container${enterClass('past:' + order._id)}">
          <div class="swipe-actions">
            <button class="swipe-btn btn-invoice tap" onclick="showInvoice('${id}')"><i class="fa-solid fa-receipt"></i><span>Invoice</span></button>
            <button class="swipe-btn btn-support tap" onclick="window.location.href='support.html?order=${id}'"><i class="fa-solid fa-headset"></i><span>Help</span></button>
            ${isCancelled ? `<button class="swipe-btn btn-delete tap" onclick="deleteCancelledOrder('${id}')"><i class="fa-solid fa-trash"></i><span>Remove</span></button>` : ''}
          </div>
          <div class="order-card past-card ${isCancelled ? 'has-delete' : ''}" data-order-id="${id}">
            <div class="oc-head">
              ${logoHtml(order)}
              <div class="oc-title">
                <h4 class="oc-name">${esc(order.restaurantName || 'Eatswada partner')}</h4>
                <div class="oc-sub">${cuisine ? esc(cuisine) + ' · ' : ''}Order #${esc(orderLabel(order))}</div>
              </div>
            </div>
            ${itemsList(order.items)}
            <button type="button" class="past-summary" onclick="window.location.href='${detailsUrl}'" aria-label="View order details">
              <span>
                ${placed ? `<span class="past-when" style="display:block">Order placed on ${esc(placed)}</span>` : ''}
                <span class="past-status ${statusClass}" style="display:block">${esc(statusLabel)}${pay.short && !isRefunded ? ` <small>· ${esc(pay.short)}</small>` : ''}</span>
              </span>
              <span class="past-total">₹${esc(order.total)} <i class="fa-solid fa-chevron-right" aria-hidden="true"></i></span>
            </button>
            <div class="past-footer">
              <div class="ghost-row">
                <button class="ghost-btn tap" onclick="showInvoice('${id}')"><i class="fa-solid fa-file-lines"></i>Invoice</button>
                ${isDelivered ? `<button class="ghost-btn rate tap" onclick="window.location.href='${detailsUrl}#rate'"><i class="fa-solid fa-star"></i>Rate</button>` : ''}
                <button class="ghost-btn tap" onclick="window.location.href='support.html?order=${id}'"><i class="fa-solid fa-circle-question"></i>Help</button>
              </div>
              <button class="btn-reorder tap" onclick="reorder('${id}')"><i class="fa-solid fa-rotate-right" aria-hidden="true"></i>Reorder</button>
            </div>
          </div>
        </div>
      `;
    }).join('');

    if (pastOrders.length > pastRenderLimit) {
      loadMoreWrap.style.display = 'flex';
    } else {
      loadMoreWrap.style.display = 'none';
    }
  }

  window.deleteCancelledOrder = (id) => {
    hideOrderLocally(id);
    renderOrders();
  };

  // ── Toast ─────────────────────────────────────────────────────────
  function toastMsg(text){
    let t = document.getElementById('od-toast');
    if(!t){ t = document.createElement('div'); t.id='od-toast'; t.className='od-toast'; document.body.appendChild(t); }
    t.textContent = text; t.classList.add('show');
    clearTimeout(t._timer); t._timer = setTimeout(()=>t.classList.remove('show'), 2600);
  }
  window.toastMsg = toastMsg;

  function escapeHtmlInv(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  // ── Reorder: re-add the past order's items to the cart, then open cart ──
  window.reorder = async function(orderId){
    if(!token){ location.href='login.html'; return; }
    const order = (allOrdersData||[]).find(o => o._id === orderId);
    if(!order || !Array.isArray(order.items) || !order.items.length){ toastMsg('Could not find this order.'); return; }
    toastMsg('Adding items to your cart…');
    let ok=0, fail=0;
    for(const it of order.items){
      const mid = it.menuItem && (it.menuItem._id || it.menuItem);
      if(!mid){ fail++; continue; }
      try{
        const r = await fetch(CONFIG.API_BASE_URL + '/cart/add', {
          method:'POST',
          headers:{ 'Authorization':'Bearer '+token, 'Content-Type':'application/json' },
          body: JSON.stringify({ menuItemId: mid, quantity: it.quantity || 1, customizations: it.customizations || {} })
        });
        if(r.ok) ok++; else fail++;
      }catch(e){ fail++; }
    }
    if(ok===0){ toastMsg('Sorry, none of these items are available right now.'); return; }
    toastMsg(fail>0 ? (ok+' item'+(ok>1?'s':'')+' added · '+fail+' unavailable') : 'Added to cart!');
    setTimeout(()=>{ location.href='cart.html'; }, 850);
  };

  // ── Invoice: a real receipt built from the order, printable / save-as-PDF ──
  function invMoney(n){ return '₹' + Number(n||0).toLocaleString('en-IN'); }
  function invAddress(o){
    const a = o.deliveryAddress || {};
    return [a.flat||a.house||a.line1, a.area||a.landmark, a.city, a.pincode||a.zip].filter(Boolean).join(', ');
  }
  window.showInvoice = function(orderId){
    const o = (allOrdersData||[]).find(x => x._id === orderId);
    if(!o){ toastMsg('Could not load this invoice.'); return; }
    const idLabel = o.orderNumber || String(o._id).slice(-6).toUpperCase();
    const dt = o.createdAt ? new Date(o.createdAt) : new Date();
    const rows = (o.items||[]).map(it =>
      `<tr><td>${(it.quantity||1)} × ${escapeHtmlInv(it.name||'Item')}</td><td class="r">${invMoney((it.price||0)*(it.quantity||1))}</td></tr>`
    ).join('');
    const disc = Number(o.discount||0), tip = Number(o.tipAmount||0), paid = o.paymentStatus === 'paid';
    const pay = OS.payment(o);
    document.getElementById('invoice-content').innerHTML =
      `<div class="inv-head"><div class="inv-brand">Eatswada</div><div class="inv-status ${pay.tone}">${escapeHtmlInv(pay.short || pay.label)}</div></div>
       <div class="inv-sub">${escapeHtmlInv(o.restaurantName||'Restaurant')}</div>
       <div class="inv-meta"><span>Invoice #${escapeHtmlInv(idLabel)}</span><span>${dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})} · ${dt.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}</span></div>
       ${invAddress(o) ? `<div class="inv-addr">Deliver to: ${escapeHtmlInv(invAddress(o))}</div>` : ''}
       <table class="inv-table"><tbody>${rows}</tbody></table>
       <div class="inv-line"><span>Item total</span><span>${invMoney(o.subtotal)}</span></div>
       ${disc>0?`<div class="inv-line disc"><span>Discount${o.coupon&&o.coupon.code?(' ('+escapeHtmlInv(o.coupon.code)+')'):''}</span><span>− ${invMoney(disc)}</span></div>`:''}
       <div class="inv-line"><span>Delivery fee</span><span>${invMoney(o.deliveryFee)}</span></div>
       ${tip>0?`<div class="inv-line"><span>Tip</span><span>${invMoney(tip)}</span></div>`:''}
       <div class="inv-total"><span>Total ${paid?'paid':'payable'}</span><span>${invMoney(o.total)}</span></div>
       <div class="inv-foot">${pay.method ? 'Payment: ' + escapeHtmlInv(pay.method) + ' · ' : ''}Thank you for ordering with Eatswada.</div>`;
    document.getElementById('invoice-overlay').classList.add('open');
  };
  window.closeInvoice = function(){ document.getElementById('invoice-overlay').classList.remove('open'); };
  window.printInvoice = function(){ window.print(); };

  const updateChipCounts = () => {
    const hidden = new Set(getHidden());
    const visible = allOrdersData.filter(o => !hidden.has(o._id));
    const counts = { all: visible.length, active: 0, delivered: 0, cancelled: 0, refunded: 0 };
    visible.forEach(o => {
      const s = o.status.toLowerCase();
      if (liveStatuses.includes(s)) { counts.active++; return; }
      if (isOrderRefunded(o)) { counts.refunded++; return; }   // refunded counted separately from cancelled
      if (counts[s] !== undefined) counts[s]++;
    });
    document.querySelectorAll('.chip').forEach(chip => {
      const key = chip.getAttribute('data-filter');
      const n = counts[key] || 0;
      chip.setAttribute('data-count', n > 0 ? n : '');
    });
    document.getElementById('stat-total').innerText = `${visible.length} order${visible.length === 1 ? '' : 's'}`;
    const liveStat = document.getElementById('stat-live');
    if (counts.active > 0) {
      liveStat.style.display = 'inline-flex';
      document.getElementById('stat-live-text').innerText = `${counts.active} live`;
    } else {
      liveStat.style.display = 'none';
    }
  };

  const moveChipIndicator = () => {
    const active = document.querySelector('.chip.active');
    const indicator = document.getElementById('chip-indicator');
    if (!active || !indicator) return;
    indicator.style.transform = `translateX(${active.offsetLeft}px)`;
    indicator.style.width = `${active.offsetWidth}px`;
    document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-selected', c === active ? 'true' : 'false'));
  };

  const renderOrders = () => {
    const hidden = new Set(getHidden());
    let filteredOrders = allOrdersData.filter(o => !hidden.has(o._id));

    // Search Filtering
    if (currentSearch) {
      const q = currentSearch.toLowerCase();
      filteredOrders = filteredOrders.filter(o =>
        (o.restaurantName && o.restaurantName.toLowerCase().includes(q)) ||
        (o._id && o._id.toLowerCase().includes(q)) ||
        (o.orderNumber && String(o.orderNumber).toLowerCase().includes(q)) ||
        (o.items && o.items.some(i => String(i.name || '').toLowerCase().includes(q)))
      );
    }

    // Chip Filtering
    if (currentFilter !== 'all') {
      if (currentFilter === 'active') filteredOrders = filteredOrders.filter(o => liveStatuses.includes(o.status.toLowerCase()));
      else if (currentFilter === 'refunded') filteredOrders = filteredOrders.filter(o => isOrderRefunded(o));
      else if (currentFilter === 'cancelled') filteredOrders = filteredOrders.filter(o => o.status.toLowerCase() === 'cancelled' && !isOrderRefunded(o));
      else filteredOrders = filteredOrders.filter(o => o.status.toLowerCase() === currentFilter);
    }

    // Reset the infinite-scroll page only when the result *set* changes (new search/filter),
    // not on every 10s poll refresh — otherwise a scrolled-down user would keep getting bumped back up.
    const searchKey = currentSearch + '::' + currentFilter;
    if (searchKey !== lastSearchKey) { pastRenderLimit = PAGE_SIZE; lastSearchKey = searchKey; }

    const liveOrders = filteredOrders.filter(o => liveStatuses.includes(o.status.toLowerCase()));
    const pastOrders = filteredOrders.filter(o => !liveStatuses.includes(o.status.toLowerCase()));

    renderLiveSection(liveOrders);
    renderPastSection(pastOrders);
    updateChipCounts();

    if (filteredOrders.length === 0) {
      emptyState.style.display = 'block';
      if (currentSearch || currentFilter !== 'all') {
        document.getElementById('empty-title').innerText = "No matching orders";
        document.getElementById('empty-desc').innerText = "Try changing your filters or search term.";
      } else {
        document.getElementById('empty-title').innerText = "No orders found";
        document.getElementById('empty-desc').innerText = "Looks like you haven't placed any orders yet.";
      }
    } else {
      emptyState.style.display = 'none';
    }

    if (!hasRenderedOnce) {
      hasRenderedOnce = true;
      requestAnimationFrame(() => document.body.classList.add('settled'));
    }
  };

  async function fetchOrders() {
    try {
      const response = await fetch(CONFIG.API_BASE_URL + '/orders', {
        headers: { 'Authorization': `Bearer ${token}` }
      });

      if (response.status === 401 || response.status === 404) return requireLogin();

      const result = await response.json();
      if (loader) loader.style.display = 'none';

      if (response.ok && result.success && result.data) {
        allOrdersData = result.data;
        renderOrders();
        const reorderId = new URLSearchParams(location.search).get('reorder');
        if (reorderId) {
          history.replaceState(history.state, '', 'orders.html');
          if (allOrdersData.some(o => o._id === reorderId)) window.reorder(reorderId);
        }
      } else {
        allOrdersData = [];
        renderOrders();
      }
    } catch (error) {
      console.error(error);
      requireLogin();
    }
  }

  // Initial Fetch & Live Polling Maintained
  fetchOrders();
  setInterval(fetchOrders, 10000);

  // Search
  const searchInput = document.getElementById('order-search');
  const searchBar = document.getElementById('search-bar');
  searchInput.addEventListener('input', (e) => {
    currentSearch = e.target.value;
    searchBar.classList.toggle('has-value', !!e.target.value);
    renderOrders();
  });
  document.getElementById('search-clear').addEventListener('click', () => {
    searchInput.value = '';
    currentSearch = '';
    searchBar.classList.remove('has-value');
    renderOrders();
    searchInput.focus();
  });

  // Filter Chips (animated selection)
  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', (e) => {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      e.currentTarget.classList.add('active');
      currentFilter = e.currentTarget.getAttribute('data-filter');
      renderOrders();
      moveChipIndicator();
      e.currentTarget.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' });
    });
  });
  document.querySelectorAll('.chip').forEach(c => c.setAttribute('role', 'tab'));
  window.addEventListener('resize', moveChipIndicator);
  setTimeout(moveChipIndicator, 50);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(moveChipIndicator);

  // Infinite scroll for Past Orders
  const io = new IntersectionObserver((entries) => {
    if (entries[0].isIntersecting) {
      pastRenderLimit += PAGE_SIZE;
      renderOrders();
    }
  }, { rootMargin: '200px' });
  io.observe(sentinel);
  loadMoreBtn.addEventListener('click', () => { pastRenderLimit += PAGE_SIZE; renderOrders(); });

  // Swipe Gestures Logic (adds a 3rd "delete" action for cancelled orders)
  let startX = 0;
  let currentCard = null;

  document.addEventListener('touchstart', e => {
    const card = e.target.closest('.past-card');
    if (card) { startX = e.touches[0].clientX; currentCard = card; }
  }, { passive: true });

  document.addEventListener('touchmove', e => {
    if (!currentCard) return;
    const currentX = e.touches[0].clientX;
    const diff = startX - currentX;
    if (diff > 40) currentCard.classList.add('swiped');
    else if (diff < -40) currentCard.classList.remove('swiped');
  }, { passive: true });

  document.addEventListener('touchend', () => { currentCard = null; });

  // Pull to Refresh Logic
  let touchStartPtr = 0;
  const ptrIndicator = document.getElementById('ptr-indicator');

  window.addEventListener('touchstart', e => {
    if (window.scrollY === 0) touchStartPtr = e.touches[0].clientY;
  }, { passive: true });

  window.addEventListener('touchmove', e => {
    if (window.scrollY === 0 && touchStartPtr > 0) {
      const diff = e.touches[0].clientY - touchStartPtr;
      if (diff > 0 && diff < 80) {
        ptrIndicator.style.height = `${diff}px`;
      }
    }
  }, { passive: true });

  window.addEventListener('touchend', e => {
    if (parseInt(ptrIndicator.style.height) > 50) {
      ptrIndicator.classList.add('ptr-spinning');
      ptrIndicator.style.height = '60px';
      fetchOrders().then(() => {
        ptrIndicator.style.height = '0';
        setTimeout(() => ptrIndicator.classList.remove('ptr-spinning'), 300);
      });
    } else {
      ptrIndicator.style.height = '0';
    }
    touchStartPtr = 0;
  });

});
</script>

<script src="navigation.js"></script>
  <script src="bottom-tab-bar.js"></script>
<div class="invoice-overlay" id="invoice-overlay">
  <div class="invoice-sheet">
    <button class="inv-close no-print" onclick="closeInvoice()" aria-label="Close">&times;</button>
    <div id="invoice-content"></div>
    <div class="inv-actions no-print">
      <button class="inv-btn ghost" onclick="closeInvoice()">Close</button>
      <button class="inv-btn solid" onclick="printInvoice()"><i class="fa-solid fa-download"></i> Save / Print</button>
    </div>
  </div>
</div>
</body>
</html>
