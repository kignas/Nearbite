<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>My Orders – Nearbite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* ============================================================
       ORDERS PAGE — 2026 Premium Standards
       ============================================================ */
    :root {
      --primary: #FC8019;
      --primary-light: #fff7ef;
      --primary-hover: #e57010;
      --bg-color: #f4f4f6;
      --card-bg: #ffffff;
      --text-main: #111827;
      --text-muted: #6b7280;
      --text-light: #9ca3af;
      --border-light: rgba(0, 0, 0, 0.05);
      --border-dashed: #e2e8f0;
      --success: #1ba672;
      --danger: #e63946;
      --glass-bg: rgba(255, 255, 255, 0.85);
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.06);
      --shadow-lg: 0 6px 20px rgba(252, 128, 25, 0.2);
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--bg-color);
      margin: 0;
      padding-bottom: calc(88px + env(safe-area-inset-bottom));
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: contain; /* For custom pull-to-refresh */
    }

    .tap { transition: transform 0.15s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.15s ease; cursor: pointer; }
    .tap:active { transform: scale(0.95); opacity: 0.9; }

    /* Pull to Refresh Indicator */
    #ptr-indicator {
      text-align: center; height: 0; overflow: hidden; transition: height 0.3s ease;
      display: flex; align-items: center; justify-content: center; color: var(--primary); font-size: 20px;
    }
    .ptr-spinning i { animation: spin 1s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* Header & Glassmorphism */
    .orders-header {
      position: sticky; top: 0; z-index: 40;
      background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-light); padding: 14px 20px; 
      display: flex; flex-direction: column; gap: 12px;
    }
    .header-top { display: flex; align-items: center; gap: 14px; }
    .header-back-btn {
      width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;
      border-radius: 50%; background: #f1f1f5; border: none; color: #374151; font-size: 14px;
    }
    .orders-header h1 { font-size: 20px; font-weight: 900; color: var(--text-main); margin: 0; letter-spacing: -0.3px; }

    /* Search & Filters */
    .search-bar {
      display: flex; align-items: center; background: #f1f1f5; border-radius: 16px; padding: 10px 16px;
    }
    .search-bar i { color: var(--text-muted); font-size: 14px; margin-right: 10px; }
    .search-bar input {
      border: none; background: transparent; outline: none; width: 100%; font-family: 'Poppins', sans-serif;
      font-size: 14px; font-weight: 500; color: var(--text-main);
    }
    .filter-chips {
      display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none;
    }
    .filter-chips::-webkit-scrollbar { display: none; }
    .chip {
      background: #f1f1f5; color: var(--text-muted); padding: 8px 16px; border-radius: 999px;
      font-size: 12px; font-weight: 700; white-space: nowrap; transition: all 0.3s ease; border: 1px solid transparent;
    }
    .chip.active {
      background: var(--primary-light); color: var(--primary); border: 1px solid rgba(252,128,25,0.3);
      box-shadow: 0 2px 8px rgba(252,128,25,0.1);
    }

    .orders-content { padding: 16px 16px 0; }

    /* Empty State */
    #empty-orders { display: none; animation: fadeIn 0.5s ease; }
    .empty-card { background: var(--card-bg); border-radius: 24px; padding: 48px 24px; box-shadow: var(--shadow-md); text-align: center; }
    .empty-img { width: 140px; margin-bottom: 24px; animation: float 3s ease-in-out infinite; }
    .empty-card h4 { font-size: 20px; font-weight: 900; color: var(--text-main); margin: 0 0 8px; }
    .empty-card p { font-size: 14px; color: var(--text-muted); font-weight: 500; margin: 0 0 32px; }
    .explore-btn {
      background: var(--primary); color: #ffffff; font-family: 'Poppins', sans-serif; font-size: 15px; font-weight: 800;
      padding: 16px 32px; border-radius: 16px; border: none; letter-spacing: 0.2px; box-shadow: var(--shadow-lg); width: 100%;
    }

    /* Section Titles */
    .section-title { font-size: 14px; font-weight: 900; color: var(--text-main); text-transform: uppercase; margin: 24px 0 16px 0; display: flex; align-items: center; gap: 8px; }
    .pulse-dot { width: 8px; height: 8px; background: var(--primary); border-radius: 50%; animation: pulse-anim 1.6s ease-in-out infinite; }
    
    @keyframes pulse-anim { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.5); opacity: 0.5; } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

    /* Order Cards Common */
    .order-card {
      background: var(--card-bg); border-radius: 24px; padding: 16px; margin-bottom: 16px;
      box-shadow: var(--shadow-sm); position: relative; animation: fadeIn 0.4s ease-out;
    }

    /* Live Track Card */
    .track-card { border: 1px solid var(--primary-light); overflow: hidden; display: block; text-decoration: none; }
    .track-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .restaurant-img { width: 48px; height: 48px; border-radius: 12px; object-fit: cover; background: #f1f1f5; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .track-info { flex: 1; }
    .track-info h3 { font-size: 16px; font-weight: 800; color: var(--text-main); margin: 0 0 2px; }
    .track-info p { font-size: 12px; color: var(--text-muted); font-weight: 600; margin: 0; }
    .eta-badge { background: #f1f5f9; padding: 6px 12px; border-radius: 10px; text-align: center; }
    .eta-badge span { display: block; font-size: 10px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
    .eta-badge strong { font-size: 14px; color: var(--text-main); font-weight: 900; }
    
    .status-alert { font-size: 12px; font-weight: 800; padding: 8px 12px; border-radius: 12px; margin-bottom: 16px; display: inline-block; }
    .status-alert.preparing { background: #fffbeb; color: #d97706; }
    .status-alert.dispatch { background: #eff6ff; color: #2563eb; }
    .status-alert.arriving { background: #f0fdf4; color: var(--success); }

    /* Progress Bar */
    .progress-wrapper { margin-bottom: 16px; }
    .progress-bar-track { height: 6px; width: 100%; background: #f0f0f4; border-radius: 999px; overflow: hidden; margin-bottom: 8px; position: relative; }
    .progress-bar-fill { position: absolute; top: 0; left: 0; height: 100%; background: linear-gradient(90deg, var(--primary), #ffaa55); border-radius: 999px; transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
    .progress-labels { display: flex; justify-content: space-between; }
    .progress-labels span { font-size: 10px; font-weight: 800; color: var(--text-light); }
    .progress-labels span.active-label { color: var(--primary); }

    .track-btn { width: 100%; background: var(--primary); color: #fff; font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 800; padding: 14px; border-radius: 14px; border: none; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: var(--shadow-lg); }

    /* Past Orders & Swipe Mechanics */
    .swipe-container { position: relative; border-radius: 24px; margin-bottom: 16px; overflow: hidden; }
    .swipe-actions { position: absolute; top: 0; right: 0; bottom: 0; width: 100%; display: flex; justify-content: flex-end; background: #f8fafc; border-radius: 24px; padding: 16px; gap: 12px; align-items: center; z-index: 1; }
    .swipe-btn { width: 50px; height: 50px; border-radius: 16px; border: none; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #fff; }
    .btn-support { background: #3b82f6; }
    .btn-invoice { background: #64748b; }
    
    .past-card { position: relative; z-index: 2; border: 1px solid var(--border-light); margin-bottom: 0; transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1); touch-action: pan-y; }
    .past-card.swiped { transform: translateX(-140px); }

    .past-header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px dashed var(--border-dashed); padding-bottom: 12px; margin-bottom: 12px; }
    .past-title-wrap { display: flex; gap: 12px; align-items: center; }
    .past-title-wrap h4 { font-size: 15px; font-weight: 800; color: var(--text-main); margin: 0; }
    .past-date { font-size: 11px; color: var(--text-light); font-weight: 600; margin-top: 2px; }
    
    .badge { font-size: 10px; font-weight: 800; padding: 4px 8px; border-radius: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    .badge.delivered { background: #e6f6f0; color: var(--success); }
    .badge.cancelled { background: #fce8e8; color: var(--danger); }

    .past-items { font-size: 13px; font-weight: 600; color: #374151; margin: 0 0 16px; line-height: 1.5; }
    .extra-items { color: var(--text-muted); font-size: 12px; }

    .past-footer { display: flex; flex-direction: column; gap: 12px; }
    .footer-row { display: flex; justify-content: space-between; align-items: center; }
    .past-total { font-size: 16px; font-weight: 900; color: var(--text-main); }
    
    .action-buttons { display: flex; gap: 8px; width: 100%; }
    .action-buttons button { flex: 1; padding: 10px; border-radius: 12px; font-family: 'Poppins', sans-serif; font-size: 13px; font-weight: 800; border: none; }
    .btn-reorder { background: var(--primary-light); color: var(--primary); border: 1px solid rgba(252,128,25,0.2); }
    .btn-rate { background: #fffbeb; color: #d97706; border: 1px solid #fde68a; display: flex; align-items: center; justify-content: center; gap: 4px;}
    .btn-rate i { font-size: 10px; }
    .btn-details { background: #f1f5f9; color: #475569; }

    /* Skeleton Loader */
    .sk-wrapper { display: flex; flex-direction: column; gap: 16px; }
    .sk { background: linear-gradient(90deg, #ececef 25%, #f6f6f9 50%, #ececef 75%); background-size: 1200px 100%; animation: shimmer 1.5s infinite linear; border-radius: 12px; }
    .sk-card { background: #fff; padding: 16px; border-radius: 24px; box-shadow: var(--shadow-sm); border: 1px solid var(--border-light); }
    .sk-row { display: flex; gap: 12px; margin-bottom: 16px; }
    .sk-avatar { width: 48px; height: 48px; border-radius: 12px; flex-shrink: 0; }
    .sk-text-1 { height: 16px; width: 60%; margin-bottom: 8px; }
    .sk-text-2 { height: 12px; width: 40%; }
    .sk-box { height: 40px; width: 100%; border-radius: 12px; }
    @keyframes shimmer { 0% { background-position: -600px 0; } 100% { background-position: 600px 0; } }

    /* Bottom Nav */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 68px; background: var(--glass-bg); backdrop-filter: blur(12px); border-top: 1px solid var(--border-light); display: flex; align-items: stretch; box-shadow: 0 -4px 24px rgba(0,0,0,0.06); z-index: 100; padding-bottom: env(safe-area-inset-bottom); }
    .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 10px; font-weight: 700; color: var(--text-light); text-decoration: none; position: relative; }
    .nav-item svg { width: 24px; height: 24px; transition: transform 0.2s; }
    .nav-item:active svg { transform: scale(0.9); }
    .nav-food-circle { width: 22px; height: 22px; }
    .nav-new-badge { position: absolute; top: 6px; right: calc(50% - 22px); background: var(--danger); color: #fff; font-size: 8px; font-weight: 900; padding: 2px 6px; border-radius: 999px; box-shadow: 0 2px 4px rgba(230,57,70,0.3); }
  </style>
</head>

<body>

<div id="ptr-indicator">
  <i class="fa-solid fa-arrow-rotate-right"></i>
</div>

<header class="orders-header">
  <div class="header-top">
    <button onclick="window.history.back()" class="header-back-btn tap" aria-label="Go back">
      <i class="fa-solid fa-arrow-left"></i>
    </button>
    <h1>My Orders</h1>
  </div>
  
  <div class="search-bar">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input type="text" id="order-search" placeholder="Search restaurant, item, or Order ID">
  </div>

  <div class="filter-chips" id="filter-chips">
    <div class="chip active tap" data-filter="all">All</div>
    <div class="chip tap" data-filter="active">Active</div>
    <div class="chip tap" data-filter="delivered">Delivered</div>
    <div class="chip tap" data-filter="cancelled">Cancelled</div>
  </div>
</header>

<div class="orders-content">

  <div id="loading-state" class="sk-wrapper">
    <div class="sk-card">
      <div class="sk-row">
        <div class="sk sk-avatar"></div>
        <div style="flex:1;"><div class="sk sk-text-1"></div><div class="sk sk-text-2"></div></div>
      </div>
      <div class="sk sk-box"></div>
    </div>
    <div class="sk-card">
      <div class="sk-row">
        <div class="sk sk-avatar"></div>
        <div style="flex:1;"><div class="sk sk-text-1"></div><div class="sk sk-text-2"></div></div>
      </div>
      <div class="sk sk-box"></div>
    </div>
  </div>

  <div id="live-orders-container"></div>
  <div id="past-orders-container"></div>

  <div id="empty-orders">
    <div class="empty-card tap">
      <img src="https://cdn-icons-png.flaticon.com/512/1046/1046784.png" alt="No Orders" class="empty-img" style="filter: hue-rotate(340deg) saturate(2); opacity: 0.9;">
      <h4 id="empty-title">No orders found</h4>
      <p id="empty-desc">Looks like you haven't placed<br>any orders yet.</p>
      <button id="empty-btn" class="explore-btn tap">Explore Restaurants</button>
    </div>
  </div>

</div>

<nav class="bottom-nav">
  <a href="index.html" class="nav-item" style="color:var(--text-light);">
    <div class="nav-food-circle">
      <svg fill="currentColor" viewBox="0 0 24 24"><path d="M18.06 22.99h1.66c.84 0 1.53-.64 1.63-1.46L23 5.05h-5V1h-1.97v4.05h-4.97l.3 2.34c1.71.47 3.31 1.32 4.27 2.26 1.44 1.42 2.43 2.89 2.43 5.29v8.05zM1 21.99V21h15.03v.99c0 .55-.45 1-1.01 1H2.01c-.56 0-1.01-.45-1.01-1zm15.03-7c0-5.87-11.31-7.95-15.03-3.89V21h15.03v-6.01z"/></svg>
    </div>
    <span>Food</span>
  </a>
  <a href="under99.html" class="nav-item" style="color:var(--text-light);">
    <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/></svg>
    <span>99 store</span>
  </a>
  <a href="orders.html" class="nav-item" style="color:var(--primary); position:relative;">
    <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
    <span>Orders</span>
    <span class="nav-new-badge">NEW</span>
  </a>
</nav>

<script>
document.addEventListener('DOMContentLoaded', () => {
  let token = localStorage.getItem('nearbite_token') || localStorage.getItem('token');
  if (token === 'undefined' || token === 'null') token = null;

  const loader = document.getElementById('loading-state');
  const liveContainer = document.getElementById('live-orders-container');
  const pastContainer = document.getElementById('past-orders-container');
  const emptyState = document.getElementById('empty-orders');
  
  let allOrdersData = [];
  let currentSearch = '';
  let currentFilter = 'all';

  // Constants to preserve exact backend mappings
  const liveStatuses = ['placed', 'confirmed', 'pending', 'preparing', 'waiting_for_rider', 'assigned', 'out_for_delivery', 'otp_verified'];

  const requireLogin = () => {
    loader.style.display = 'none';
    liveContainer.innerHTML = '';
    pastContainer.innerHTML = '';
    emptyState.style.display = 'block';
    document.getElementById('empty-title').innerText = "Please log in";
    document.getElementById('empty-desc').innerHTML = `Log in to view your premium orders.`;
    const btn = document.getElementById('empty-btn');
    btn.innerText = "LOGIN NOW";
    btn.onclick = () => {
        localStorage.clear();
        window.location.href = 'login.html';
    };
  };

  if (!token) return requireLogin();

  // Formatting Helper
  const formatItemsDisplay = (items) => {
    if (!items || items.length === 0) return '';
    const first = items[0];
    const isChicken = first.name.toLowerCase().includes('chicken');
    const isVeg = first.name.toLowerCase().includes('paneer') || first.name.toLowerCase().includes('veg');
    const icon = isChicken ? '🍗' : (isVeg ? '🥗' : '🍲');
    let html = `${icon} ${first.name} ×${first.quantity}`;
    if (items.length > 1) {
      html += `<br><span class="extra-items">+${items.length - 1} more items</span>`;
    }
    return html;
  };

  const getPlaceholderImage = (name) => {
    const initial = name ? name.charAt(0).toUpperCase() : 'E';
    return `<div class="restaurant-img">${initial}</div>`;
  };

  const renderOrders = () => {
    let filteredOrders = allOrdersData;

    // Search Filtering
    if (currentSearch) {
      const q = currentSearch.toLowerCase();
      filteredOrders = filteredOrders.filter(o => 
        (o.restaurantName && o.restaurantName.toLowerCase().includes(q)) ||
        (o._id && o._id.toLowerCase().includes(q)) ||
        (o.items && o.items.some(i => i.name.toLowerCase().includes(q)))
      );
    }

    // Chip Filtering
    if (currentFilter !== 'all') {
      if (currentFilter === 'active') filteredOrders = filteredOrders.filter(o => liveStatuses.includes(o.status.toLowerCase()));
      else filteredOrders = filteredOrders.filter(o => o.status.toLowerCase() === currentFilter);
    }

    const liveOrders = filteredOrders.filter(o => liveStatuses.includes(o.status.toLowerCase()));
    const pastOrders = filteredOrders.filter(o => !liveStatuses.includes(o.status.toLowerCase()));

    // Render Live Orders
    if (liveOrders.length > 0) {
      liveContainer.innerHTML = `<div class="section-title">Live Tracking <span class="pulse-dot"></span></div>` + liveOrders.map(order => {
        let width = '10%'; let active1 = 'active-label', active2 = '', active3 = '', active4 = '';
        let statusTitle = 'Order Received';
        let alertClass = '';
        const status = order.status.toLowerCase();

        if (status === 'preparing') { width = '35%'; active2 = 'active-label'; statusTitle = 'Preparing your food'; alertClass = 'preparing'; }
        if (['waiting_for_rider', 'assigned'].includes(status)) { width = '60%'; active2 = 'active-label'; active3 = 'active-label'; statusTitle = 'Rider Assigned'; alertClass = 'dispatch'; }
        if (['out_for_delivery', 'otp_verified'].includes(status)) { width = '85%'; active2 = 'active-label'; active3 = 'active-label'; active4 = 'active-label'; statusTitle = 'Arriving Soon!'; alertClass = 'arriving'; }

        const imgHtml = order.restaurantImage ? `<img src="${order.restaurantImage}" class="restaurant-img" loading="lazy" alt="Logo">` : getPlaceholderImage(order.restaurantName);
        
        return `
          <div class="order-card track-card tap" onclick="window.location.href='track-order.html?id=${order._id}'">
            <div class="track-header">
              ${imgHtml}
              <div class="track-info">
                <h3>${order.restaurantName || "EatSwada Partner"}</h3>
                <p>Order #${order._id.substring(0,6).toUpperCase()}</p>
              </div>
              <div class="eta-badge">
                <span>ETA</span>
                <strong>25m</strong>
              </div>
            </div>
            
            <div class="status-alert ${alertClass}"><i class="fa-solid fa-clock-rotate-left"></i> ${statusTitle}</div>
            
            <div class="progress-wrapper">
              <div class="progress-bar-track"><div class="progress-bar-fill" style="width: ${width};"></div></div>
              <div class="progress-labels">
                <span class="${active1}">Received</span>
                <span class="${active2}">Preparing</span>
                <span class="${active3}">Dispatch</span>
                <span class="${active4}">Arriving</span>
              </div>
            </div>
            <button class="track-btn">Track Order <i class="fa-solid fa-location-arrow"></i></button>
          </div>
        `;
      }).join('');
    } else { liveContainer.innerHTML = ''; }

    // Render Past Orders
    if (pastOrders.length > 0) {
      pastContainer.innerHTML = `<div class="section-title" style="margin-top:${liveOrders.length > 0 ? '24px' : '0'}">Past Orders</div>` + pastOrders.map(order => {
        const dateStr = new Date(order.createdAt).toLocaleString('en-IN', { month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit' });
        const itemsHtml = formatItemsDisplay(order.items);
        const isDelivered = order.status.toLowerCase() === 'delivered';
        const badgeClass = isDelivered ? 'delivered' : 'cancelled';
        const imgHtml = order.restaurantImage ? `<img src="${order.restaurantImage}" class="restaurant-img" loading="lazy" alt="Logo">` : getPlaceholderImage(order.restaurantName);
        
        return `
          <div class="swipe-container">
            <div class="swipe-actions">
              <button class="swipe-btn btn-invoice tap"><i class="fa-solid fa-receipt"></i></button>
              <button class="swipe-btn btn-support tap"><i class="fa-solid fa-headset"></i></button>
            </div>
            <div class="order-card past-card">
              <div class="past-header">
                <div class="past-title-wrap">
                  ${imgHtml}
                  <div>
                    <h4>${order.restaurantName || "EatSwada Partner"}</h4>
                    <div class="past-date">${dateStr}</div>
                  </div>
                </div>
                <span class="badge ${badgeClass}">${order.status}</span>
              </div>
              <p class="past-items">${itemsHtml}</p>
              <div class="past-footer">
                <div class="footer-row">
                  <span class="past-total">₹${order.total}</span>
                </div>
                <div class="action-buttons">
                  <button class="btn-reorder tap">Reorder</button>
                  ${isDelivered ? `<button class="btn-rate tap">Rate <i class="fa-solid fa-star"></i></button>` : ''}
                  <button class="btn-details tap" onclick="window.location.href='track-order.html?id=${order._id}'">Details</button>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    } else { pastContainer.innerHTML = ''; }

    // Empty State Check
    if (filteredOrders.length === 0) {
      emptyState.style.display = 'block';
      if (currentSearch || currentFilter !== 'all') {
        document.getElementById('empty-title').innerText = "No matching orders";
        document.getElementById('empty-desc').innerText = "Try changing your filters or search term.";
      } else {
        document.getElementById('empty-title').innerText = "No orders found";
        document.getElementById('empty-desc').innerText = "Looks like you haven't placed any orders yet.";
      }
    } else {
      emptyState.style.display = 'none';
    }
  };

  async function fetchOrders() {
    try {
      const response = await fetch('https://eatswada.onrender.com/api/orders', {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      
      if (response.status === 401 || response.status === 404) return requireLogin();

      const result = await response.json();
      if (loader) loader.style.display = 'none';

      if (response.ok && result.success && result.data) {
        allOrdersData = result.data;
        renderOrders();
      } else {
        allOrdersData = [];
        renderOrders();
      }
    } catch (error) {
      console.error(error);
      requireLogin();
    }
  } 

  // Initial Fetch & Live Polling Maintained
  fetchOrders(); 
  setInterval(fetchOrders, 10000); 

  // Interactive Frontend Features
  
  // Search
  document.getElementById('order-search').addEventListener('input', (e) => {
    currentSearch = e.target.value;
    renderOrders();
  });

  // Filter Chips
  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', (e) => {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      e.target.classList.add('active');
      currentFilter = e.target.getAttribute('data-filter');
      renderOrders();
    });
  });

  // Swipe Gestures Logic
  let startX = 0;
  let currentCard = null;

  document.addEventListener('touchstart', e => {
    const card = e.target.closest('.past-card');
    if (card) { startX = e.touches[0].clientX; currentCard = card; }
  }, { passive: true });

  document.addEventListener('touchmove', e => {
    if (!currentCard) return;
    const currentX = e.touches[0].clientX;
    const diff = startX - currentX;
    if (diff > 40) currentCard.classList.add('swiped');
    else if (diff < -40) currentCard.classList.remove('swiped');
  }, { passive: true });

  document.addEventListener('touchend', () => { currentCard = null; });

  // Pull to Refresh Logic
  let touchStartPtr = 0;
  const ptrIndicator = document.getElementById('ptr-indicator');
  
  window.addEventListener('touchstart', e => {
    if (window.scrollY === 0) touchStartPtr = e.touches[0].clientY;
  }, { passive: true });

  window.addEventListener('touchmove', e => {
    if (window.scrollY === 0 && touchStartPtr > 0) {
      const diff = e.touches[0].clientY - touchStartPtr;
      if (diff > 0 && diff < 80) {
        ptrIndicator.style.height = `${diff}px`;
      }
    }
  }, { passive: true });

  window.addEventListener('touchend', e => {
    if (parseInt(ptrIndicator.style.height) > 50) {
      ptrIndicator.classList.add('ptr-spinning');
      ptrIndicator.style.height = '60px';
      fetchOrders().then(() => {
        ptrIndicator.style.height = '0';
        setTimeout(() => ptrIndicator.classList.remove('ptr-spinning'), 300);
      });
    } else {
      ptrIndicator.style.height = '0';
    }
    touchStartPtr = 0;
  });

});
</script>
</body>
</html>
