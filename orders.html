<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F7F7F9">
<title>My Orders – Nearbite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
/* ============================================================
   NEARBITE · ORDERS — 2026 PREMIUM DESIGN SYSTEM
   ============================================================ */
:root{
  --brand:#FC8019; --brand-dark:#E06B12; --brand-darker:#C85F0E;
  --brand-50:#FFF4E9; --brand-100:#FFE8D1;
  --ink-900:#14171F; --ink-800:#1F232C; --ink-700:#3A3F4B; --ink-500:#6B7280;
  --ink-400:#9AA1AC; --ink-300:#C9CDD4; --ink-200:#E4E6EA;
  --line:#ECEDF1; --paper:#F7F7F9; --card:#FFFFFF;
  --success:#16A673; --success-bg:#E8F8F1;
  --danger:#E5484D; --danger-bg:#FDECEC;
  --info:#2F6FEB; --info-bg:#EAF1FE;
  --amber:#D97706; --amber-bg:#FFF7E6;
  --violet:#6D5BD0; --violet-bg:#EFEBFC;
  --glass:rgba(247,247,249,0.82);
  --shadow-xs:0 1px 2px rgba(20,23,31,.05);
  --shadow-sm:0 2px 10px rgba(20,23,31,.06);
  --shadow-md:0 10px 28px rgba(20,23,31,.09);
  --shadow-brand:0 10px 24px rgba(252,128,25,.28);
  --r-xl:24px; --r-lg:18px; --r-md:14px; --r-sm:10px;
  --ease-out:cubic-bezier(.16,1,.3,1); --ease:cubic-bezier(.4,0,.2,1);
}
*,*::before,*::after{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  font-family:var(--font-sans),sans-serif;
  background:var(--paper); color:var(--ink-900); margin:0;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:contain;
  line-height:1.45;
}
button{font-family:inherit;}
img{max-width:100%;display:block;}
.tap{transition:transform .16s var(--ease-out),opacity .16s var(--ease-out);cursor:pointer;}
.tap:active{transform:scale(.95);opacity:.85;}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px;}

@keyframes fadeSlideUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes floatY{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
@keyframes pulseDot{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.5);opacity:.45;}}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes shimmer{0%{background-position:-600px 0;}100%{background-position:600px 0;}}
@keyframes ripple{to{transform:scale(2.6);opacity:0;}}
@keyframes popIn{0%{transform:scale(.85);opacity:0;}100%{transform:scale(1);opacity:1;}}
@keyframes sparkleFloat{0%,100%{transform:translateY(0) scale(1);opacity:.7;}50%{transform:translateY(-10px) scale(1.15);opacity:1;}}

/* settle: entrance animation plays once, not on every 10s poll refresh */
.order-card{animation:fadeSlideUp .45s var(--ease-out) both;}
.order-card:nth-of-type(2){animation-delay:.04s;}
.order-card:nth-of-type(3){animation-delay:.08s;}
.order-card:nth-of-type(4){animation-delay:.12s;}
.settled .order-card{animation:none;}

/* ---------- Pull to refresh ---------- */
#ptr-indicator{
  height:0; overflow:hidden; display:flex; align-items:center; justify-content:center;
  transition:height .3s var(--ease); color:var(--brand);
}
.ptr-ring{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--brand-100);border-top-color:var(--brand);}
.ptr-spinning .ptr-ring{animation:spin .7s linear infinite;}

/* ---------- Header ---------- */
.orders-header{
  position:sticky; top:0; z-index:40;
  background:var(--glass); backdrop-filter:blur(20px) saturate(1.6); -webkit-backdrop-filter:blur(20px) saturate(1.6);
  border-bottom:1px solid var(--line);
  padding:calc(12px + env(safe-area-inset-top)) 18px 14px;
  display:flex; flex-direction:column; gap:12px;
}
.header-top{display:flex; align-items:center; gap:12px;}
.header-back-btn{
  width:38px;height:38px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  border-radius:50%;background:var(--card);border:1px solid var(--line);color:var(--ink-700);font-size:14px;
  box-shadow:var(--shadow-xs);
}
.header-titles{flex:1; min-width:0;}
.header-greeting{font-size:12px;font-weight:700;color:var(--ink-500);letter-spacing:.2px;margin-bottom:1px;}
.header-titles h1{font-size:22px;font-weight:900;color:var(--ink-900);margin:0;letter-spacing:-.4px;}
.header-stats{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--ink-500);}
.header-stats .sep{width:3px;height:3px;border-radius:50%;background:var(--ink-300);}
.stat-live{display:inline-flex;align-items:center;gap:5px;color:var(--brand);}
.pulse-dot-sm{width:6px;height:6px;border-radius:50%;background:var(--brand);animation:pulseDot 1.6s ease-in-out infinite;}

.search-bar{
  display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line);
  border-radius:16px; padding:11px 14px; box-shadow:var(--shadow-xs);
}
.search-bar i.fa-magnifying-glass{color:var(--ink-400);font-size:14px;}
.search-bar input{
  border:none;background:transparent;outline:none;width:100%;font-family:inherit;
  font-size:14px;font-weight:600;color:var(--ink-900);
}
.search-bar input::placeholder{color:var(--ink-400);font-weight:500;}
.search-clear{
  display:none;width:20px;height:20px;border-radius:50%;background:var(--ink-200);color:var(--ink-700);
  align-items:center;justify-content:center;font-size:10px;flex-shrink:0;
}
.search-bar.has-value .search-clear{display:flex;}

.filter-chips{position:relative;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 4px;}
.filter-chips::-webkit-scrollbar{display:none;}
.chip{
  position:relative;z-index:2;background:transparent;color:var(--ink-500);padding:8px 15px;border-radius:999px;
  font-size:12.5px;font-weight:700;white-space:nowrap;transition:color .35s var(--ease);
}
.chip.active{color:var(--brand-darker);}
.chip::after{content:attr(data-count);margin-left:5px;font-size:10px;opacity:.75;}
.chip[data-count=""]::after,.chip:not([data-count])::after{content:"";margin:0;}
.chip-indicator{
  position:absolute; z-index:1; top:2px; height:calc(100% - 6px); left:0; width:0;
  background:var(--brand-50); border:1px solid rgba(252,128,25,.35); border-radius:999px;
  box-shadow:0 2px 8px rgba(252,128,25,.12);
  transition:transform .35s var(--ease-out), width .35s var(--ease-out);
}

.orders-content{padding:18px 16px 0;max-width:640px;margin:0 auto;}

/* ---------- Section titles ---------- */
.section-title{
  display:flex;align-items:center;justify-content:space-between;margin:6px 2px 14px;
}
.section-title .st-left{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:900;color:var(--ink-900);text-transform:uppercase;letter-spacing:.4px;}
.section-title .st-count{font-size:11px;font-weight:700;color:var(--ink-400);text-transform:none;letter-spacing:0;}

/* ---------- Cards ---------- */
.order-card{background:var(--card);border-radius:var(--r-xl);box-shadow:var(--shadow-sm);position:relative;margin-bottom:16px;}

/* ---------- Live tracking card ---------- */
.track-card{border:1px solid var(--line);overflow:hidden;display:block;text-decoration:none;padding:0;}
.track-cover{position:relative;height:112px;background:linear-gradient(135deg,#FFE8D1,#FFF4E9);overflow:hidden;}
.track-cover img{width:100%;height:100%;object-fit:cover;}
.track-cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(15,17,22,.55) 100%);}
.live-flag{
  position:absolute;top:10px;left:12px;z-index:2;display:flex;align-items:center;gap:5px;
  background:rgba(20,23,31,.55);backdrop-filter:blur(6px);color:#fff;font-size:10px;font-weight:800;
  padding:5px 9px 5px 7px;border-radius:999px;letter-spacing:.4px;text-transform:uppercase;
}
.live-flag .dot{width:6px;height:6px;border-radius:50%;background:#4ADE80;animation:pulseDot 1.4s ease-in-out infinite;}
.eta-flag{
  position:absolute;top:10px;right:12px;z-index:2;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);
  padding:5px 10px;border-radius:12px;text-align:center;box-shadow:var(--shadow-xs);
}
.eta-flag span{display:block;font-size:8.5px;font-weight:800;color:var(--ink-500);text-transform:uppercase;letter-spacing:.4px;}
.eta-flag strong{font-size:13px;font-weight:900;color:var(--ink-900);font-variant-numeric:tabular-nums;}
.cover-caption{position:absolute;bottom:10px;left:74px;right:12px;z-index:2;color:#fff;}
.cover-caption h3{font-size:16px;font-weight:800;margin:0 0 1px;text-shadow:0 1px 4px rgba(0,0,0,.25);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cover-caption p{font-size:11.5px;font-weight:600;margin:0;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.track-logo{
  position:absolute;left:14px;top:84px;z-index:3;width:56px;height:56px;border-radius:16px;
  background:var(--card);border:3px solid var(--card);box-shadow:var(--shadow-sm);object-fit:cover;
  display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:var(--brand);overflow:hidden;
}
.track-logo img{width:100%;height:100%;object-fit:cover;}
.track-body{padding:32px 16px 16px;}

.status-alert{
  display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:800;padding:7px 12px 7px 10px;
  border-radius:11px;margin-bottom:14px;
}
.status-alert i{font-size:12px;}
.status-alert.preparing{background:var(--amber-bg);color:var(--amber);}
.status-alert.dispatch{background:var(--info-bg);color:var(--info);}
.status-alert.arriving{background:var(--success-bg);color:var(--success);}

.mini-progress{margin-bottom:14px;}
.mini-track{position:relative;height:5px;background:var(--ink-200);border-radius:999px;overflow:hidden;margin-bottom:9px;}
.mini-fill{
  position:absolute;top:0;left:0;height:100%;width:100%;transform-origin:left;transform:scaleX(0);
  background:linear-gradient(90deg,var(--brand),#FFA858);border-radius:999px;
  transition:transform .8s var(--ease-out);
}
.mini-labels{display:flex;justify-content:space-between;}
.mini-labels span{font-size:9.5px;font-weight:800;color:var(--ink-300);letter-spacing:.2px;}
.mini-labels span.on{color:var(--brand-darker);}

.order-line-row{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink-700);margin-bottom:8px;}
.order-line-row i{color:var(--ink-400);font-size:12px;width:14px;text-align:center;}
.order-line-row .extra-tag{color:var(--ink-400);font-weight:700;}
.item-thumb{
  display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;
  background:var(--brand-50);color:var(--brand);font-size:11px;font-weight:800;vertical-align:middle;
  margin-right:6px;overflow:hidden;flex-shrink:0;
}
.item-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.addr-row{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;color:var(--ink-500);font-weight:600;margin-bottom:16px;padding-bottom:14px;border-bottom:1px dashed var(--line);}
.addr-row i{color:var(--ink-400);font-size:12px;width:14px;text-align:center;margin-top:1px;}
.addr-row span{overflow:hidden;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;}

.track-actions{display:flex;gap:8px;}
.track-btn{
  flex:1;background:var(--brand);color:#fff;font-family:inherit;font-size:14px;font-weight:800;
  padding:13px;border-radius:14px;border:none;display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:var(--shadow-brand);position:relative;overflow:hidden;
}
.icon-btn{
  width:46px;height:46px;flex-shrink:0;border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-size:15px;border:1px solid var(--line);background:var(--card);color:var(--ink-700);
}
.icon-btn.call{background:var(--success-bg);color:var(--success);border-color:transparent;}

/* ---------- Past order cards ---------- */
.swipe-container{position:relative;border-radius:var(--r-xl);margin-bottom:16px;overflow:hidden;content-visibility:auto;contain-intrinsic-size:260px;}
.swipe-actions{
  position:absolute;inset:0;display:flex;justify-content:flex-end;align-items:center;
  background:var(--ink-900);border-radius:var(--r-xl);padding:0 16px;gap:10px;z-index:1;
}
.swipe-btn{
  width:48px;height:48px;border-radius:14px;border:none;display:flex;flex-direction:column;gap:2px;
  align-items:center;justify-content:center;font-size:15px;color:#fff;flex-shrink:0;
}
.swipe-btn span{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;}
.btn-support{background:#3B7DF6;}
.btn-invoice{background:#586274;}
.btn-delete{background:var(--danger);}

.past-card{position:relative;z-index:2;border:1px solid var(--line);margin-bottom:0;padding:16px;transition:transform .32s var(--ease-out);touch-action:pan-y;background:var(--card);}
.past-card.swiped{transform:translateX(-128px);}
.past-card.swiped.has-delete{transform:translateX(-186px);}

.past-header{display:flex;gap:12px;align-items:flex-start;padding-bottom:13px;margin-bottom:13px;border-bottom:1px dashed var(--line);}
.past-thumb{
  width:52px;height:52px;border-radius:14px;object-fit:cover;flex-shrink:0;background:var(--brand-50);
  display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800;color:var(--brand);overflow:hidden;
}
.past-thumb img{width:100%;height:100%;object-fit:cover;}
.past-title-wrap{flex:1;min-width:0;}
.past-title-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.past-title-wrap h4{font-size:15px;font-weight:800;color:var(--ink-900);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.past-cuisine{font-size:11.5px;color:var(--ink-400);font-weight:600;margin-top:1px;}
.past-date{font-size:11px;color:var(--ink-400);font-weight:600;margin-top:3px;}

.badge{font-size:9.5px;font-weight:800;padding:4px 9px;border-radius:8px;text-transform:uppercase;letter-spacing:.4px;flex-shrink:0;}
.badge.delivered{background:var(--success-bg);color:var(--success);}
.badge.cancelled{background:var(--danger-bg);color:var(--danger);}
.badge.refunded{background:var(--violet-bg);color:var(--violet);}

.past-items{font-size:13px;font-weight:600;color:var(--ink-700);margin:0 0 14px;line-height:1.55;}
.extra-items{color:var(--ink-400);font-size:11.5px;font-weight:700;}

.past-footer{display:flex;flex-direction:column;gap:12px;}
.footer-row{display:flex;justify-content:space-between;align-items:center;}
.pay-chip{font-size:11px;font-weight:700;color:var(--ink-500);background:var(--paper);padding:4px 10px;border-radius:8px;}
.past-total{font-size:16.5px;font-weight:900;color:var(--ink-900);font-variant-numeric:tabular-nums;}

.action-buttons{display:flex;gap:8px;}
.action-buttons button{flex:1;padding:11px;border-radius:12px;font-family:inherit;font-size:12.5px;font-weight:800;border:none;position:relative;overflow:hidden;}
.btn-reorder{background:var(--brand);color:#fff;box-shadow:0 6px 14px rgba(252,128,25,.22);}
.btn-details{background:var(--paper);color:var(--ink-700);border:1px solid var(--line);}
.ghost-row{display:flex;gap:4px;border-top:1px solid var(--line);margin-top:2px;padding-top:10px;}
.ghost-btn{
  flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:none;border:none;
  font-family:inherit;font-size:11.5px;font-weight:700;color:var(--ink-500);padding:8px 4px;border-radius:10px;
}
.ghost-btn i{font-size:12px;}
.ghost-btn.rate{color:var(--amber);}

/* ---------- Empty state ---------- */
#empty-orders{display:none;}
.empty-card{background:var(--card);border-radius:var(--r-xl);padding:52px 24px 40px;box-shadow:var(--shadow-sm);text-align:center;position:relative;overflow:hidden;}
.empty-illustration{width:120px;height:120px;margin:0 auto 22px;position:relative;animation:floatY 3.2s ease-in-out infinite;}
.empty-illustration .spark{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--brand-100);animation:sparkleFloat 2.4s ease-in-out infinite;}
.empty-illustration .spark.s1{top:6px;right:14px;animation-delay:0s;}
.empty-illustration .spark.s2{top:36px;left:2px;animation-delay:.6s;background:var(--brand);}
.empty-illustration .spark.s3{bottom:14px;right:0;animation-delay:1.1s;}
.empty-card h4{font-size:18px;font-weight:900;color:var(--ink-900);margin:0 0 6px;}
.empty-card p{font-size:13.5px;color:var(--ink-500);font-weight:600;margin:0 0 28px;line-height:1.6;}
.explore-btn{
  background:var(--brand);color:#fff;font-family:inherit;font-size:14.5px;font-weight:800;
  padding:15px 30px;border-radius:14px;border:none;box-shadow:var(--shadow-brand);width:100%;max-width:280px;
}

/* ---------- Skeleton ---------- */
.sk-wrapper{display:flex;flex-direction:column;gap:16px;}
.sk{background:linear-gradient(90deg,#ECEDF1 25%,#F5F5F7 50%,#ECEDF1 75%);background-size:1200px 100%;animation:shimmer 1.5s infinite linear;border-radius:10px;}
.sk-card{background:var(--card);border-radius:var(--r-xl);box-shadow:var(--shadow-sm);border:1px solid var(--line);overflow:hidden;}
.sk-cover{height:112px;border-radius:0;}
.sk-body{padding:32px 16px 16px;position:relative;}
.sk-avatar{position:absolute;top:-24px;left:14px;width:56px;height:56px;border-radius:16px;border:3px solid var(--card);}
.sk-text-1{height:15px;width:55%;margin-bottom:9px;}
.sk-text-2{height:11px;width:35%;margin-bottom:16px;}
.sk-box{height:38px;width:100%;margin-bottom:10px;}
.sk-line{height:11px;width:100%;margin-bottom:8px;}

/* ---------- Load more / sentinel ---------- */
.load-more-wrap{display:flex;justify-content:center;padding:6px 0 20px;}
.load-more-btn{
  background:var(--card);border:1px solid var(--line);color:var(--ink-700);font-family:inherit;font-weight:800;
  font-size:13px;padding:11px 22px;border-radius:12px;box-shadow:var(--shadow-xs);display:flex;align-items:center;gap:8px;
}
#scroll-sentinel{height:1px;}

/* ---------- Bottom nav ---------- */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;height:66px;background:var(--glass);backdrop-filter:blur(16px);
  border-top:1px solid var(--line);display:flex;align-items:stretch;box-shadow:0 -6px 24px rgba(20,23,31,.06);
  z-index:100;padding-bottom:env(safe-area-inset-bottom);
}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px;font-weight:700;color:var(--ink-400);text-decoration:none;position:relative;}
.nav-item svg{width:23px;height:23px;transition:transform .2s var(--ease-out);}
.nav-item:active svg{transform:scale(.88);}
.nav-new-badge{position:absolute;top:6px;right:calc(50% - 24px);background:var(--danger);color:#fff;font-size:8px;font-weight:900;padding:2px 6px;border-radius:999px;box-shadow:0 2px 5px rgba(229,72,77,.35);}
</style>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="ptr-indicator"><div class="ptr-ring"></div></div>

<header class="orders-header">
  <div class="header-top">
    <button onclick="window.nearbiteSafeBack()" class="header-back-btn tap" aria-label="Go back"><i class="fa-solid fa-arrow-left"></i></button>
    <div class="header-titles">
      <div class="header-greeting" id="header-greeting">Good day 👋</div>
      <h1>My Orders</h1>
    </div>
  </div>

  <div class="header-stats">
    <span id="stat-total">0 orders</span>
    <span class="sep"></span>
    <span class="stat-live" id="stat-live" style="display:none;"><span class="pulse-dot-sm"></span><span id="stat-live-text">0 live</span></span>
  </div>

  <div class="search-bar" id="search-bar">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input type="text" id="order-search" placeholder="Search restaurant, item, or Order ID">
    <div class="search-clear tap" id="search-clear"><i class="fa-solid fa-xmark"></i></div>
  </div>

  <div class="filter-chips" id="filter-chips">
    <div class="chip-indicator" id="chip-indicator"></div>
    <div class="chip active tap" data-filter="all">All</div>
    <div class="chip tap" data-filter="active">Active</div>
    <div class="chip tap" data-filter="delivered">Delivered</div>
    <div class="chip tap" data-filter="cancelled">Cancelled</div>
    <div class="chip tap" data-filter="refunded">Refunded</div>
  </div>
</header>

<div class="orders-content">

  <div id="loading-state" class="sk-wrapper">
    <div class="sk-card"><div class="sk sk-cover"></div><div class="sk-body"><div class="sk sk-avatar"></div><div class="sk sk-text-1"></div><div class="sk sk-text-2"></div><div class="sk sk-box"></div></div></div>
    <div class="sk-card" style="border-radius:24px;"><div style="padding:16px;"><div style="display:flex;gap:12px;margin-bottom:16px;"><div class="sk" style="width:52px;height:52px;border-radius:14px;flex-shrink:0;"></div><div style="flex:1;"><div class="sk sk-text-1"></div><div class="sk sk-text-2" style="margin-bottom:0;"></div></div></div><div class="sk sk-line"></div><div class="sk sk-line" style="width:70%;"></div></div></div>
  </div>

  <div id="live-orders-container"></div>
  <div id="past-orders-container"></div>
  <div id="load-more-wrap" class="load-more-wrap" style="display:none;">
    <button class="load-more-btn tap" id="load-more-btn"><i class="fa-solid fa-chevron-down"></i> Load more orders</button>
  </div>
  <div id="scroll-sentinel"></div>

  <div id="empty-orders">
    <div class="empty-card">
      <div class="empty-illustration">
        <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="60" cy="103" rx="34" ry="7" fill="#FC8019" opacity="0.08"/>
          <path d="M32 46 L36 30 C37 26 40 24 44 24 L76 24 C80 24 83 26 84 30 L88 46 Z" fill="#FFE8D1"/>
          <rect x="28" y="46" width="64" height="46" rx="12" fill="#FC8019"/>
          <rect x="28" y="46" width="64" height="14" rx="7" fill="#E06B12"/>
          <circle cx="60" cy="72" r="12" fill="#FFF4E9"/>
          <path d="M55 72 L58.5 76 L66 68" stroke="#FC8019" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="spark s1"></span><span class="spark s2"></span><span class="spark s3"></span>
      </div>
      <h4 id="empty-title">No orders found</h4>
      <p id="empty-desc">Looks like you haven't placed<br>any orders yet.</p>
      <button id="empty-btn" class="explore-btn tap">Explore Restaurants</button>
    </div>
  </div>

</div>

<nav class="bottom-nav">
  <a href="index.html" class="nav-item" style="color:var(--ink-400);">
    <svg fill="currentColor" viewBox="0 0 24 24"><path d="M18.06 22.99h1.66c.84 0 1.53-.64 1.63-1.46L23 5.05h-5V1h-1.97v4.05h-4.97l.3 2.34c1.71.47 3.31 1.32 4.27 2.26 1.44 1.42 2.43 2.89 2.43 5.29v8.05zM1 21.99V21h15.03v.99c0 .55-.45 1-1.01 1H2.01c-.56 0-1.01-.45-1.01-1zm15.03-7c0-5.87-11.31-7.95-15.03-3.89V21h15.03v-6.01z"/></svg>
    <span>Food</span>
  </a>
  <a href="under99.html" class="nav-item" style="color:var(--ink-400);">
    <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/></svg>
    <span>99 store</span>
  </a>
  <a href="orders.html" class="nav-item" style="color:var(--brand);position:relative;">
    <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
    <span>Orders</span>
    <span class="nav-new-badge">NEW</span>
  </a>
</nav>

<script>
document.addEventListener('DOMContentLoaded', () => {
  let token = localStorage.getItem('nearbite_token') || localStorage.getItem('token');
  if (token === 'undefined' || token === 'null') token = null;

  const loader = document.getElementById('loading-state');
  const liveContainer = document.getElementById('live-orders-container');
  const pastContainer = document.getElementById('past-orders-container');
  const emptyState = document.getElementById('empty-orders');
  const loadMoreWrap = document.getElementById('load-more-wrap');
  const loadMoreBtn = document.getElementById('load-more-btn');
  const sentinel = document.getElementById('scroll-sentinel');

  let allOrdersData = [];
  let currentSearch = '';
  let currentFilter = 'all';
  let hasRenderedOnce = false;

  // Infinite-scroll state for Past Orders (all data is already fetched; we
  // simply paginate the render so long histories don't paint hundreds of DOM nodes at once)
  const PAGE_SIZE = 6;
  let pastRenderLimit = PAGE_SIZE;
  let lastSearchKey = null;

  // Client-side "hide from device" for cancelled orders (Delete swipe action).
  // We never call the backend to delete — cancelled orders remain in the
  // account's history server-side, this only removes the card from view here.
  const HIDDEN_KEY = 'nb_hidden_orders';
  const getHidden = () => { try { return JSON.parse(localStorage.getItem(HIDDEN_KEY) || '[]'); } catch(e){ return []; } };
  const hideOrderLocally = (id) => {
    const set = new Set(getHidden()); set.add(id);
    localStorage.setItem(HIDDEN_KEY, JSON.stringify([...set]));
  };

  // Constants to preserve exact backend mappings
  const liveStatuses = ['placed', 'confirmed', 'pending', 'preparing', 'waiting_for_rider', 'assigned', 'out_for_delivery', 'otp_verified'];

  const requireLogin = () => {
    loader.style.display = 'none';
    liveContainer.innerHTML = '';
    pastContainer.innerHTML = '';
    loadMoreWrap.style.display = 'none';
    emptyState.style.display = 'block';
    document.getElementById('empty-title').innerText = "Please log in";
    document.getElementById('empty-desc').innerHTML = `Log in to view your premium orders.`;
    const btn = document.getElementById('empty-btn');
    btn.innerText = "LOGIN NOW";
    btn.onclick = () => {
        localStorage.clear();
        window.location.href = 'login.html';
    };
  };

  if (!token) return requireLogin();

  // Default empty-state action (was previously a dead button with no handler)
  document.getElementById('empty-btn').onclick = () => { window.location.href = 'index.html'; };

  // Time-based greeting — purely cosmetic, computed client-side
  (() => {
    const h = new Date().getHours();
    const text = h < 5 ? 'Late night cravings? 🌙' : h < 12 ? 'Good morning 👋' : h < 17 ? 'Good afternoon 👋' : h < 21 ? 'Good evening 👋' : 'Good night 🌙';
    document.getElementById('header-greeting').innerText = text;
  })();

  // Formatting Helper — shows the item's actual menu image (returned by
  // the API, live where available). Falls back to an initials badge if no
  // image exists for that item; never an emoji, never a stand-in photo.
  const formatItemsDisplay = (items) => {
    if (!items || items.length === 0) return '';
    const first = items[0];
    const thumb = first.image
      ? `<span class="item-thumb"><img src="${first.image}" loading="lazy" alt=""></span>`
      : `<span class="item-thumb">${initials(first.name)}</span>`;
    let html = `${thumb}${first.name} ×${first.quantity}`;
    if (items.length > 1) {
      html += `<br><span class="extra-items">+${items.length - 1} more item${items.length > 2 ? 's' : ''}</span>`;
    }
    return html;
  };

  const initials = (name) => (name ? name.charAt(0).toUpperCase() : 'E');

  const logoHtml = (order, cls) => order.restaurantImage
    ? `<img src="${order.restaurantImage}" class="${cls}" loading="lazy" alt="${order.restaurantName || 'Restaurant'}">`
    : `<div class="${cls}">${initials(order.restaurantName)}</div>`;

  // Reuses the exact same defensive address-parsing rules as track-order.html
  const getDeliveryAddressText = (order) => {
    if (!order) return '';
    if (typeof order.deliveryAddress === 'string' && order.deliveryAddress.trim()) return order.deliveryAddress.trim();
    if (order.deliveryAddress && typeof order.deliveryAddress === 'object') {
      return order.deliveryAddress.formatted || order.deliveryAddress.fullAddress || order.deliveryAddress.addressLine || order.deliveryAddress.line1 || '';
    }
    if (typeof order.address === 'string' && order.address.trim()) return order.address.trim();
    return '';
  };

  const minutesRemaining = (order) => {
    if (!order.estimatedDelivery) return null;
    const diffMs = new Date(order.estimatedDelivery) - Date.now();
    return Math.max(1, Math.round(diffMs / 60000));
  };

  function renderLiveSection(liveOrders) {
    if (liveOrders.length === 0) { liveContainer.innerHTML = ''; return; }

    liveContainer.innerHTML = `
      <div class="section-title">
        <div class="st-left">Live Orders <span class="pulse-dot-sm"></span></div>
        <div class="st-count">${liveOrders.length} active</div>
      </div>` + liveOrders.map(order => {
      let width = 0.1; let active1 = 'on', active2 = '', active3 = '', active4 = '';
      let statusTitle = 'Order Received'; let alertClass = ''; let statusIcon = 'fa-receipt';
      const status = order.status.toLowerCase();

      if (status === 'preparing') { width = 0.35; active2 = 'on'; statusTitle = 'Preparing your food'; alertClass = 'preparing'; statusIcon = 'fa-fire-burner'; }
      if (['waiting_for_rider', 'assigned'].includes(status)) { width = 0.6; active2 = 'on'; active3 = 'on'; statusTitle = status === 'assigned' ? 'Rider assigned' : 'Finding a rider'; alertClass = 'dispatch'; statusIcon = 'fa-motorcycle'; }
      if (['out_for_delivery', 'otp_verified'].includes(status)) { width = 0.88; active2 = 'on'; active3 = 'on'; active4 = 'on'; statusTitle = 'Arriving soon!'; alertClass = 'arriving'; statusIcon = 'fa-location-arrow'; }

      const mins = minutesRemaining(order);
      const etaText = mins !== null ? mins : '—';
      const addr = getDeliveryAddressText(order);
      const canCall = !!(order.rider && order.rider.phone);
      const itemsHtml = formatItemsDisplay(order.items);

      return `
        <div class="order-card track-card">
          <a href="track-order.html?id=${order._id}" style="text-decoration:none;color:inherit;display:block;">
            <div class="track-cover">
              ${order.restaurantImage ? `<img src="${order.restaurantImage}" loading="lazy" alt="">` : ''}
              <div class="live-flag"><span class="dot"></span>Live</div>
              <div class="eta-flag"><span>ETA</span><strong>${etaText}${mins !== null ? 'm' : ''}</strong></div>
              <div class="cover-caption"><h3>${order.restaurantName || "EatSwada Partner"}</h3><p>Order #${order._id.substring(0,6).toUpperCase()}</p></div>
            </div>
            ${logoHtml(order, 'track-logo')}
            <div class="track-body">
              <div class="status-alert ${alertClass}"><i class="fa-solid ${statusIcon}"></i> ${statusTitle}</div>
              <div class="mini-progress">
                <div class="mini-track"><div class="mini-fill" style="transform:scaleX(${width});"></div></div>
                <div class="mini-labels">
                  <span class="${active1}">Received</span><span class="${active2}">Preparing</span>
                  <span class="${active3}">Dispatch</span><span class="${active4}">Arriving</span>
                </div>
              </div>
              ${itemsHtml ? `<div class="order-line-row"><i class="fa-solid fa-bag-shopping"></i><span>${itemsHtml.replace('<br>',' ')}</span></div>` : ''}
              ${addr ? `<div class="addr-row"><i class="fa-solid fa-location-dot"></i><span>${addr}</span></div>` : ''}
            </div>
          </a>
          <div style="padding:0 16px 16px;display:flex;gap:8px;">
            <button class="track-btn tap" onclick="window.location.href='track-order.html?id=${order._id}'">Track Order <i class="fa-solid fa-location-arrow"></i></button>
            ${canCall ? `<a href="tel:${order.rider.phone}" class="icon-btn call tap" aria-label="Call rider"><i class="fa-solid fa-phone"></i></a>` : ''}
            <button class="icon-btn tap" aria-label="Support" onclick="window.location.href='support.html?order=${order._id}'"><i class="fa-solid fa-headset"></i></button>
          </div>
        </div>
      `;
    }).join('');
  }

  function renderPastSection(pastOrders) {
    if (pastOrders.length === 0) { pastContainer.innerHTML = ''; loadMoreWrap.style.display = 'none'; return; }

    const visible = pastOrders.slice(0, pastRenderLimit);

    pastContainer.innerHTML = `
      <div class="section-title" style="margin-top:${document.getElementById('live-orders-container').innerHTML ? '24px' : '0'}">
        <div class="st-left">Past Orders</div>
        <div class="st-count">${pastOrders.length} total</div>
      </div>` + visible.map(order => {
      const dateStr = new Date(order.createdAt).toLocaleString('en-IN', { month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit' });
      const itemsHtml = formatItemsDisplay(order.items);
      const statusLower = order.status.toLowerCase();
      const isDelivered = statusLower === 'delivered';
      const isRefunded = statusLower === 'refunded';
      const badgeClass = isDelivered ? 'delivered' : (isRefunded ? 'refunded' : 'cancelled');
      const isCancelled = statusLower === 'cancelled';
      const payLabel = order.paymentStatus === 'paid' ? 'Paid Online' : 'COD';
      const cuisine = order.cuisine || order.restaurantCuisine || '';

      return `
        <div class="swipe-container">
          <div class="swipe-actions">
            <button class="swipe-btn btn-invoice tap" onclick="window.location.href='track-order.html?id=${order._id}'"><i class="fa-solid fa-receipt"></i><span>Invoice</span></button>
            <button class="swipe-btn btn-support tap" onclick="window.location.href='support.html?order=${order._id}'"><i class="fa-solid fa-headset"></i><span>Help</span></button>
            ${isCancelled ? `<button class="swipe-btn btn-delete tap" onclick="deleteCancelledOrder('${order._id}')"><i class="fa-solid fa-trash"></i><span>Remove</span></button>` : ''}
          </div>
          <div class="order-card past-card ${isCancelled ? 'has-delete' : ''}" data-order-id="${order._id}">
            <div class="past-header">
              ${logoHtml(order, 'past-thumb')}
              <div class="past-title-wrap">
                <div class="past-title-row">
                  <h4>${order.restaurantName || "EatSwada Partner"}</h4>
                  <span class="badge ${badgeClass}">${order.status}</span>
                </div>
                ${cuisine ? `<div class="past-cuisine">${cuisine}</div>` : ''}
                <div class="past-date">${dateStr}</div>
              </div>
            </div>
            <p class="past-items">${itemsHtml}</p>
            <div class="past-footer">
              <div class="footer-row">
                <span class="pay-chip">${payLabel}</span>
                <span class="past-total">₹${order.total}</span>
              </div>
              <div class="action-buttons">
                <button class="btn-reorder tap" onclick="window.location.href='index.html'">Order Again</button>
                <button class="btn-details tap" onclick="window.location.href='track-order.html?id=${order._id}'">View Details</button>
              </div>
              <div class="ghost-row">
                <button class="ghost-btn tap" onclick="window.location.href='track-order.html?id=${order._id}'"><i class="fa-solid fa-file-lines"></i>Invoice</button>
                ${isDelivered ? `<button class="ghost-btn rate tap" onclick="window.location.href='track-order.html?id=${order._id}#rate'"><i class="fa-solid fa-star"></i>Rate</button>` : ''}
                <button class="ghost-btn tap" onclick="window.location.href='support.html?order=${order._id}'"><i class="fa-solid fa-circle-question"></i>Need Help</button>
              </div>
            </div>
          </div>
        </div>
      `;
    }).join('');

    if (pastOrders.length > pastRenderLimit) {
      loadMoreWrap.style.display = 'flex';
    } else {
      loadMoreWrap.style.display = 'none';
    }
  }

  window.deleteCancelledOrder = (id) => {
    hideOrderLocally(id);
    renderOrders();
  };

  const updateChipCounts = () => {
    const hidden = new Set(getHidden());
    const visible = allOrdersData.filter(o => !hidden.has(o._id));
    const counts = { all: visible.length, active: 0, delivered: 0, cancelled: 0, refunded: 0 };
    visible.forEach(o => {
      const s = o.status.toLowerCase();
      if (liveStatuses.includes(s)) counts.active++;
      else if (counts[s] !== undefined) counts[s]++;
    });
    document.querySelectorAll('.chip').forEach(chip => {
      const key = chip.getAttribute('data-filter');
      const n = counts[key] || 0;
      chip.setAttribute('data-count', n > 0 ? n : '');
    });
    document.getElementById('stat-total').innerText = `${visible.length} order${visible.length === 1 ? '' : 's'}`;
    const liveStat = document.getElementById('stat-live');
    if (counts.active > 0) {
      liveStat.style.display = 'inline-flex';
      document.getElementById('stat-live-text').innerText = `${counts.active} live`;
    } else {
      liveStat.style.display = 'none';
    }
  };

  const moveChipIndicator = () => {
    const active = document.querySelector('.chip.active');
    const indicator = document.getElementById('chip-indicator');
    if (!active || !indicator) return;
    indicator.style.transform = `translateX(${active.offsetLeft - 2}px)`;
    indicator.style.width = `${active.offsetWidth}px`;
  };

  const renderOrders = () => {
    const hidden = new Set(getHidden());
    let filteredOrders = allOrdersData.filter(o => !hidden.has(o._id));

    // Search Filtering
    if (currentSearch) {
      const q = currentSearch.toLowerCase();
      filteredOrders = filteredOrders.filter(o =>
        (o.restaurantName && o.restaurantName.toLowerCase().includes(q)) ||
        (o._id && o._id.toLowerCase().includes(q)) ||
        (o.items && o.items.some(i => i.name.toLowerCase().includes(q)))
      );
    }

    // Chip Filtering
    if (currentFilter !== 'all') {
      if (currentFilter === 'active') filteredOrders = filteredOrders.filter(o => liveStatuses.includes(o.status.toLowerCase()));
      else filteredOrders = filteredOrders.filter(o => o.status.toLowerCase() === currentFilter);
    }

    // Reset the infinite-scroll page only when the result *set* changes (new search/filter),
    // not on every 10s poll refresh — otherwise a scrolled-down user would keep getting bumped back up.
    const searchKey = currentSearch + '::' + currentFilter;
    if (searchKey !== lastSearchKey) { pastRenderLimit = PAGE_SIZE; lastSearchKey = searchKey; }

    const liveOrders = filteredOrders.filter(o => liveStatuses.includes(o.status.toLowerCase()));
    const pastOrders = filteredOrders.filter(o => !liveStatuses.includes(o.status.toLowerCase()));

    renderLiveSection(liveOrders);
    renderPastSection(pastOrders);
    updateChipCounts();

    if (filteredOrders.length === 0) {
      emptyState.style.display = 'block';
      if (currentSearch || currentFilter !== 'all') {
        document.getElementById('empty-title').innerText = "No matching orders";
        document.getElementById('empty-desc').innerText = "Try changing your filters or search term.";
      } else {
        document.getElementById('empty-title').innerText = "No orders found";
        document.getElementById('empty-desc').innerText = "Looks like you haven't placed any orders yet.";
      }
    } else {
      emptyState.style.display = 'none';
    }

    if (!hasRenderedOnce) {
      hasRenderedOnce = true;
      requestAnimationFrame(() => document.body.classList.add('settled'));
    }
  };

  async function fetchOrders() {
    try {
      const response = await fetch('https://eatswada.onrender.com/api/orders', {
        headers: { 'Authorization': `Bearer ${token}` }
      });

      if (response.status === 401 || response.status === 404) return requireLogin();

      const result = await response.json();
      if (loader) loader.style.display = 'none';

      if (response.ok && result.success && result.data) {
        allOrdersData = result.data;
        renderOrders();
      } else {
        allOrdersData = [];
        renderOrders();
      }
    } catch (error) {
      console.error(error);
      requireLogin();
    }
  }

  // Initial Fetch & Live Polling Maintained
  fetchOrders();
  setInterval(fetchOrders, 10000);

  // Search
  const searchInput = document.getElementById('order-search');
  const searchBar = document.getElementById('search-bar');
  searchInput.addEventListener('input', (e) => {
    currentSearch = e.target.value;
    searchBar.classList.toggle('has-value', !!e.target.value);
    renderOrders();
  });
  document.getElementById('search-clear').addEventListener('click', () => {
    searchInput.value = '';
    currentSearch = '';
    searchBar.classList.remove('has-value');
    renderOrders();
    searchInput.focus();
  });

  // Filter Chips (animated selection)
  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', (e) => {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      e.currentTarget.classList.add('active');
      currentFilter = e.currentTarget.getAttribute('data-filter');
      renderOrders();
      moveChipIndicator();
    });
  });
  window.addEventListener('resize', moveChipIndicator);
  setTimeout(moveChipIndicator, 50);

  // Infinite scroll for Past Orders
  const io = new IntersectionObserver((entries) => {
    if (entries[0].isIntersecting) {
      pastRenderLimit += PAGE_SIZE;
      renderOrders();
    }
  }, { rootMargin: '200px' });
  io.observe(sentinel);
  loadMoreBtn.addEventListener('click', () => { pastRenderLimit += PAGE_SIZE; renderOrders(); });

  // Swipe Gestures Logic (adds a 3rd "delete" action for cancelled orders)
  let startX = 0;
  let currentCard = null;

  document.addEventListener('touchstart', e => {
    const card = e.target.closest('.past-card');
    if (card) { startX = e.touches[0].clientX; currentCard = card; }
  }, { passive: true });

  document.addEventListener('touchmove', e => {
    if (!currentCard) return;
    const currentX = e.touches[0].clientX;
    const diff = startX - currentX;
    if (diff > 40) currentCard.classList.add('swiped');
    else if (diff < -40) currentCard.classList.remove('swiped');
  }, { passive: true });

  document.addEventListener('touchend', () => { currentCard = null; });

  // Pull to Refresh Logic
  let touchStartPtr = 0;
  const ptrIndicator = document.getElementById('ptr-indicator');

  window.addEventListener('touchstart', e => {
    if (window.scrollY === 0) touchStartPtr = e.touches[0].clientY;
  }, { passive: true });

  window.addEventListener('touchmove', e => {
    if (window.scrollY === 0 && touchStartPtr > 0) {
      const diff = e.touches[0].clientY - touchStartPtr;
      if (diff > 0 && diff < 80) {
        ptrIndicator.style.height = `${diff}px`;
      }
    }
  }, { passive: true });

  window.addEventListener('touchend', e => {
    if (parseInt(ptrIndicator.style.height) > 50) {
      ptrIndicator.classList.add('ptr-spinning');
      ptrIndicator.style.height = '60px';
      fetchOrders().then(() => {
        ptrIndicator.style.height = '0';
        setTimeout(() => ptrIndicator.classList.remove('ptr-spinning'), 300);
      });
    } else {
      ptrIndicator.style.height = '0';
    }
    touchStartPtr = 0;
  });

});
</script>

<script src="navigation.js"></script>
