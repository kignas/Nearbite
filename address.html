<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Addresses · Eatswada</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap">

<!-- Shared stylesheet loads first so the page-scoped rules below win
     without any global change to style.css. -->
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<script src="address-store.js?v=20260922-4"></script>
<script src="address-api.js"></script>
<script src="address-model.js?v=20260922-4"></script>
<script src="safe-html.js"></script>
<!-- The address flow is styled only by address-flow.css (scoped to
     body.ea). address-v3.css is no longer loaded by this page. -->
<link rel="stylesheet" href="address-flow.css?v=20260923-refine">
<script>
/* Chooses the screen before first paint so the wrong view never flashes.
   Homepage / Cart → "Select Your Location"; Profile → "Addresses". */
(function () {
  var p = new URLSearchParams(location.search);
  var view = (p.get('view') === 'select' || p.get('return') === 'cart') ? 'select' : 'manage';
  document.documentElement.setAttribute('data-address-view', view);
  document.documentElement.classList.add('ea-html');
})();
</script>
</head>
<body class="ea ea-body">

<!-- ================================================================
     SCREEN 1 — SELECT YOUR LOCATION  (Homepage / Cart entry)
     ================================================================ -->
<div class="ls-view" id="selectView">
  <div class="ls-inner">
    <header class="ls-head">
      <button type="button" class="ls-back" onclick="addressBack()" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12H4.5M10.5 18l-6-6 6-6"/></svg>
      </button>
      <h1 class="ls-title">Select Your Location</h1>
    </header>

    <div class="ls-search" role="search">
      <label class="ea-sr" for="lsSearch">Search an area or address</label>
      <input id="lsSearch" type="search" inputmode="search" autocomplete="off" enterkeyhint="search"
             placeholder="Search an area or address" maxlength="120">
      <button type="button" class="ls-clear" id="lsClear" aria-label="Clear search" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M17 7L7 17M7 7l10 10"/></svg>
      </button>
      <svg class="ls-search-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="M20 20l-4.3-4.3"/></svg>
    </div>

    <div class="ls-actions">
      <button type="button" class="ls-action" id="lsUseCurrent" onclick="useCurrentLocation()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="2.4" fill="currentColor" stroke="none"/><path d="M12 2.8v2.7M12 18.5v2.7M2.8 12h2.7M18.5 12h2.7"/></svg>
        <span>Use Current Location</span>
      </button>
      <button type="button" class="ls-action" onclick="openAddAddressFlow()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><rect x="3.8" y="3.8" width="16.4" height="16.4" rx="3.6"/><path d="M12 8.2v7.6M8.2 12h7.6"/></svg>
        <span>Add New Address</span>
      </button>
    </div>

    <!-- Search results replace the saved / recent sections while typing -->
    <div id="lsSearchArea" hidden>
      <div class="ls-status" id="lsStatus" role="status" aria-live="polite" hidden></div>
      <div class="ls-list ls-results" id="lsResults" role="listbox" aria-label="Search results" hidden></div>
    </div>

    <div id="lsHome">
      <section id="lsSavedSec" aria-labelledby="lsSavedTitle">
        <h2 class="ls-eyebrow" id="lsSavedTitle">Saved Addresses</h2>
        <div class="ls-list" id="lsSaved" aria-busy="true">
          <div class="ls-skel" aria-hidden="true"><i></i><span><i></i><i></i></span></div>
          <div class="ls-skel" aria-hidden="true"><i></i><span><i></i><i></i></span></div>
        </div>
      </section>
      <section id="lsRecentSec" aria-labelledby="lsRecentTitle" hidden>
        <h2 class="ls-eyebrow" id="lsRecentTitle">Recently Searched</h2>
        <div class="ls-list" id="lsRecent"></div>
      </section>
    </div>
  </div>
</div>

<!-- ================================================================
     SCREEN 2 — PROFILE → ADDRESSES
     ================================================================ -->
<div class="ea-app" id="manageView">
  <header class="ea-header">
    <div class="ea-top">
      <button type="button" class="ea-back" onclick="addressBack()" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12H4.5M10.5 18l-6-6 6-6"/></svg>
      </button>
      <h1 class="ea-title">Addresses</h1>
    </div>
  </header>

  <div class="ea-band"><span>Saved Addresses</span></div>

  <div class="ea-main" role="main">
    <div id="list" aria-busy="true"><div class="ea-empty">Loading addresses…</div></div>
  </div>

  <div class="ea-fab">
    <button type="button" onclick="openAddAddressFlow()">Add New Address</button>
  </div>
</div>

<!-- ================================================================
     SCREEN 4 — ADDRESS DETAILS (add / edit)
     ================================================================ -->
<div class="ea-form" id="modal" role="dialog" aria-modal="true" aria-labelledby="formTitle">

  <div class="ea-form-head">
    <div class="ea-form-head-row">
      <button type="button" class="ea-back" onclick="closeEditor()" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12H4.5M10.5 18l-6-6 6-6"/></svg>
      </button>
      <div class="ea-head-body">
        <span class="ea-sr" id="formTitle">Add delivery address</span>
        <p class="ea-head-line"><span class="ea-head-primary" id="headPrimary">No location set</span><span class="ea-head-sep" id="headSep">|</span><span class="ea-head-secondary" id="headSecondary">Confirm your delivery point on the map</span></p>
      </div>
    </div>
  </div>

  <div class="ea-form-body" id="formBody">
   <div class="ea-form-inner">

    <!-- Receiver Details -->
    <section class="ea-sec" id="receiverSec">
      <h2 class="ea-sec-title">Receiver Details</h2>
      <div class="ea-panel ea-receiver">
        <button type="button" class="ea-check" id="useAccount" onclick="toggleUseAccount()" aria-pressed="false">
          <span class="ea-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.3 4.2L19 7"/></svg></span>
          <span class="ea-check-body">
            <span class="ea-check-text">Use my account details</span>
            <span class="ea-check-sub" id="accountLine" hidden></span>
          </span>
        </button>

        <div class="ea-receiver-fields" id="receiverFields">
          <div class="ea-float">
            <input class="ea-input" id="receiverName" maxlength="60" placeholder=" " autocomplete="name">
            <label for="receiverName">Receiver name <span class="req">*</span></label>
            <div class="ea-err" id="err_receiverName"></div>
          </div>
          <div class="ea-float">
            <input class="ea-input" id="receiverPhone" inputmode="tel" maxlength="10" placeholder=" " autocomplete="tel">
            <label for="receiverPhone">Receiver's number <span class="req">*</span></label>
            <div class="ea-err" id="err_receiverPhone"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Location Details — the only address-type selector on the page -->
    <section class="ea-sec">
      <h2 class="ea-sec-title">Location Details</h2>
      <div class="ea-panel">

        <div class="ea-pending" id="pendingLoc" style="display:none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5v.2"/></svg>
          <span>Confirm your delivery point on the map before saving.</span>
          <button type="button" onclick="changeLocation()">Set location</button>
        </div>
        <div class="ea-err" id="err_location"></div>

        <div class="ea-seg" id="locSeg" role="group" aria-label="Location type">
          <button type="button" class="on" data-type="Village" onclick="chooseType('Village')" aria-pressed="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h16M6 20v-7.5L12 7l6 5.5V20M9 20v-4h6v4"/></svg>
            Village
          </button>
          <button type="button" data-type="Town" onclick="chooseType('Town')" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V8l7-4v16M11 20V6l9 3v11M7 11h1M7 14h1M7 17h1M15 12h1M15 15h1M15 18h1"/></svg>
            Town
          </button>
        </div>

        <div class="ea-address-fields" id="addressFields">
          <div class="ea-float ea-house-field" id="houseField">
            <input class="ea-input" id="house" maxlength="120" placeholder=" " autocomplete="address-line1">
            <label for="house"><span id="lbl_house">House / Flat / Floor</span> <span class="req">*</span></label>
            <div class="ea-err" id="err_house"></div>
          </div>

          <div class="ea-float ea-landmark-field" id="landmarkField">
            <input class="ea-input" id="landmark" maxlength="160" placeholder=" " autocomplete="address-line2">
            <label for="landmark"><span id="lbl_landmark">Address details</span> <span id="landmarkReq" class="req">*</span></label>
            <div class="ea-err" id="err_landmark"></div>
          </div>

          <div class="ea-area-row" id="areaRow">
            <div class="ea-float">
              <textarea class="ea-input ea-textarea" id="area" rows="2" maxlength="120" placeholder=" "></textarea>
              <label for="area"><span id="lbl_area">Locality / Village</span> <span id="areaReq" class="req">*</span></label>
              <div class="ea-err" id="err_area"></div>
            </div>
            <button type="button" class="ea-maptile" onclick="changeLocation()" aria-label="Change delivery location on the map">
              <svg viewBox="0 0 16 21" aria-hidden="true"><circle cx="8" cy="7" r="6.5" fill="currentColor"/><circle cx="8" cy="7" r="2.4" fill="#fff"/><path d="M8 13.5v3.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="8" cy="19" r="1.5" fill="currentColor"/></svg>
              <span id="changeLocText">Change</span>
            </button>
          </div>
        </div>

        <div class="ea-saveas">
          <span class="ea-saveas-title">Save address as <span class="req">*</span></span>
          <div class="ea-saveas-seg" id="saveAsSeg" role="group" aria-label="Save address as">
            <button type="button" data-tag="Home" onclick="chooseSaveAs('Home')" aria-pressed="true">Home</button>
            <button type="button" data-tag="Work" onclick="chooseSaveAs('Work')" aria-pressed="false">Office</button>
            <button type="button" data-tag="Other" onclick="chooseSaveAs('Other')" aria-pressed="false">Other</button>
          </div>
        </div>

      </div>
    </section>


   </div>
  </div>

  <div class="ea-form-foot">
    <button type="button" class="ea-save" id="save" onclick="saveAddress()" disabled>Save Address</button>
  </div>
</div>

<!-- Three-dot menu for a saved address on "Select Your Location" -->
<div class="ea-menu" id="addrMenu" role="menu" aria-label="Address options" hidden>
  <button type="button" role="menuitem" data-menu-action="edit">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4.2L19 9.2 14.8 5 4 15.8z"/><path d="M13 6.8l4.2 4.2"/></svg> Edit
  </button>
  <button type="button" role="menuitem" class="is-danger" data-menu-action="delete">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 7h15M9.5 7V4.6h5V7M6.8 7l.9 12.4h8.6L17.2 7"/></svg> Delete
  </button>
</div>

<div class="ea-toast" id="toast" role="status" aria-live="polite"></div>

<script src="address.js?v=20260922-4"></script>

<script src="navigation.js"></script>
</body>
</html>
