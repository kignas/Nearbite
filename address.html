<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff">
<title>Saved addresses · Nearbite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--brand:#fc8019;--soft:#f7f7f8;--ink:#111827;--muted:#6b7280;--line:#e8eaed;--green:#15803d;--red:#dc2626}
*{box-sizing:border-box}body{margin:0;background:var(--soft);color:var(--ink);font-family:'Plus Jakarta Sans',sans-serif;padding-bottom:30px}
.app{max-width:720px;margin:auto;min-height:100dvh}.header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:13px 16px}
.top{display:flex;align-items:center;gap:12px}.back,.add{width:40px;height:40px;border:0;border-radius:13px;background:#f5f5f6;display:grid;place-items:center;color:#374151}.add{background:#fff2e8;color:var(--brand)}
.title{font-size:17px;font-weight:800;flex:1}.sub{font-size:11px;color:var(--muted);margin:4px 0 0 52px}
.main{padding:16px}.hint{background:#fff2e8;border:1px solid #ffe1ce;color:#8a4517;border-radius:16px;padding:12px 13px;font-size:11px;line-height:1.5;margin-bottom:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:19px;box-shadow:0 6px 24px rgba(17,24,39,.05);margin-bottom:11px;overflow:hidden}
.addr{padding:15px}.addr-top{display:flex;gap:12px}.addr-icon{width:42px;height:42px;border-radius:13px;background:#f7f7f8;display:grid;place-items:center;flex:none}.addr-icon.default{background:#fff2e8;color:var(--brand)}
.addr-body{flex:1;min-width:0}.tag{font-size:13px;font-weight:800;display:flex;gap:7px;align-items:center}.default{color:var(--brand);font-size:9px;text-transform:uppercase;letter-spacing:.08em}.line{font-size:11px;color:#4b5563;line-height:1.55;margin-top:5px}.meta{font-size:10px;color:#9ca3af;margin-top:5px}
.actions{display:flex;gap:8px;margin-top:13px;padding-top:11px;border-top:1px solid #f0f1f2}.action{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;font-size:10px;font-weight:800;color:#374151}.action.primary{border-color:#ffd5bd;background:#fff8f3;color:#c85e0d}.action.danger{color:var(--red)}
.empty{text-align:center;background:#fff;border:1px dashed #d9dce0;border-radius:19px;padding:34px 20px;color:var(--muted);font-size:12px}.empty i{font-size:30px;color:#c7cbd1;margin-bottom:10px}
.card.selected{border-color:#bbf7d0;box-shadow:0 6px 24px rgba(21,128,61,.12)}.current{color:var(--green);font-size:9px;text-transform:uppercase;letter-spacing:.08em}
.locperm{display:none;gap:11px;background:#fff2e8;border:1px solid #ffe1ce;border-radius:16px;padding:13px;margin-bottom:14px}.locperm.show{display:flex}.locperm.denied{background:#fef2f2;border-color:#fecaca}
.locperm-icon{font-size:18px;flex:none;line-height:1.2}.locperm-body{flex:1;min-width:0}.locperm-title{font-size:12px;font-weight:800;color:#8a4517;margin-bottom:4px}.locperm.denied .locperm-title{color:#991b1b}
.locperm-text{font-size:11px;color:#8a4517;line-height:1.5;margin-bottom:10px}.locperm.denied .locperm-text{color:#991b1b}
.locperm-btn{border:0;background:var(--brand);color:#fff;border-radius:10px;padding:9px 14px;font-size:11px;font-weight:800}.locperm-btn:disabled{opacity:.6}.locperm.denied .locperm-btn{background:#dc2626}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.52);z-index:100;display:none;align-items:flex-end;padding:10px}.modal.show{display:flex}.sheet{width:min(620px,100%);max-height:92dvh;overflow:auto;background:#fff;border-radius:25px;padding:19px;margin:auto}
.sheet-head{display:flex;align-items:center;gap:10px}.sheet-head h2{font-size:17px;margin:0;flex:1}.close{border:0;background:#f4f4f5;width:36px;height:36px;border-radius:11px}.loc{margin:15px 0;background:#f8fafc;border:1px solid var(--line);padding:12px;border-radius:15px}.loc button{width:100%;height:43px;border:1px solid var(--brand);background:#fff7f2;color:#c85e0d;border-radius:12px;font-weight:800;font-size:11px}.status{font-size:10px;margin-top:8px;color:var(--green);line-height:1.4}.status.err{color:var(--red)}
.tags{display:flex;gap:8px;margin:12px 0}.tagbtn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font-size:11px;font-weight:800}.tagbtn.on{border-color:var(--brand);background:#fff2e8;color:var(--brand)}
label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#6b7280;font-weight:800;margin:13px 0 7px}input{width:100%;height:46px;border:1px solid var(--line);background:#fafafa;border-radius:12px;padding:0 12px;outline:none;font-size:12px}input:focus{border-color:#f5a36d;background:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.save{width:100%;height:48px;border:0;background:var(--brand);color:#fff;border-radius:13px;font-weight:800;margin-top:17px}.save:disabled{background:#ddd;color:#999}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,15px);opacity:0;background:#111827;color:#fff;padding:10px 14px;border-radius:11px;font-size:11px;z-index:130;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="app">
<header class="header">
  <div class="top">
    <button class="back" onclick="goBack()"><i class="fa-solid fa-arrow-left"></i></button>
    <div class="title">Saved addresses</div>
    <button class="add" onclick="openEditor()"><i class="fa-solid fa-plus"></i></button>
  </div>
  <div class="sub">Choose where you want your food delivered</div>
</header>
<main class="main">
  <div class="locperm" id="locPermCard">
    <div class="locperm-icon">📍</div>
    <div class="locperm-body">
      <div class="locperm-title" id="locPermTitle"></div>
      <div class="locperm-text" id="locPermText"></div>
      <button class="locperm-btn" id="locPermBtn" onclick="requestLocationPermission()"></button>
    </div>
  </div>
  <div class="hint"><i class="fa-solid fa-location-dot"></i> Your saved GPS location is used to calculate restaurant distance and delivery charges. You can switch addresses before placing each order.</div>
  <div id="list"><div class="empty"><i class="fa-solid fa-location-dot"></i><br>Loading addresses…</div></div>
</main>
</div>

<div class="modal" id="modal">
 <div class="sheet">
  <div class="sheet-head"><h2 id="formTitle">Add new address</h2><button class="close" onclick="closeEditor()"><i class="fa-solid fa-xmark"></i></button></div>
  <div class="loc">
    <button id="gpsBtn" onclick="captureGps()"><i class="fa-solid fa-location-crosshairs"></i> Use my current location</button>
    <div class="status" id="gpsStatus"></div>
  </div>
  <label>Save as</label>
  <div class="tags">
    <button class="tagbtn on" data-tag="Home" onclick="chooseTag('Home')">Home</button>
    <button class="tagbtn" data-tag="Work" onclick="chooseTag('Work')">Work</button>
    <button class="tagbtn" data-tag="Other" onclick="chooseTag('Other')">Other</button>
  </div>
  <div class="grid">
    <div><label>House / flat</label><input id="house" placeholder="House No. / Name"></div>
    <div><label>Pincode</label><input id="pincode" inputmode="numeric" maxlength="6" placeholder="735224"></div>
  </div>
  <label>Area / street</label><input id="area" placeholder="Locality / village / street">
  <label>Landmark</label><input id="landmark" placeholder="Nearby landmark">
  <div class="grid">
    <div><label>City</label><input id="city" value="Maynaguri"></div>
    <div><label>Receiver name</label><input id="receiverName" placeholder="Full name"></div>
  </div>
  <label>Receiver phone</label><input id="receiverPhone" inputmode="tel" maxlength="10" placeholder="10-digit mobile number">
  <button class="save" id="save" onclick="saveAddress()">Save address</button>
 </div>
</div>
<div class="toast" id="toast"></div>

<script>
const API='https://eatswada.onrender.com/api';
const SELECTED_ID_KEY='nearbite_selected_address_id';
let addresses=[], editingId=null, tag='Home', lat=null, lng=null;
const $=id=>document.getElementById(id);
const token=()=>localStorage.getItem('nearbite_token')||localStorage.getItem('token')||'';
const headers=()=>({'Content-Type':'application/json',...(token()?{'Authorization':'Bearer '+token()}:{})});
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('show'),2200)}
function goBack(){if(new URLSearchParams(location.search).get('return')==='cart')location.href='cart.html';else history.back()}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function coords(a){const c=a?.location?.coordinates;return Array.isArray(c)&&c.length>=2?[Number(c[1]),Number(c[0])]:[null,null]}
function cache(a){localStorage.setItem('nearbite_address',JSON.stringify(a));localStorage.setItem('nearbite_address_updated_at',String(Date.now()))}
function selectedId(){return localStorage.getItem(SELECTED_ID_KEY)||''}
function useAddress(a){
  if(a&&a._id)localStorage.setItem(SELECTED_ID_KEY,String(a._id));
  cache(a);
  render();
  toast('Delivery address selected');
  setTimeout(()=>goBack(),250);
}
function render(){
 const root=$('list');
 if(!addresses.length){root.innerHTML='<div class="empty"><i class="fa-solid fa-location-dot"></i><br><b>No saved addresses</b><br><span>Add your first delivery address.</span></div>';return}
 const selId=selectedId();
 root.innerHTML=addresses.map(a=>{
   const [la,lo]=coords(a), is=a.isDefault===true, sel=String(a._id)===String(selId);
   const label=a.tag||'Other';
   const icon=label==='Home'?'fa-house':label==='Work'?'fa-briefcase':'fa-location-dot';
   const text=[a.house,a.area,a.landmark].filter(Boolean).join(', ');
   return `<div class="card ${sel?'selected':''}"><div class="addr">
    <div class="addr-top"><div class="addr-icon ${is?'default':''}"><i class="fa-solid ${icon}"></i></div>
    <div class="addr-body"><div class="tag">${escapeHtml(label)} ${is?'<span class="default">Default</span>':''} ${sel?'<span class="current">Delivering here</span>':''}</div>
    <div class="line">${escapeHtml(text||'Address details')}</div>
    <div class="meta">${escapeHtml(a.city||'Maynaguri')}${a.pincode?' · '+escapeHtml(a.pincode):''}${Number.isFinite(la)?' · GPS saved':''}</div></div></div>
    <div class="actions">
      <button class="action primary" onclick="useAddressById('${a._id}')"><i class="fa-solid fa-check"></i> ${sel?'Selected':'Use this address'}</button>
      ${!is?`<button class="action" onclick="setDefault('${a._id}')">Set default</button>`:''}
      <button class="action" onclick="editAddress('${a._id}')">Edit</button>
      <button class="action danger" onclick="deleteAddress('${a._id}')">Delete</button>
    </div>
   </div></div>`;
 }).join('');
}
function byId(id){return addresses.find(a=>String(a._id)===String(id))}
function useAddressById(id){const a=byId(id);if(a)useAddress(a)}
// Single source of truth for "which address is the current checkout selection".
// Default address is a separate concept (a.isDefault) and must never override
// this once nearbite_selected_address_id is set to a still-valid address.
function resolveSelectedAddress(){
 const selId=selectedId();
 let selected=selId?byId(selId):null;
 if(!selected){
   selected=addresses.find(a=>a.isDefault)||addresses[0]||null;
   if(selected)localStorage.setItem(SELECTED_ID_KEY,String(selected._id));
 }
 if(selected){
   cache(selected);
 }else{
   localStorage.removeItem('nearbite_address');
   localStorage.removeItem(SELECTED_ID_KEY);
   localStorage.removeItem('nearbite_address_updated_at');
 }
 return selected;
}
async function load(){
 if(!token()){location.replace('login.html');return}
 try{
  const r=await fetch(API+'/users/addresses',{headers:headers(),cache:'no-store'});
  if(r.status===401||r.status===403)throw new Error('AUTH');
  const p=await r.json();addresses=Array.isArray(p?.data)?p.data:Array.isArray(p?.addresses)?p.addresses:Array.isArray(p)?p:[];
  resolveSelectedAddress();
  render();
 }catch(e){
  if(e.message==='AUTH'){localStorage.removeItem('nearbite_token');localStorage.removeItem('token');location.replace('login.html');return}
  $('list').innerHTML='<div class="empty">Could not load addresses. Please try again.</div>';
 }
}
function chooseTag(t){tag=t;document.querySelectorAll('.tagbtn').forEach(b=>b.classList.toggle('on',b.dataset.tag===t))}
function openEditor(id=null){
 editingId=id;tag='Home';lat=null;lng=null;
 const a=id?byId(id):null;
 $('formTitle').textContent=a?'Edit address':'Add new address';
 $('house').value=a?.house||'';$('area').value=a?.area||'';$('landmark').value=a?.landmark||'';
 $('city').value=a?.city||'Maynaguri';$('pincode').value=a?.pincode||'';
 $('receiverName').value=a?.receiverName||'';$('receiverPhone').value=(a?.receiverPhone||'').replace(/\D/g,'');
 const c=coords(a);if(Number.isFinite(c[0])){lat=c[0];lng=c[1];$('gpsStatus').textContent=`Saved GPS: ${lat.toFixed(6)}, ${lng.toFixed(6)}`}
 else $('gpsStatus').textContent='';
 chooseTag(a?.tag||'Home');$('modal').classList.add('show');
}
function editAddress(id){openEditor(id)}
function closeEditor(){$('modal').classList.remove('show')}
function captureGps(){
 if(!navigator.geolocation){$('gpsStatus').textContent='Location is not supported by this browser.';$('gpsStatus').className='status err';return}
 $('gpsBtn').disabled=true;$('gpsBtn').textContent='Getting location…';
 navigator.geolocation.getCurrentPosition(p=>{
   lat=Number(p.coords.latitude.toFixed(7));lng=Number(p.coords.longitude.toFixed(7));
   $('gpsStatus').className='status';$('gpsStatus').textContent=`GPS captured: ${lat.toFixed(6)}, ${lng.toFixed(6)}`;
   $('gpsBtn').disabled=false;$('gpsBtn').innerHTML='<i class="fa-solid fa-location-dot"></i> Location captured';
 },e=>{
   $('gpsBtn').disabled=false;$('gpsBtn').innerHTML='<i class="fa-solid fa-location-crosshairs"></i> Use my current location';
   $('gpsStatus').className='status err';$('gpsStatus').textContent=e.code===1?'Location permission denied.':e.code===3?'Location request timed out.':'Could not get your location.';
 },{enableHighAccuracy:true,timeout:15000,maximumAge:30000});
}
async function saveAddress(){
 const data={tag,house:$('house').value.trim()||'No House Number',area:$('area').value.trim(),landmark:$('landmark').value.trim(),
 city:$('city').value.trim()||'Maynaguri',pincode:$('pincode').value.trim(),
 receiverName:$('receiverName').value.trim(),receiverPhone:$('receiverPhone').value.replace(/\D/g,''),
 latitude:lat,longitude:lng,isDefault:!addresses.length};
 if(!data.area||!Number.isFinite(lat)||!Number.isFinite(lng)){toast('Add area and capture your GPS location');return}
 const b=$('save');b.disabled=true;b.textContent='Saving…';
 try{
  const url=editingId?API+'/users/addresses/'+encodeURIComponent(editingId):API+'/users/addresses';
  const r=await fetch(url,{method:editingId?'PUT':'POST',headers:headers(),body:JSON.stringify(data)});
  const p=await r.json().catch(()=>({}));if(!r.ok)throw new Error(p.message||'Could not save address');
  // load() -> resolveSelectedAddress() re-caches nearbite_address from fresh
  // server data ONLY for whichever address is currently selected. Do not
  // separately cache(saved) here — editing a non-selected address (e.g.
  // editing "Home" while "Work" is the current checkout selection) must not
  // change what's delivering.
  await load();
  closeEditor();toast(editingId?'Address updated':'Address added');
 }catch(e){toast(e.message)}finally{b.disabled=false;b.textContent='Save address'}
}
async function setDefault(id){
 try{const r=await fetch(API+'/users/addresses/'+encodeURIComponent(id)+'/default',{method:'PATCH',headers:headers()});const p=await r.json().catch(()=>({}));if(!r.ok)throw new Error(p.message||'Could not set default');await load();toast('Default address changed')}catch(e){toast(e.message)}
}
async function deleteAddress(id){
 const a=byId(id);if(!a)return;
 if(!confirm(`Delete your ${a.tag||'saved'} address?`))return;
 try{
  const r=await fetch(API+'/users/addresses/'+encodeURIComponent(id),{method:'DELETE',headers:headers()});
  const p=await r.json().catch(()=>({}));if(!r.ok)throw new Error(p.message||'Could not delete address');
  // load() -> resolveSelectedAddress() already falls back to default/first
  // ONLY when nearbite_selected_address_id no longer matches any address
  // (i.e. the deleted one was the current selection). Deleting an
  // unrelated address now leaves the current selection untouched.
  await load();
  toast('Address deleted');
 }catch(e){toast(e.message)}
}
// ── Location permission nudge (production-grade, non-spammy) ──
// Reads permission state via the Permissions API without prompting.
// getCurrentPosition() is only ever called from an explicit user tap.
function renderLocPerm(state){
 const card=$('locPermCard');if(!card)return;
 if(state==='granted'){card.classList.remove('show','denied');return}
 card.classList.add('show');
 if(state==='denied'){
  card.classList.add('denied');
  $('locPermTitle').textContent='Location permission is blocked';
  $('locPermText').textContent='Please enable location access for Nearbite in your browser settings to get accurate delivery distance and charges.';
  $('locPermBtn').textContent='Try Again';
 }else{
  card.classList.remove('denied');
  $('locPermTitle').textContent='Enable location for a better ordering experience';
  $('locPermText').textContent='We use your location to accurately calculate delivery distance, delivery charges and provide a smoother ordering experience.';
  $('locPermBtn').textContent='Enable Location';
 }
}
function initLocationPermission(){
 if(!$('locPermCard'))return;
 if(navigator.permissions&&navigator.permissions.query){
  navigator.permissions.query({name:'geolocation'}).then(status=>{
   renderLocPerm(status.state);
   status.onchange=()=>renderLocPerm(status.state);
  }).catch(()=>renderLocPerm('prompt'));
 }else{
  renderLocPerm('prompt');
 }
}
function requestLocationPermission(){
 if(!navigator.geolocation){renderLocPerm('denied');return}
 $('locPermBtn').disabled=true;
 navigator.geolocation.getCurrentPosition(
  ()=>{renderLocPerm('granted')},
  e=>{$('locPermBtn').disabled=false;renderLocPerm(e.code===1?'denied':'prompt')},
  {enableHighAccuracy:false,timeout:10000,maximumAge:60000}
 );
}
document.addEventListener('DOMContentLoaded',()=>{load();initLocationPermission()});
</script>
</body>
</html>
