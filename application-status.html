<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Application status | Eatswada</title><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>body{margin:0;background:#f3f5f3;color:#17191e;font:15px Manrope,Arial}.top{background:#fff;padding:16px;border-bottom:1px solid #e7e9e7}.top a{color:inherit;text-decoration:none}.wrap{max-width:620px;margin:24px auto;padding:0 15px}.card{background:white;border:1px solid #e7e9e7;border-radius:16px;padding:22px}h1{font-size:24px}.muted{color:#6d737d;line-height:1.6}.status{font-weight:800;color:#367e34;text-transform:capitalize}.btn{display:inline-block;background:#367e34;color:#fff;padding:13px 17px;border-radius:11px;text-decoration:none;font-weight:800;margin-top:16px}.error{color:#a33b30}</style></head><body><header class="top"><a href="profile.html">← Profile</a></header><main class="wrap"><section class="card"><h1>Your restaurant application</h1><p class="muted" id="state">Loading your application…</p><div id="details"></div><a class="btn" href="apply.html">Apply / update application</a></section></main><script>(()=>{const API='https://eatswada.onrender.com/api/vendor-applications/mine';const t=localStorage.getItem('nearbite_token')||localStorage.getItem('token')||'';if(!t){location.replace('login.html?redirect=application-status.html');return}fetch(API,{headers:{Authorization:'Bearer '+t}}).then(async r=>{let d=await r.json().catch(()=>({}));if(r.status===404||d.data==null){document.getElementById('state').textContent='No application found for this customer account yet.';return}if(!r.ok||d.success===false)throw Error(d.message||'Could not load application.');const a=d.data||d.application||d;document.getElementById('state').innerHTML='Status: <span class="status"></span>';document.querySelector('.status').textContent=String(a.status||'pending').replaceAll('_',' ');let html='<p class="muted">'+(a.restaurantName||'')+'</p>';if(a.changeRequest)html+='<p><b>Update requested by Eatswada:</b><br>'+escapeHtml(a.changeRequest)+'</p>';if(a.rejectionReason)html+='<p><b>Reason:</b><br>'+escapeHtml(a.rejectionReason)+'</p>';html+='<p class="muted">The Eatswada team will contact you using your business contact details. Application approval does not create Vendor dashboard access.</p>';document.getElementById('details').innerHTML=html;if(a.status!=='needs_changes')document.querySelector('.btn').style.display='none'}).catch(e=>{document.getElementById('state').textContent=e.message;document.getElementById('state').className='error'});function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}})();</script></body></html>
