<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="view-transition" content="same-origin">
  <title>Menu – EatSwada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  

  <style>
    /* ============================================================
       RESET & BASE
    ============================================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* Action colour. The brief sets Eatswada green as the primary
         action/positive colour for this page. Every ADD control, stepper
         and positive accent derives from these four tokens. */
      --action:      #159A62;
      --action-dark: #0E7C4C;
      --action-soft: #E7F6EE;
      --action-line: #BFE5D2;

      --brand:       #FC8019;
      --brand-light: #fff4ea;
      --brand-dark:  #e0700f;

      /* Positive / veg signals. */
      --green:       #159A62;
      --green-soft:  #E7F6EE;
      --green-line:  #C4E9D6;
      --red:         #E23744;
      --red-soft:    #FEF2F2;

      --bg:          #F5F6F8;
      --card:        #FFFFFF;
      --text-1:      #101828;
      --text-2:      #4A5567;
      --text-3:      #98A2B3;
      --border:      #EFF1F5;
      --line-soft:   #F2F4F7;

      --shadow-sm:   0 1px 2px rgba(16,24,40,.04);
      --shadow-md:   0 1px 2px rgba(16,24,40,.04), 0 6px 16px rgba(16,24,40,.05);
      --shadow-lg:   0 8px 28px rgba(16,24,40,.10);
      --ease:        cubic-bezier(0.25, 1, 0.5, 1);
      --gutter:      14px;
    }

    /* Menu image sizing is owned by style.css (--nb-item-img). */
    @media (max-width: 380px) { :root { --gutter: 12px; } }

    body {
      background: var(--bg);
      font-family: var(--font);
      padding-bottom: 140px;
      -webkit-font-smoothing: antialiased;
    }

    /* ============================================================
       TOP BAR & INFO CARD
    ============================================================ */
    .top-bar {
      position: sticky; top: 0; z-index: 200;
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(0,0,0,0.06);
      padding: 12px 16px;
      display: flex; justify-content: space-between; align-items: center;
    }

    .icon-btn {
      width: 38px; height: 38px; border-radius: 50%;
      background: #f3f3f5; border: none;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: background 0.15s, transform 0.12s;
    }
    .icon-btn:active { transform: scale(0.88); background: #eaeaed; }
    .icon-btn i { font-size: 13px; color: #333; }
    .top-actions { display: flex; gap: 10px; }

    .res-card {
      margin: var(--gutter) var(--gutter) 0;
      background: var(--card);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border);
    }
    .res-card-body { padding: 16px 16px 0; }
    .res-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .res-name {
      font-size: 22px; font-weight: 800; color: var(--text-1);
      line-height: 1.18; letter-spacing: -.5px;
    }
    .res-cuisine {
      font-size: 13px; color: var(--text-3); font-weight: 500;
      margin-top: 5px; line-height: 1.4;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    .heart-btn {
      width: 36px; height: 36px; border-radius: 50%;
      border: 1px solid var(--border); background: #FAFBFC;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; cursor: pointer; transition: transform .18s var(--ease);
    }
    .heart-btn:active { transform: scale(.88); }
    .heart-btn.loved { border-color: #FFD6D6; background: var(--red-soft); }
    .heart-btn.loved i { color: var(--red) !important; }
    .heart-btn i { font-size: 14px; color: #CBD2DC; transition: color .2s; }

    /* Rating leads the row as a solid chip; everything else is neutral. */
    .res-meta-row {
      display: flex; align-items: center; gap: 8px;
      margin-top: 13px; flex-wrap: wrap;
    }
    .rating-pill {
      display: inline-flex; align-items: center; gap: 5px;
      background: var(--green); border: 0;
      border-radius: 8px; padding: 5px 9px; box-shadow: none;
    }
    .rating-star { color: #fff; font-size: 10px; }
    .rating-num { font-size: 13px; font-weight: 800; color: #fff; letter-spacing: .1px; }
    .rating-divider { width: 1px; height: 11px; background: rgba(255,255,255,.4); }
    .rating-count { font-size: 11px; font-weight: 700; color: rgba(255,255,255,.9); }
    .meta-chip {
      font-size: 13px; font-weight: 600; color: var(--text-2);
      display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
    }
    .meta-chip i { color: var(--text-3); font-size: 11px; }
    .meta-dot { color: #D5DBE4; font-weight: 700; }

    .offer-strip {
      margin: 13px 0 0; padding: 10px 12px;
      background: var(--action-soft); border-radius: 12px;
      border: 1px solid var(--action-line);
      display: none; align-items: center; gap: 10px;
    }
    .offer-icon {
      width: 28px; height: 28px; background: var(--action); border-radius: 8px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .offer-icon i { font-size: 12px; color: #fff; }
    .offer-text {
      font-size: 12px; font-weight: 800; color: #B45309; line-height: 1.35;
      min-width: 0; overflow: hidden; text-overflow: ellipsis;
    }

    .delivery-strip {
      padding: 11px 16px; margin-top: 14px;
      border-top: 1px solid var(--line-soft);
      background: #FCFCFD;
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    .del-chip {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; font-weight: 700; color: var(--text-2);
    }
    .del-chip .orange { color: var(--action); }
    .del-chip .blue { color: #60A5FA; }
    .del-sep { width: 1px; height: 13px; background: var(--border); }

    /* ============================================================
       STICKY CATEGORY NAV & FILTERS
    ============================================================ */
    .cat-nav-sentinel { height: 1px; margin: 0; padding: 0; }
    .cat-nav {
      position: fixed; top: 62px; left: 0; right: 0; z-index: 150;
      background: rgba(255,255,255,.97);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 4px 16px rgba(16,24,40,.06);
      transform: translateY(-110%); opacity: 0; pointer-events: none;
      transition: transform .3s var(--ease), opacity .25s ease;
    }
    .cat-nav.visible { transform: translateY(0); opacity: 1; pointer-events: auto; }
    .cat-nav-inner {
      display: flex; align-items: center; gap: 8px;
      overflow-x: auto; padding: 10px var(--gutter);
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
      scroll-snap-type: x proximity;
      overscroll-behavior-x: contain;
    }
    .cat-nav-inner::-webkit-scrollbar { display: none; }
    .cat-nav-pill {
      flex-shrink: 0; scroll-snap-align: center;
      padding: 8px 15px; border-radius: 999px;
      font-size: 13px; font-weight: 700; letter-spacing: -.1px;
      color: var(--text-2); background: #F2F4F7;
      border: 1px solid transparent;
      cursor: pointer; white-space: nowrap;
      transition: background .18s var(--ease), color .18s var(--ease),
                  border-color .18s var(--ease), transform .12s var(--ease);
    }
    .cat-nav-pill:active { transform: scale(.95); }
    .cat-nav-pill.active {
      background: var(--text-1); color: #fff; border-color: var(--text-1);
    }

    .filter-bar {
      margin: 12px var(--gutter) 0;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      background: var(--card); border-radius: 16px; padding: 10px 14px;
      box-shadow: var(--shadow-sm); border: 1px solid var(--border);
    }
    .filter-label {
      font-size: 11px; font-weight: 800; color: var(--text-3);
      text-transform: uppercase; letter-spacing: .1em;
    }
    .veg-toggle-row { display: flex; align-items: center; gap: 8px; }
    .veg-chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 13px; border-radius: 999px;
      font-size: 12px; font-weight: 800; cursor: pointer;
      border: 1px solid transparent; user-select: none;
      transition: background .18s var(--ease), color .18s var(--ease),
                  border-color .18s var(--ease), transform .12s var(--ease);
    }
    .veg-chip:active { transform: scale(.95); }
    .veg-dot-icon {
      width: 11px; height: 11px; border-radius: 3px; border: 1.5px solid;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .veg-dot-icon::after { content: ''; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .veg-chip.veg-type { color: var(--green); border-color: var(--green-line); background: var(--green-soft); }
    .veg-chip.veg-type.active { background: var(--green); color: #fff; border-color: var(--green); }
    .veg-chip.nonveg-type { color: var(--red); border-color: #FBD5D5; background: var(--red-soft); }
    .veg-chip.nonveg-type.active { background: var(--red); color: #fff; border-color: var(--red); }

    /* ============================================================
       MENU SECTION
    ============================================================ */
    .menu-section { padding: 0 var(--gutter); margin-top: 18px; }
    .menu-cat-group { margin-bottom: 2px; }

    .menu-cat-header {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 16px 0 10px; cursor: pointer;
      border-bottom: 1px solid var(--border);
      user-select: none;
    }
    /* .menu-cat-title is owned by style.css. */
    .menu-cat-count {
      font-size: 13px; font-weight: 700; color: var(--text-3);
      flex-shrink: 0;
    }
    .menu-cat-chevron {
      font-size: 11px; color: var(--text-3); flex-shrink: 0;
      transition: transform .25s var(--ease);
    }
    .menu-cat-header.collapsed .menu-cat-chevron { transform: rotate(-90deg); }
    .menu-cat-items { overflow: hidden; transition: max-height .35s ease, opacity .3s; max-height: 9999px; opacity: 1; }
    .menu-cat-items.collapsed { max-height: 0; opacity: 0; }
    .hidden-by-filter { display: none !important; }

    @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

    /* Menu item, food image, ADD/stepper and skeleton styling all live in
       style.css under "RESTAURANT MENU — PRODUCTION". Nothing for those
       components belongs in this file. */

    .empty-filter-msg { text-align: center; padding: 52px 24px; display: none; }
    .empty-filter-msg i { font-size: 32px; color: #D5DBE4; display: block; margin-bottom: 14px; }
    .empty-filter-msg p { font-size: 14px; font-weight: 700; color: var(--text-3); }
    
    /* ============================================================
       WARNING CARDS
    ============================================================ */
    .closed-warning-card {
      margin: 14px 14px 0;
      padding: 14px 16px;
      border-radius: 18px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      animation: slideInFromRight 0.3s cubic-bezier(0.25, 1, 0.5, 1) forwards;
      opacity: 0;
    }
    .closed-warning-card.closed-today {
      background: #fff8f1;
      border: 1.5px solid #fed7aa;
    }
    .closed-warning-card.temp-closed {
      background: #fff1f2;
      border: 1.5px solid #fecdd3;
    }
    .closed-icon {
      width: 38px; height: 38px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .closed-today .closed-icon { background: #ffedd5; color: #ea580c; font-size: 16px; }
    .temp-closed .closed-icon { background: #ffe4e6; color: #e11d48; font-size: 16px; }
    .closed-text { padding-top: 2px; }
    .closed-text h4 { font-size: 15px; font-weight: 800; color: #1e293b; margin-bottom: 3px; }
    .closed-text p { font-size: 13px; font-weight: 600; color: #64748b; line-height: 1.4; }

    /* ── SAFE PREMIUM SLIDE-IN (Content Only, Won't Break Scroll) ── */
    @keyframes slideInFromRight {
      0% { 
        opacity: 0; 
        transform: translateX(40px); 
      }
      100% { 
        opacity: 1; 
        transform: translateX(0); 
      }
    }

    /* Apply the animation ONLY to the content blocks, keeping the Top Bar safe */
    .res-card, 
    .delivery-strip, 
    .filter-bar, 
    .menu-section {
      animation: slideInFromRight 0.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
      /* Staggering the entrance slightly for a fluid feel */
      opacity: 0; 
    }
    
    .res-card { animation-delay: 0.05s; }
    .delivery-strip { animation-delay: 0.1s; }
    .filter-bar { animation-delay: 0.15s; }
    .menu-section { animation-delay: 0.2s; }

    /* ── ULTRA PREMIUM EXIT ANIMATION ── */
    @keyframes slideOutRight {
      0% { transform: translateX(0); opacity: 1; }
      100% { transform: translateX(50px); opacity: 0; }
    }
    
    .slide-out-active {
      /* Overrides the entrance animation and slides everything away */
      animation: slideOutRight 0.25s cubic-bezier(0.4, 0, 0.2, 1) forwards !important;
    }

    /* ── States and API-driven item chrome (Phase 1.1) ── */
    .menu-state { text-align: center; padding: 52px 22px 60px; }
    .menu-state i { font-size: 32px; color: #D5DBE4; display: block; margin-bottom: 16px; }
    .menu-state-title { font-size: 16px; font-weight: 800; color: var(--text-1); margin: 0 0 6px; letter-spacing: -.3px; }
    .menu-state-sub { font-size: 13px; font-weight: 500; color: var(--text-2); margin: 0 0 20px; line-height: 1.5; }
    .menu-state-btn {
      background: var(--action); color: #fff; border: none; padding: 12px 26px;
      border-radius: 12px; font-family: inherit; font-size: 14px; font-weight: 800;
      cursor: pointer; box-shadow: 0 4px 12px rgba(252,128,25,.24);
      transition: transform .14s var(--ease), filter .14s var(--ease);
    }
    .menu-state-btn:active { transform: scale(.96); filter: brightness(.96); }
    .menu-state-btn:disabled { opacity: .6; cursor: default; transform: none; }


    
    /* ============================================================
       REDUCED MOTION
    ============================================================ */
    @media (prefers-reduced-motion: reduce) {
      .res-card, .delivery-strip, .filter-bar, .menu-section,
      .closed-warning-card {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
      .cat-nav, .cat-nav-pill, .veg-chip, .menu-state-btn, .icon-btn,
      .heart-btn, .menu-cat-chevron, .menu-cat-items { transition: none !important; }
      .cat-nav-inner { scroll-behavior: auto; }
      .veg-chip:active, .cat-nav-pill:active, .icon-btn:active,
      .heart-btn:active, .menu-state-btn:active { transform: none; }
    }
</style>

<style id="eatswada-restaurant-polish-v2">
/* ============================================================
   EATSWADA — RESTAURANT MENU, PREMIUM LAYER

   Loads after style.css. `!important` appears only on properties
   that style.css also owns (.nb-item-*, .top-bar, .res-card,
   .cat-nav, .menu-cat-*); style.css is shared across pages and is
   not edited here, so overriding it in place is the only option.

   `display` is deliberately NEVER marked !important on JS-controlled
   visibility elements. renderRestaurantHeader(), syncVegFilterAvailability()
   and applyFilter() use inline style.display for .filter-bar, .offer-strip,
   .meta-chip, .rating-count and .rating-divider.

   No ID, class, data attribute or JS hook is renamed or removed.
============================================================ */

:root{
  --ew-green:#159A62;
  --ew-green-dark:#0E7C4C;
  --ew-green-soft:#E7F6EE;
  --ew-green-line:#BFE5D2;
  --ew-ink:#101828;
  --ew-ink-2:#4A5567;
  --ew-ink-3:#98A2B3;
  --ew-line:#EFF1F5;
  --ew-line-2:#E4E8EE;
  --ew-amber:#B45309;
  --ew-amber-soft:#FFF6E8;
  --ew-amber-line:#F7E2C0;
  /* Food image footprint — one value drives the whole media column. */
  --nb-item-img:118px;
}
@media(max-width:380px){:root{--nb-item-img:106px}}
@media(max-width:340px){:root{--nb-item-img:94px}}

html,body{font-family:var(--font)!important}
body{background:#F7F8FA!important;color:var(--ew-ink)}
button,input,select,textarea{font-family:inherit}

/* ── Top bar ─────────────────────────────────────────────── */
.top-bar{
  height:58px!important;padding:0 var(--gutter)!important;
  background:#fff!important;border-bottom:1px solid var(--ew-line)!important;
  box-shadow:0 1px 2px rgba(16,24,40,.04)!important;
}
/* No page title in the header — the customer already knows they are
   looking at a menu. */
.top-bar::before{content:none!important}
.icon-btn{
  width:38px!important;height:38px!important;border-radius:12px!important;
  background:#fff!important;border:1px solid #E7EBEF!important;box-shadow:none!important;
  transition:background .16s var(--ease);
}
.icon-btn i{color:#344050!important;font-size:14px!important}
.icon-btn:active{background:#F2F4F7!important;transform:scale(.94)}
.top-actions{gap:8px!important}

/* ── Restaurant card ─────────────────────────────────────── */
.res-card{
  margin:14px var(--gutter) 0!important;
  background:#fff!important;border:1px solid var(--ew-line)!important;
  border-radius:20px!important;overflow:hidden!important;
  box-shadow:0 1px 2px rgba(16,24,40,.04),0 6px 18px rgba(16,24,40,.05)!important;
}
.res-card-body{padding:16px 15px 13px!important}
.res-name{
  font-size:24px!important;font-weight:800!important;line-height:1.16!important;
  letter-spacing:-.7px!important;color:var(--ew-ink)!important;overflow-wrap:anywhere;
}
.res-cuisine{
  margin-top:5px!important;font-size:12px!important;font-weight:600!important;
  color:var(--ew-ink-3)!important;line-height:1.45!important;overflow-wrap:anywhere;
}

.res-meta-row{margin-top:13px!important;align-items:center!important;flex-wrap:wrap!important;gap:8px!important}
.rating-pill{
  display:inline-flex;align-items:center!important;gap:5px!important;
  background:var(--ew-green)!important;border-radius:8px!important;
  padding:5px 8px!important;box-shadow:none!important;
}
.rating-star{font-size:10px!important;color:#fff!important}
.rating-num{font-size:12px!important;font-weight:800!important;color:#fff!important;line-height:1!important}
.rating-divider{display:block;width:1px!important;height:10px!important;background:rgba(255,255,255,.42)!important}
.rating-count{font-size:10px!important;font-weight:700!important;color:rgba(255,255,255,.93)!important;line-height:1!important}
.meta-chip{
  display:inline-flex;align-items:center!important;gap:5px!important;
  font-size:12px!important;font-weight:700!important;color:var(--ew-ink-2)!important;
}
.meta-chip i{color:var(--ew-ink-3)!important;font-size:11px!important}
.meta-dot{color:#D5DBE4!important;font-size:10px!important}

/* Visibility stays with the JS — only the look is set here. */
.offer-strip{
  margin-top:13px!important;align-items:center!important;gap:9px!important;
  padding:9px 10px!important;border-radius:12px!important;
  background:var(--ew-amber-soft)!important;border:1px solid var(--ew-amber-line)!important;
}
.offer-icon{
  width:24px!important;height:24px!important;flex:none!important;
  border-radius:8px!important;background:var(--ew-amber)!important;
}
.offer-icon i{font-size:10px!important;color:#fff!important}
.offer-text{font-size:12px!important;font-weight:700!important;color:#8A5312!important;line-height:1.4!important}

.delivery-strip{padding:10px 15px 11px!important;background:#FBFCFD!important;border-top:1px solid var(--ew-line)!important}
.del-chip{font-size:11px!important;font-weight:700!important;color:var(--ew-ink-2)!important}
.del-chip .orange{color:var(--ew-green)!important}
.del-chip .blue{color:var(--ew-ink-2)!important}

/* ── Category navigation ─────────────────────────────────── */
.cat-nav{
  top:58px!important;background:rgba(255,255,255,.98)!important;
  border-bottom:1px solid var(--ew-line)!important;
  box-shadow:0 2px 10px rgba(16,24,40,.05)!important;
}
.cat-nav-inner{padding:9px var(--gutter)!important;gap:7px!important;scroll-behavior:smooth}
.cat-nav-pill{
  padding:8px 14px!important;border-radius:999px!important;
  font-size:12px!important;font-weight:800!important;letter-spacing:-.1px!important;
  background:#F2F4F7!important;color:var(--ew-ink-2)!important;
  border:1px solid transparent!important;white-space:nowrap!important;
  transition:background .18s var(--ease),color .18s var(--ease);
}
.cat-nav-pill.active{background:var(--ew-ink)!important;border-color:var(--ew-ink)!important;color:#fff!important}
.cat-nav-pill:active{transform:scale(.97)}

/* ── Filters ─────────────────────────────────────────────── */
/* display is plain so syncVegFilterAvailability() can still hide this. */
.filter-bar{
  display:flex;margin:13px var(--gutter) 2px!important;
  padding:0!important;min-height:0!important;
  background:transparent!important;border:0!important;box-shadow:none!important;
  align-items:center!important;gap:9px!important;
}
/* The two chips read as filters on their own; the word is redundant. */
.filter-label{display:none}
.veg-toggle-row{display:flex;gap:8px!important;flex-wrap:wrap!important}
.veg-chip{
  display:inline-flex!important;align-items:center!important;gap:7px!important;
  min-height:36px;padding:8px 13px!important;border-radius:999px!important;

  <script>
  /* Item badges come from the API only. There is no hardcoded list of
     "bestsellers" — a badge is shown when the backend says so, never
     because an item's name happens to match a string in the frontend. */
  let activeFilter = null;
  let isRestaurantOpen = true; // tracks restaurant availability for item states
  let currentResId = null;

  function formatTime(timeStr) {
    if (!timeStr) return '';
    let [hours, minutes] = timeStr.split(':');
    let h = parseInt(hours, 10);
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12;
    if (h === 0) h = 12;
    return `${h}:${minutes} ${ampm}`;
  }

  /* The quick chips and the filter sheet describe the same thing — a diet
     preference — so they share one piece of state (sheetApplied.diet) and one
     visibility pass. They used to keep separate state and each recompute
     .hidden-by-filter alone, which meant using one silently discarded the
     other. `activeFilter` is still maintained for any outside reader. */
  function toggleFilter(type) {
    sheetApplied.diet = (sheetApplied.diet === type) ? null : type;
    activeFilter = (sheetApplied.diet === 'veg' || sheetApplied.diet === 'nonveg')
      ? sheetApplied.diet : null;
    syncQuickChips();
    updateFilterBadge();
    applyAllMenuFilters();
  }

  function syncQuickChips() {
    const veg = document.getElementById('filter-veg');
    const nonveg = document.getElementById('filter-nonveg');
    if (veg) {
      const on = sheetApplied.diet === 'veg';
      veg.classList.toggle('active', on);
      veg.setAttribute('aria-pressed', on ? 'true' : 'false');
    }
    if (nonveg) {
      const on = sheetApplied.diet === 'nonveg';
      nonveg.classList.toggle('active', on);
      nonveg.setAttribute('aria-pressed', on ? 'true' : 'false');
    }
  }

  /* Kept so any existing caller still works — it now runs the shared pass. */
  function applyFilter() {
    applyAllMenuFilters();
  }

  const catNav = document.getElementById('cat-nav');
  const sentinel = document.getElementById('cat-nav-sentinel');
  const menuSec = document.querySelector('.menu-section');

  const sentinelObs = new IntersectionObserver(entries => {
    const isHidden = !entries[0].isIntersecting;
    catNav.classList.toggle('visible', isHidden);
    menuSec.style.paddingTop = isHidden ? '44px' : '0px';
  }, { threshold: 0 });
  sentinelObs.observe(sentinel);

  function setupScrollSpy(categories) {
    const opts = { rootMargin: '-80px 0px -60% 0px', threshold: 0 };
    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          const id = e.target.id;
          document.querySelectorAll('.cat-nav-pill').forEach(p => p.classList.toggle('active', p.dataset.target === id));
          const activePill = document.querySelector(`.cat-nav-pill[data-target="${id}"]`);
          if (activePill) activePill.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        }
      });
    }, opts);
    categories.forEach(cat => {
      const el = document.getElementById('cat-' + cat.replace(/\s+/g, '-').toLowerCase());
      if (el) obs.observe(el);
    });
  }

  function scrollToCategory(catId) {
    const el = document.getElementById(catId);
    if (!el) return;
    const offset = 116;
    const top = el.getBoundingClientRect().top + window.scrollY - offset;
    window.scrollTo({ top, behavior: 'smooth' });
  }

  /* Builds a JS string literal that is safe to sit inside an HTML attribute.
     JSON.stringify handles every JS-string hazard (quotes, backslashes,
     newlines, line separators); escapeMenuHtml then handles the HTML layer,
     and the parser decodes it back before the JS is parsed.

     This replaces a hand-rolled .replace(/'/g, "\\'") that escaped quotes but
     NOT backslashes — a dish named  Chef\  produced  'Chef\\'  , which ends the
     string early and lets the rest of the name run as JavaScript in the
     browser of every customer who opens the menu. */
  function jsArg(value) {
    return escapeMenuHtml(JSON.stringify(String(value == null ? '' : value)));
  }

  window.makeBtnHTML = function(itemName, qty, price, rId, inStock, menuItemId, image, isVeg, originalPrice) {
    const safeName = jsArg(itemName);
    const safeId = jsArg(rId);
    const safeMenuItemId = jsArg(menuItemId || '');
    const safeImage = jsArg(resolveMenuImage(image) || '');
    const vegArg = isVeg ? 'true' : 'false';
    const numPrice = Number(price) || 0;
    const numOriginal = Number(originalPrice) || 0;
    const isItemAvailable = inStock !== false && isRestaurantOpen;

    // Items with real customization groups open the sheet instead of adding directly.
    if (isItemAvailable && window.__ewCust && window.__ewCust[menuItemId]) {
      return `<button onclick="ewOpenCustomize(${safeMenuItemId})" class="nb-add-btn nb-add-btn--cust" aria-label="Customise ${escapeMenuHtml(itemName)}">ADD <span class="nb-add-plus" aria-hidden="true">+</span></button>`;
    }

    if (qty > 0) {
      // Disables adding if unavailable. Allows removing if the restaurant is OPEN but the item is out of stock.
      // If the restaurant is CLOSED, all changes (add and remove) are disabled.
      const plusBtn = !isItemAvailable
        ? `<button class="nb-qty-btn is-disabled" onclick="notifyItemUnavailable()" aria-label="Item unavailable">+</button>`
        : `<button onclick="updateCart(${safeName}, 1, ${numPrice}, ${safeId}, true, ${safeMenuItemId}, ${safeImage}, ${vegArg}, ${numOriginal})" class="nb-qty-btn" aria-label="Increase quantity">+</button>`;
      
      const minusBtn = !isRestaurantOpen
        ? `<button class="nb-qty-btn is-disabled" onclick="notifyItemUnavailable()" aria-label="Item unavailable">−</button>`
        : `<button onclick="updateCart(${safeName}, -1, ${numPrice}, ${safeId}, true, ${safeMenuItemId}, ${safeImage}, ${vegArg}, ${numOriginal})" class="nb-qty-btn" aria-label="Decrease quantity">−</button>`;

      return `
        <div class="nb-qty${!isItemAvailable ? ' is-disabled' : ''}" role="group" aria-label="Quantity">
           ${minusBtn}
           <span class="nb-qty-val">${escapeMenuHtml(qty)}</span>
           ${plusBtn}
         </div>`;
    }

    if (!isItemAvailable) {
      return `<button class="nb-add-btn is-disabled" disabled>Unavailable</button>`;
    }
    return `<button onclick="updateCart(${safeName}, 1, ${numPrice}, ${safeId}, true, ${safeMenuItemId}, ${safeImage}, ${vegArg}, ${numOriginal})" class="nb-add-btn" aria-label="Add ${escapeMenuHtml(itemName)} to cart">ADD</button>`;
  };

  function notifyItemUnavailable() {
    if (!isRestaurantOpen) {
      alert("The restaurant is not accepting orders right now.");
    } else {
      alert("This item just went out of stock and can't be added right now.");
    }
  }

  /* ── Menu shape normaliser ───────────────────────────────────
     The backend groups the menu as { "Starters": [...] }. This also
     accepts a flat array (with a category field) so an API shape change
     degrades into a working page instead of a blank one. */
  function normalizeMenu(data) {
    if (!data) return [];

    if (Array.isArray(data)) {
      // [{ category, items: [...] }] or a flat list of items.
      if (data.length && data[0] && Array.isArray(data[0].items)) {
        return data
          .map(group => ({
            name: group.category || group.name || 'Menu',
            items: group.items.filter(Boolean)
          }))
          .filter(group => group.items.length);
      }

      const grouped = new Map();
      data.filter(Boolean).forEach(item => {
        const key = item.category || item.categoryName || 'Menu';
        if (!grouped.has(key)) grouped.set(key, []);
        grouped.get(key).push(item);
      });
      return Array.from(grouped, ([name, items]) => ({ name, items }));
    }

    if (typeof data === 'object') {
      return Object.keys(data)
        .map(name => ({
          name,
          items: Array.isArray(data[name]) ? data[name].filter(Boolean) : []
        }))
        .filter(group => group.items.length);
    }

    return [];
  }

  function cuisineText(restaurant) {
    if (Array.isArray(restaurant.cuisine)) return restaurant.cuisine.filter(Boolean).join(', ');
    if (typeof restaurant.cuisineDisplay === 'string' && restaurant.cuisineDisplay.trim()) {
      return restaurant.cuisineDisplay.trim();
    }
    if (typeof restaurant.cuisine === 'string') return restaurant.cuisine.trim();
    return '';
  }

  function setMetaChip(id, iconHtml, value) {
    const node = document.getElementById(id);
    if (!node) return;

    // No real value means no chip — never a placeholder like "2 km".
    if (!value) {
      node.style.display = 'none';
      const dot = node.previousElementSibling;
      if (dot && dot.classList.contains('meta-dot')) dot.style.display = 'none';
      return;
    }

    node.style.display = '';
    // iconHtml is a literal in every call site; value can come from the API.
    node.innerHTML = iconHtml + ' ' + escapeMenuHtml(value);
  }

  function selectedCustomerCoords() {
    try {
      const address = JSON.parse(localStorage.getItem('nearbite_address') || 'null');
      const c = address && address.location && address.location.coordinates;
      if (Array.isArray(c) && c.length === 2 && Number.isFinite(Number(c[0])) && Number.isFinite(Number(c[1]))) {
        return { lng: Number(c[0]), lat: Number(c[1]) };
      }
    } catch (e) {}
    return null;
  }

  function restaurantCoords(restaurant) {
    const c = restaurant && restaurant.location && restaurant.location.coordinates;
    if (!Array.isArray(c) || c.length !== 2) return null;
    if (!Number.isFinite(Number(c[0])) || !Number.isFinite(Number(c[1]))) return null;
    return { lng: Number(c[0]), lat: Number(c[1]) };
  }

  function distanceKm(a, b) {
    const R = 6371;
    const dLat = (b.lat - a.lat) * Math.PI / 180;
    const dLng = (b.lng - a.lng) * Math.PI / 180;
    const lat1 = a.lat * Math.PI / 180;
    const lat2 = b.lat * Math.PI / 180;
    const x = Math.sin(dLat/2)**2 + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLng/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
  }

  function formatRestaurantDistance(restaurant) {
    const customer = selectedCustomerCoords();
    const target = restaurantCoords(restaurant);
    if (customer && target) {
      const km = distanceKm(customer, target);
      return km < 1 ? Math.round(km * 1000) + ' m' : km.toFixed(1) + ' km';
    }
    const meters = Number(restaurant.distanceMeters);
    if (Number.isFinite(meters)) return meters < 1000 ? Math.round(meters) + ' m' : (meters/1000).toFixed(1) + ' km';
    return typeof restaurant.distance === 'string' ? restaurant.distance : '';
  }

  function openRestaurantDetails() {
    if (!currentResId) return;
    window.location.href = 'restaurant-details.html?id=' + encodeURIComponent(currentResId);
  }

  function renderRestaurantHeader(restaurant) {
    currentRestaurant = restaurant;   // used by the minimum-order hint
    const brand = (window.CONFIG && window.CONFIG.BRAND_NAME) || 'EatSwada';
    document.title = restaurant.name + ' – ' + brand;
    const restaurantName = restaurant.name || 'Restaurant';
    document.getElementById('res-name').innerText = restaurantName;
    const topResName = document.getElementById('top-res-name');
    if (topResName) topResName.innerText = restaurantName;

    const cuisine = cuisineText(restaurant);
    const cuisineEl = document.getElementById('res-cuisine');
    cuisineEl.innerText = cuisine;
    cuisineEl.style.display = cuisine ? '' : 'none';

    const ratingPill = document.querySelector('.rating-pill');
    const rating = Number(restaurant.rating);

    if (Number.isFinite(rating) && rating > 0) {
      if (ratingPill) ratingPill.style.display = '';
      document.getElementById('res-rating-num').innerText = rating.toFixed(1);

      const count = Number(restaurant.ratingCount);
      const countEl = document.getElementById('res-rating-count');
      if (Number.isFinite(count) && count > 0) {
        countEl.innerText = count.toLocaleString('en-IN') + ' ratings';
        countEl.style.display = '';
      } else {
        countEl.style.display = 'none';
        const divider = document.querySelector('.rating-divider');
        if (divider) divider.style.display = 'none';
      }
    } else if (ratingPill) {
      // Genuinely unrated restaurants say so rather than showing a made-up score.
      ratingPill.style.display = '';
      document.getElementById('res-rating-num').innerText = 'New';
      document.getElementById('res-rating-count').style.display = 'none';
      const divider = document.querySelector('.rating-divider');
      if (divider) divider.style.display = 'none';
    }

    const min = Number(restaurant.estimatedDeliveryMin);
    const max = Number(restaurant.estimatedDeliveryMax);
    let timeText = '';
    if (Number.isFinite(min) && Number.isFinite(max)) timeText = min + '-' + max + ' mins';
    else if (Number.isFinite(max)) timeText = max + ' mins';
    else if (typeof restaurant.time === 'string' && restaurant.time.trim()) timeText = restaurant.time.trim();
    setMetaChip('res-time', '<i class="fa-regular fa-clock"></i>', timeText);

    const distanceText = formatRestaurantDistance(restaurant);
    setMetaChip('res-distance', '<i class="fa-solid fa-location-dot"></i>', distanceText);

    const freeDeliveryEl = document.getElementById('res-free-delivery');
    if (freeDeliveryEl) {
      freeDeliveryEl.innerHTML = restaurant.freeDeliveryEnabled === false
        ? '<i class="fa-solid fa-motorcycle orange"></i> Delivery available'
        : '<i class="fa-solid fa-motorcycle orange"></i> FREE delivery' +
          (Number(restaurant.freeDeliveryAbove) > 0
            ? ' above ₹' + Number(restaurant.freeDeliveryAbove).toLocaleString('en-IN')
            : '');
    }

    const offer = restaurant.offer || restaurant.offerText || '';
    if (offer) {
      document.getElementById('res-offer-text').innerText = offer;
      document.getElementById('res-offer-banner').style.display = 'flex';
    } else {
      document.getElementById('res-offer-banner').style.display = 'none';
    }
  }

  function renderClosedWarning(restaurant) {
    const existing = document.querySelector('.closed-warning-card');
    if (existing) existing.remove();
    if (isRestaurantOpen) return;

    const reason = restaurant.availability && restaurant.availability.closedReason;
    const opensAt = restaurant.availability && restaurant.availability.opensAt;
    let warningHtml;

    if (reason === 'closed_today') {
      const timeStr = opensAt
        ? `Opens tomorrow at ${formatTime(opensAt)}.`
        : 'Not accepting orders today.';
      warningHtml = `
        <div class="closed-warning-card closed-today">
          <div class="closed-icon"><i class="fa-solid fa-moon"></i></div>
          <div class="closed-text">
            <h4>Closed Today</h4>
            <p>The restaurant is taking a break. ${timeStr}</p>
          </div>
        </div>`;
    } else {
      warningHtml = `
        <div class="closed-warning-card temp-closed">
          <div class="closed-icon"><i class="fa-solid fa-store-slash"></i></div>
          <div class="closed-text">
            <h4>Temporarily Closed</h4>
            <p>This restaurant is currently unavailable. Please check back later.</p>
          </div>
        </div>`;
    }

    document.querySelector('.res-card').insertAdjacentHTML('beforebegin', warningHtml);
  }

  function formatCompactCount(value) {
    const n = Number(value);
    if (!Number.isFinite(n) || n <= 0) return '';
    if (n < 1000) return Math.round(n).toLocaleString('en-IN');
    if (n < 1000000) {
      const k = n / 1000;
      return (k >= 10 ? Math.round(k) : Number(k.toFixed(1))) + 'k';
    }
    const m = n / 1000000;
    return (m >= 10 ? Math.round(m) : Number(m.toFixed(1))) + 'M';
  }

  function renderMenu(groups, resId) {
    const menuContainer = document.getElementById('menu-container');
    const navInner = document.getElementById('cat-nav-inner');
    const categories = groups.map(group => group.name);

    navInner.innerHTML = categories.map((cat, i) => {
      const catId = categoryDomId(cat);
      return `<div class="cat-nav-pill ${i === 0 ? 'active' : ''}" data-target="${catId}" onclick="scrollToCategory('${catId}')">${escapeMenuHtml(cat)}</div>`;
    }).join('');

    let cartMemory = {};
    try { cartMemory = JSON.parse(localStorage.getItem('nearbite_cart')) || {}; } catch (e) {}

    let globalIdx = 0;

    menuContainer.innerHTML = groups.map(group => {
      const catId = categoryDomId(group.name);

      const itemsHTML = group.items.map(item => {
        const key = String(item.name).replace(/\s+/g, '');
        const qty = cartMemory[item.name] ? cartMemory[item.name].quantity : 0;

        const cleanPrice = typeof item.price === 'number'
          ? item.price
          : parseFloat(String(item.price).replace(/[^\d.]/g, '')) || 0;

        const rawOriginalPrice = Number(item.originalPrice);
        const originalPrice = Number.isFinite(rawOriginalPrice) && rawOriginalPrice > cleanPrice
          ? rawOriginalPrice
          : null;
        const discountPercent = originalPrice
          ? Math.round((1 - cleanPrice / originalPrice) * 100)
          : 0;

        // Badges come from the API only.
        const badgeLabel = item.badge || item.tag ||
          (item.isBestseller === true || item.bestseller === true ? 'Bestseller' : '') ||
          (item.isMustTry === true || item.mustTry === true ? 'Must Try' : '');

        const itemCoupon = item.coupon || item.couponText || item.couponCode || item.couponLabel || '';
        const tagHTML = (badgeLabel ? `<span class="nb-item-badge">${escapeMenuHtml(badgeLabel)}</span>` : '') +
          (itemCoupon ? `<span class="nb-item-coupon"><i class="fa-solid fa-ticket"></i> ${escapeMenuHtml(itemCoupon)}</span>` : '');

        const vegKnown = typeof item.isVeg === 'boolean';
        const vegIcon = !vegKnown
          ? ''
          : item.isVeg
            ? `<span class="nb-veg-mark veg" title="Veg" aria-label="Veg"><span></span></span>`
            : `<span class="nb-veg-mark nonveg" title="Non-veg" aria-label="Non-veg"><span></span></span>`;

        const delay = (globalIdx++ * 0.04).toFixed(2);
        const imageSrc = item.image || item.img || '';
        const displayImage = resolveMenuImage(imageSrc);
        const inStock = item.inStock !== false;
        const isItemAvailable = inStock && isRestaurantOpen;

        let overlayText = '';
        if (!isRestaurantOpen) overlayText = 'Unavailable';
        else if (!inStock) overlayText = 'Out of Stock';

        const description = typeof item.desc === 'string' && item.desc.trim()
          ? item.desc.trim()
          : (typeof item.description === 'string' ? item.description.trim() : '');

        const ewHasCustom = Array.isArray(item.customizations) && item.customizations.some(g => g && Array.isArray(g.options) && g.options.length);
        if (ewHasCustom) {
          window.__ewCust = window.__ewCust || {};
          window.__ewCust[item._id] = { name: item.name, price: Number(cleanPrice) || Number(item.price) || 0, resId, menuItemId: item._id, image: imageSrc, isVeg: item.isVeg, originalPrice, groups: item.customizations };
        }
        const isCustomisable = item.isCustomisable === true || item.customisable === true || ewHasCustom;

        return `
          <div class="menu-item nb-menu-item"
               data-veg="${item.isVeg ? 'true' : 'false'}"
               data-veg-known="${vegKnown ? 'true' : 'false'}"
               data-egg="${item.isEgg === true || item.egg === true || item.diet === 'egg' ? 'true' : 'false'}"
               data-reordered="${item.highlyReordered === true || item.isHighlyReordered === true || item.reordered === true || item.isReordered === true ? 'true' : 'false'}"
               style="animation-delay:${delay}s;">

            <div class="nb-item-main">
              <div class="nb-item-tag-row">
                ${vegIcon}
                ${tagHTML}
              </div>
              <h3 class="nb-item-title">${escapeMenuHtml(item.name)}</h3>

              <div class="nb-item-price-row">
                <span class="nb-item-current-price">₹${cleanPrice}</span>
                ${originalPrice ? `<span class="nb-item-original-price">₹${originalPrice}</span><span class="nb-item-discount">${discountPercent}% OFF</span>` : ''}
              </div>

              ${(() => {
                const itemRating = Number(
                  item.rating ?? item.itemRating ?? item.avgRating ?? item.averageRating
                );
                const itemRatingCount = Number(
                  item.ratingCount ?? item.itemRatingCount ?? item.reviewCount ?? item.reviewsCount ?? item.ratingsCount
                );
                if (!Number.isFinite(itemRating) || itemRating <= 0) return '';
                const countText = Number.isFinite(itemRatingCount) && itemRatingCount > 0
                  ? ' <span class="nb-item-rating-count">(' + formatCompactCount(itemRatingCount) + ')</span>'
                  : '';
                return '<div class="nb-item-rating" aria-label="Item rating ' + itemRating.toFixed(1) + '">'
                  + '<span class="nb-item-rating-star" aria-hidden="true">★</span>'
                  + '<span class="nb-item-rating-value">' + itemRating.toFixed(1) + '</span>'
                  + countText
                  + '</div>';
              })()}

              ${description ? `<p class="nb-item-desc">${escapeMenuHtml(description)}</p>` : ''}
            </div>

            <div class="nb-item-media">
              <div class="nb-item-image-wrap${displayImage ? ' is-loading' : ''}">
                <div class="nb-item-image-placeholder" aria-hidden="true"><i class="fa-solid fa-utensils" aria-hidden="true"></i></div>
                ${displayImage
                  ? `<img class="nb-item-image ${!isItemAvailable ? 'is-unavailable' : ''}" src="${escapeMenuHtml(displayImage)}" alt="${escapeMenuHtml(item.name)}" loading="lazy" decoding="async" onload="this.classList.add('is-loaded'); this.closest('.nb-item-image-wrap').classList.remove('is-loading');" onerror="this.closest('.nb-item-image-wrap').classList.remove('is-loading'); this.remove();">`
                  : ''
                }
                ${overlayText ? `<div class="nb-item-overlay"><span>${overlayText}</span></div>` : ''}
              </div>

              <div id="btn-container-${key}" class="nb-item-cta">
                ${window.makeBtnHTML(item.name, qty, cleanPrice, resId, inStock, item._id, imageSrc, item.isVeg, originalPrice)}
              </div>

              ${isCustomisable ? `<div class="nb-item-customisable">Customisable</div>` : '<div class="nb-item-customisable nb-item-customisable-spacer"></div>'}
            </div>

          </div>`;
      }).join('');

      return `
        <div class="menu-cat-group" id="${catId}">
          <div class="menu-cat-header" onclick="toggleCategory(this)">
            <span class="menu-cat-title">${escapeMenuHtml(group.name)} <span class="menu-cat-count">(${group.items.length})</span></span>
            <i class="fa-solid fa-chevron-down menu-cat-chevron"></i>
          </div>
          <div class="menu-cat-items">${itemsHTML}</div>
        </div>`;
    }).join('');

    document.getElementById('menu-skeleton').style.display = 'none';
    menuContainer.style.display = 'block';
    setupScrollSpy(categories);
    syncVegFilterAvailability();
  }

  /* Decides whether a value is worth putting in <img src>. Returns the URL
     or '' to render the placeholder instead. Purely a display guard — the
     value passed to updateCart() is left exactly as the API sent it. */
  const MENU_IMAGE_REJECT = ['null', 'undefined', 'nan', 'none', 'false', '0'];

  function resolveMenuImage(raw) {
    if (typeof raw !== 'string') return '';

    const url = raw.trim();
    if (!url || MENU_IMAGE_REJECT.indexOf(url.toLowerCase()) !== -1) return '';

    if (/^https?:\/\//i.test(url)) return url;                       // absolute
    if (/^\/\//.test(url)) return url;                               // protocol-relative
    if (/^data:image\/[a-z0-9.+-]+;base64,/i.test(url)) return url;   // inline image
    if (/^[a-z][a-z0-9.+-]*:/i.test(url)) return '';                  // any other scheme
    return url;                                                       // relative path
  }

  /* Category names come from the vendor and used to be pasted straight into
     an inline onclick="scrollToCategory('...')" handler, where a name like
     a'); alert(1);// would break out of the string and run. Strip everything
     that isn't a letter, digit or dash so the id can only ever be an id. */
  function categoryDomId(name) {
    return 'cat-' + String(name == null ? '' : name)
      .toLowerCase()
      .replace(/\s+/g, '-')
      .replace(/[^a-z0-9\-]/g, '')
      .slice(0, 60) || 'cat';
  }

  function escapeMenuHtml(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  /* Hide the veg/non-veg filter when the menu carries no veg information,
     so it can never be a chip that filters nothing. */
  function syncVegFilterAvailability() {
    const bar = document.querySelector('.filter-bar');
    const quickRow = document.getElementById('quick-filter-row');
    if (!bar) return;
    const known = document.querySelectorAll('.menu-item[data-veg-known="true"]').length;
    if (quickRow) quickRow.style.display = known ? 'flex' : 'none';
    bar.style.display = '';
    updateFilterBadge();
  }

  async function loadRestaurantPage() {
    const params = new URLSearchParams(window.location.search);
    const resId = params.get('id');
    currentResId = resId;

    if (!resId) {
      return showErrorState('This link is missing a restaurant ID.', false);
    }

    showMenuSkeleton();

    try {
      const [restaurant, menuPayload] = await Promise.all([
        window.API.getObject(window.API.routes.restaurant(resId)),
        window.API.request(window.API.routes.restaurantMenu(resId))
      ]);

      isRestaurantOpen = restaurant.isOpen !== false &&
        !(restaurant.availability && restaurant.availability.isOpen === false);

      renderClosedWarning(restaurant);
      renderRestaurantHeader(restaurant);

      const groups = normalizeMenu(window.API.unwrap(menuPayload));

      if (!groups.length) {
        return showEmptyMenuState();
      }

      renderMenu(groups, resId);

      if (typeof window.updateGlobalCart === 'function') window.updateGlobalCart();
      renderOrderHint();
    } catch (error) {
      console.error('[restaurant] load failed:', error);
      showErrorState(error && error.message ? error.message : 'Please try again.', true);
    }
  }

  function showMenuSkeleton() {
    const skeleton = document.getElementById('menu-skeleton');
    const container = document.getElementById('menu-container');
    if (skeleton) skeleton.style.display = 'block';
    if (container) {
      container.style.display = 'none';
      container.innerHTML = '';
    }
  }

  function showEmptyMenuState() {
    document.getElementById('menu-skeleton').style.display = 'none';
    const container = document.getElementById('menu-container');
    container.style.display = 'block';
    container.innerHTML = `
      <div class="menu-state">
        <i class="fa-solid fa-utensils"></i>
        <p class="menu-state-title">Menu not available</p>
        <p class="menu-state-sub">This restaurant hasn't published its menu yet.</p>
      </div>`;
    const bar = document.querySelector('.filter-bar');
    if (bar) bar.style.display = 'none';
  }

  function showErrorState(message, canRetry) {
    document.getElementById('menu-skeleton').style.display = 'none';
    const container = document.getElementById('menu-container');
    container.style.display = 'block';
    container.innerHTML = `
      <div class="menu-state">
        <i class="fa-solid fa-plug-circle-xmark"></i>
        <p class="menu-state-title">Couldn't load this restaurant</p>
        <p class="menu-state-sub">${escapeMenuHtml(message || 'Please try again.')}</p>
        ${canRetry ? '<button type="button" class="menu-state-btn" id="menu-retry-btn">Try Again</button>' : ''}
      </div>`;

    const retry = document.getElementById('menu-retry-btn');
    if (retry) {
      retry.addEventListener('click', () => {
        retry.disabled = true;
        retry.textContent = 'Retrying…';
        loadRestaurantPage();
      });
    }

    const bar = document.querySelector('.filter-bar');
    if (bar) bar.style.display = 'none';
  }


  /* Advanced filter sheet — additive only. Existing restaurant loading,
     menu rendering, cart and API code remain unchanged. */
  let sheetDraft = { sort: null, diet: null, reordered: false };
  let sheetApplied = { sort: null, diet: null, reordered: false };

  function filterMenuItems() {
    return Array.from(document.querySelectorAll('.menu-item'));
  }

  function itemDiet(item) {
    if (item.dataset.egg === 'true') return 'egg';
    if (item.dataset.vegKnown !== 'true') return 'unknown';
    return item.dataset.veg === 'true' ? 'veg' : 'nonveg';
  }

  function isHighlyReordered(item) {
    if (item.dataset.reordered === 'true') return true;
    return !!item.querySelector('.nb-item-badge') &&
      /reorder/i.test(item.querySelector('.nb-item-badge').textContent || '');
  }

  function previewFilterCount() {
    let items = filterMenuItems();
    const query = menuSearchQuery.trim().toLowerCase();
    if (query) items = items.filter(item => itemSearchText(item).indexOf(query) !== -1);
    if (sheetDraft.diet) items = items.filter(item => itemDiet(item) === sheetDraft.diet);
    if (sheetDraft.reordered) items = items.filter(isHighlyReordered);
    return items.length;
  }

  function activeSheetCount() {
    return [sheetApplied.sort, sheetApplied.diet, sheetApplied.reordered ? 'reordered' : null].filter(Boolean).length;
  }

  function updateFilterBadge() {
    const badge = document.getElementById('filter-count-badge');
    if (badge) {
      const count = activeSheetCount();
      badge.textContent = count;
      badge.hidden = count === 0;
    }
  }

  function syncSheetOptions() {
    document.querySelectorAll('.sheet-option[data-sort]').forEach(btn =>
      btn.classList.toggle('selected', btn.dataset.sort === sheetDraft.sort)
    );
    document.querySelectorAll('.sheet-option[data-diet]').forEach(btn =>
      btn.classList.toggle('selected', btn.dataset.diet === sheetDraft.diet)
    );
    document.querySelectorAll('.sheet-option[data-top-pick]').forEach(btn =>
      btn.classList.toggle('selected', sheetDraft.reordered)
    );

    const count = previewFilterCount();
    const apply = document.getElementById('apply-filter-btn');
    const label = document.getElementById('apply-filter-count');
    if (label) label.textContent = '(' + count + ')';
    // Never disabled: a filter that legitimately matches nothing must be
    // applicable so the customer sees why, rather than a dead button.
    if (apply) apply.disabled = false;
  }

  function openFilterSheet() {
    sheetDraft = { ...sheetApplied };
    syncSheetOptions();
    const backdrop = document.getElementById('filter-sheet-backdrop');
    if (!backdrop) return;
    backdrop.classList.add('open');
    backdrop.setAttribute('aria-hidden', 'false');
    document.body.classList.add('filter-sheet-open');
  }

  function closeFilterSheet(event) {
    if (event && event.target && event.target.id !== 'filter-sheet-backdrop') return;
    const backdrop = document.getElementById('filter-sheet-backdrop');
    if (!backdrop) return;
    backdrop.classList.remove('open');
    backdrop.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('filter-sheet-open');
  }

  function setDraftSort(value) {
    sheetDraft.sort = sheetDraft.sort === value ? null : value;
    syncSheetOptions();
  }

  function setDraftDiet(value) {
    sheetDraft.diet = sheetDraft.diet === value ? null : value;
    syncSheetOptions();
  }

  function toggleDraftReordered() {
    sheetDraft.reordered = !sheetDraft.reordered;
    syncSheetOptions();
  }

  function clearAllFilters() {
    sheetDraft = { sort: null, diet: null, reordered: false };
    syncSheetOptions();
  }

  function applySheetFilters() {
    sheetApplied = { ...sheetDraft };
    activeFilter = (sheetApplied.diet === 'veg' || sheetApplied.diet === 'nonveg')
      ? sheetApplied.diet : null;

    // Sort within each category, preserving category grouping.
    if (sheetApplied.sort) {
      document.querySelectorAll('.menu-cat-group').forEach(group => {
        const box = group.querySelector('.menu-cat-items');
        if (!box) return;
        const children = Array.from(box.children).filter(el => el.classList.contains('menu-item'));
        children.sort((a, b) => {
          const pa = parseFloat((a.querySelector('.nb-item-current-price')?.textContent || '').replace(/[^\d.]/g,'')) || 0;
          const pb = parseFloat((b.querySelector('.nb-item-current-price')?.textContent || '').replace(/[^\d.]/g,'')) || 0;
          return sheetApplied.sort === 'price-asc' ? pa - pb : pb - pa;
        });
        children.forEach(child => box.appendChild(child));
      });
    }

    syncQuickChips();
    updateFilterBadge();
    applyAllMenuFilters();
    closeFilterSheet();
  }


  /* ══════════════════════════════════════════════════════════
     SHARED MENU VISIBILITY, IN-MENU SEARCH, ORDER HINTS
     Additive. No API route, storage key, cart function or
     restaurant-availability rule is touched below.
     ══════════════════════════════════════════════════════════ */

  let menuSearchQuery = '';

  function itemSearchText(item) {
    const title = item.querySelector('.nb-item-title');
    const desc  = item.querySelector('.nb-item-desc');
    return ((title ? title.textContent : '') + ' ' + (desc ? desc.textContent : '')).toLowerCase();
  }

  /* The one place .hidden-by-filter is written. Search, the quick chips and
     the sheet each narrow the same list, so they are combined here rather
     than each running their own pass. */
  function applyAllMenuFilters() {
    const items = Array.from(document.querySelectorAll('.menu-item'));
    const query = menuSearchQuery.trim().toLowerCase();
    let visible = 0;

    items.forEach(item => {
      let show = true;

      if (query) show = itemSearchText(item).indexOf(query) !== -1;

      // Items carrying no veg information are hidden by a diet filter rather
      // than being silently classified as non-veg.
      if (show && sheetApplied.diet) show = itemDiet(item) === sheetApplied.diet;
      if (show && sheetApplied.reordered) show = isHighlyReordered(item);

      item.classList.toggle('hidden-by-filter', !show);
      if (show) visible++;
    });

    // Collapse categories that have nothing left to show.
    document.querySelectorAll('.menu-cat-group').forEach(group => {
      const any = group.querySelector('.menu-item:not(.hidden-by-filter)');
      group.classList.toggle('cat-group-empty', !any);
    });

    updateMenuEmptyState(visible, query);
    return visible;
  }

  function updateMenuEmptyState(visible, query) {
    const box = document.getElementById('empty-filter-msg');
    if (!box) return;

    if (visible > 0) { box.style.display = 'none'; return; }

    const icon  = document.getElementById('empty-filter-icon');
    const title = document.getElementById('empty-filter-title');
    const sub   = document.getElementById('empty-filter-sub');

    let iconClass = 'fa-solid fa-sliders';
    let titleText = 'No dishes match these filters';
    let subText   = 'Try changing your filters.';

    if (query) {
      iconClass = 'fa-solid fa-magnifying-glass';
      titleText = 'No dishes found';
      subText   = 'Try searching for something else.';
    } else if (sheetApplied.reordered && !sheetApplied.diet) {
      // The backend may simply not mark any dish as highly reordered.
      iconClass = 'fa-solid fa-rotate-right';
      titleText = 'No highly reordered items found';
      subText   = 'This restaurant hasn\u2019t marked any dishes as highly reordered.';
    }

    if (icon)  icon.className = iconClass;
    if (title) title.textContent = titleText;
    if (sub)   sub.textContent = subText;
    box.style.display = 'block';
  }

  /* ── In-menu search ─────────────────────────────────────── */

  function toggleMenuSearch() {
    const row = document.getElementById('menu-search-row');
    if (!row) return;
    if (row.hidden) openMenuSearch(); else closeMenuSearch();
  }

  function openMenuSearch() {
    const row = document.getElementById('menu-search-row');
    const input = document.getElementById('menu-search-input');
    const btn = document.getElementById('menu-search-btn');
    if (!row) return;
    row.hidden = false;
    document.body.classList.add('menu-search-open');
    if (btn) btn.setAttribute('aria-expanded', 'true');
    if (input) setTimeout(() => input.focus(), 60);
  }

  function closeMenuSearch() {
    const row = document.getElementById('menu-search-row');
    const input = document.getElementById('menu-search-input');
    const btn = document.getElementById('menu-search-btn');
    if (input) input.value = '';
    menuSearchQuery = '';
    syncSearchClearButton();
    if (row) row.hidden = true;
    document.body.classList.remove('menu-search-open');
    if (btn) btn.setAttribute('aria-expanded', 'false');
    applyAllMenuFilters();
  }

  function syncSearchClearButton() {
    const clear = document.getElementById('menu-search-clear');
    if (clear) clear.hidden = menuSearchQuery.length === 0;
  }

  function onMenuSearchInput() {
    const input = document.getElementById('menu-search-input');
    menuSearchQuery = input ? input.value : '';
    syncSearchClearButton();
    applyAllMenuFilters();
  }

  function clearMenuSearch() {
    const input = document.getElementById('menu-search-input');
    if (input) { input.value = ''; input.focus(); }
    menuSearchQuery = '';
    syncSearchClearButton();
    applyAllMenuFilters();
  }

  /* ── Minimum order / free delivery hint ─────────────────── */

  let currentRestaurant = null;

  function firstPositiveNumber() {
    for (let i = 0; i < arguments.length; i++) {
      const n = Number(arguments[i]);
      if (Number.isFinite(n) && n > 0) return n;
    }
    return null;
  }

  const money = n => '\u20B9' + Math.ceil(n).toLocaleString('en-IN');

  /* Reads the existing nearbite_cart only — never writes to it. Returns null
     when a subtotal cannot be established from the stored entries, so a wrong
     figure is never shown. */
  function cartSubtotalForRestaurant() {
    let cart = null;
    try { cart = JSON.parse(localStorage.getItem('nearbite_cart')); } catch (e) { return null; }
    if (!cart || typeof cart !== 'object') return null;

    let subtotal = 0;
    let priced = false;

    Object.keys(cart).forEach(key => {
      const entry = cart[key];
      if (!entry || typeof entry !== 'object') return;

      const rid = entry.restaurantId || entry.resId || entry.restaurant || entry.rId;
      if (currentResId && rid && String(rid) !== String(currentResId)) return;

      const qty = Number(entry.quantity);
      const price = Number(entry.price != null ? entry.price : entry.itemPrice);
      if (!Number.isFinite(qty) || qty <= 0) return;
      if (!Number.isFinite(price) || price <= 0) return;

      subtotal += price * qty;
      priced = true;
    });

    return priced ? subtotal : null;
  }

  let freeDeliveryUnlockState = null;
  let freeDeliveryToastTimer = null;

  function showFreeDeliveryCongratulations() {
    const toast = document.getElementById('ew-free-delivery-toast');
    if (!toast) return;
    clearTimeout(freeDeliveryToastTimer);
    toast.classList.add('show');
    freeDeliveryToastTimer = setTimeout(() => {
      toast.classList.remove('show');
    }, 3200);
  }

  function renderOrderHint() {
    const box = document.getElementById('order-hint');
    if (!box) return;

    const restaurant = currentRestaurant;
    const subtotal = cartSubtotalForRestaurant();

    if (!restaurant || subtotal === null || subtotal <= 0) {
      box.hidden = true;
      freeDeliveryUnlockState = null;
      return;
    }

    // Minimum order is measured on the food subtotal only — no delivery fee,
    // no tip. The backend stays the final authority at checkout.
    const minimum = firstPositiveNumber(
      restaurant.minimumOrder, restaurant.minOrder,
      restaurant.minimumOrderAmount, restaurant.minOrderValue
    );

    const freeAbove = restaurant.freeDeliveryEnabled === false
      ? null
      : firstPositiveNumber(restaurant.freeDeliveryAbove);

    if (freeAbove === null) {
      freeDeliveryUnlockState = null;
    } else {
      const unlockedNow = subtotal >= freeAbove;
      if (freeDeliveryUnlockState === false && unlockedNow) {
        showFreeDeliveryCongratulations();
      }
      if (freeDeliveryUnlockState === null) {
        // Establish the initial state silently. Do not pop a message on page load.
      }
      freeDeliveryUnlockState = unlockedNow;
    }

    let html = '';
    let short = false;

    if (minimum && subtotal < minimum) {
      short = true;
      html = '<i class="fa-solid fa-circle-info" aria-hidden="true"></i>' +
             '<span>Minimum order ' + money(minimum) +
             ' · <b>Add ' + money(minimum - subtotal) + ' more</b></span>';
    } else if (freeAbove && subtotal < freeAbove) {
      html = '<i class="fa-solid fa-motorcycle" aria-hidden="true"></i>' +
             '<span>Add <b>' + money(freeAbove - subtotal) + ' more</b> for FREE delivery</span>';
    }

    // Once free delivery is reached, the persistent "unlocked" banner is gone.
    if (!html) {
      box.hidden = true;
      return;
    }

    box.innerHTML = html;
    box.classList.toggle('is-short', short);
    box.hidden = false;
  }

  /* updateCart() lives in cart-bar.js and is left exactly as it is — this
     wraps it so the hint can refresh after a quantity change, always calling
     through and never letting a hint error reach the cart. */
  (function hookCartUpdates() {
    if (typeof window.updateCart !== 'function' || window.updateCart.__ewHinted) return;
    const original = window.updateCart;
    const wrapped = function () {
      const result = original.apply(this, arguments);
      try { renderOrderHint(); } catch (e) { console.warn('[restaurant] order hint failed:', e); }
      return result;
    };
    wrapped.__ewHinted = true;
    window.updateCart = wrapped;
  })();

  document.addEventListener('keydown', event => {
    if (event.key !== 'Escape') return;
    const sheet = document.getElementById('filter-sheet-backdrop');
    if (sheet && sheet.classList.contains('open')) { closeFilterSheet(); return; }
    const row = document.getElementById('menu-search-row');
    if (row && !row.hidden) closeMenuSearch();
  });

  document.addEventListener('DOMContentLoaded', loadRestaurantPage);

  function toggleCategory(headerEl) {
    headerEl.classList.toggle('collapsed');
    const itemsEl = headerEl.nextElementSibling;
    if (itemsEl) itemsEl.classList.toggle('collapsed');
  }
  
    /* ── ULTRA PREMIUM BACK NAVIGATION ── */
  // Navigation is provided centrally by navigation.js.
  
  </script>

<script>
(function(){
  var cur = null; // { base, qty, sel: [Set per group] }
  var el = {};
  function build(){
    if (document.getElementById('ewcs-sheet')) return;
    var bd = document.createElement('div'); bd.className='ewcs-backdrop'; bd.id='ewcs-backdrop';
    var sh = document.createElement('div'); sh.className='ewcs-sheet'; sh.id='ewcs-sheet'; sh.setAttribute('role','dialog'); sh.setAttribute('aria-modal','true');
    sh.innerHTML =
      '<div class="ewcs-handle"></div>'+
      '<div class="ewcs-head"><div class="ewcs-htitle"><span class="ewcs-vegdot"></span><h3 id="ewcs-title"></h3></div><button class="ewcs-close" id="ewcs-close" aria-label="Close">✕</button></div>'+
      '<div class="ewcs-body" id="ewcs-body"></div>'+
      '<div class="ewcs-foot"><div class="ewcs-qty"><button id="ewcs-minus" aria-label="Decrease">−</button><span id="ewcs-qty">1</span><button id="ewcs-plus" aria-label="Increase">+</button></div><button class="ewcs-add" id="ewcs-add">Add item</button></div>';
    document.body.appendChild(bd); document.body.appendChild(sh);
    el = { bd:bd, sh:sh, title:document.getElementById('ewcs-title'), body:document.getElementById('ewcs-body'), qty:document.getElementById('ewcs-qty'), add:document.getElementById('ewcs-add') };
    bd.addEventListener('click', close);
    document.getElementById('ewcs-close').addEventListener('click', close);
    document.getElementById('ewcs-minus').addEventListener('click', function(){ cur.qty=Math.max(1,cur.qty-1); el.qty.textContent=cur.qty; refresh(); });
    document.getElementById('ewcs-plus').addEventListener('click', function(){ cur.qty=Math.min(20,cur.qty+1); el.qty.textContent=cur.qty; refresh(); });
    el.add.addEventListener('click', confirmAdd);
    el.body.addEventListener('change', refresh);
  }
  function money(n){ return '₹'+ (Math.round(Number(n)||0)); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

  window.ewOpenCustomize = function(id){
    var base = window.__ewCust && window.__ewCust[id];
    if (!base){ return; }
    build();
    cur = { base:base, qty:1 };
    el.title.textContent = base.name;
    document.querySelector('.ewcs-vegdot').className = 'ewcs-vegdot';
    el.qty.textContent = '1';
    // render groups
    var html = '';
    (base.groups||[]).forEach(function(g, gi){
      var max = Number(g.maxSelect||1)||1;
      var required = !!g.required;
      var multi = max > 1;
      var rule = multi ? ('Select up to '+max) : (required ? 'Required · Select 1' : 'Select 1');
      html += '<div class="ewcs-group" data-gi="'+gi+'" data-max="'+max+'" data-required="'+(required?1:0)+'" data-multi="'+(multi?1:0)+'" data-title="'+esc(g.title)+'">'+
        '<div class="ewcs-gtitle">'+esc(g.title||'Options')+'</div>'+
        '<div class="ewcs-grule">'+(required?'<span class="req">Required</span> · ':'')+esc(multi?('Select up to '+max):'Select 1')+'</div>';
      (g.options||[]).forEach(function(o, oi){
        var extra = Number(o.extraPrice||0);
        var priceTxt = extra>0 ? ('+'+money(extra)) : (required||multi ? 'Free' : '');
        var checkedDefault = (!multi && required && oi===0) ? 'checked' : '';
        html += '<label class="ewcs-opt">'+
            '<span class="veg '+(o.isVeg!==false?'v':'n')+'"></span>'+
            '<span class="lbl">'+esc(o.label)+'</span>'+
            (priceTxt?'<span class="pr '+(extra>0?'':'free')+'">'+priceTxt+'</span>':'')+
            '<input type="'+(multi?'checkbox':'radio')+'" name="ewcs-g'+gi+'" value="'+oi+'" data-extra="'+extra+'" '+checkedDefault+'>'+
          '</label>';
      });
      html += '</div>';
    });
    el.body.innerHTML = html;
    refresh();
    el.bd.classList.add('show');
    requestAnimationFrame(function(){ el.sh.classList.add('show'); });
  };

  function refresh(){
    if (!cur) return;
    var extra = 0, valid = true;
    el.body.querySelectorAll('.ewcs-group').forEach(function(grp){
      var multi = grp.getAttribute('data-multi')==='1';
      var max = Number(grp.getAttribute('data-max'))||1;
      var required = grp.getAttribute('data-required')==='1';
      var checked = grp.querySelectorAll('input:checked');
      checked.forEach(function(c){ extra += Number(c.getAttribute('data-extra'))||0; });
      // enforce max on multi by disabling unchecked when full
      if (multi){
        var full = checked.length >= max;
        grp.querySelectorAll('input[type=checkbox]').forEach(function(c){ if(!c.checked) c.disabled = full; });
      }
      if (required && checked.length < 1) valid = false;
    });
    var unit = Number(cur.base.price) + extra;
    el.add.disabled = !valid;
    el.add.textContent = valid ? ('Add item · '+money(unit*cur.qty)) : 'Select required options';
    cur._unit = unit;
  }

  function confirmAdd(){
    if (!cur || el.add.disabled) return;
    var flat = [], labels = [];
    el.body.querySelectorAll('.ewcs-group').forEach(function(grp){
      var title = grp.getAttribute('data-title');
      grp.querySelectorAll('input:checked').forEach(function(c){
        var lbl = c.closest('.ewcs-opt').querySelector('.lbl').textContent;
        var vegEl = c.closest('.ewcs-opt').querySelector('.veg');
        flat.push({ title:title, label:lbl, extraPrice:Number(c.getAttribute('data-extra'))||0, isVeg:!vegEl.classList.contains('n') });
        labels.push(lbl);
      });
    });
    var base = cur.base;
    var compositeName = labels.length ? (base.name + ' (' + labels.join(', ') + ')') : base.name;
    var unit = Number(cur._unit) || Number(base.price);
    var resName = '';
    try { resName = (window.currentRestaurant && window.currentRestaurant.name) || (document.getElementById('res-name') && document.getElementById('res-name').textContent.trim()) || ''; } catch(e){}
    var cart = {};
    try { cart = JSON.parse(localStorage.getItem('nearbite_cart')) || {}; } catch(e){ cart = {}; }
    if (cart[compositeName]) {
      cart[compositeName].quantity += cur.qty;
    } else {
      cart[compositeName] = {
        quantity: cur.qty,
        price: unit,
        originalPrice: (Number(base.originalPrice) > Number(base.price)) ? (Number(base.originalPrice) + (unit - Number(base.price))) : null,
        resId: base.resId,
        menuItem: base.menuItemId,
        image: base.image,
        name: compositeName,
        isVeg: base.isVeg,
        restaurantName: resName,
        customizations: flat
      };
    }
    try { localStorage.setItem('nearbite_cart', JSON.stringify(cart)); } catch(e){}
    if (typeof window.updateGlobalCart === 'function') window.updateGlobalCart();
    close();
  }

  function close(){
    if (!el.sh) return;
    el.sh.classList.remove('show'); el.bd.classList.remove('show');
    cur = null;
  }
})();
</script>
</body>
