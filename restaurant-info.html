<!doctype html>
<html lang="en">
<head>
<meta name="color-scheme" content="light dark">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<script>(function(){try{var t=localStorage.getItem('eatswada_theme');if(t==='dark')document.documentElement.dataset.ewTheme='dark';var h=localStorage.getItem('eatswada_header_theme');var ok=['raspberry'];document.documentElement.dataset.ewHeader=ok.indexOf(h)>-1?h:'raspberry';}catch(e){document.documentElement.dataset.ewHeader='raspberry';}})();</script>
<script src="https://cdn.jsdelivr.net/npm/darkreader@4.9.133/darkreader.js" data-ew-dark-reader></script>
<script src="eatswada-theme.js"></script>
<script src="eatswada-header-theme.js"></script>
<meta name="theme-color" content="#f5f6fb">
<title>Restaurant Information – Eatswada | EatSwada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300,0,0&display=swap">
<link rel="stylesheet" href="css/restaurant-info.css">
<link rel="stylesheet" href="css/eatswada-ui-system.css?v=20260923-typography">
<link rel="stylesheet" href="eatswada-theme.css">
<link rel="stylesheet" href="eatswada-header-theme.css">

<meta name="description" content="Explore EatSwada, your local food ordering platform in Maynaguri, West Bengal."/>
<meta name="robots" content="noindex, nofollow"/>
<link rel="canonical" href="https://eatswada.com/restaurant-info.html"/>
<meta property="og:type" content="website"/>
<meta property="og:site_name" content="EatSwada"/>
<meta property="og:title" content="Restaurant Information – Eatswada | EatSwada"/>
<meta property="og:description" content="Explore EatSwada, your local food ordering platform in Maynaguri, West Bengal."/>
<meta property="og:url" content="https://eatswada.com/restaurant-info.html"/>
<meta name="twitter:card" content="summary"/>
</head>
<body>
<header class="topbar">
  <button class="top-icon" id="back-btn" aria-label="Back"><span class="material-symbols-outlined">arrow_back</span></button>
  <button class="top-icon" id="share-btn" aria-label="Share"><span class="material-symbols-outlined">ios_share</span></button>
</header>

<main class="page">
  <section class="restaurant-card" id="restaurant-card" hidden>
    <div id="restaurant-header"></div>
    <div class="section-rule"></div>
    <div id="restaurant-hours"></div>
    <div id="restaurant-services"></div>
  </section>

  <section class="loading-card" id="loading-card">
    <div class="skeleton s1"></div><div class="skeleton s2"></div><div class="skeleton s3"></div>
  </section>

  <div class="fssai" id="fssai" hidden>
    <div>FSSAI Lic No</div>
    <strong id="fssai-value"></strong>
  </div>

  <section class="error-card" id="error-card" hidden>
    <strong>Unable to load restaurant</strong>
    <span id="error-text">Please try again.</span>
  </section>
</main>

<div class="bottom-bar"><button id="menu-btn">Go back to menu</button></div>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="safe-html.js"></script>
<script src="api.js"></script>
<script type="module" src="js/restaurant-info.js"></script>
</body>
</html>
