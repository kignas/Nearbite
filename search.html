<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Search – Nearbite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
<style>
  body{background:#fff;color:#1f2937;font-family:Poppins,sans-serif}
  .mind-section{padding:24px 18px 28px;background:#fff}
  .section-heading{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .section-heading h2{margin:0;font-size:18px;line-height:1.2;font-weight:900;letter-spacing:-.3px;text-transform:uppercase;color:#737985}
  .section-heading span{height:1px;background:#e5e7eb;flex:1}
  .mind-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));column-gap:10px;row-gap:22px}
  .mind-item{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .mind-item:active{transform:scale(.94)}
  .mind-image-wrap{width:74px;height:74px;border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden;background:linear-gradient(145deg,#fff7ef,#fff);}
  .mind-image-wrap img{width:100%;height:100%;object-fit:contain;padding:2px;display:block}
  .mind-item span{font-size:12px;font-weight:800;color:#3f4652;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .mind-skeleton{height:96px;border-radius:14px;background:linear-gradient(90deg,#f4f4f5 25%,#e9e9eb 37%,#f4f4f5 63%);background-size:400% 100%;animation:mindShimmer 1.3s infinite}
  @keyframes mindShimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}
  .result-card{display:flex;align-items:center;gap:13px;padding:14px 2px;text-decoration:none;color:inherit;border-bottom:1px solid #f1f2f4}
  .result-card img{width:64px;height:64px;object-fit:cover;border-radius:14px;background:#f3f4f6;flex:0 0 64px}
  .result-main{min-width:0;flex:1}.result-title-row{display:flex;align-items:center;gap:8px}.result-title-row strong{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.result-main p{margin:3px 0;color:#8a919d;font-size:11px}.result-main small{display:block;color:#a0a5ad;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.result-rating{font-size:10px;font-weight:800;color:#168a5c;background:#edf9f3;padding:3px 6px;border-radius:7px;white-space:nowrap}.result-arrow{color:#c5c9cf;font-size:11px}
  .search-empty{text-align:center;padding:70px 20px;color:#9ca3af}.search-empty i{font-size:40px;color:#e5e7eb;margin-bottom:14px}.search-empty p{margin:0;font-size:15px;font-weight:800;color:#4b5563}.search-empty span{font-size:11px}
  @media (min-width:600px){.mind-grid{grid-template-columns:repeat(6,1fr)}.mind-image-wrap{width:84px;height:84px}}
</style>
</head>
<body class="bg-white pb-20">

<!-- ── Sticky Search Bar ── -->
<div class="sticky top-0 bg-white z-50 px-4 pt-5 pb-4 border-b border-gray-100">
  <div class="flex items-center gap-3 bg-gray-100 rounded-2xl px-4 py-3.5 focus-within:ring-2 focus-within:ring-orange-400 transition-all">
    <button onclick="window.history.back()" class="flex-shrink-0">
      <i class="fa-solid fa-chevron-left text-orange-500 text-base"></i>
    </button>
    <input type="text" id="search-input"
           placeholder="Search restaurants or dishes..."
           autofocus
           class="flex-1 bg-transparent outline-none text-gray-800 text-[15px] font-semibold placeholder-gray-400">
    <button id="clear-btn" onclick="clearSearch()" class="hidden flex-shrink-0">
      <i class="fa-solid fa-xmark text-gray-400 text-base"></i>
    </button>
    <i class="fa-solid fa-microphone text-orange-500 text-base flex-shrink-0"></i>
  </div>
</div>

<!-- ── What's on your mind ── -->
<section id="mind-section" class="mind-section" aria-label="What's on your mind">
  <div class="section-heading">
    <h2>What's on your mind?</h2>
    <span></span>
  </div>
  <div id="mind-grid" class="mind-grid" aria-live="polite">
    <div class="mind-skeleton"></div><div class="mind-skeleton"></div><div class="mind-skeleton"></div><div class="mind-skeleton"></div>
    <div class="mind-skeleton"></div><div class="mind-skeleton"></div><div class="mind-skeleton"></div><div class="mind-skeleton"></div>
  </div>
</section>

<!-- ── Search Results ── -->
<div id="results-section" class="px-5 pt-4 hidden">
  <p id="results-count" class="text-[10px] font-black text-gray-400 tracking-widest uppercase mb-4">– results</p>
  <div id="results-list" class="flex flex-col divide-y divide-gray-50"></div>
</div>

<!-- ── Bottom Navigation ── -->
<nav class="bottom-nav">
  <a href="index.html" class="nav-item">
    <svg fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    <span>Home</span>
  </a>
  <a href="under99.html" class="nav-item">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/></svg>
    <span>₹99 Store</span>
  </a>
  <a href="search.html" class="nav-item active">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
    <span>Search</span>
  </a>
  <a href="orders.html" class="nav-item">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
    <span>Orders</span>
  </a>
  <a href="profile.html" class="nav-item">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
    <span>Profile</span>
  </a>
</nav>

<script>
  const API_BASE = 'https://eatswada.onrender.com/api';
  const searchInput = document.getElementById('search-input');
  const mindSection = document.getElementById('mind-section');
  const mindGrid = document.getElementById('mind-grid');
  const resultsSection = document.getElementById('results-section');
  const resultsList = document.getElementById('results-list');
  const resultsCount = document.getElementById('results-count');
  const clearBtn = document.getElementById('clear-btn');
  let restaurants = [];

  const FALLBACK_CATEGORIES = [
    {name:'Biryani',type:'Biryani',image:'https://media-assets.swiggy.com/swiggy/image/upload/fl_lossy,f_auto,q_auto,w_288,h_360/v1674029853/PC_Creative%20refresh/3D_folders/food/biryani.png'},
    {name:'Pizzas',type:'Pizza',image:'https://media-assets.swiggy.com/swiggy/image/upload/fl_lossy,f_auto,q_auto,w_288,h_360/v1674029856/PC_Creative%20refresh/3D_folders/food/pizza.png'},
    {name:'Burgers',type:'Burger',image:'https://media-assets.swiggy.com/swiggy/image/upload/fl_lossy,f_auto,q_auto,w_288,h_360/v1674029845/PC_Creative%20refresh/3D_folders/food/burger.png'},
    {name:'Momos',type:'Momos',image:'https://media-assets.swiggy.com/swiggy/image/upload/fl_lossy,f_auto,q_auto,w_288,h_360/v1674029852/PC_Creative%20refresh/3D_folders/food/momo.png'},
    {name:'Noodles',type:'Noodles',image:'https://media-assets.swiggy.com/swiggy/image/upload/fl_lossy,f_auto,q_auto,w_288,h_360/v1674029858/PC_Creative%20refresh/3D_folders/food/noodles.png'},
    {name:'Sweets',type:'Sweets',image:'https://images.unsplash.com/photo-1551024506-0bccd828d307?w=240&auto=format&fit=crop&q=80'},
    {name:'Fried Rice',type:'Fried Rice',image:'https://images.unsplash.com/photo-1603133872878-684f208fb84b?w=240&auto=format&fit=crop&q=80'},
    {name:'Rolls',type:'Rolls',image:'https://images.unsplash.com/photo-1601050690597-df0568f70950?w=240&auto=format&fit=crop&q=80'},
    {name:'Cakes',type:'Cakes',image:'https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=240&auto=format&fit=crop&q=80'},
    {name:'Ice Cream',type:'Ice Cream',image:'https://images.unsplash.com/photo-1563805042-7684c019e1cb?w=240&auto=format&fit=crop&q=80'},
    {name:'Puchka',type:'Puchka',image:'https://images.unsplash.com/photo-1601050690117-94f5f6fa8bd7?w=240&auto=format&fit=crop&q=80'},
    {name:'Dosa',type:'Dosa',image:'https://images.unsplash.com/photo-1589301760014-d929f3979dbc?w=240&auto=format&fit=crop&q=80'}
  ];

  function esc(v){return String(v ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

  function renderMind(categories){
    const cats = (categories || []).filter(c=>c && c.image).slice(0,12);
    const data = cats.length ? cats : FALLBACK_CATEGORIES;
    mindGrid.innerHTML = data.map((cat,i)=>`
      <button class="mind-item" type="button" onclick="quickSearch('${esc(cat.type).replace(/'/g,"\'")}')" aria-label="Search ${esc(cat.name)}">
        <div class="mind-image-wrap">
          <img src="${esc(cat.image)}" alt="${esc(cat.name)}" loading="lazy"
               onerror="this.onerror=null;this.src='${esc(FALLBACK_CATEGORIES[i % FALLBACK_CATEGORIES.length].image)}'">
        </div>
        <span>${esc(cat.name)}</span>
      </button>`).join('');
  }

  async function loadCategories(){
    try{
      const r=await fetch(`${API_BASE}/categories`,{cache:'no-store'});
      const j=await r.json();
      const cats=(j && j.success && Array.isArray(j.data)) ? j.data.filter(c=>c.isActive!==false).sort((a,b)=>(a.order??0)-(b.order??0)).map(c=>({name:c.name,type:c.name,image:c.image})) : [];
      renderMind(cats);
    }catch(e){renderMind([]);}
  }

  async function loadRestaurants(){
    try{
      const cached=sessionStorage.getItem('es_home_restaurants');
      if(cached) restaurants=JSON.parse(cached);
      if(!Array.isArray(restaurants) || !restaurants.length){
        const r=await fetch(`${API_BASE}/restaurants`,{cache:'no-store'});
        const j=await r.json();
        restaurants=(j && j.success && Array.isArray(j.data)) ? j.data : [];
        sessionStorage.setItem('es_home_restaurants',JSON.stringify(restaurants));
      }
    }catch(e){restaurants=[];}
  }

  function quickSearch(q){
    searchInput.value=q;
    searchInput.dispatchEvent(new Event('input',{bubbles:true}));
  }
  window.quickSearch=quickSearch;

  searchInput.addEventListener('input',e=>{
    const q=e.target.value.trim().toLowerCase();
    clearBtn.classList.toggle('hidden',!q);
    if(q){mindSection.classList.add('hidden');resultsSection.classList.remove('hidden');doSearch(q);}
    else clearSearch();
  });

  function doSearch(q){
    const matched=restaurants.filter(res=>{
      const name=String(res.name||'').toLowerCase();
      const cuisine=Array.isArray(res.cuisine)?res.cuisine.join(' ').toLowerCase():String(res.cuisine||'').toLowerCase();
      const menu=Array.isArray(res.menu)?res.menu:[];
      return name.includes(q)||cuisine.includes(q)||menu.some(item=>String(item.name||'').toLowerCase().includes(q));
    });
    resultsCount.innerText=`${matched.length} restaurant${matched.length!==1?'s':''} found`;
    if(!matched.length){resultsList.innerHTML=`<div class="search-empty"><i class="fa-solid fa-magnifying-glass"></i><p>No results for "${esc(searchInput.value)}"</p><span>Try searching for something else</span></div>`;return;}
    resultsList.innerHTML=matched.map(res=>{
      const id=esc(res._id||res.id||'');
      const dishes=(Array.isArray(res.menu)?res.menu:[]).filter(i=>String(i.name||'').toLowerCase().includes(q)).slice(0,3).map(i=>i.name).join(', ');
      return `<a href="restaurant.html?id=${encodeURIComponent(id)}" class="result-card">
        <img src="${esc(res.image||res.img||'')}" alt="${esc(res.name)}" onerror="this.style.display='none'">
        <div class="result-main"><div class="result-title-row"><strong>${esc(res.name)}</strong><span class="result-rating">${esc(res.rating||'4.0')} ★</span></div><p>${esc(Array.isArray(res.cuisine)?res.cuisine.join(', '):(res.cuisine||'Indian & Fast Food'))}</p>${dishes?`<small>Popular: ${esc(dishes)}</small>`:''}</div><i class="fa-solid fa-chevron-right result-arrow"></i>
      </a>`;
    }).join('');
  }

  function clearSearch(){searchInput.value='';clearBtn.classList.add('hidden');resultsSection.classList.add('hidden');mindSection.classList.remove('hidden');searchInput.focus();}
  window.clearSearch=clearSearch;

  document.addEventListener('DOMContentLoaded',()=>{renderMind([]);loadCategories();loadRestaurants();});
</script>
</body>
</html>
