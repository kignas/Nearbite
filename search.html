<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Search – Eatswada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">

<script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
<style>
  :root{--ew-green:#159447;--ew-text:#171717}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    background:#fff;color:var(--ew-text);
    font-family:"Manrope",sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:84px;
  }

  .search-header{
    position:sticky;top:0;z-index:50;
    background:rgba(255,255,255,.96);
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    padding:12px 16px 10px;
    border-bottom:1px solid rgba(0,0,0,.055)
  }
  .search-input-wrapper{
    min-height:54px;display:flex;align-items:center;gap:10px;
    background:#fff;border:1px solid #e5e7e8;border-radius:17px;
    padding:7px 10px 7px 9px;
    box-shadow:0 6px 22px rgba(0,0,0,.055);
    transition:border-color .2s,box-shadow .2s
  }
  .search-input-wrapper:focus-within{
    border-color:rgba(21,148,71,.48);
    box-shadow:0 8px 26px rgba(21,148,71,.11)
  }
  .search-back{
    width:38px;height:38px;flex:0 0 38px;border:0;border-radius:12px;
    display:grid;place-items:center;background:#f7f7f7;color:#454545
  }
  .search-icon{color:#777;font-size:16px;flex:0 0 auto}
  #search-input{
    min-width:0;color:#202020;font-family:"Manrope",sans-serif
  }
  #search-input::placeholder{color:#a0a0a0}
  .search-clear{
    width:32px;height:32px;display:grid;place-items:center;
    border:0;border-radius:10px;flex:0 0 32px;background:transparent
  }
  .search-clear:hover{background:#f5f5f5}
  .search-mic{
    width:35px;height:35px;display:grid;place-items:center;
    color:var(--ew-green);flex:0 0 35px;
    border:0;border-left:1px solid #ededed;padding-left:10px;
    box-sizing:content-box;background:transparent
  }

  .suggestion-chips{
    display:flex;gap:9px;overflow-x:auto;
    padding:12px 16px 18px;scrollbar-width:none;
    overscroll-behavior-x:contain
  }
  .suggestion-chips::-webkit-scrollbar{display:none}
  .chip{
    display:inline-flex;align-items:center;gap:7px;
    padding:9px 13px;border:1px solid #e8e9e9;border-radius:999px;
    font-family:"Manrope",sans-serif;font-size:11.5px;font-weight:700;
    color:#505050;white-space:nowrap;background:#fff;
    box-shadow:0 2px 7px rgba(0,0,0,.025);
    transition:transform .15s,border-color .15s
  }
  .chip:active{transform:scale(.97)}
  .chip i{color:var(--ew-green);font-size:9px}

  #results-section{padding-bottom:12px}
  .result-card{
    display:flex;align-items:center;gap:13px;padding:14px 0;
    text-decoration:none;color:inherit;border-bottom:1px solid #f0f0f0;
    transition:background .15s,transform .15s
  }
  .result-card:active{transform:scale(.99);background:#fafafa}
  .result-card img{
    width:76px;height:76px;object-fit:cover;border-radius:15px;
    background:#f3f4f6;flex:0 0 76px;box-shadow:0 5px 15px rgba(0,0,0,.07)
  }
  .result-main{min-width:0;flex:1}
  .result-title-row{
    display:flex;align-items:center;justify-content:space-between;gap:8px
  }
  .result-title-row strong{
    font-size:14px;line-height:1.35;font-weight:800;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#1c1c1c
  }
  .result-main p{
    margin:4px 0 0;color:#666;font-size:11.5px;line-height:1.45;
    font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
  }
  .result-main small{
    display:block;color:#888;font-size:10.5px;line-height:1.4;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    margin-top:5px;font-weight:600
  }
  .result-rating{
    font-size:10px;line-height:1;font-weight:800;color:#fff;
    background:#198f43;padding:5px 6px;border-radius:7px;
    white-space:nowrap;display:inline-flex;align-items:center;gap:3px;flex:0 0 auto
  }
  .search-empty{text-align:center;padding:72px 20px 90px;color:#9ca3af}
  .search-empty i{
    width:68px;height:68px;display:grid;place-items:center;margin:0 auto 18px;
    border-radius:50%;background:#f5f7f6;color:#c5cbc8;font-size:25px
  }
  .search-empty p{margin:0 0 5px;font-size:15px;font-weight:800;color:#2e2e2e}
  .search-empty span{font-size:12px;color:#888;font-weight:600}

  .bottom-nav{
    height:72px;padding:9px 12px calc(9px + env(safe-area-inset-bottom));
    box-shadow:0 -5px 22px rgba(0,0,0,.07)
  }
  .bottom-nav a{transition:transform .15s ease,color .15s ease}
  .bottom-nav a:active{transform:scale(.94)}
  .bottom-nav .active{color:var(--ew-green)!important}

  @media (min-width:600px){
    .search-header{padding-left:24px;padding-right:24px}
    .suggestion-chips{padding-left:24px;padding-right:24px}
    #results-section{max-width:760px;margin:0 auto}
  }
</style>
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<script src="api.js"></script>
</head>
<body class="bg-white pb-24">

<!-- ── Sticky Premium Search Bar ── -->
<div class="search-header">
  <div class="search-input-wrapper">
    <button onclick="window.history.back()" class="search-back" aria-label="Go back">
      <i class="fa-solid fa-chevron-left"></i>
    </button>
    <i class="fa-solid fa-magnifying-glass search-icon" aria-hidden="true"></i>
    <input type="text" id="search-input"
           placeholder="Search restaurants or dishes..."
           autocomplete="off" autocapitalize="none" spellcheck="false"
           class="flex-1 bg-transparent outline-none text-[15px] font-semibold">
    <button id="clear-btn" onclick="clearSearch()" class="search-clear hidden" aria-label="Clear search">
      <i class="fa-solid fa-xmark text-gray-400 text-lg"></i>
    </button>
    <button class="search-mic" type="button" aria-label="Voice search">
      <i class="fa-solid fa-microphone text-[15px]"></i>
    </button>
  </div>
</div>

<!-- ── Suggestion Chips ── -->
<div class="suggestion-chips" id="suggestion-chips">
  <button class="chip" onclick="quickSearch('Comfort food')"><i class="fa-solid fa-star-of-life"></i> Comfort food</button>
  <button class="chip" onclick="quickSearch('Netflix and chill')"><i class="fa-solid fa-star-of-life"></i> Netflix and chill</button>
  <button class="chip" onclick="quickSearch('Game night munchies')"><i class="fa-solid fa-star-of-life"></i> Game night munchies</button>
  <button class="chip" onclick="quickSearch('Quick bites')"><i class="fa-solid fa-star-of-life"></i> Quick bites</button>
</div>
<!-- ── Search Results ── -->
<div id="results-section" class="px-4 pt-2 hidden">
  <div id="results-list" class="flex flex-col"></div>
</div>

<!-- ── Bottom Navigation ── -->
<nav class="bottom-nav fixed bottom-0 w-full bg-white border-t border-gray-100 flex justify-around py-3 z-50">
  <a href="index.html" class="flex flex-col items-center text-gray-400 gap-1 text-[10px] font-bold">
    <i class="fa-solid fa-bowl-food text-xl"></i><span>Food</span>
  </a>
  <a href="under99.html" class="flex flex-col items-center text-gray-400 gap-1 text-[10px] font-bold">
    <i class="fa-solid fa-tag text-xl"></i><span>₹99 Store</span>
  </a>
  <a href="search.html" class="active flex flex-col items-center text-[10px] font-bold">
    <i class="fa-solid fa-magnifying-glass text-xl"></i><span>Search</span>
  </a>
  <a href="orders.html" class="flex flex-col items-center text-gray-400 gap-1 text-[10px] font-bold">
    <i class="fa-solid fa-receipt text-xl"></i><span>Orders</span>
  </a>
</nav>

<script>
  const searchInput = document.getElementById('search-input');
  const resultsSection = document.getElementById('results-section');
  const resultsList = document.getElementById('results-list');
  const clearBtn = document.getElementById('clear-btn');
  const chipsSection = document.getElementById('suggestion-chips');
  let restaurants = [];


  function esc(v){return String(v ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

  async function loadRestaurants(){
    // Shares the one restaurant cache used by the home and category pages.
    const cached = window.API.cache.readList(window.API.CACHE_KEYS.restaurants, 10*60*1000);
    if (cached) restaurants = cached;

    try{
      restaurants = await window.API.getList(window.API.routes.restaurants);
      window.API.cache.writeList(window.API.CACHE_KEYS.restaurants, restaurants);
    }catch(e){
      console.warn('[search] restaurant load failed:', e.message);
      if(!Array.isArray(restaurants)) restaurants=[];
    }
  }

  function quickSearch(q){
    searchInput.value=q;
    searchInput.dispatchEvent(new Event('input',{bubbles:true}));
  }
  window.quickSearch=quickSearch;

  searchInput.addEventListener('input',e=>{
    const q=e.target.value.trim().toLowerCase();
    clearBtn.classList.toggle('hidden',!q);
    if(q){
      chipsSection.classList.add('hidden');
      resultsSection.classList.remove('hidden');
      doSearch(q);
    } else {
      clearSearch();
    }
  });

  function doSearch(q){
    const matched=restaurants.filter(res=>{
      const name=String(res.name||'').toLowerCase();
      const cuisine=Array.isArray(res.cuisine)?res.cuisine.join(' ').toLowerCase():String(res.cuisine||'').toLowerCase();
      const menu=Array.isArray(res.menu)?res.menu:[];
      return name.includes(q)||cuisine.includes(q)||menu.some(item=>String(item.name||'').toLowerCase().includes(q));
    });
    
    if(!matched.length){
      resultsList.innerHTML=`<div class="search-empty">
        <i class="fa-solid fa-magnifying-glass"></i>
        <p>No restaurants or dishes found</p>
        <span>Please try another search or check your spelling</span>
      </div>`;
      return;
    }
    
    resultsList.innerHTML=matched.map(res=>{
      const id=esc(res._id||res.id||'');
      const dishes=(Array.isArray(res.menu)?res.menu:[]).filter(i=>String(i.name||'').toLowerCase().includes(q)).slice(0,3).map(i=>i.name).join(', ');
      return `<a href="restaurant.html?id=${encodeURIComponent(id)}" class="result-card">
        <img src="${esc(res.image||res.img||'')}" alt="${esc(res.name)}" onerror="this.style.display='none'">
        <div class="result-main">
          <div class="result-title-row">
            <strong>${esc(res.name)}</strong>
            <span class="result-rating">${esc(res.rating||'4.0')} <i class="fa-solid fa-star text-[8px]"></i></span>
          </div>
          <p>${esc(Array.isArray(res.cuisine)?res.cuisine.join(', '):(res.cuisine||'Indian, Fast Food'))}</p>
          ${dishes?`<small>Matches: ${esc(dishes)}</small>`:''}
        </div>
      </a>`;
    }).join('');
  }

  function clearSearch(){
    searchInput.value='';
    clearBtn.classList.add('hidden');
    resultsSection.classList.add('hidden');
    chipsSection.classList.remove('hidden');
    searchInput.focus();
  }
  window.clearSearch=clearSearch;

  document.addEventListener('DOMContentLoaded',()=>{loadRestaurants();});
</script>
</body>
</html>
