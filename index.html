<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>EatSwada – Food Near You</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<!-- Switched to Manrope for a more space-efficient, native-app feel -->
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"/>
<style>
  /* ══════════════════════════════════════════════════════════════
     1. BASE
     One continuous page background. Sections do not paint their own
     backgrounds — separation comes from spacing and from the cards.
     ══════════════════════════════════════════════════════════════ */
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --page-bg:      #FFFFFF;
    --surface:      #FFFFFF;
    --text:         #171A20;
    --text-soft:    #5B6472;
    --text-mute:    #8A93A2;
    --line:         #E3E6EB;
    --brand:        #FC8019;
    --brand-ink:    #0F172A;
  }

  html { background: var(--page-bg); }

  body {
    margin: 0;
    font-family: 'Manrope', system-ui, -apple-system, sans-serif;
    background: var(--page-bg);
    color: var(--text);
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: none;
    padding-bottom: 110px;
  }

  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

  .tap { transition: transform .13s ease, opacity .13s ease; cursor: pointer; }
  .tap:active { transform: scale(.96); opacity: .85; }

  @keyframes cardFadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ══════════════════════════════════════════════════════════════
     2. SKELETONS
     ══════════════════════════════════════════════════════════════ */
  @keyframes shimmer {
    0%   { background-position: -600px 0; }
    100% { background-position:  600px 0; }
  }

  .sk {
    display: block;
    background: linear-gradient(90deg, #E7E9ED 25%, #F3F4F7 50%, #E7E9ED 75%);
    background-size: 1200px 100%;
    animation: shimmer 1.5s infinite linear;
    border-radius: 10px;
  }
  .sk.d1 { animation-delay: .08s; }
  .sk.d2 { animation-delay: .16s; }
  .sk.d3 { animation-delay: .24s; }
  .sk.d4 { animation-delay: .32s; }

  .cs-item { display: flex; flex-direction: column; align-items: center; width: 100%; }
  .cs-ring { width: 100%; aspect-ratio: 1/1; border-radius: 50%; }
  .cs-name { width: 70%; height: 11px; margin-top: 8px; border-radius: 5px; }

  /* ══════════════════════════════════════════════════════════════
     3. EATSWADA HEADER — HEADER-ONLY THEME SYSTEM
     Everything below this header remains unchanged.
     ══════════════════════════════════════════════════════════════ */
  /* ══════════════════════════════════════════════════════════════
     3. EATSWADA HEADER — BENCHMARK HEADER SYSTEM
     Header-only. Everything below this block remains unchanged.
     ══════════════════════════════════════════════════════════════ */

  .hero-header{position:relative;z-index:10;isolation:isolate;padding:12px 16px 10px;background:var(--hd-bg,#fff);color:var(--hd-ink,#202431);border-radius:0 0 28px 28px;box-shadow:0 5px 18px rgba(15,23,42,.045);transition:background .28s ease,color .28s ease;}
  .hero-header[data-theme="anime"]{--hd-bg:#fff;--hd-ink:#202431;--hd-muted:#687386;--hd-accent:#d20a61;}
  .hero-header[data-theme="pink"]{--hd-bg:#ffd9e7;--hd-ink:#202431;--hd-muted:#687386;--hd-accent:#d20a61;}
  .hero-header[data-theme="lavender"]{--hd-bg:#ded0ff;--hd-ink:#202431;--hd-muted:#665f78;--hd-accent:#6839c7;}
  .hero-header[data-theme="magenta"]{--hd-bg:#b90058;--hd-ink:#fff;--hd-muted:rgba(255,255,255,.82);--hd-accent:#ffdf70;}
  .hero-header>*{position:relative;z-index:2;}

  .loc-row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:50px;margin:0 0 11px;}
  .loc-left{display:flex;align-items:center;gap:10px;min-width:0;text-decoration:none;color:var(--hd-ink);}
  .loc-pin-wrap{flex:0 0 44px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#d20a61;box-shadow:0 5px 14px rgba(210,10,97,.16);}
  .loc-pin-wrap i{font-size:18px;color:#fff;}
  .hero-header[data-theme="magenta"] .loc-pin-wrap{background:rgba(255,255,255,.18);box-shadow:none;}
  .loc-copy{display:flex;flex-direction:column;justify-content:center;min-width:0;line-height:1.08;}
  .loc-name-row{display:flex;align-items:center;gap:6px;min-width:0;}
  .loc-name{font-size:17px;font-weight:800;letter-spacing:-.35px;color:var(--hd-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .loc-chevron{font-size:10px;color:var(--hd-muted);flex:0 0 auto;}
  .loc-sub{margin:3px 0 0;font-size:11px;font-weight:600;color:var(--hd-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .loc-right{display:flex;align-items:center;gap:8px;flex:0 0 auto;}
  .btn-store{width:84px;height:44px;border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;background:rgba(255,255,255,.76);border:1px solid rgba(210,10,97,.12);box-shadow:0 4px 12px rgba(15,23,42,.035);}
  .hero-header[data-theme="magenta"] .btn-store{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.25);}
  .store-top{font-size:8px;font-weight:900;letter-spacing:.5px;text-transform:uppercase;line-height:1;color:var(--hd-muted);}
  .store-bot{font-size:17px;font-weight:900;line-height:1.1;color:var(--hd-accent);}
  .btn-profile{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;text-decoration:none;background:#fff;box-shadow:0 4px 12px rgba(15,23,42,.05);}
  .profile-initial{font-size:16px;font-weight:900;color:#b80057;}

  .search-row{display:flex;align-items:center;gap:9px;height:56px;margin:0;position:relative;z-index:6;}
  .search-box{flex:1;min-width:0;height:56px;display:flex;align-items:center;gap:11px;padding:0 16px;border-radius:17px;background:#fff;border:1px solid rgba(15,23,42,.035);box-shadow:0 6px 16px rgba(15,23,42,.055);text-decoration:none;overflow:hidden;}
  .search-icon{font-size:18px;color:#263342;flex:0 0 auto;}
  .search-text{flex:1;min-width:0;font-size:14px;font-weight:600;color:#667085;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .search-mic{border:0;background:transparent;padding:4px 2px;flex:0 0 auto;color:#d20a61;font-size:17px;cursor:pointer;display:grid;place-items:center;}
  .search-mic.is-listening{animation:voicePulse .9s ease-in-out infinite;}
  @keyframes voicePulse{50%{transform:scale(1.15);opacity:.65;}}
  .veg-box{flex:0 0 66px;width:66px;height:56px;border-radius:17px;background:#fff;border:1px solid rgba(15,23,42,.035);box-shadow:0 6px 16px rgba(15,23,42,.05);color:#334155;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;}
  .veg-label-txt{font-size:8px;font-weight:900;letter-spacing:1px;color:#334155;}
  .veg-track{width:34px;height:17px;border-radius:99px;background:#e2e8f0;position:relative;transition:background .18s ease;}
  .veg-track.on{background:#20b866;}
  .veg-thumb{width:17px;height:17px;position:absolute;left:0;top:0;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(15,23,42,.15);transition:transform .18s ease;display:flex;align-items:center;justify-content:center;}
  .veg-track.on .veg-thumb{transform:translateX(17px);}
  .veg-inner{width:7px;height:7px;border:1.5px solid #16a34a;border-radius:2px;display:flex;align-items:center;justify-content:center;}
  .veg-inner-dot{width:3px;height:3px;background:#16a34a;border-radius:50%;}

  .banner-wrap{position:relative;height:274px;margin:10px 0 0;padding:0;z-index:3;border-radius:25px;overflow:hidden;box-shadow:0 8px 22px rgba(15,23,42,.065);}
  .header-carousel{position:relative;width:100%;height:100%;overflow:hidden;touch-action:pan-y;overscroll-behavior-x:contain;}
  .header-carousel-track{display:flex;height:100%;gap:0;will-change:transform;transform:translate3d(0,0,0);transition:transform .42s cubic-bezier(.22,1,.36,1);}
  .header-carousel-track.is-dragging{transition:none;}
  .header-slide{position:relative;flex:0 0 100%;width:100%;height:100%;overflow:hidden;background:var(--sl-bg,#fff);}
  .header-slide[data-theme="anime"]{--sl-bg:#fff;--sl-ink:#1f2430;--sl-muted:#687386;--sl-accent:#d20a61;--sl-cta-bg:#d20a61;--sl-cta-ink:#fff;}
  .header-slide[data-theme="pink"]{--sl-bg:linear-gradient(145deg,#f7b4ca,#ef86aa);--sl-ink:#172033;--sl-muted:#4d5564;--sl-accent:#c50057;--sl-cta-bg:#c50057;--sl-cta-ink:#fff;}
  .header-slide[data-theme="lavender"]{--sl-bg:linear-gradient(145deg,#bba7ee,#8b6bd2);--sl-ink:#fff;--sl-muted:rgba(255,255,255,.92);--sl-accent:#ffe078;--sl-cta-bg:#fff;--sl-cta-ink:#5a2ea6;}
  .header-slide[data-theme="magenta"]{--sl-bg:linear-gradient(145deg,#c1005d,#770039);--sl-ink:#fff;--sl-muted:rgba(255,255,255,.92);--sl-accent:#ffdf70;--sl-cta-bg:#fff;--sl-cta-ink:#a1004b;}
  .header-slide__panel{position:absolute;inset:0;background:var(--banner-bg,var(--sl-bg));transition:background .35s ease;}
  .header-slide__copy{position:absolute;left:22px;top:0;bottom:0;width:56%;max-width:56%;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;z-index:3;color:var(--sl-ink);}
  .header-slide__art{position:absolute;right:-1%;top:0;bottom:0;width:65%;height:100%;object-fit:cover;object-position:center right;z-index:1;pointer-events:none;-webkit-user-drag:none;}
  .header-slide__panel::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(90deg,rgba(255,255,255,.98) 0%,rgba(255,255,255,.82) 30%,rgba(255,255,255,0) 63%);}
  .header-slide[data-theme="pink"] .header-slide__panel::after{background:linear-gradient(90deg,rgba(255,217,231,.98) 0%,rgba(255,217,231,.82) 30%,rgba(255,217,231,0) 65%);}
  .header-slide[data-theme="lavender"] .header-slide__panel::after{background:linear-gradient(90deg,rgba(128,95,205,.82) 0%,rgba(128,95,205,.45) 32%,rgba(128,95,205,0) 67%);}
  .header-slide[data-theme="magenta"] .header-slide__panel::after{background:linear-gradient(90deg,rgba(170,0,79,.9) 0%,rgba(170,0,79,.48) 34%,rgba(170,0,79,0) 70%);}
  .banner-badge{display:inline-flex;align-items:center;min-height:20px;padding:0 9px;margin-bottom:7px;border-radius:999px;background:rgba(255,255,255,.6);font-size:8px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:var(--sl-ink);}
  .banner-title{margin:0;font-size:28px;line-height:1.02;letter-spacing:-.8px;font-weight:900;color:var(--sl-ink);max-width:12ch;}
  .banner-title-accent{color:var(--sl-accent);}
  .banner-subtitle{margin:9px 0 0;font-size:13px;line-height:1.35;font-weight:650;color:var(--sl-muted);max-width:20ch;}
  .banner-offer{margin:7px 0 0;font-size:14px;line-height:1.2;font-weight:900;color:var(--sl-ink);}
  .banner-cta{margin-top:13px;display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:0 17px;border-radius:999px;background:var(--sl-cta-bg);color:var(--sl-cta-ink);font-size:12px;font-weight:900;text-decoration:none;box-shadow:0 5px 12px -9px rgba(0,0,0,.45);}
  .banner-cta i{font-size:10px;}
  .banner-controls{position:absolute;left:50%;bottom:13px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;z-index:5;}
  .banner-controls[hidden]{display:none;}
  .banner-dot{width:7px;height:7px;border:0;padding:0;border-radius:999px;background:rgba(110,120,140,.35);transition:width .25s ease,background .25s ease;cursor:pointer;}
  .banner-dot.is-active{width:18px;background:#d20a61;}
  .hero-header[data-theme="lavender"] .banner-dot,.hero-header[data-theme="magenta"] .banner-dot{background:rgba(255,255,255,.45);}
  .hero-header[data-theme="lavender"] .banner-dot.is-active,.hero-header[data-theme="magenta"] .banner-dot.is-active{background:#fff;}

  @keyframes bannerWobble{0%{transform:translateY(4px) rotate(-.6deg);opacity:.55;}45%{transform:translateY(-1px) rotate(.4deg);opacity:1;}72%{transform:translateY(1px) rotate(-.2deg);}100%{transform:translateY(0) rotate(0);opacity:1;}}
  .header-slide.is-active .banner-badge{animation:bannerWobble .72s cubic-bezier(.34,1.25,.5,1) both;}
  .header-slide.is-active .banner-title{animation:bannerWobble .72s cubic-bezier(.34,1.25,.5,1) both;}
  .header-slide.is-active .banner-subtitle{animation:bannerWobble .72s cubic-bezier(.34,1.25,.5,1) .07s both;}
  .header-slide.is-active .banner-offer{animation:bannerWobble .72s cubic-bezier(.34,1.25,.5,1) .1s both;}
  .header-slide.is-active .banner-cta{animation:bannerWobble .72s cubic-bezier(.34,1.25,.5,1) .14s both;}

  @media(max-width:380px){
    .hero-header{padding:10px 14px 9px;}
    .loc-name{font-size:16px;}.loc-sub{font-size:10px;}
    .loc-pin-wrap{flex-basis:42px;width:42px;height:42px;}
    .btn-store{width:78px;height:42px;}.btn-profile{width:42px;height:42px;}
    .search-row{height:54px;}.search-box,.veg-box{height:54px;}
    .banner-wrap{height:248px;margin-top:9px;border-radius:22px;}
    .header-slide__copy{left:19px;width:58%;max-width:58%;}
    .header-slide__art{width:68%;}
    .banner-title{font-size:25px;}.banner-subtitle{font-size:11px;}
    .banner-controls{bottom:11px;}
  }
  @media(prefers-reduced-motion:reduce){
    .hero-header{transition:none;}.header-carousel-track{transition:none !important;}
    .header-slide.is-active .banner-badge,.header-slide.is-active .banner-title,
    .header-slide.is-active .banner-subtitle,.header-slide.is-active .banner-offer,
    .header-slide.is-active .banner-cta{animation:none !important;}
    .search-mic.is-listening{animation:none;}
  }

  /* ══════════════════════════════════════════════════════════════
     4. PAGE SECTIONS — shared, transparent, one background
     ══════════════════════════════════════════════════════════════ */
  .page { padding-top: 4px; }

  .section { padding: 20px 0 4px; }
  .section[hidden] { display: none; }

  .sec-head { display: flex; align-items: center; gap: 12px; padding: 0 18px; margin-bottom: 14px; }

  /* Upgraded to Zomato-style section titles */
  .sec-title {
    margin: 0;
    font-size: 12px;
    font-weight: 700;
    color: #64748B;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .sec-head::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  /* ── What's on your mind ── */
  .cat-scroll {
    display: grid;
    grid-template-rows: repeat(2, auto);
    grid-auto-flow: column;
    grid-auto-columns: 25vw;
    justify-content: start;
    gap: 18px 14px;
    padding: 4px 18px 20px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scroll-behavior: smooth;
    scroll-snap-type: x proximity;
    overscroll-behavior-x: contain;
  }
  @media (min-width: 620px) { .cat-scroll { grid-auto-columns: 120px; } }

  .cat-item {
    display: flex; flex-direction: column; align-items: center; width: 100%;
    text-decoration: none; scroll-snap-align: start;
    -webkit-tap-highlight-color: transparent;
    transition: transform .18s ease, opacity .18s ease;
  }
  .cat-item:active { transform: scale(.93); opacity: .8; }

  .cat-ring { width: 100%; aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; }
  .cat-ring img { width: 100%; height: 100%; object-fit: contain; transform: scale(1.2); opacity: 0; transition: opacity .25s ease; }
  .cat-ring img.loaded { opacity: 1; }

  .cat-name { font-size: 14px; font-weight: 700; color: #2A2F3A; text-align: center; line-height: 1.2; }

  /* ── Filter bar ── */
  .filter-bar {
    display: flex; gap: 8px; overflow-x: auto;
    padding: 4px 18px 16px;
    scrollbar-width: none;
    background: transparent;
  }
  .filter-bar[hidden] { display: none; }
  .filter-bar::-webkit-scrollbar { display: none; }

  .filter-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 9px 14px; flex-shrink: 0;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    font-family: inherit; font-size: 14px; font-weight: 600; color: #3B4453;
    white-space: nowrap; cursor: pointer;
    box-shadow: 0 1px 2px rgba(15,23,42,.04);
    transition: background .18s ease, border-color .18s ease, color .18s ease, transform .12s ease;
  }
  .filter-pill:active { transform: scale(.95); }
  .filter-pill.active {
    background: #FFF3E8;
    color: #C2560A;
    border-color: var(--brand);
    box-shadow: none;
  }
  .filter-count {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 18px; height: 18px; padding: 0 5px; margin-left: 2px;
    border-radius: 9px; background: var(--brand); color: #fff;
    font-size: 11px; font-weight: 800;
  }

  /* ── Refresh notice ── */
  #home-notice {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin: 0 18px 14px; padding: 10px 14px;
    background: #FFF8EC; border: 1px solid #F6DFBE; border-radius: 12px;
    font-size: 13px; font-weight: 600; color: #8A5A12;
  }
  #home-notice[hidden] { display: none; }
  .notice-retry {
    border: none; background: transparent; color: #B45309;
    font-family: inherit; font-size: 13px; font-weight: 800;
    text-decoration: underline; cursor: pointer; flex-shrink: 0; padding: 0;
  }

  /* ── Empty / error blocks ── */
  .state-block { text-align: center; padding: 44px 24px 52px; }
  .state-icon { font-size: 40px; color: #C3C9D4; display: block; margin-bottom: 14px; }
  .state-title { font-size: 16px; font-weight: 800; color: #303845; margin: 0 0 6px; }
  .state-sub { font-size: 13px; font-weight: 500; color: var(--text-soft); margin: 0 0 18px; line-height: 1.5; }
  .state-btn {
    background: var(--brand); color: #fff; border: none;
    padding: 12px 26px; border-radius: 12px;
    font-family: inherit; font-size: 14px; font-weight: 800; cursor: pointer;
  }
  .state-btn:active { transform: scale(.97); }
  .state-btn:disabled { opacity: .6; cursor: default; }

  /* ══════════════════════════════════════════════════════════════
     5. FILTER SHEET
     ══════════════════════════════════════════════════════════════ */
  .filter-sheet { position: fixed; inset: 0; z-index: 100001; }
  .filter-sheet[hidden] { display: none; }

  .sheet-backdrop {
    position: absolute; inset: 0; background: rgba(15,23,42,.45);
    opacity: 0; transition: opacity .22s ease;
  }
  .filter-sheet.open .sheet-backdrop { opacity: 1; }

  .sheet-panel {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: var(--surface); border-radius: 22px 22px 0 0;
    padding: 8px 20px calc(24px + env(safe-area-inset-bottom, 0px));
    max-height: 78vh; overflow-y: auto;
    transform: translateY(100%); transition: transform .24s cubic-bezier(.22,1,.36,1);
  }
  .filter-sheet.open .sheet-panel { transform: translateY(0); }

  .sheet-grabber { width: 40px; height: 4px; border-radius: 2px; background: #DEE2E8; margin: 6px auto 14px; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .sheet-title { font-size: 18px; font-weight: 800; margin: 0; color: var(--text); }
  .sheet-clear {
    border: none; background: transparent; color: var(--brand);
    font-family: inherit; font-size: 13px; font-weight: 800; cursor: pointer; padding: 4px;
  }
  .sheet-group-title {
    font-size: 12px; font-weight: 800; letter-spacing: .8px; text-transform: uppercase;
    color: var(--text-mute); margin: 18px 0 8px;
  }
  .sheet-options { display: flex; flex-direction: column; }
  .sheet-option {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; padding: 14px 2px; border: none; border-bottom: 1px solid #F1F2F5;
    background: transparent; font-family: inherit; font-size: 15px; font-weight: 600;
    color: #333A45; text-align: left; cursor: pointer;
  }
  .sheet-option i { color: var(--brand); opacity: 0; font-size: 14px; }
  .sheet-option.selected { color: #C2560A; font-weight: 800; }
  .sheet-option.selected i { opacity: 1; }
  .sheet-done {
    width: 100%; margin-top: 20px; padding: 15px;
    background: var(--brand-ink); color: #fff; border: none; border-radius: 14px;
    font-family: inherit; font-size: 15px; font-weight: 800; cursor: pointer;
  }

  /* ══════════════════════════════════════════════════════════════
     6. LOCATION — permission sheet, status banner, card availability
     Additive only. Reuses the sheet shell, tokens and type above so
     the existing Home layout is untouched.
     ══════════════════════════════════════════════════════════════ */
  .loc-sheet { position: fixed; inset: 0; z-index: 100002; }
  .loc-sheet[hidden] { display: none; }
  .loc-sheet .sheet-backdrop { opacity: 0; transition: opacity .22s ease; }
  .loc-sheet.open .sheet-backdrop { opacity: 1; }
  .loc-sheet .sheet-panel {
    transform: translateY(100%);
    transition: transform .24s cubic-bezier(.22,1,.36,1);
    padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  }
  .loc-sheet.open .sheet-panel { transform: translateY(0); }

  .loc-sheet-pin {
    width: 46px; height: 46px; border-radius: 50%;
    background: #FFF3E8; color: #C2560A;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; margin: 4px 0 12px;
  }
  .loc-sheet-title { font-size: 18px; font-weight: 800; letter-spacing: -0.3px; color: var(--text); margin: 0 0 8px; }
  .loc-sheet-text { font-size: 14px; font-weight: 500; line-height: 1.55; color: var(--text-soft); margin: 0 0 20px; }

  .loc-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; min-height: 50px; padding: 14px 16px; margin-bottom: 10px;
    border-radius: 14px; font-family: inherit; font-size: 15px; font-weight: 800;
    cursor: pointer; text-decoration: none; border: none;
  }
  .loc-btn:active { transform: scale(.98); }
  .loc-btn-primary { background: var(--brand); color: #fff; }
  .loc-btn-primary:disabled { opacity: .65; cursor: default; transform: none; }
  .loc-btn-secondary { background: var(--surface); color: #333A45; border: 1px solid var(--line); }
  .loc-btn-quiet {
    background: transparent; border: none; color: var(--text-mute);
    font-family: inherit; font-size: 14px; font-weight: 700;
    width: 100%; min-height: 44px; margin-bottom: 0; cursor: pointer;
  }
  .loc-sheet .loc-btn:focus-visible,
  .loc-sheet .loc-btn-quiet:focus-visible { outline: 2px solid var(--brand-ink); outline-offset: 2px; }

  /* ── Location status banner (above the restaurant list) ── */
  #location-banner {
    display: flex; align-items: center; gap: 12px;
    margin: 0 18px 14px; padding: 12px 14px;
    background: #F6F7F9; border: 1px solid var(--line); border-radius: 12px;
  }
  #location-banner[hidden] { display: none; }
  .lb-icon { font-size: 14px; color: #8A93A2; flex-shrink: 0; }
  .lb-text { flex: 1; min-width: 0; font-size: 13px; font-weight: 600; color: #3B4453; line-height: 1.45; }
  .lb-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .lb-btn {
    border: none; background: transparent; color: #C2560A;
    font-family: inherit; font-size: 13px; font-weight: 800;
    text-decoration: underline; cursor: pointer;
    padding: 10px 6px; min-height: 40px; white-space: nowrap;
  }
  .lb-btn:disabled { color: var(--text-mute); text-decoration: none; cursor: default; }

  /* Per-card delivery status is not styled here — restaurant-card.css
     already owns .es-card.is-unavailable, .es-availability-overlay and
     the toast. */

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
    }
  }


</style>
