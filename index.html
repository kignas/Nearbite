<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>EatSwada – Food Near You</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<!-- Switched to Manrope for a more space-efficient, native-app feel -->
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"/>
<style>
  /* ══════════════════════════════════════════════════════════════
     1. BASE
     One continuous page background. Sections do not paint their own
     backgrounds — separation comes from spacing and from the cards.
     ══════════════════════════════════════════════════════════════ */
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --page-bg:      #FFFFFF;
    --surface:      #FFFFFF;
    --text:         #171A20;
    --text-soft:    #5B6472;
    --text-mute:    #8A93A2;
    --line:         #E3E6EB;
    --brand:        #FC8019;
    --brand-ink:    #0F172A;
  }

  html { background: var(--page-bg); }

  body {
    margin: 0;
    font-family: 'Manrope', system-ui, -apple-system, sans-serif;
    background: var(--page-bg);
    color: var(--text);
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: none;
    padding-bottom: 110px;
  }

  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

  .tap { transition: transform .13s ease, opacity .13s ease; cursor: pointer; }
  .tap:active { transform: scale(.96); opacity: .85; }

  @keyframes cardFadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ══════════════════════════════════════════════════════════════
     2. SKELETONS
     ══════════════════════════════════════════════════════════════ */
  @keyframes shimmer {
    0%   { background-position: -600px 0; }
    100% { background-position:  600px 0; }
  }

  .sk {
    display: block;
    background: linear-gradient(90deg, #E7E9ED 25%, #F3F4F7 50%, #E7E9ED 75%);
    background-size: 1200px 100%;
    animation: shimmer 1.5s infinite linear;
    border-radius: 10px;
  }
  .sk.d1 { animation-delay: .08s; }
  .sk.d2 { animation-delay: .16s; }
  .sk.d3 { animation-delay: .24s; }
  .sk.d4 { animation-delay: .32s; }

  .cs-item { display: flex; flex-direction: column; align-items: center; width: 100%; }
  .cs-ring { width: 100%; aspect-ratio: 1/1; border-radius: 50%; }
  .cs-name { width: 70%; height: 11px; margin-top: 8px; border-radius: 5px; }

  /* ══════════════════════════════════════════════════════════════
     3. EATSWADA HEADER — HEADER-ONLY THEME SYSTEM
     Everything below this header remains unchanged.
     ══════════════════════════════════════════════════════════════ */
  .hero-header{
    --hero-bg:#C50057;--hero-bg-2:#8E003E;--hero-ink:#fff;--hero-muted:rgba(255,255,255,.76);--hero-accent:#FFD35A;
    min-height:276px;padding:14px 16px 0;position:relative;z-index:10;isolation:isolate;overflow:hidden;
    color:var(--hero-ink);background:linear-gradient(145deg,var(--hero-bg),var(--hero-bg-2));
    border-bottom-left-radius:28px;border-bottom-right-radius:28px;box-shadow:0 18px 38px -24px rgba(15,23,42,.42);
  }
  .hero-header[data-theme="pink"]{--hero-bg:#F7B7CB;--hero-bg-2:#E887A9;--hero-ink:#172033;--hero-muted:#5F6675;--hero-accent:#C50057;}
  .hero-header[data-theme="lavender"]{--hero-bg:#BDA9EA;--hero-bg-2:#8F70D2;--hero-ink:#17132A;--hero-muted:#5C5670;--hero-accent:#6A35C7;}
  .hero-header[data-theme="magenta"]{--hero-bg:#B80057;--hero-bg-2:#730035;--hero-ink:#fff;--hero-muted:rgba(255,255,255,.78);--hero-accent:#FFDE69;}
  .hero-header[data-theme="anime"]{--hero-bg:#fff;--hero-bg-2:#fff;--hero-ink:#1F2430;--hero-muted:#697386;--hero-accent:#D20A61;background:#fff;box-shadow:0 18px 38px -26px rgba(15,23,42,.28);}
  .hero-header::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(circle at 85% 18%,rgba(255,255,255,.18),transparent 28%),radial-gradient(circle at 12% 0%,rgba(255,255,255,.12),transparent 28%);}
  .hero-header[data-theme="anime"]::before{background:radial-gradient(circle at 78% 18%,rgba(255,182,205,.28),transparent 28%),radial-gradient(circle at 14% 4%,rgba(218,225,255,.32),transparent 30%);}
  .hero-header>*{position:relative;z-index:2;}

  /* Artwork belongs to the header. It is NOT a separate promotional card. */
  .anime-art{display:block;position:absolute;right:-2px;top:92px;width:54%;height:170px;z-index:1;pointer-events:none;
    background-repeat:no-repeat;background-position:right center;background-size:contain;mix-blend-mode:multiply;opacity:.96;}
  .hero-header[data-theme="pink"] .anime-art,.hero-header[data-theme="lavender"] .anime-art,.hero-header[data-theme="magenta"] .anime-art{mix-blend-mode:normal;opacity:1;}

  .hero-header.theme-slide-next{animation:esHeaderSlideNext .38s cubic-bezier(.22,1,.36,1) both;}
  .hero-header.theme-slide-prev{animation:esHeaderSlidePrev .38s cubic-bezier(.22,1,.36,1) both;}
  @keyframes esHeaderSlideNext{from{transform:translateX(28px);opacity:.72}to{transform:none;opacity:1}}
  @keyframes esHeaderSlidePrev{from{transform:translateX(-28px);opacity:.72}to{transform:none;opacity:1}}

  .loc-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px;gap:10px;position:relative;z-index:4;}
  .loc-left{flex:1;min-width:0;padding-right:4px;text-decoration:none;display:flex;flex-direction:column;justify-content:center;}
  .loc-sub{font-size:11px;font-weight:650;color:var(--hero-muted);line-height:16px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;order:2;}
  .loc-name-row{display:flex;align-items:center;gap:6px;margin-top:0;max-width:100%;order:1;}
  .loc-arrow{font-size:11px;color:var(--hero-accent);flex-shrink:0;}
  .loc-name{font-size:16px;font-weight:850;color:var(--hero-ink);line-height:21px;letter-spacing:-.25px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:100%;}
  .loc-chevron{font-size:9px;color:var(--hero-muted);flex-shrink:0;}
  .loc-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .btn-store{background:rgba(255,255,255,.24);border:1px solid rgba(255,255,255,.38);color:var(--hero-ink);border-radius:15px;min-height:40px;padding:0 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;flex-shrink:0;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 8px 20px -15px rgba(0,0,0,.45);}
  .hero-header[data-theme="anime"] .btn-store,.hero-header[data-theme="pink"] .btn-store,.hero-header[data-theme="lavender"] .btn-store{border-color:rgba(197,0,87,.12);background:rgba(255,255,255,.82);}
  .store-top{font-size:8px;font-weight:850;color:var(--hero-muted);text-transform:uppercase;letter-spacing:.7px;line-height:1;}.store-bot{font-size:14px;font-weight:900;color:var(--hero-accent);line-height:1.25;}
  .btn-profile{width:40px;height:40px;background:#fff;color:#1F2937;border-radius:50%;border:0;display:flex;align-items:center;justify-content:center;text-decoration:none;flex-shrink:0;box-shadow:0 9px 20px -10px rgba(0,0,0,.42);}
  .btn-profile i{font-size:14px;color:#1F2937}.profile-initial{font-weight:900;font-size:15px;color:#B80057}

  .search-row{display:flex;gap:9px;margin-bottom:0;position:relative;z-index:5;}
  .search-box{flex:1;min-width:0;background:#fff;border-radius:17px;height:50px;display:flex;align-items:center;padding:0 15px;gap:10px;border:1px solid rgba(255,255,255,.96);box-shadow:0 11px 24px -15px rgba(0,0,0,.5);text-decoration:none;overflow:hidden;}
  .search-icon{font-size:16px;color:#667085;flex-shrink:0}.search-text{color:#667085;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .veg-box{width:68px;height:50px;border:1px solid rgba(255,255,255,.78);border-radius:17px;background:rgba(255,255,255,.97);color:#334155;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;flex-shrink:0;cursor:pointer;box-shadow:0 10px 20px -15px rgba(0,0,0,.45);}
  .veg-label-txt{font-size:8px;font-weight:900;letter-spacing:1px}.veg-track{width:28px;height:14px;border-radius:99px;background:#E2E8F0;position:relative}.veg-track.on{background:#DCFCE7}.veg-thumb{width:14px;height:14px;position:absolute;left:0;top:0;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(15,23,42,.16);display:flex;align-items:center;justify-content:center}.veg-track.on .veg-thumb{transform:translateX(14px)}.veg-inner{width:6px;height:6px;border:1.5px solid #16A34A;border-radius:2px;display:flex;align-items:center;justify-content:center}.veg-inner-dot{width:3px;height:3px;background:#16A34A;border-radius:50%}

  .banner-wrap{position:relative;min-height:158px;padding:0;margin:0;z-index:3;}
  .banner-carousel{position:relative;min-height:158px;}
  .banner-slide{position:absolute;inset:0;background:transparent;border:0;box-shadow:none;overflow:visible;opacity:0;pointer-events:none;transform:translateX(10px);transition:opacity .25s ease,transform .35s cubic-bezier(.22,1,.36,1);}
  .banner-slide.is-active{opacity:1;pointer-events:auto;transform:none;}
  .banner-slide.is-leaving{opacity:0;transform:translateX(-10px);}
  .banner-image{display:none!important}.banner-shade{display:none!important}
  .banner-copy{position:absolute;left:12px;top:18px;bottom:14px;max-width:57%;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;color:var(--hero-ink);z-index:3;}
  .banner-slide.text-dark .banner-copy{color:#172033}.banner-badge{display:inline-flex;align-items:center;min-height:21px;padding:0 8px;border-radius:999px;background:rgba(255,255,255,.38);border:1px solid rgba(255,255,255,.45);backdrop-filter:blur(8px);font-size:8px;font-weight:900;letter-spacing:1px;text-transform:uppercase;}
  .hero-header[data-theme="anime"] .banner-badge{background:#FCE7F3;border-color:#F9C5DD;color:#C50057}.banner-title{margin:7px 0 0;font-size:27px;line-height:1.02;letter-spacing:-.9px;font-weight:900;}.banner-subtitle{margin:7px 0 0;font-size:11px;line-height:1.35;font-weight:600;opacity:.84;max-width:30ch}.banner-offer{margin:7px 0 0;font-size:13px;line-height:1.2;font-weight:900}.banner-cta{margin-top:11px;display:inline-flex;align-items:center;gap:8px;min-height:34px;padding:0 14px;border-radius:999px;background:var(--hero-accent);color:#fff;font-size:11px;font-weight:900;text-decoration:none;box-shadow:0 8px 18px -12px rgba(0,0,0,.5)}
  .hero-header[data-theme="anime"] .banner-cta{color:#fff;background:#C50057}.banner-controls{position:absolute;left:12px;bottom:5px;display:flex;align-items:center;gap:5px;z-index:4}.banner-dot{width:6px;height:6px;border:0;padding:0;border-radius:50%;background:rgba(100,116,139,.25)}.banner-dot.is-active{width:18px;border-radius:99px;background:var(--hero-accent)}.banner-arrow{display:none!important}
  .banner-loading,.banner-fallback{display:none!important}
  @media(max-width:380px){.hero-header{min-height:264px}.anime-art{width:55%;height:160px;top:91px}.banner-copy{max-width:58%;left:10px}.banner-title{font-size:24px}.banner-subtitle{font-size:10px}.banner-wrap,.banner-carousel{min-height:150px}}
  @media(prefers-reduced-motion:reduce){.hero-header,.banner-slide{animation:none!important;transition:none!important}}

  /* ══════════════════════════════════════════════════════════════
     4. PAGE SECTIONS — shared, transparent, one background
     ══════════════════════════════════════════════════════════════ */
  .page { padding-top: 4px; }

  .section { padding: 20px 0 4px; }
  .section[hidden] { display: none; }

  .sec-head { display: flex; align-items: center; gap: 12px; padding: 0 18px; margin-bottom: 14px; }

  /* Upgraded to Zomato-style section titles */
  .sec-title {
    margin: 0;
    font-size: 12px;
    font-weight: 700;
    color: #64748B;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .sec-head::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  /* ── What's on your mind ── */
  .cat-scroll {
    display: grid;
    grid-template-rows: repeat(2, auto);
    grid-auto-flow: column;
    grid-auto-columns: 25vw;
    justify-content: start;
    gap: 18px 14px;
    padding: 4px 18px 20px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scroll-behavior: smooth;
    scroll-snap-type: x proximity;
    overscroll-behavior-x: contain;
  }
  @media (min-width: 620px) { .cat-scroll { grid-auto-columns: 120px; } }

  .cat-item {
    display: flex; flex-direction: column; align-items: center; width: 100%;
    text-decoration: none; scroll-snap-align: start;
    -webkit-tap-highlight-color: transparent;
    transition: transform .18s ease, opacity .18s ease;
  }
  .cat-item:active { transform: scale(.93); opacity: .8; }

  .cat-ring { width: 100%; aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; }
  .cat-ring img { width: 100%; height: 100%; object-fit: contain; transform: scale(1.2); opacity: 0; transition: opacity .25s ease; }
  .cat-ring img.loaded { opacity: 1; }

  .cat-name { font-size: 14px; font-weight: 700; color: #2A2F3A; text-align: center; line-height: 1.2; }

  /* ── Filter bar ── */
  .filter-bar {
    display: flex; gap: 8px; overflow-x: auto;
    padding: 4px 18px 16px;
    scrollbar-width: none;
    background: transparent;
  }
  .filter-bar[hidden] { display: none; }
  .filter-bar::-webkit-scrollbar { display: none; }

  .filter-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 9px 14px; flex-shrink: 0;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    font-family: inherit; font-size: 14px; font-weight: 600; color: #3B4453;
    white-space: nowrap; cursor: pointer;
    box-shadow: 0 1px 2px rgba(15,23,42,.04);
    transition: background .18s ease, border-color .18s ease, color .18s ease, transform .12s ease;
  }
  .filter-pill:active { transform: scale(.95); }
  .filter-pill.active {
    background: #FFF3E8;
    color: #C2560A;
    border-color: var(--brand);
    box-shadow: none;
  }
  .filter-count {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 18px; height: 18px; padding: 0 5px; margin-left: 2px;
    border-radius: 9px; background: var(--brand); color: #fff;
    font-size: 11px; font-weight: 800;
  }

  /* ── Refresh notice ── */
  #home-notice {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin: 0 18px 14px; padding: 10px 14px;
    background: #FFF8EC; border: 1px solid #F6DFBE; border-radius: 12px;
    font-size: 13px; font-weight: 600; color: #8A5A12;
  }
  #home-notice[hidden] { display: none; }
  .notice-retry {
    border: none; background: transparent; color: #B45309;
    font-family: inherit; font-size: 13px; font-weight: 800;
    text-decoration: underline; cursor: pointer; flex-shrink: 0; padding: 0;
  }

  /* ── Empty / error blocks ── */
  .state-block { text-align: center; padding: 44px 24px 52px; }
  .state-icon { font-size: 40px; color: #C3C9D4; display: block; margin-bottom: 14px; }
  .state-title { font-size: 16px; font-weight: 800; color: #303845; margin: 0 0 6px; }
  .state-sub { font-size: 13px; font-weight: 500; color: var(--text-soft); margin: 0 0 18px; line-height: 1.5; }
  .state-btn {
    background: var(--brand); color: #fff; border: none;
    padding: 12px 26px; border-radius: 12px;
    font-family: inherit; font-size: 14px; font-weight: 800; cursor: pointer;
  }
  .state-btn:active { transform: scale(.97); }
  .state-btn:disabled { opacity: .6; cursor: default; }

  /* ══════════════════════════════════════════════════════════════
     5. FILTER SHEET
     ══════════════════════════════════════════════════════════════ */
  .filter-sheet { position: fixed; inset: 0; z-index: 100001; }
  .filter-sheet[hidden] { display: none; }

  .sheet-backdrop {
    position: absolute; inset: 0; background: rgba(15,23,42,.45);
    opacity: 0; transition: opacity .22s ease;
  }
  .filter-sheet.open .sheet-backdrop { opacity: 1; }

  .sheet-panel {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: var(--surface); border-radius: 22px 22px 0 0;
    padding: 8px 20px calc(24px + env(safe-area-inset-bottom, 0px));
    max-height: 78vh; overflow-y: auto;
    transform: translateY(100%); transition: transform .24s cubic-bezier(.22,1,.36,1);
  }
  .filter-sheet.open .sheet-panel { transform: translateY(0); }

  .sheet-grabber { width: 40px; height: 4px; border-radius: 2px; background: #DEE2E8; margin: 6px auto 14px; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .sheet-title { font-size: 18px; font-weight: 800; margin: 0; color: var(--text); }
  .sheet-clear {
    border: none; background: transparent; color: var(--brand);
    font-family: inherit; font-size: 13px; font-weight: 800; cursor: pointer; padding: 4px;
  }
  .sheet-group-title {
    font-size: 12px; font-weight: 800; letter-spacing: .8px; text-transform: uppercase;
    color: var(--text-mute); margin: 18px 0 8px;
  }
  .sheet-options { display: flex; flex-direction: column; }
  .sheet-option {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; padding: 14px 2px; border: none; border-bottom: 1px solid #F1F2F5;
    background: transparent; font-family: inherit; font-size: 15px; font-weight: 600;
    color: #333A45; text-align: left; cursor: pointer;
  }
  .sheet-option i { color: var(--brand); opacity: 0; font-size: 14px; }
  .sheet-option.selected { color: #C2560A; font-weight: 800; }
  .sheet-option.selected i { opacity: 1; }
  .sheet-done {
    width: 100%; margin-top: 20px; padding: 15px;
    background: var(--brand-ink); color: #fff; border: none; border-radius: 14px;
    font-family: inherit; font-size: 15px; font-weight: 800; cursor: pointer;
  }

  /* ══════════════════════════════════════════════════════════════
     6. LOCATION — permission sheet, status banner, card availability
     Additive only. Reuses the sheet shell, tokens and type above so
     the existing Home layout is untouched.
     ══════════════════════════════════════════════════════════════ */
  .loc-sheet { position: fixed; inset: 0; z-index: 100002; }
  .loc-sheet[hidden] { display: none; }
  .loc-sheet .sheet-backdrop { opacity: 0; transition: opacity .22s ease; }
  .loc-sheet.open .sheet-backdrop { opacity: 1; }
  .loc-sheet .sheet-panel {
    transform: translateY(100%);
    transition: transform .24s cubic-bezier(.22,1,.36,1);
    padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  }
  .loc-sheet.open .sheet-panel { transform: translateY(0); }

  .loc-sheet-pin {
    width: 46px; height: 46px; border-radius: 50%;
    background: #FFF3E8; color: #C2560A;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; margin: 4px 0 12px;
  }
  .loc-sheet-title { font-size: 18px; font-weight: 800; letter-spacing: -0.3px; color: var(--text); margin: 0 0 8px; }
  .loc-sheet-text { font-size: 14px; font-weight: 500; line-height: 1.55; color: var(--text-soft); margin: 0 0 20px; }

  .loc-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; min-height: 50px; padding: 14px 16px; margin-bottom: 10px;
    border-radius: 14px; font-family: inherit; font-size: 15px; font-weight: 800;
    cursor: pointer; text-decoration: none; border: none;
  }
  .loc-btn:active { transform: scale(.98); }
  .loc-btn-primary { background: var(--brand); color: #fff; }
  .loc-btn-primary:disabled { opacity: .65; cursor: default; transform: none; }
  .loc-btn-secondary { background: var(--surface); color: #333A45; border: 1px solid var(--line); }
  .loc-btn-quiet {
    background: transparent; border: none; color: var(--text-mute);
    font-family: inherit; font-size: 14px; font-weight: 700;
    width: 100%; min-height: 44px; margin-bottom: 0; cursor: pointer;
  }
  .loc-sheet .loc-btn:focus-visible,
  .loc-sheet .loc-btn-quiet:focus-visible { outline: 2px solid var(--brand-ink); outline-offset: 2px; }

  /* ── Location status banner (above the restaurant list) ── */
  #location-banner {
    display: flex; align-items: center; gap: 12px;
    margin: 0 18px 14px; padding: 12px 14px;
    background: #F6F7F9; border: 1px solid var(--line); border-radius: 12px;
  }
  #location-banner[hidden] { display: none; }
  .lb-icon { font-size: 14px; color: #8A93A2; flex-shrink: 0; }
  .lb-text { flex: 1; min-width: 0; font-size: 13px; font-weight: 600; color: #3B4453; line-height: 1.45; }
  .lb-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .lb-btn {
    border: none; background: transparent; color: #C2560A;
    font-family: inherit; font-size: 13px; font-weight: 800;
    text-decoration: underline; cursor: pointer;
    padding: 10px 6px; min-height: 40px; white-space: nowrap;
  }
  .lb-btn:disabled { color: var(--text-mute); text-decoration: none; cursor: default; }

  /* Per-card delivery status is not styled here — restaurant-card.css
     already owns .es-card.is-unavailable, .es-availability-overlay and
     the toast. */

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
    }
  }

/* === Header benchmark v3: match the approved mobile reference === */
.hero-header{min-height:242px;padding:14px 16px 0;border-bottom-left-radius:24px;border-bottom-right-radius:24px;box-shadow:0 14px 30px -24px rgba(15,23,42,.28);}
.hero-header[data-theme="anime"]{background:#fff;}
.hero-header::before{display:none;}
.anime-art{top:91px;right:-2px;width:55%;height:151px;background-position:right bottom;background-size:contain;mix-blend-mode:multiply;opacity:1;z-index:1;}
.loc-row{height:50px;margin-bottom:10px;gap:9px;z-index:5;}
.loc-left{display:grid;grid-template-columns:40px minmax(0,1fr);grid-template-rows:21px 18px;column-gap:9px;align-items:center;padding-right:0;}
.loc-left::before{content:'\f3c5';font-family:'Font Awesome 6 Free';font-weight:900;grid-row:1 / span 2;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff0f6;color:#d20a61;font-size:18px;box-shadow:0 7px 18px -12px rgba(210,10,97,.4);}
.loc-name-row{display:contents;}
.loc-arrow{display:none;}
.loc-name{grid-column:2;grid-row:1;font-size:15px;line-height:20px;font-weight:850;}
.loc-chevron{font-size:8px;}
.loc-sub{grid-column:2;grid-row:2;font-size:10px;line-height:15px;font-weight:600;color:#697386;}
.loc-right{gap:8px;}
.btn-store{min-width:78px;height:40px;border-radius:16px;background:#fff0f6!important;border-color:#f6d4e3!important;box-shadow:0 8px 18px -14px rgba(210,10,97,.3);}
.store-top{font-size:8px;color:#697386;}.store-bot{font-size:15px;color:#d20a61;}
.btn-profile{width:40px;height:40px;}
.search-row{height:54px;gap:9px;margin-bottom:0;z-index:6;}
.search-box{height:54px;border-radius:18px;padding:0 15px;box-shadow:0 12px 24px -16px rgba(15,23,42,.28);}
.search-icon{font-size:17px;}.search-text{font-size:13px;}
.veg-box{height:54px;width:68px;border-radius:18px;}
.banner-wrap{min-height:124px;height:124px;z-index:3;}
.banner-carousel{min-height:124px;height:124px;}
.banner-slide{height:124px;}
.banner-copy{left:12px;top:10px;bottom:4px;max-width:52%;justify-content:center;z-index:4;}
.banner-title{font-size:27px;line-height:1.03;letter-spacing:-1px;margin:0;font-weight:900;}
.banner-subtitle{font-size:11px;line-height:1.35;margin:7px 0 0;max-width:25ch;font-weight:600;}
.banner-offer{font-size:12px;margin-top:6px;}
.banner-cta{min-height:34px;margin-top:10px;padding:0 15px;font-size:11px;background:#d20a61;}
.hero-header[data-theme="anime"] .banner-cta{background:#d20a61;}
.banner-controls{left:50%;transform:translateX(-50%);bottom:-1px;}
.banner-dot{width:7px;height:7px;}.banner-dot.is-active{width:7px;height:7px;background:#d20a61;}
@media(max-width:380px){.hero-header{min-height:238px}.anime-art{top:88px;width:57%;height:149px}.banner-wrap,.banner-carousel,.banner-slide{min-height:121px;height:121px}.banner-title{font-size:25px}.banner-copy{max-width:52%;}}

/* ══════════════════════════════════════════════════════════════
   HEADER CAROUSEL v4 — real horizontal swipe track
   Header chrome (location + search) stays fixed; only the
   promotional hero area is a carousel. Each slide is a complete,
   independent themed panel that physically slides in/out via
   translate3d. Rules live last so they win cleanly. Nothing below
   "What's on your mind?" is affected.
   ══════════════════════════════════════════════════════════════ */
.hero-header{min-height:302px;}
@media(max-width:380px){.hero-header{min-height:280px;}}

/* Hero region: a little more breathing room below the search bar */
.banner-wrap{position:relative;min-height:0;height:auto;margin-top:12px;padding:0;z-index:3;}

/* Viewport clips the track; touch-action keeps vertical scroll native */
.header-carousel{position:relative;width:100%;overflow:hidden;border-radius:20px;touch-action:pan-y;}
.header-carousel-track{display:flex;align-items:stretch;gap:10px;will-change:transform;transform:translate3d(0,0,0);transition:transform .42s cubic-bezier(.22,1,.36,1);}
.header-carousel-track.is-dragging{transition:none;}
@media(prefers-reduced-motion:reduce){.header-carousel-track{transition:none!important;}}

/* One full-width slide per banner */
.header-slide{position:relative;flex:0 0 100%;width:100%;height:168px;border-radius:20px;overflow:hidden;}
@media(max-width:380px){.header-slide{height:150px;border-radius:18px;}.header-carousel{border-radius:18px;}}

.header-slide__panel{position:absolute;inset:0;}
.header-slide__copy{position:absolute;left:16px;top:0;bottom:0;max-width:56%;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;z-index:3;color:var(--slide-ink,#1F2430);}
.header-slide__art{position:absolute;right:0;top:0;bottom:0;width:52%;height:100%;object-fit:contain;object-position:right bottom;z-index:1;pointer-events:none;}
@media(max-width:380px){.header-slide__copy{max-width:58%;left:14px;}}

/* Per-slide themes (independent of the header's own theme) */
.header-slide[data-theme="anime"]{background:#fff;--slide-ink:#1F2430;--slide-muted:#697386;--slide-accent:#D20A61;box-shadow:inset 0 0 0 1px #F2E5EC;}
.header-slide[data-theme="anime"] .header-slide__art{mix-blend-mode:multiply;}
.header-slide[data-theme="pink"]{background:linear-gradient(145deg,#F7B7CB,#E887A9);--slide-ink:#172033;--slide-muted:#5F6675;--slide-accent:#C50057;}
.header-slide[data-theme="lavender"]{background:linear-gradient(145deg,#BDA9EA,#8F70D2);--slide-ink:#17132A;--slide-muted:#4A4160;--slide-accent:#6A35C7;}
.header-slide[data-theme="magenta"]{background:linear-gradient(145deg,#B80057,#730035);--slide-ink:#fff;--slide-muted:rgba(255,255,255,.82);--slide-accent:#FFDE69;}

/* Copy typography — reuse existing class names, re-based for the panel layout */
.banner-badge{display:inline-flex;align-items:center;min-height:20px;padding:0 8px;border-radius:999px;background:rgba(255,255,255,.5);font-size:8px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:var(--slide-ink);margin-bottom:6px;}
.banner-title{margin:0;font-size:26px;line-height:1.05;letter-spacing:-.8px;font-weight:900;color:var(--slide-ink);}
.banner-subtitle{margin:7px 0 0;font-size:11px;line-height:1.35;font-weight:600;color:var(--slide-muted);max-width:26ch;opacity:1;}
.banner-offer{margin:7px 0 0;font-size:12px;line-height:1.2;font-weight:900;color:var(--slide-ink);}
.banner-cta{margin-top:11px;display:inline-flex;align-items:center;gap:8px;min-height:34px;padding:0 15px;border-radius:999px;background:var(--slide-accent);color:#fff;font-size:11px;font-weight:900;text-decoration:none;box-shadow:0 8px 18px -12px rgba(0,0,0,.5);}
.header-slide[data-theme="magenta"] .banner-cta{color:#5A0027;}
@media(max-width:380px){.banner-title{font-size:23px;}.banner-subtitle{font-size:10px;}}

/* Neutralize the old header-scoped anime overrides so per-slide themes win */
.hero-header[data-theme="anime"] .banner-cta{background:var(--slide-accent);color:#fff;}
.hero-header[data-theme="anime"] .banner-badge{background:rgba(255,255,255,.5);color:var(--slide-ink);}
.header-slide[data-theme="anime"] .banner-badge{background:#FCE7F3;color:#C50057;}
.header-slide[data-theme="magenta"] .banner-cta{background:var(--slide-accent);color:#5A0027;}

/* Indicators sit below the hero, above "What's on your mind?" */
.banner-controls{display:flex;align-items:center;justify-content:center;gap:6px;height:14px;margin-top:9px;padding:0;position:static;transform:none;left:auto;bottom:auto;}
.banner-controls[hidden]{display:none;}
.banner-dot{width:6px;height:6px;border:0;padding:0;border-radius:999px;background:rgba(100,116,139,.28);transition:width .25s ease,background .25s ease;cursor:pointer;}
.banner-dot.is-active{width:18px;height:6px;background:#D20A61;}

  <div class="search-row es-header-item">
