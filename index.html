<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<meta name="theme-color" content="#FFD756"/>
<title>EatSwada – Food Near You</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<style>
  /* ══════════════════════════════════════════════════════════════
     1. BASE
     One page background (light neutral). Cards are the only white
     surfaces, so every section reads as part of the same sheet.
     ══════════════════════════════════════════════════════════════ */
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --page:       #F5F6F8;
    --card:       #FFFFFF;
    --ink:        #131722;
    --ink-soft:   #5C6675;
    --ink-mute:   #8B94A3;
    --line:       #E6E9EE;
    --brand:      #FC8019;
    --brand-soft: #FFF3E8;
    --brand-ink:  #C2560A;
    --cta:        #0F172A;
    --amber-ink:  #241A00;
  }

  html { background: var(--page); }

  body {
    margin: 0;
    font-family: 'Poppins', system-ui, -apple-system, sans-serif;
    background: var(--page);
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: none;
    overflow-x: hidden;
    padding-bottom: 110px;
  }

  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

  .tap { transition: transform .13s ease, opacity .13s ease; cursor: pointer; }
  .tap:active { transform: scale(.96); opacity: .85; }

  a:focus-visible, button:focus-visible {
    outline: 2px solid var(--cta);
    outline-offset: 2px;
    border-radius: 10px;
  }

  @keyframes cardFadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ══════════════════════════════════════════════════════════════
     2. SKELETONS
     ══════════════════════════════════════════════════════════════ */
  @keyframes shimmer {
    0%   { background-position: -600px 0; }
    100% { background-position:  600px 0; }
  }

  .sk {
    display: block;
    background: linear-gradient(90deg, #E7E9ED 25%, #F3F4F7 50%, #E7E9ED 75%);
    background-size: 1200px 100%;
    animation: shimmer 1.5s infinite linear;
    border-radius: 10px;
  }
  .sk.d1 { animation-delay: .08s; }
  .sk.d2 { animation-delay: .16s; }
  .sk.d3 { animation-delay: .24s; }
  .sk.d4 { animation-delay: .32s; }

  .cs-item { width: 76px; flex: 0 0 76px; }
  .cs-tile { width: 76px; height: 76px; border-radius: 22px; }
  .cs-name { width: 60%; height: 11px; margin: 9px auto 0; border-radius: 5px; }

  /* ══════════════════════════════════════════════════════════════
     3. HERO  (header + copy + search — one compact amber block)
     ══════════════════════════════════════════════════════════════ */
  .hero {
    position: relative;
    isolation: isolate;
    overflow: hidden;
    background: linear-gradient(158deg, #FFD756 0%, #FFC42F 52%, #FFB825 100%);
    border-radius: 0 0 26px 26px;
    padding: calc(14px + env(safe-area-inset-top, 0px)) 16px 18px;
  }

  /* Decoration: two soft light pools. No animation, no extra requests. */
  .hero::before,
  .hero::after { content: ''; position: absolute; z-index: 0; pointer-events: none; }
  .hero::before {
    width: 230px; height: 230px; top: -100px; right: -80px;
    background: radial-gradient(circle at center, rgba(255,255,255,.5) 0%, rgba(255,255,255,0) 70%);
  }
  .hero::after {
    width: 280px; height: 280px; bottom: -170px; left: -110px;
    background: radial-gradient(circle at center, rgba(255,132,0,.26) 0%, rgba(255,132,0,0) 70%);
  }
  .hero > * { position: relative; z-index: 1; }

  /* ── Row 1: delivery estimate + actions ── */
  .hero-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }

  .eta { flex: 1; min-width: 0; text-decoration: none; display: block; color: inherit; }
  .eta-time {
    margin: 0; font-size: 17px; font-weight: 800; line-height: 1.25;
    letter-spacing: -.2px; color: var(--amber-ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .eta-time[hidden] { display: none; }
  .eta-place {
    display: flex; align-items: center; gap: 5px; margin: 1px 0 0;
    font-size: 12.5px; font-weight: 700; color: rgba(36,26,0,.62);
  }
  .eta-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 170px; }
  .eta-pin { font-size: 11px; flex-shrink: 0; }
  .eta-chev { font-size: 9px; flex-shrink: 0; opacity: .75; }
  .eta-addr {
    margin: 1px 0 0; font-size: 11px; font-weight: 500; color: rgba(36,26,0,.52);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px;
  }
  .eta-addr[hidden] { display: none; }
  /* No live estimate yet — the place name takes the lead line instead of
     leaving a dash where the headline should be. */
  .eta.no-eta .eta-place { font-size: 16px; font-weight: 800; color: var(--amber-ink); }

  .hero-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

  .btn-store {
    background: rgba(255,255,255,.94); border-radius: 22px; height: 38px; padding: 0 13px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: 0 2px 10px rgba(120,80,0,.13); cursor: pointer; text-decoration: none;
  }
  .store-top { font-size: 8.5px; font-weight: 700; color: #7A828E; text-transform: uppercase; letter-spacing: .6px; line-height: 1; }
  .store-bot { font-size: 14px; font-weight: 900; color: var(--brand); line-height: 1.2; }

  .btn-profile {
    width: 38px; height: 38px; background: rgba(255,255,255,.94); border-radius: 50%;
    display: flex; align-items: center; justify-content: center; text-decoration: none;
    flex-shrink: 0; box-shadow: 0 2px 10px rgba(120,80,0,.13);
  }
  .btn-profile i { font-size: 15px; color: #4B5563; }
  .profile-initial { font-weight: 900; font-size: 16px; color: var(--brand); }

  /* ── Row 2: headline ── */
  .hero-copy { margin: 16px 0 14px; }
  .hero-title {
    margin: 0; font-size: clamp(19px, 5.6vw, 23px); line-height: 1.22;
    font-weight: 800; letter-spacing: -.4px; color: var(--amber-ink);
  }
  .hero-sub { margin: 5px 0 0; font-size: 12.5px; font-weight: 600; color: rgba(36,26,0,.6); }

  /* ── Row 3: search ── */
  .search-row { display: flex; gap: 10px; }
  .search-box {
    flex: 1; min-width: 0; background: #fff; border-radius: 15px; height: 50px;
    display: flex; align-items: center; gap: 10px; padding: 0 15px;
    text-decoration: none; box-shadow: 0 6px 16px rgba(120,80,0,.10);
  }
  .search-icon { font-size: 16px; color: #B0B7C3; flex-shrink: 0; }
  .search-text {
    flex: 1; min-width: 0; font-size: 13.5px; font-weight: 600; color: #98A0AD;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: opacity .25s ease;
  }

  .veg-box {
    background: #fff; border-radius: 15px; width: 56px; height: 50px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 5px; border: none; box-shadow: 0 6px 16px rgba(120,80,0,.10);
    cursor: pointer; flex-shrink: 0; font-family: inherit;
  }
  .veg-box[hidden] { display: none; }
  .veg-label-txt { font-size: 8.5px; font-weight: 900; letter-spacing: .8px; color: #4B5563; }
  .veg-track { width: 30px; height: 15px; background: #D6DAE1; border-radius: 999px; position: relative; transition: background .25s; }
  .veg-track.on { background: #22C55E; }
  .veg-thumb {
    position: absolute; top: 2px; left: 2px; width: 11px; height: 11px; background: #fff;
    border-radius: 50%; box-shadow: 0 1px 3px rgba(0,0,0,.2);
    transition: transform .28s cubic-bezier(.34,1.56,.64,1);
    display: flex; align-items: center; justify-content: center;
  }
  .veg-track.on .veg-thumb { transform: translateX(15px); }
  .veg-inner { width: 6px; height: 6px; border: 1px solid #16A34A; border-radius: 1.5px; display: flex; align-items: center; justify-content: center; }
  .veg-inner-dot { width: 3px; height: 3px; background: #16A34A; border-radius: 50%; }

  /* ══════════════════════════════════════════════════════════════
     4. SECTIONS — shared, transparent, one background
     ══════════════════════════════════════════════════════════════ */
  .page { padding-top: 6px; }

  .section { padding: 18px 0 2px; }
  .section[hidden] { display: none; }

  .sec-head {
    display: flex; align-items: center; gap: 10px;
    padding: 0 18px; margin-bottom: 12px; overflow: hidden;
  }
  .sec-title {
    margin: 0; font-size: 14px; font-weight: 800; letter-spacing: .9px;
    text-transform: uppercase; color: #333A45; white-space: nowrap;
  }
  .sec-count { font-size: 11.5px; font-weight: 700; color: var(--ink-mute); white-space: nowrap; flex-shrink: 0; }
  .sec-count:empty { display: none; }
  .sec-head::after { content: ""; flex: 1 1 auto; min-width: 0; height: 1px; background: var(--line); }

  /* ── What's on your mind — one touch rail, every category reachable ── */
  .cat-rail {
    display: flex;
    gap: 14px;
    padding: 2px 18px 8px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scroll-snap-type: x proximity;
    scroll-padding-left: 18px;
    overscroll-behavior-x: contain;
  }

  .cat-item {
    flex: 0 0 76px; width: 76px;
    display: flex; flex-direction: column; align-items: center;
    text-decoration: none; scroll-snap-align: start;
    -webkit-tap-highlight-color: transparent;
    transition: transform .18s ease, opacity .18s ease;
  }
  .cat-item:active { transform: scale(.94); opacity: .85; }

  .cat-tile {
    width: 76px; height: 76px; border-radius: 22px; overflow: hidden;
    background: #FFF1DC;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .cat-tile img {
    width: 100%; height: 100%; object-fit: contain; padding: 6px;
    opacity: 0; transition: opacity .25s ease;
  }
  .cat-tile img.loaded { opacity: 1; }

  .cat-name {
    margin-top: 9px; font-size: 12.5px; font-weight: 700; color: #333A45;
    text-align: center; line-height: 1.25; width: 100%;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; word-break: break-word;
  }

  @media (min-width: 700px) {
    .cat-item, .cat-tile, .cs-item, .cs-tile { flex-basis: 92px; width: 92px; }
    .cat-tile, .cs-tile { height: 92px; }
    .cat-rail, .sec-head { padding-left: 24px; padding-right: 24px; }
  }

  /* ── Filter bar ── */
  .filter-bar {
    display: flex; gap: 8px; overflow-x: auto;
    padding: 2px 18px 14px;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-x: contain;
  }
  .filter-bar[hidden] { display: none; }
  .filter-bar::-webkit-scrollbar { display: none; }
  @media (min-width: 700px) { .filter-bar { padding-left: 24px; padding-right: 24px; } }

  .filter-pill {
    display: inline-flex; align-items: center; gap: 6px;
    height: 36px; padding: 0 15px; flex-shrink: 0;
    background: var(--card); border: 1px solid var(--line); border-radius: 999px;
    font-family: inherit; font-size: 13px; font-weight: 600; color: #3B4453;
    white-space: nowrap; cursor: pointer;
    transition: background .18s ease, border-color .18s ease, color .18s ease, transform .12s ease;
  }
  .filter-pill:active { transform: scale(.95); }
  .filter-pill.active {
    background: var(--brand-soft);
    color: var(--brand-ink);
    border-color: #FFC79A;
  }
  .filter-count {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 18px; height: 18px; padding: 0 5px;
    border-radius: 9px; background: var(--brand); color: #fff;
    font-size: 11px; font-weight: 800;
  }

  /* ── Restaurant list ── */
  #restaurant-list {
    display: grid;
    grid-auto-rows: 1fr;      /* every card ends up the same height */
    gap: 16px;
    padding: 0 18px 4px;
  }
  @media (min-width: 700px) {
    #restaurant-list { grid-template-columns: repeat(2, 1fr); padding-left: 24px; padding-right: 24px; }
  }

  /* ── Refresh notice ── */
  #home-notice {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin: 0 18px 14px; padding: 10px 14px;
    background: #FFF8EC; border: 1px solid #F6DFBE; border-radius: 12px;
    font-size: 12.5px; font-weight: 600; color: #8A5A12;
  }
  #home-notice[hidden] { display: none; }
  .notice-retry {
    border: none; background: transparent; color: #B45309;
    font-family: inherit; font-size: 12.5px; font-weight: 800;
    text-decoration: underline; cursor: pointer; flex-shrink: 0; padding: 0;
  }

  /* ── Empty / error blocks ── */
  .state-block {
    text-align: center; padding: 40px 24px 44px;
    background: var(--card); border: 1px solid var(--line); border-radius: 20px;
  }
  .state-icon { font-size: 38px; color: #C3C9D4; display: block; margin-bottom: 14px; }
  .state-title { font-size: 16px; font-weight: 800; color: #303845; margin: 0 0 6px; }
  .state-sub { font-size: 13px; font-weight: 500; color: var(--ink-soft); margin: 0 0 18px; line-height: 1.5; }
  .state-btn {
    background: var(--cta); color: #fff; border: none;
    padding: 12px 26px; border-radius: 12px;
    font-family: inherit; font-size: 14px; font-weight: 800; cursor: pointer;
  }
  .state-btn:active { transform: scale(.97); }
  .state-btn:disabled { opacity: .6; cursor: default; }

  /* ══════════════════════════════════════════════════════════════
     5. FILTER SHEET
     ══════════════════════════════════════════════════════════════ */
  .filter-sheet { position: fixed; inset: 0; z-index: 100001; }
  .filter-sheet[hidden] { display: none; }

  .sheet-backdrop {
    position: absolute; inset: 0; background: rgba(15,23,42,.45);
    opacity: 0; transition: opacity .22s ease;
  }
  .filter-sheet.open .sheet-backdrop { opacity: 1; }

  .sheet-panel {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: var(--card); border-radius: 22px 22px 0 0;
    padding: 8px 20px calc(24px + env(safe-area-inset-bottom, 0px));
    max-height: 78vh; overflow-y: auto;
    transform: translateY(100%); transition: transform .24s cubic-bezier(.22,1,.36,1);
  }
  .filter-sheet.open .sheet-panel { transform: translateY(0); }

  .sheet-grabber { width: 40px; height: 4px; border-radius: 2px; background: #DEE2E8; margin: 6px auto 14px; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .sheet-title { font-size: 17px; font-weight: 800; margin: 0; color: var(--ink); }
  .sheet-clear {
    border: none; background: transparent; color: var(--brand-ink);
    font-family: inherit; font-size: 13px; font-weight: 800; cursor: pointer; padding: 4px;
  }
  .sheet-group-title {
    font-size: 12px; font-weight: 800; letter-spacing: .8px; text-transform: uppercase;
    color: var(--ink-mute); margin: 18px 0 8px;
  }
  .sheet-options { display: flex; flex-direction: column; }
  .sheet-option {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; padding: 14px 2px; border: none; border-bottom: 1px solid #F1F2F5;
    background: transparent; font-family: inherit; font-size: 14.5px; font-weight: 600;
    color: #333A45; text-align: left; cursor: pointer;
  }
  .sheet-option i { color: var(--brand); opacity: 0; font-size: 14px; }
  .sheet-option.selected { color: var(--brand-ink); font-weight: 800; }
  .sheet-option.selected i { opacity: 1; }
  .sheet-done {
    width: 100%; margin-top: 20px; padding: 15px;
    background: var(--cta); color: #fff; border: none; border-radius: 14px;
    font-family: inherit; font-size: 15px; font-weight: 800; cursor: pointer;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
    }
  }
</style>
<link rel="stylesheet" href="restaurant-card.css"/>
</head>

<body>

<header class="hero">
  <div class="hero-top">
    <a class="eta tap" id="eta-block" href="address.html">
      <p class="eta-time" id="eta-line" hidden>Delivery in <span id="delivery-time-value"></span> minutes</p>
      <p class="eta-place">
        <i class="fa-solid fa-location-dot eta-pin"></i>
        <span class="eta-name" id="loc-name">Maynaguri</span>
        <i class="fa-solid fa-chevron-down eta-chev"></i>
      </p>
      <p class="eta-addr" id="loc-sub" hidden></p>
    </a>

    <div class="hero-actions">
      <a class="btn-store tap" href="under99.html">
        <span class="store-top">Under</span>
        <span class="store-bot">₹99</span>
      </a>
      <a class="btn-profile tap" href="profile.html" aria-label="Profile">
        <i class="fa-solid fa-user"></i>
      </a>
    </div>
  </div>

  <div class="hero-copy">
    <h1 class="hero-title">Hungry? Let's fix that.</h1>
    <p class="hero-sub">Kitchens near you, delivered to your door.</p>
  </div>

  <div class="search-row">
    <a class="search-box tap" href="search.html">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <span class="search-text" id="search-placeholder">Search restaurants and dishes</span>
    </a>

    <button type="button" class="veg-box tap" id="veg-toggle-btn" aria-pressed="false" aria-label="Show pure veg restaurants only" hidden>
      <span class="veg-label-txt">VEG</span>
      <span class="veg-track" id="veg-track">
        <span class="veg-thumb">
          <span class="veg-inner"><span class="veg-inner-dot"></span></span>
        </span>
      </span>
    </button>
  </div>
</header>

<main class="page">

  <section class="section" id="mind-section">
    <div class="sec-head">
      <h2 class="sec-title">What's on your mind?</h2>
    </div>
    <div class="cat-rail no-scrollbar" id="cat-scroll">
      <div class="cs-item"><div class="sk cs-tile"></div><div class="sk cs-name"></div></div>
      <div class="cs-item"><div class="sk cs-tile d1"></div><div class="sk cs-name d1"></div></div>
      <div class="cs-item"><div class="sk cs-tile d2"></div><div class="sk cs-name d2"></div></div>
      <div class="cs-item"><div class="sk cs-tile d3"></div><div class="sk cs-name d3"></div></div>
      <div class="cs-item"><div class="sk cs-tile d4"></div><div class="sk cs-name d4"></div></div>
    </div>
  </section>

  <div class="filter-bar" id="filter-bar" role="group" aria-label="Restaurant filters" hidden></div>

  <section class="section" id="restaurants-section">
    <div class="sec-head">
      <h2 class="sec-title" id="restaurants-title">Restaurants near you</h2>
      <span class="sec-count" id="restaurants-count" aria-live="polite"></span>
    </div>

    <div id="home-notice" role="status" hidden></div>

    <div id="restaurant-list">
      <div class="rs-card"><div class="sk rs-img"></div><div class="rs-body"><div class="sk rs-name"></div><div class="sk rs-cuis"></div><div class="sk rs-meta"></div></div></div>
      <div class="rs-card"><div class="sk rs-img d1"></div><div class="rs-body"><div class="sk rs-name d1"></div><div class="sk rs-cuis d1"></div><div class="sk rs-meta d1"></div></div></div>
    </div>
  </section>

</main>

<div class="filter-sheet" id="filter-sheet" role="dialog" aria-modal="true" aria-label="Filters and sorting" hidden>
  <div class="sheet-backdrop" data-close-sheet="1"></div>
  <div class="sheet-panel">
    <div class="sheet-grabber"></div>
    <div class="sheet-head">
      <h3 class="sheet-title">Filters</h3>
      <button type="button" class="sheet-clear" id="filter-sheet-clear">Clear all</button>
    </div>
    <div id="filter-sheet-body"></div>
    <button type="button" class="sheet-done" data-close-sheet="1">Show results</button>
  </div>
</div>

<script src="config.js"></script>
<script src="api.js"></script>
<script src="restaurant-card.js"></script>
<script src="home.js"></script>
<script src="cart-bar.js"></script>
<script src="bottom-tab-bar.js"></script>
</body>
</html>
