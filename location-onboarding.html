<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff">
<title>Your location · Nearbite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://unpkg.com">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--brand:#fc8019;--ink:#111827;--muted:#6b7280;--line:#e7e8eb}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;color:var(--ink);overflow:hidden}
#map{position:absolute;inset:0}
.top{position:absolute;top:14px;left:14px;right:14px;z-index:1000;display:flex;align-items:center;gap:10px}
.back,.locate{width:42px;height:42px;border:0;border-radius:14px;background:#fff;box-shadow:0 5px 20px #0002;color:#111827}
.title{flex:1;background:#fff;border-radius:14px;padding:11px 14px;box-shadow:0 5px 20px #0002}
.title b{font-size:14px}.title span{display:block;font-size:10px;color:var(--muted);margin-top:2px}
.pin{position:absolute;left:50%;top:50%;z-index:900;transform:translate(-50%,-100%);pointer-events:none;color:var(--brand);font-size:42px;text-shadow:0 3px 8px #0003}
.pin-dot{position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:50%;background:#fff;border:2px solid var(--brand);transform:translate(-50%,-50%);z-index:901;pointer-events:none}
.sheet{position:absolute;left:10px;right:10px;bottom:10px;z-index:1000;background:#fff;border-radius:24px;padding:18px;box-shadow:0 -5px 30px #0002}
.status{display:flex;gap:11px;align-items:flex-start;margin-bottom:13px}
.status-icon{width:40px;height:40px;border-radius:13px;background:#fff2e8;color:var(--brand);display:grid;place-items:center;flex:none}
.status b{font-size:14px}.status span{display:block;color:var(--muted);font-size:11px;line-height:1.45;margin-top:3px}
.address{font-size:12px;color:#374151;background:#f8fafc;border:1px solid var(--line);padding:11px 12px;border-radius:13px;margin-bottom:11px;min-height:40px}
.actions{display:grid;grid-template-columns:1fr 1.2fr;gap:9px}.btn{height:48px;border-radius:14px;border:1px solid var(--line);background:#fff;font-weight:800;font-size:12px}.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.warn{display:none;background:#fff7ed;border:1px solid #fed7aa;color:#9a4d13;padding:10px 12px;border-radius:12px;font-size:10px;line-height:1.45;margin-bottom:11px}
.loading{position:fixed;inset:0;background:#fff;z-index:2000;display:flex;align-items:center;justify-content:center;flex-direction:column}
.spinner{width:36px;height:36px;border:4px solid #eee;border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.leaflet-control-attribution{font-size:8px}
</style>
</head>
<body>
<div id="map"></div>
<div class="pin"><i class="fa-solid fa-location-dot"></i></div><div class="pin-dot"></div>
<div class="top">
  <button class="back" onclick="goBack()" aria-label="Back"><i class="fa-solid fa-arrow-left"></i></button>
  <div class="title"><b>Set your delivery location</b><span>Move the map to place the pin exactly where you receive orders.</span></div>
  <button class="locate" id="locateBtn" onclick="locateMe()" aria-label="Use current location"><i class="fa-solid fa-location-crosshairs"></i></button>
</div>
<div class="sheet">
  <div class="status">
    <div class="status-icon"><i class="fa-solid fa-location-dot"></i></div>
    <div><b>Accurate location = accurate delivery</b><span>Nearbite uses this GPS point to calculate delivery distance and charges.</span></div>
  </div>
  <div class="warn" id="warn"></div>
  <div class="address" id="coords">Getting your location…</div>
  <div class="actions">
    <button class="btn" onclick="locateMe()"><i class="fa-solid fa-crosshairs"></i> Use current</button>
    <button class="btn primary" id="confirm" onclick="confirmLocation()" disabled>Confirm location</button>
  </div>
</div>
<div class="loading" id="loading"><div class="spinner"></div><b style="margin-top:12px;font-size:13px">Finding your location…</b><span style="margin-top:5px;color:#6b7280;font-size:11px">Please allow location access</span></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const DEFAULT=[26.52,88.73]; // Maynaguri fallback only; never used as confirmed customer GPS.
let map, current=null, locating=false;
const $=id=>document.getElementById(id);
function goBack(){history.back()}
function showWarn(t){$('warn').textContent=t;$('warn').style.display=t?'block':'none'}
function updateText(){
 if(!current){$('coords').textContent='Move the map or allow location access to set your delivery point.';return}
 $('coords').textContent=`Pin: ${current.lat.toFixed(6)}, ${current.lng.toFixed(6)} · Move the map to adjust`;
 $('confirm').disabled=false;
}
function initMap(){
 map=L.map('map',{zoomControl:false,attributionControl:true}).setView(DEFAULT,15);
 L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'© OpenStreetMap contributors'}).addTo(map);
 map.on('moveend',()=>{const c=map.getCenter();current={lat:c.lat,lng:c.lng};updateText()});
 locateMe();
}
function locateMe(){
 if(locating)return;
 if(!navigator.geolocation){showWarn('This browser does not support location. You can still move the map and choose a location manually.');return}
 locating=true;$('locateBtn').disabled=true;$('loading').style.display='flex';showWarn('');
 navigator.geolocation.getCurrentPosition(p=>{
   current={lat:p.coords.latitude,lng:p.coords.longitude};
   map.setView([current.lat,current.lng],17,{animate:true});
   updateText();locating=false;$('locateBtn').disabled=false;$('loading').style.display='none';
 },e=>{
   locating=false;$('locateBtn').disabled=false;$('loading').style.display='none';
   const msg=e.code===1
    ? 'Location permission was denied. Please allow location access in your browser settings for accurate delivery distance and charges.'
    : e.code===3 ? 'Location request timed out. Tap “Use current” to try again, or move the map manually.'
    : 'We could not get your location. You can move the map manually and confirm your delivery point.';
   showWarn(msg);updateText();
 },{enableHighAccuracy:true,timeout:15000,maximumAge:30000});
}
function confirmLocation(){
 if(!current)return;
 localStorage.setItem('nearbite_onboarding_location',JSON.stringify({
   latitude:Number(current.lat.toFixed(7)),longitude:Number(current.lng.toFixed(7)),capturedAt:Date.now()
 }));
 localStorage.setItem('nearbite_location_permission_seen','1');
 const next=localStorage.getItem('nearbite_after_login');
 window.location.href='complete-profile.html?location=done'+(next?'':'&new=1');
}
window.addEventListener('load',initMap);
</script>
</body>
</html>
