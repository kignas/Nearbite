<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Choose delivery location · Nearbite</title>
<link rel="preconnect" href="https://unpkg.com">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--brand:#fc8019;--ink:#111827;--muted:#6b7280;--line:#e7e8eb;--soft:#f7f7f8}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;color:var(--ink);overflow:hidden}
#map{position:absolute;inset:0;background:#e9eef2}
.top{position:absolute;top:14px;left:14px;right:14px;z-index:1000;display:flex;align-items:center;gap:10px}
.back,.locate{width:44px;height:44px;border:0;border-radius:14px;background:#fff;box-shadow:0 5px 20px #0002;color:#111827;font-size:16px}
.title{flex:1;background:rgba(255,255,255,.97);border-radius:15px;padding:11px 14px;box-shadow:0 5px 20px #0002}
.title b{font-size:14px}.title span{display:block;font-size:10px;color:var(--muted);margin-top:3px}
.pin{position:absolute;left:50%;top:50%;z-index:900;transform:translate(-50%,-100%);pointer-events:none;color:var(--brand);font-size:44px;filter:drop-shadow(0 4px 5px #0004)}
.pin-dot{position:absolute;left:50%;top:50%;width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid var(--brand);transform:translate(-50%,-50%);z-index:901;pointer-events:none}
.gps-marker{width:18px;height:18px;border:3px solid #fff;border-radius:50%;background:#1677ff;box-shadow:0 2px 10px #0005}
.gps-pulse{border:2px solid #1677ff;border-radius:50%;animation:pulse 1.8s infinite}@keyframes pulse{0%{transform:scale(.7);opacity:.75}100%{transform:scale(1.8);opacity:0}}
.sheet{position:absolute;left:10px;right:10px;bottom:10px;z-index:1000;background:rgba(255,255,255,.98);border-radius:25px;padding:18px;box-shadow:0 -5px 30px #0002}
.status{display:flex;gap:11px;align-items:flex-start;margin-bottom:13px}.status-icon{width:40px;height:40px;border-radius:13px;background:#fff2e8;color:var(--brand);display:grid;place-items:center;flex:none}
.status b{font-size:14px}.status span{display:block;color:var(--muted);font-size:11px;line-height:1.45;margin-top:3px}
.address{font-size:12px;color:#374151;background:#f8fafc;border:1px solid var(--line);padding:11px 12px;border-radius:13px;margin-bottom:11px;min-height:40px}
.address strong{display:block;color:#111827;margin-bottom:2px}.accuracy{font-size:10px;color:#15803d;margin-top:5px}
.warn{display:none;background:#fff7ed;border:1px solid #fed7aa;color:#9a4d13;padding:10px 12px;border-radius:12px;font-size:10px;line-height:1.45;margin-bottom:11px}
.actions{display:grid;grid-template-columns:1fr 1.2fr;gap:9px}.btn{height:48px;border-radius:14px;border:1px solid var(--line);background:#fff;font-weight:800;font-size:12px}.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn:disabled{opacity:.45}
.leaflet-control-attribution{font-size:8px}
</style>
</head>
<body>
<div id="map"></div>
<div class="pin"><i class="fa-solid fa-location-dot"></i></div><div class="pin-dot"></div>
<div class="top">
  <button class="back" onclick="window.nearbiteSafeBack()" aria-label="Back"><i class="fa-solid fa-arrow-left"></i></button>
  <div class="title"><b>Set your delivery location</b><span>Allow location or move the map to your exact delivery point.</span></div>
  <button class="locate" id="locateBtn" onclick="locateMe()" aria-label="Use current location"><i class="fa-solid fa-location-crosshairs"></i></button>
</div>
<div class="sheet">
  <div class="status">
    <div class="status-icon"><i class="fa-solid fa-location-dot"></i></div>
    <div><b>Use your real location</b><span>We use this GPS point to calculate restaurant distance and delivery charges accurately.</span></div>
  </div>
  <div class="warn" id="warn"></div>
  <div class="address" id="address">Waiting for your location…</div>
  <div class="actions">
    <button class="btn" id="currentBtn" onclick="locateMe()"><i class="fa-solid fa-crosshairs"></i> Use current</button>
    <button class="btn primary" id="confirm" onclick="confirmLocation()" disabled>Confirm location</button>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const DEFAULT=[26.52,88.73]; // Map-only fallback. Never saved as customer GPS.
let map,current=null,locating=false,gpsMarker=null,accuracyCircle=null,watchId=null,firstFix=false;
const $=id=>document.getElementById(id);
function warn(t){$('warn').textContent=t;$('warn').style.display=t?'block':'none'}
function setAddress(main,meta=''){ $('address').innerHTML=`<strong>${escapeHtml(main)}</strong>${meta?`<div class="accuracy">${escapeHtml(meta)}</div>`:''}` }
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]) )}
let mapMoveTimer=null;
function updateCenterFromMap(){
 // The fallback map center is never a valid customer location.
 // Only a real GPS fix can unlock map selection.
 if(!firstFix)return;
 const c=map.getCenter();
 if(!Number.isFinite(c.lat)||!Number.isFinite(c.lng))return;
 // The center pin is the selected delivery point. After the first GPS fix,
 // moving the map intentionally changes the delivery coordinates.
 current={lat:c.lat,lng:c.lng,accuracy:firstFix && current?.accuracy ? current.accuracy : 0};
 $('confirm').disabled=false;
 clearTimeout(mapMoveTimer);
 mapMoveTimer=setTimeout(async()=>{
   setAddress('Selected delivery location','Getting the address for this point…');
   const d=await reverseGeocode(current.lat,current.lng);
   const meta=current.accuracy?`GPS accuracy ±${Math.round(current.accuracy)} m`:'Delivery point selected on map';
   setAddress(d?.display_name||'Selected delivery location',meta);
 },250);
}
function showGps(lat,lng,accuracy){
 if(gpsMarker)map.removeLayer(gpsMarker);
 if(accuracyCircle)map.removeLayer(accuracyCircle);
 const icon=L.divIcon({className:'',html:'<div class="gps-marker"></div>',iconSize:[18,18],iconAnchor:[9,9]});
 gpsMarker=L.marker([lat,lng],{icon,interactive:false}).addTo(map);
 accuracyCircle=L.circle([lat,lng],{radius:Math.min(Math.max(accuracy||30,10),500),color:'#1677ff',fillColor:'#1677ff',fillOpacity:.08,weight:1}).addTo(map);
}
async function reverseGeocode(lat,lng){
 try{
  const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lng)}&zoom=18&addressdetails=1`,{headers:{Accept:'application/json'}});
  if(!r.ok)return null;
  const d=await r.json(); localStorage.setItem('nearbite_onboarding_geocode',JSON.stringify(d));
  return d;
 }catch(e){return null}
}
function applyPosition(p,center=true){
 current={lat:Number(p.coords.latitude),lng:Number(p.coords.longitude),accuracy:Number(p.coords.accuracy||0)};
 firstFix=true; showGps(current.lat,current.lng,current.accuracy);
 if(center)map.setView([current.lat,current.lng],17,{animate:true});
 const acc=current.accuracy?`GPS accuracy ±${Math.round(current.accuracy)} m`:'GPS location captured';
 setAddress('Current location',acc); $('confirm').disabled=false; warn('');
 reverseGeocode(current.lat,current.lng).then(d=>{
  if(d?.display_name)setAddress(d.display_name,acc);
 });
}
function locateMe(){
 if(locating)return;
 if(!navigator.geolocation){warn('Your browser does not support location. Move the map manually to choose your delivery point.');return}
 locating=true;$('locateBtn').disabled=true;$('currentBtn').disabled=true;warn('Requesting your live location…');
 navigator.geolocation.getCurrentPosition(p=>{
   applyPosition(p,true); locating=false;$('locateBtn').disabled=false;$('currentBtn').disabled=false;
 },e=>{
   locating=false;$('locateBtn').disabled=false;$('currentBtn').disabled=false;
   const msg=e.code===1?'Location permission was denied. We’ll let you enter your delivery address manually.':
     e.code===3?'Location took too long. Please try again or enter your delivery address manually.':
     'We could not get your GPS location. You can enter your delivery address manually.';
   warn(msg);
   setAddress('Location not available','Opening manual address entry…');
   if(e.code===1){
     setTimeout(()=>{
       const next=localStorage.getItem('nearbite_after_login');
       window.location.href='complete-profile.html?location=manual'+(next?'':'&new=1');
     },700);
   }
 },{enableHighAccuracy:true,timeout:25000,maximumAge:10000});
}
async function confirmLocation(){
 if(!current)return;
 const btn=$('confirm');
 btn.disabled=true; btn.textContent='Saving location…';
 try{
   const d=await reverseGeocode(current.lat,current.lng);
   localStorage.setItem('nearbite_onboarding_location',JSON.stringify({
     latitude:Number(current.lat.toFixed(7)),longitude:Number(current.lng.toFixed(7)),
     accuracy:Number((current.accuracy||0).toFixed(1)),capturedAt:Date.now()
   }));
   if(d) localStorage.setItem('nearbite_onboarding_geocode',JSON.stringify(d));
   localStorage.setItem('nearbite_location_permission_seen','1');
   const next=localStorage.getItem('nearbite_after_login');
   window.location.href='complete-profile.html?location=done'+(next?'':'&new=1');
 }catch(e){
   warn('We could not save the location. Please try again.');
   btn.disabled=false; btn.textContent='Confirm location';
 }
}
function init(){
 map=L.map('map',{zoomControl:false,attributionControl:true}).setView(DEFAULT,15);
 L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'© OpenStreetMap contributors'}).addTo(map);
 map.on('moveend',updateCenterFromMap);
 map.on('movestart',()=>{ if(!locating) $('address').style.opacity='.75'; });
 map.on('moveend',()=>{ $('address').style.opacity='1'; });
 // The default map is visual context only and cannot be confirmed.
 $('confirm').disabled=true;
 setAddress('Finding your current location…','Please allow location access when your browser asks.');
 locateMe();
}
window.addEventListener('load',init);
</script>

<script src="navigation.js"></script>
</body>
</html>
