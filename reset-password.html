<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password — Eatswada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<style>
body{font-family:Inter,system-ui,sans-serif;background:#f7f7f7;color:#111827}.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(430px,100%);background:#fff;border:1px solid #e8e8e8;border-radius:24px;padding:26px;box-shadow:0 18px 50px rgba(0,0,0,.08)}.brand{font-size:22px;font-weight:800;color:#15803d;margin-bottom:22px}.title{font-size:25px;font-weight:800;letter-spacing:-.6px;margin:0}.sub{font-size:13px;line-height:1.55;color:#6b7280;margin:8px 0 22px}.label{display:block;font-size:12px;font-weight:700;margin:15px 0 7px}.field{width:100%;height:50px;border:1px solid #d9dde3;border-radius:13px;padding:0 14px;font:inherit;outline:none}.field:focus{border-color:#15803d;box-shadow:0 0 0 3px rgba(21,128,61,.1)}.btn{width:100%;height:50px;margin-top:20px;border:0;border-radius:13px;background:#15803d;color:#fff;font:800 14px Inter;cursor:pointer}.btn:disabled{opacity:.55}.error{display:none;margin-top:14px;padding:11px 12px;border-radius:12px;background:#fef2f2;border:1px solid #fbd5d5;color:#b42318;font-size:12px;font-weight:600;line-height:1.45}.error.show{display:block}.success{display:none;margin-top:14px;padding:11px 12px;border-radius:12px;background:#f0fdf4;border:1px solid #bbf7d0;color:#166534;font-size:12px;font-weight:600}.success.show{display:block}.back{display:block;text-align:center;margin-top:16px;color:#15803d;text-decoration:none;font-size:13px;font-weight:700}
</style>
</head>
<body><main class="wrap"><section class="card">
<div class="brand">Eatswada</div><h1 class="title">Create a new password</h1><p class="sub">Choose a strong password for your Eatswada account.</p>
<form id="form" novalidate><label class="label" for="password">New password</label><input id="password" class="field" type="password" minlength="8" maxlength="128" autocomplete="new-password" placeholder="At least 8 characters"><label class="label" for="confirm">Confirm password</label><input id="confirm" class="field" type="password" minlength="8" maxlength="128" autocomplete="new-password" placeholder="Enter it again"><div id="error" class="error" role="alert"></div><div id="success" class="success"></div><button id="btn" class="btn" type="submit">Reset password</button></form><a class="back" href="login.html">Back to login</a>
</section></main>
<script>
const API=CONFIG.API_BASE_URL+'/users';const token=new URLSearchParams(location.search).get('token')||'';const $=id=>document.getElementById(id);function msg(t){$('error').textContent=t||'';$('error').classList.toggle('show',!!t)}
$('form').addEventListener('submit',async e=>{e.preventDefault();msg('');$('success').classList.remove('show');const password=$('password').value,confirm=$('confirm').value;if(!token){msg('This password reset link is missing or invalid. Please request a new one.');return}if(password.length<8){msg('Password must be at least 8 characters.');return}if(password!==confirm){msg('Passwords do not match.');return}const b=$('btn');b.disabled=true;b.textContent='Resetting…';try{const r=await fetch(API+'/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({resetToken:token,password})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.success)throw new Error(d.message||'This reset link is invalid or expired.');$('success').textContent='Password changed successfully. You can now log in.';$('success').classList.add('show');$('password').value='';$('confirm').value='';setTimeout(()=>location.href='login.html',1400)}catch(err){msg(err.message||'Unable to reset your password.')}finally{b.disabled=false;b.textContent='Reset password'}});
</script><script src="navigation.js"></script></body></html>
