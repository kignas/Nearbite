<!DOCTYPE html>
<html lang="en"><head>
<meta name="color-scheme" content="light"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>(function(){try{var t=localStorage.getItem('eatswada_theme');t=t==='dark'?'dark':'light';var d=document.documentElement;d.dataset.ewTheme=t;d.style.colorScheme=t;var h=localStorage.getItem('eatswada_header_theme');var ok=['raspberry'];d.dataset.ewHeader=ok.indexOf(h)>-1?h:'raspberry';}catch(e){document.documentElement.dataset.ewHeader='raspberry';}})();</script>
<script src="https://cdn.jsdelivr.net/npm/darkreader@4.9.133/darkreader.js" data-ew-dark-reader></script>
<script src="eatswada-theme.js"></script>
<script src="eatswada-header-theme.js"></script>
<title>Payment Successful – Eatswada | EatSwada</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/eatswada-payment.css?v=20261004-pay1">
<link rel="stylesheet" href="eatswada-theme.css">
<link rel="stylesheet" href="eatswada-header-theme.css">

<meta name="description" content="Explore EatSwada, your local food ordering platform in Maynaguri, West Bengal."/>
<meta name="robots" content="noindex, nofollow"/>
<link rel="canonical" href="https://eatswada.com/payment-success.html"/>
<meta property="og:type" content="website"/>
<meta property="og:site_name" content="EatSwada"/>
<meta property="og:title" content="Payment Successful – Eatswada | EatSwada"/>
<meta property="og:description" content="Explore EatSwada, your local food ordering platform in Maynaguri, West Bengal."/>
<meta property="og:url" content="https://eatswada.com/payment-success.html"/>
<meta name="twitter:card" content="summary"/>
</head>
<body><main class="ew-result ew-success" aria-live="polite">

<div class="ew-icon-wrap">
  <span class="ew-halo" aria-hidden="true"></span>
  <div class="ew-icon" aria-hidden="true">
    <svg class="ew-svg" viewBox="0 0 48 48" fill="none" aria-hidden="true">
      <circle class="ew-ring" cx="24" cy="24" r="20" stroke="currentColor" stroke-width="2.5"/>
      <path class="ew-draw" d="m14.5 24.5 6.2 6.1L34 17.8" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="ew-spark ew-spark--dot" style="--a:15deg;--sd:.46s;--dist:40px;--s:5px" aria-hidden="true"></span>
    <span class="ew-spark ew-spark--dot" style="--a:72deg;--sd:.54s;--dist:33px;--s:4px" aria-hidden="true"></span>
    <span class="ew-spark ew-spark--dot" style="--a:128deg;--sd:.48s;--dist:42px;--s:5px" aria-hidden="true"></span>
    <span class="ew-spark ew-spark--dot" style="--a:182deg;--sd:.56s;--dist:35px;--s:4px" aria-hidden="true"></span>
    <span class="ew-spark ew-spark--dot" style="--a:236deg;--sd:.50s;--dist:41px;--s:5px" aria-hidden="true"></span>
    <span class="ew-spark ew-spark--dot" style="--a:302deg;--sd:.58s;--dist:44px;--s:4px" aria-hidden="true"></span>
  </div>
</div>

<h1 class="ew-title">Payment successful</h1>
<p class="ew-copy">Your payment has been verified. Your order is now confirmed.</p>

<div class="ew-order" id="ew-order" hidden>
  <div class="ew-order-row">
    <span class="ew-order-label">Order number</span>
    <span class="ew-order-value" id="ew-order-number"></span>
  </div>
  <p class="ew-order-meta">Payment verified · Order confirmed</p>
</div>

<div class="ew-actions">
  <button class="ew-btn ew-btn-primary" id="ew-continue">Continue to order</button>
</div>

<div class="ew-redirect">
  <div class="ew-redirect-bar" aria-hidden="true"><span class="ew-redirect-fill"></span></div>
  <p class="ew-note">Please don't close the page while we finish opening your order.</p>
</div>

</main>
<script>
(function(){
const KEY='nearbite_payment_context';let ctx=null;try{ctx=JSON.parse(localStorage.getItem(KEY)||'null')}catch(_){}
const box=document.getElementById('ew-order'),num=document.getElementById('ew-order-number');
if(ctx?.orderNumber){num.textContent=ctx.orderNumber;box.hidden=false}
let done=false;
function go(){if(done)return;done=true;
try{if(ctx?.multiple&&ctx.deliveryOtps){Object.keys(ctx.deliveryOtps).forEach(id=>{if(ctx.deliveryOtps[id])localStorage.setItem('nearbite_delivery_otp_'+id,ctx.deliveryOtps[id])})}
else if(ctx?.deliveryOtp&&ctx?.orderId)localStorage.setItem('nearbite_delivery_otp_'+ctx.orderId,ctx.deliveryOtp)}catch(_){}
/* No order id available (e.g. the page was refreshed after the context was
   consumed). Stay on this confirmation screen instead of falling through to
   the Orders list, which would look like the payment never completed. */
if(!ctx?.orderId)return;
/* Keep the context until we actually leave, so refresh/back can still resolve
   the order; only clear it once we navigate to the order view. */
try{localStorage.removeItem(KEY)}catch(_){}
location.href=ctx.multiple?'orders.html':'track-order.html?id='+encodeURIComponent(ctx.orderId)}
document.getElementById('ew-continue').addEventListener('click',go);setTimeout(go,3600)
})();
</script></body></html>
