<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#ffffff"><title>Reset Password – Nearbite</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><script src="config.js"></script>
<style>
:root{--brand:#FC8019;--text:#111827;--muted:#6b7280;--border:#e5e7eb;--danger:#dc2626;--success:#059669}*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Plus Jakarta Sans',sans-serif;background:#fff;color:var(--text);min-height:100dvh}.header{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;position:sticky;top:0;background:#fff;z-index:5}.back{width:40px;height:40px;border:0;border-radius:50%;background:#f3f4f6;font-size:16px}.title{font-size:18px;font-weight:800}.content{padding:38px 20px;max-width:520px;margin:auto}.hero{text-align:center;margin-bottom:28px}.icon{width:64px;height:64px;border-radius:22px;background:#fff4ec;color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:25px;margin:0 auto 16px}.hero h1{font-size:25px;font-weight:900}.hero p{margin-top:8px;color:var(--muted);font-size:13px;line-height:1.6}.field{margin-bottom:14px}label{display:block;font-size:12px;font-weight:800;color:#374151;margin-bottom:7px}input{width:100%;padding:15px;border:1.5px solid var(--border);border-radius:14px;background:#f9fafb;font:600 14px 'Plus Jakarta Sans';outline:0}input:focus{background:#fff;border-color:var(--brand);box-shadow:0 0 0 3px rgba(252,128,25,.1)}button.primary{display:block;width:100%;border:0;border-radius:15px;padding:16px;background:var(--brand);color:#fff;font:800 14px 'Plus Jakarta Sans';margin-top:10px}button.primary:disabled{opacity:.5}.error{display:none;background:#fef2f2;color:var(--danger);border:1px solid #fecaca;border-radius:12px;padding:12px;font-size:12px;font-weight:700;margin-bottom:16px}.error.show{display:block}.otp{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.otp input{text-align:center;font-size:20px;padding:14px}.link{display:block;width:100%;border:0;background:none;color:var(--brand);font:800 13px 'Plus Jakarta Sans';padding:12px}.hidden{display:none!important}.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;margin-right:8px;vertical-align:-2px}@keyframes spin{to{transform:rotate(360deg)}}
</style></head><body>
<div class="header"><button class="back" onclick="history.back()" aria-label="Back"><i class="fa-solid fa-arrow-left"></i></button><div class="title">Reset password</div></div>
<main class="content"><div class="hero"><div class="icon"><i class="fa-solid fa-lock"></i></div><h1>Forgot your password?</h1><p>Verify your mobile number and create a new password.</p></div>
<div id="error" class="error"></div>
<section id="phoneStep"><div class="field"><label for="phone">Mobile number</label><input id="phone" type="tel" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number" autocomplete="tel-national"></div><button id="sendBtn" class="primary" onclick="sendResetOTP()">Send OTP</button></section>
<section id="otpStep" class="hidden"><div class="field"><label>Enter OTP</label><div class="otp"><input maxlength="1" inputmode="numeric" id="o1"><input maxlength="1" inputmode="numeric" id="o2"><input maxlength="1" inputmode="numeric" id="o3"><input maxlength="1" inputmode="numeric" id="o4"></div></div><button id="verifyBtn" class="primary" onclick="verifyResetOTP()">Verify OTP</button><button id="resendBtn" class="link" onclick="sendResetOTP(true)" disabled>Resend in 60s</button></section>
<section id="passwordStep" class="hidden"><div class="field"><label for="newPassword">New password</label><input id="newPassword" type="password" minlength="6" maxlength="72" autocomplete="new-password" placeholder="At least 6 characters"></div><div class="field"><label for="confirmPassword">Confirm password</label><input id="confirmPassword" type="password" minlength="6" maxlength="72" autocomplete="new-password" placeholder="Enter password again"></div><button id="resetBtn" class="primary" onclick="resetPassword()">Change password</button></section>
<button class="link" onclick="location.href='login.html'">Back to login</button></main>
<script>
const API=`${CONFIG.API_BASE_URL}/users`;let phone='',resetToken='',timer;
const $=id=>document.getElementById(id);function err(m){$('error').textContent=m||'';$('error').classList.toggle('show',!!m)}
['o1','o2','o3','o4'].forEach((id,i)=>{$(id).addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,1);if(e.target.value&&i<3)$(['o1','o2','o3','o4'][i+1]).focus()})});
function countdown(){let n=60;const b=$('resendBtn');b.disabled=true;b.textContent=`Resend in ${n}s`;clearInterval(timer);timer=setInterval(()=>{n--;b.textContent=n?`Resend in ${n}s`:'Resend';if(!n){clearInterval(timer);b.disabled=false}},1000)}
async function sendResetOTP(resend=false){err('');const raw=$('phone').value.replace(/\D/g,'').slice(0,10);if(!/^[6-9]\d{9}$/.test(raw)){err('Enter a valid 10-digit mobile number.');return}phone='+91'+raw;const b=resend?$('resendBtn'):$('sendBtn');b.disabled=true;b.textContent='Sending…';try{const r=await fetch(`${API}/forgot-password`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.success)throw new Error(d.message||'Could not send OTP.');$('phoneStep').classList.add('hidden');$('otpStep').classList.remove('hidden');countdown();$('o1').focus()}catch(e){err(e.message||'Could not send OTP.');b.disabled=false;b.textContent=resend?'Resend':'Send OTP'}}
async function verifyResetOTP(){err('');const otp=['o1','o2','o3','o4'].map(id=>$(id).value).join('');if(otp.length!==4){err('Enter the 4-digit OTP.');return}const b=$('verifyBtn');b.disabled=true;b.textContent='Verifying…';try{const r=await fetch(`${API}/forgot-password/verify`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,otp})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.success)throw new Error(d.message||'Invalid or expired OTP.');resetToken=d.data?.resetToken;if(!resetToken)throw new Error('Reset session could not be created.');$('otpStep').classList.add('hidden');$('passwordStep').classList.remove('hidden');$('newPassword').focus()}catch(e){err(e.message||'Invalid OTP.')}finally{b.disabled=false;b.textContent='Verify OTP'}}
async function resetPassword(){err('');const password=$('newPassword').value,confirm=$('confirmPassword').value;if(password.length<6){err('Password must be at least 6 characters.');return}if(password!==confirm){err('Passwords do not match.');return}const b=$('resetBtn');b.disabled=true;b.textContent='Changing…';try{const r=await fetch(`${API}/forgot-password/reset`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,resetToken,password})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.success)throw new Error(d.message||'Could not change password.');alert('Password changed successfully. Please log in.');location.href='login.html'}catch(e){err(e.message||'Could not change password.')}finally{b.disabled=false;b.textContent='Change password'}}
</script><script src="navigation.js"></script></body></html>
