<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<script>(function(){try{var t=localStorage.getItem('eatswada_theme');if(t==='dark')document.documentElement.dataset.ewTheme='dark';}catch(e){}})();</script>
<link rel="stylesheet" href="eatswada-theme.css">
<script src="eatswada-theme.js"></script>
<meta name="theme-color" content="#ffe8f0">
<title>99 Store – Eatswada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/under99-tokens.css">
<link rel="stylesheet" href="css/under99-base.css">
<link rel="stylesheet" href="css/under99-header.css">
<link rel="stylesheet" href="css/under99-hero.css">
<link rel="stylesheet" href="css/under99-filters.css">
<link rel="stylesheet" href="css/under99-price-tabs.css">
<link rel="stylesheet" href="css/under99-product-card.css">
<link rel="stylesheet" href="css/under99-product-grid.css">
<link rel="stylesheet" href="css/under99-customize.css">
<link rel="stylesheet" href="css/under99-responsive.css">
<link rel="stylesheet" href="css/under99-skeleton.css">
<link rel="stylesheet" href="search-overlay.css">
<link rel="stylesheet" href="css/eatswada-ui-system.css?v=20260923-typography">
</head>
<body>

<header class="u99-header">
  <div class="u99-topbar">
    <a class="u99-circle-btn" href="index.html" aria-label="Back"><span data-icon="back" data-icon-size="22"></span></a>
    <button id="u99-location" class="u99-location" type="button" aria-label="Change delivery location">
      <span class="u99-location-pin" data-icon="location" data-icon-size="20"></span>
      <span class="u99-location-copy">
        <span class="u99-location-line">
          <strong id="u99-location-name" class="u99-location-name">Location</strong>
          <span class="u99-location-chevron" data-icon="chevron-down" data-icon-size="15"></span>
        </span>
        <span id="u99-location-sub" class="u99-location-sub">Delivery in 35 min</span>
      </span>
    </button>
    <button class="u99-circle-btn u99-search-btn" type="button" data-ew-search aria-label="Search"><span data-icon="search" data-icon-size="22"></span></button>
  </div>

  <section class="u99-hero" aria-label="Meals under ₹99">
    <div class="u99-hero-copy">
      <div class="u99-kicker">MEALS UNDER</div>
      <div class="u99-price"><span class="currency">₹</span><span class="number">99</span></div>
      <p class="u99-sub">Great food. Lower prices. Everyday.</p>
    </div>
    <div class="u99-hero-fallback" aria-hidden="true"></div>
    <div class="u99-hero-skeleton" aria-hidden="true">
      <span class="u99-hero-skel-copy"></span>
      <span class="u99-hero-skel-art"></span>
    </div>
    <img id="u99-hero-art" class="u99-hero-art" alt="" hidden>
  </section>

</header>

<nav class="u99-filter-rail" aria-label="99 Store filters">
    <button class="u99-filter filter-pill u99-filter-icon" data-filter-action="open" type="button" aria-label="Open filters"><span data-icon="filter" data-icon-size="17"></span><span class="u99-filter-icon-label">Filters</span></button>
    <button id="u99-discount" class="u99-filter filter-pill featured" data-filter-action="discount" type="button"><span class="u99-percent">%</span>25–60% lower prices</button>
    <button class="u99-filter filter-pill" data-filter-action="open" data-rail="delivery" type="button">Delivery time <span data-icon="chevron-down" data-icon-size="15"></span></button>
    <button class="u99-filter filter-pill" data-filter-action="open" data-rail="food" type="button">Veg / Non-Veg <span data-icon="chevron-down" data-icon-size="15"></span></button>
  </nav>

<main class="u99-page">

  <nav class="u99-price-seg" role="tablist" aria-label="Price range">
    <span class="u99-price-thumb" aria-hidden="true"></span>
    <button class="u99-price-tab active" role="tab" aria-selected="true" data-price-band="99">₹99 &amp; under</button>
    <button class="u99-price-tab" role="tab" aria-selected="false" data-price-band="100">₹100 – ₹149</button>
    <button class="u99-price-tab" role="tab" aria-selected="false" data-price-band="150">₹150 – ₹200</button>
  </nav>

  <section id="u99-products">
    <div class="u99-products-head">
      <h2 id="u99-count" class="u99-products-title">All items</h2>
      <button id="u99-sort" class="u99-sort" type="button" aria-haspopup="dialog">
        <span data-icon="sort" data-icon-size="15"></span>
        <span id="u99-sort-label">Sort</span>
      </button>
    </div>

    <div class="u99-results-stage">
      <div id="u99-skeleton" class="u99-skeleton">
        <div class="u99-skel-grid"><div class="u99-skel-card u99-shimmer"></div><div class="u99-skel-card u99-shimmer"></div><div class="u99-skel-card u99-shimmer"></div><div class="u99-skel-card u99-shimmer"></div></div>
      </div>
      <div id="u99-product-grid" class="u99-product-grid"></div>
    </div>
  </section>
</main>

<!-- ===================== FILTERS SHEET (ref #04) ===================== -->
<div id="u99-filter-backdrop" class="u99-filter-backdrop" aria-hidden="true">
  <section class="u99-filter-sheet" role="dialog" aria-modal="true" aria-labelledby="u99-filter-title">
    <div class="u99-sheet-grab"></div>
    <div class="u99-filter-head">
      <h2 id="u99-filter-title" class="u99-filter-title">Filters</h2>
      <button class="u99-filter-close" data-filter-action="close" aria-label="Close"><span data-icon="close" data-icon-size="18"></span></button>
    </div>

    <div class="u99-filter-scroll">
      <div class="u99-filter-block">
        <div class="u99-filter-label">Offers &amp; pricing</div>
        <button class="u99-row" data-filter-choice="offer" data-value="discount"><span class="u99-row-label">25–60% lower prices</span><span class="u99-check" aria-hidden="true"></span></button>
        <button class="u99-row" data-filter-choice="offer" data-value="free"><span class="u99-row-label">Free delivery</span><span class="u99-check" aria-hidden="true"></span></button>
        <button class="u99-row" data-filter-choice="offer" data-value="great"><span class="u99-row-label">Great offers</span><span class="u99-check" aria-hidden="true"></span></button>
      </div>

      <div class="u99-filter-block">
        <div class="u99-filter-label">Delivery time</div>
        <button class="u99-row" data-filter-choice="delivery" data-value="30"><span class="u99-row-label">Fastest (under 30 mins)</span><span class="u99-radio" aria-hidden="true"></span></button>
        <button class="u99-row" data-filter-choice="delivery" data-value="40"><span class="u99-row-label">30–40 mins</span><span class="u99-radio" aria-hidden="true"></span></button>
        <button class="u99-row" data-filter-choice="delivery" data-value="60"><span class="u99-row-label">40–60 mins</span><span class="u99-radio" aria-hidden="true"></span></button>
      </div>

      <div class="u99-filter-block">
        <div class="u99-filter-label">Veg / Non-Veg</div>
        <button class="u99-row" data-filter-choice="food" data-value="veg"><span class="u99-row-label">Pure Veg</span><span class="u99-radio" aria-hidden="true"></span></button>
        <button class="u99-row" data-filter-choice="food" data-value="all"><span class="u99-row-label">Both</span><span class="u99-radio" aria-hidden="true"></span></button>
        <button class="u99-row" data-filter-choice="food" data-value="nonveg"><span class="u99-row-label">Non-Veg</span><span class="u99-radio" aria-hidden="true"></span></button>
      </div>
    </div>

    <div class="u99-filter-actions">
      <button class="u99-clear" data-filter-action="clear" type="button">Clear all</button>
      <button class="u99-apply" data-filter-action="apply" type="button">Apply</button>
    </div>
  </section>
</div>

<!-- ===================== SORT SHEET (ref #03) ===================== -->
<div id="u99-sort-backdrop" class="u99-filter-backdrop" aria-hidden="true">
  <section class="u99-sort-sheet" role="dialog" aria-modal="true" aria-labelledby="u99-sort-title">
    <div class="u99-sheet-grab"></div>
    <div class="u99-filter-head">
      <h2 id="u99-sort-title" class="u99-filter-title">Sort by</h2>
      <button class="u99-filter-close" data-sort-action="close" aria-label="Close"><span data-icon="close" data-icon-size="18"></span></button>
    </div>
    <div class="u99-sort-options">
      <button class="u99-sort-option selected" data-sort-option="default"><span class="u99-sort-ic" data-icon="sort-updown" data-icon-size="18"></span><span class="u99-sort-text">Recommended</span><span class="u99-sort-radio"></span></button>
      <button class="u99-sort-option" data-sort-option="price"><span class="u99-sort-ic" data-icon="price-up" data-icon-size="18"></span><span class="u99-sort-text">Price: Low to High</span><span class="u99-sort-radio"></span></button>
      <button class="u99-sort-option" data-sort-option="price-desc"><span class="u99-sort-ic" data-icon="price-down" data-icon-size="18"></span><span class="u99-sort-text">Price: High to Low</span><span class="u99-sort-radio"></span></button>
      <button class="u99-sort-option" data-sort-option="rating"><span class="u99-sort-ic" data-icon="star" data-icon-size="18"></span><span class="u99-sort-text">Rating: High to Low</span><span class="u99-sort-radio"></span></button>
      <button class="u99-sort-option" data-sort-option="delivery"><span class="u99-sort-ic" data-icon="clock" data-icon-size="18"></span><span class="u99-sort-text">Delivery time</span><span class="u99-sort-radio"></span></button>
    </div>
    <div class="u99-filter-actions single">
      <button class="u99-apply" data-sort-action="apply" type="button">Apply</button>
    </div>
  </section>
</div>

<!-- ===================== ITEM CUSTOMIZATION SHEET (ref #02) ===================== -->
<div id="u99-item-backdrop" class="u99-filter-backdrop u99-item-backdrop" aria-hidden="true">
  <section id="u99-item-sheet" class="u99-item-sheet" role="dialog" aria-modal="true" aria-label="Item details"></section>
</div>

<div id="u99-toast" class="u99-toast" role="status"></div>

<script src="cart-bar.js"></script>
<script src="search-overlay.js"></script>
<script src="js/under99-icons.js"></script>
<script src="js/under99-core.js"></script>
<script src="js/under99-header.js"></script>
<script src="js/under99-filters.js"></script>
<script src="js/under99-price-tabs.js"></script>
<script src="js/under99-products.js"></script>
<script src="js/under99-customize.js"></script>
<script src="js/under99.js"></script>
</body>
</html>
