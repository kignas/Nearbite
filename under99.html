<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#FBD4E1">
<title>99 Store – Eatswada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/under99-base.css">
<link rel="stylesheet" href="css/under99-header.css">
<link rel="stylesheet" href="css/under99-hero.css">
<link rel="stylesheet" href="css/under99-filters.css">
<link rel="stylesheet" href="css/under99-popular.css">
<link rel="stylesheet" href="css/under99-price-tabs.css">
<link rel="stylesheet" href="css/under99-product-card.css">
<link rel="stylesheet" href="css/under99-product-grid.css">
<link rel="stylesheet" href="css/under99-responsive.css">
<link rel="stylesheet" href="css/under99-skeleton.css">
</head>
<body>

<header class="u99-header">
  <div class="u99-topbar">
    <a class="u99-circle-btn" href="index.html" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
    </a>
    <button id="u99-location" class="u99-location" type="button" aria-label="Change delivery location">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.7A7.35 7.35 0 0 0 4.65 10c0 5.35 7.35 11.3 7.35 11.3S19.35 15.35 19.35 10A7.35 7.35 0 0 0 12 2.7Zm0 10.05A2.75 2.75 0 1 1 12 7.25a2.75 2.75 0 0 1 0 5.5Z"/></svg>
      <span class="u99-location-copy"><strong id="u99-location-name" class="u99-location-name">Takaturi</strong><span id="u99-location-sub" class="u99-location-sub">Delivery in 35–40 minutes</span></span>
    </button>
    <button class="u99-circle-btn u99-search-btn" type="button" onclick="location.href='search.html'" aria-label="Search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.8" cy="10.8" r="7.2"/><path d="m16.1 16.1 4.1 4.1"/></svg>
    </button>
  </div>

  <section class="u99-hero" aria-label="Meals under ₹99">
    <div class="u99-hero-copy">
      <div class="u99-kicker">MEALS UNDER</div>
      <div class="u99-price"><span class="currency">₹</span><span class="number">99</span></div>
      <p class="u99-sub">Great food. Lower prices. Everyday.</p>
    </div>
    <img id="u99-hero-art" class="u99-hero-art" alt="" hidden>
  </section>

  <nav class="u99-filter-rail" aria-label="99 Store filters">
    <button class="u99-filter u99-filter-icon" data-filter-action="open" type="button" aria-label="Filters">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h16"/><circle cx="9" cy="7" r="2"/><path d="M4 17h16"/><circle cx="15" cy="17" r="2"/></svg>
    </button>
    <button id="u99-discount" class="u99-filter active" data-filter-action="discount" type="button"><span class="u99-percent">%</span>40–60% Lower Prices</button>
    <button class="u99-filter" data-filter-action="open" type="button">Veg/Non-Veg <span>⌄</span></button>
    <button class="u99-filter" data-filter-action="open" type="button">₹99 &amp; under <span>⌄</span></button>
  </nav>
</header>

<main class="u99-page">

  <section class="u99-popular">
    <div class="u99-section-title u99-section"><span>Popular dishes near you</span><a class="link" href="#u99-products">See all →</a></div>
    <div id="u99-popular-rail" class="u99-popular-rail"></div>
  </section>

  <nav class="u99-price-tabs" aria-label="Price range">
    <button class="u99-price-tab active" data-price-band="99">₹99 &amp; under</button>
    <button class="u99-price-tab" data-price-band="100">₹100 – ₹149</button>
    <button class="u99-price-tab" data-price-band="150">₹150 – ₹200</button>
  </nav>

  <section id="u99-products">
    <div class="u99-products-head">
      <h2 id="u99-count" class="u99-products-title">All items</h2>
      <button id="u99-sort" class="u99-sort" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 4v16M5 7l3-3 3 3M16 20V4m-3 13 3 3 3-3"/></svg>
        <span id="u99-sort-label">Sort</span>
      </button>
    </div>

    <div id="u99-skeleton" class="u99-skeleton">
      <div class="u99-skel-pop"><div><div class="u99-skel-circle u99-shimmer"></div><div class="u99-skel-line u99-shimmer"></div></div><div><div class="u99-skel-circle u99-shimmer"></div><div class="u99-skel-line u99-shimmer"></div></div><div><div class="u99-skel-circle u99-shimmer"></div><div class="u99-skel-line u99-shimmer"></div></div><div><div class="u99-skel-circle u99-shimmer"></div><div class="u99-skel-line u99-shimmer"></div></div></div>
      <div class="u99-skel-grid"><div class="u99-skel-card u99-shimmer"></div><div class="u99-skel-card u99-shimmer"></div><div class="u99-skel-card u99-shimmer"></div><div class="u99-skel-card u99-shimmer"></div></div>
    </div>

    <div id="u99-product-grid" class="u99-product-grid"></div>
  </section>
</main>

<div id="u99-filter-backdrop" class="u99-filter-backdrop" aria-hidden="true">
  <section class="u99-filter-sheet" role="dialog" aria-modal="true" aria-labelledby="u99-filter-title">
    <div class="u99-filter-head"><h2 id="u99-filter-title" class="u99-filter-title">Filters &amp; sorting</h2><button class="u99-filter-close" data-filter-action="close" aria-label="Close">×</button></div>

    <div class="u99-filter-block">
      <div class="u99-filter-label">Discount</div>
      <div class="u99-filter-options"><button class="u99-option selected" data-filter-choice="discount" data-value="discount">40–60% Lower Prices</button></div>
    </div>

    <div class="u99-filter-block">
      <div class="u99-filter-label">Food preference</div>
      <div class="u99-filter-options">
        <button class="u99-option selected" data-filter-choice="food" data-value="all">All</button>
        <button class="u99-option" data-filter-choice="food" data-value="veg">Veg</button>
        <button class="u99-option" data-filter-choice="food" data-value="nonveg">Non-Veg</button>
      </div>
    </div>

    <div class="u99-filter-block">
      <div class="u99-filter-label">Delivery time</div>
      <div class="u99-filter-options">
        <button class="u99-option" data-filter-choice="delivery" data-value="20">Under 20 min</button>
        <button class="u99-option" data-filter-choice="delivery" data-value="30">Under 30 min</button>
        <button class="u99-option" data-filter-choice="delivery" data-value="45">Under 45 min</button>
      </div>
    </div>

    <div class="u99-filter-actions">
      <button class="u99-clear" data-filter-action="clear">Clear all</button>
      <button class="u99-apply" data-filter-action="apply">Show results</button>
    </div>
  </section>
</div>

<div id="u99-toast" class="u99-toast" role="status"></div>

<script src="cart-bar.js"></script>
<script src="js/under99-core.js"></script>
<script src="js/under99-header.js"></script>
<script src="js/under99-filters.js"></script>
<script src="js/under99-popular.js"></script>
<script src="js/under99-price-tabs.js"></script>
<script src="js/under99-products.js"></script>
<script src="js/under99.js"></script>
</body>
</html>
