<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="view-transition" content="same-origin">
  <title>99 Store – Eatswada</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>

<style>
:root{
  --ink:#101828;
  --muted:#737983;
  --soft:#f7f8fa;
  --line:#e7e8eb;
  --pink:#e11d8d;
  --pink2:#ff9ed1;
  --pink-soft:#fff0f8;
  --green:#16865a;
  --green-soft:#edf9f3;
  --red:#dc2446;
  --gold:#f4aa22;
  --shadow:0 3px 16px rgba(16,24,40,.055);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--soft);color:var(--ink);font-family:Poppins,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,a{font:inherit}
button{cursor:pointer}
body{padding-bottom:78px}
svg{display:block}

.store-header{
  position:sticky;top:0;z-index:1000;
  background:rgba(255,255,255,.97);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(16,24,40,.06);
}
.header-top{
  height:72px;padding:10px 18px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.header-left{display:flex;align-items:center;gap:12px;min-width:0}
.icon-btn{
  width:44px;height:44px;flex:0 0 44px;
  border:1px solid #e2e4e8;border-radius:50%;
  background:#fff;color:#101828;
  display:grid;place-items:center;
  box-shadow:0 1px 3px rgba(16,24,40,.025);
  -webkit-tap-highlight-color:transparent;
}
.icon-btn:active{transform:scale(.95)}
.icon-btn svg{width:21px;height:21px}
.header-copy{min-width:0}
.header-title{
  margin:0;font-size:20px;line-height:1.1;font-weight:900;
  letter-spacing:-.55px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.header-sub{
  margin:3px 0 0;font-size:10px;line-height:1.2;
  color:#7e858e;font-weight:600;white-space:nowrap;
}
.filter-row{
  display:flex;gap:8px;overflow-x:auto;
  padding:0 18px 11px;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.filter-row::-webkit-scrollbar{display:none}
.filter-pill{
  height:42px;flex:0 0 auto;padding:0 16px;
  border:1px solid #dedfe4;border-radius:23px;
  background:#fff;color:#2c3138;
  font-size:12px;font-weight:700;white-space:nowrap;
  display:flex;align-items:center;gap:7px;
  box-shadow:0 1px 2px rgba(16,24,40,.02);
}
.filter-pill.active{
  color:var(--pink);border-color:#f1b3d5;background:var(--pink-soft);
}
.filter-pill svg{width:17px;height:17px}
.filter-pill.active svg{stroke:var(--pink)}

main{max-width:820px;margin:0 auto;padding:18px 14px 28px}
.restaurant-feed{display:flex;flex-direction:column;gap:16px}
.items-found-label{
  margin:0 5px 13px;font-size:20px;line-height:1.2;
  font-weight:900;letter-spacing:-.45px;
}


.skeleton-feed{display:flex;flex-direction:column;gap:16px}
.skeleton-card{
  background:#fff;border:1px solid var(--line);border-radius:21px;padding:14px;
}
.skeleton-big{height:42px;border-radius:8px;margin-bottom:12px}
.skeleton-row{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.skeleton-img{aspect-ratio:1.06/1;border-radius:15px}
.skeleton-line{height:12px;border-radius:6px;margin-top:9px}
.skeleton{
  background:linear-gradient(90deg,#f0f1f3 25%,#fafafa 37%,#f0f1f3 63%);
  background-size:400% 100%;animation:shimmer 1.25s ease-in-out infinite;
}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}

.empty{
  background:#fff;border:1px solid var(--line);border-radius:20px;
  text-align:center;padding:55px 20px;color:#737983;
}
.empty h3{margin:12px 0 5px;color:#363b42;font-size:16px}
.empty p{margin:0;font-size:12px}

.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:9999;
  height:68px;padding-bottom:env(safe-area-inset-bottom);
  display:flex;background:rgba(255,255,255,.98);
  border-top:1px solid rgba(16,24,40,.06);
  box-shadow:0 -5px 24px rgba(16,24,40,.06);
}
.nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;color:#9aa2ae;text-decoration:none;font-size:10px;font-weight:700;
}
.nav-item.active{color:var(--pink)}
.nav-item svg{width:20px;height:20px}
.nav-item.active svg{stroke:var(--pink)}
.nav-new-badge{display:none}

.toast{
  position:fixed;left:50%;bottom:82px;z-index:12000;
  transform:translateX(-50%);display:none;
  background:#17191d;color:#fff;padding:10px 14px;border-radius:11px;
  font-size:12px;font-weight:700;box-shadow:0 8px 25px rgba(0,0,0,.2);
  white-space:nowrap;
}

@media(max-width:430px){
  .header-top{height:70px;padding-left:14px;padding-right:14px}
  .header-title{font-size:19px}
  main{padding-left:12px;padding-right:12px}
  .restaurant-card{padding:13px;border-radius:20px}
  .restaurant-name{font-size:20px}
  .discount-line{font-size:14px}
  .item-card{min-width:calc((100% - 22px)/3);width:calc((100% - 22px)/3)}
}
@media(max-width:370px){
  .header-title{font-size:17px}
  .header-sub{font-size:9px}
  .icon-btn{width:40px;height:40px;flex-basis:40px}
  .filter-pill{padding:0 13px;font-size:11px}
  .restaurant-name{font-size:18px}
  .meta,.free-row{font-size:11px}
  .item-name{font-size:12px}
  .price{font-size:16px}
}
@media(min-width:700px){
  main{padding-left:20px;padding-right:20px}
  .restaurant-card{padding:16px}
  .restaurant-name{font-size:24px}
}
</style>

<body>
<header class="store-header">
  <div class="header-top">
    <div class="header-left">
      <a href="index.html" class="icon-btn" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
      </a>
      <div class="header-copy">
        <h1 class="header-title">Meals Under ₹99 – 1000</h1>
        <p class="header-sub">Great food. Lower prices. Everyday.</p>
      </div>
    </div>
    <button class="icon-btn" onclick="window.location.href='search.html'" aria-label="Search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><circle cx="11" cy="11" r="7.5"/><path d="m17 17 4 4"/></svg>
    </button>
  </div>

  <div class="filter-row">
    <button class="filter-pill" id="sort-btn" onclick="cycleSort()" aria-label="Filters">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
    </button>

    <button class="filter-pill active" id="discount-btn" onclick="toggleDiscount()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="2"/><circle cx="16" cy="16" r="2"/><path d="M19 5 5 19"/></svg>
      40–60% Lower Prices
    </button>

    <button class="filter-pill" id="veg-btn" onclick="toggleVegFilter()">
      Veg/Non-Veg
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 10 5 5 5-5"/></svg>
    </button>

    <button class="filter-pill" id="price-btn" onclick="cyclePrice()">
      ₹99 &amp; under
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 10 5 5 5-5"/></svg>
    </button>
  </div>
</header>

<main>
  <p id="item-count" class="items-found-label">Deals for you</p>

  <section id="skeleton-feed" class="skeleton-feed" aria-hidden="true">
    <div class="skeleton-card">
      <div class="skeleton skeleton-big"></div>
      <div class="skeleton-row">
        <div><div class="skeleton skeleton-img"></div><div class="skeleton skeleton-line"></div></div>
        <div><div class="skeleton skeleton-img"></div><div class="skeleton skeleton-line"></div></div>
        <div><div class="skeleton skeleton-img"></div><div class="skeleton skeleton-line"></div></div>
      </div>
    </div>
    <div class="skeleton-card">
      <div class="skeleton skeleton-big"></div>
      <div class="skeleton-row">
        <div><div class="skeleton skeleton-img"></div><div class="skeleton skeleton-line"></div></div>
        <div><div class="skeleton skeleton-img"></div><div class="skeleton skeleton-line"></div></div>
        <div><div class="skeleton skeleton-img"></div><div class="skeleton skeleton-line"></div></div>
      </div>
    </div>
  </section>

  <section id="under99-list" class="restaurant-feed" style="display:none"></section>
</main>

<nav class="bottom-nav">
  <a href="index.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V20H4z"/><path d="M9 20v-5h6v5"/></svg>
    <span>Food</span>
  </a>
  <a href="under99.html" class="nav-item active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m20 13-7 7-9-9V4h7z"/><circle cx="7.5" cy="7.5" r="1"/></svg>
    <span>99 Store</span>
  </a>
  <a href="orders.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h10v18H7z"/><path d="M9 7h6M9 11h6M9 15h6"/></svg>
    <span>Orders</span>
  </a>
</nav>

<div id="toast" class="toast"></div>

<script src="cart-bar.js"></script>
<script src="under99card.js"></script>
<script>
(() => {
  const API = 'https://eatswada.onrender.com/api/restaurants/under99';
  const $ = id => document.getElementById(id);
  const esc = value => String(value ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
  const num = (value, fallback=0) => {
    const n = Number(value);
    return Number.isFinite(n) ? n : fallback;
  };

  let allRestaurants = [];
  let maxPrice = 99;
  let vegOnly = false;
  let discountOnly = true;
  let sortMode = 'default';

  function showToast(message){
    const t=$('toast');
    if(!t)return;
    t.textContent=message;
    t.style.display='block';
    clearTimeout(window.__toastTimer);
    window.__toastTimer=setTimeout(()=>t.style.display='none',1800);
  }
  window.showToast = showToast;

  function normalizeRestaurant(raw){
    const r = raw?.restaurant && typeof raw.restaurant === 'object'
      ? raw.restaurant : raw;
    const menu = Array.isArray(raw?.menu) ? raw.menu.map(item => ({
      id:item.id || item._id || '',
      name:item.name || 'Item',
      description:item.description || '',
      price:num(item.price),
      originalPrice:item.originalPrice == null ? null : num(item.originalPrice),
      discountPercent:item.discountPercent == null ? null : num(item.discountPercent),
      image:item.image || '',
      isVeg:Boolean(item.isVeg),
      category:item.category || 'Recommended',
      isUnder99:Boolean(item.isUnder99 ?? num(item.price) <= 99),
      isBestseller:Boolean(item.isBestseller),
      isRecommended:Boolean(item.isRecommended),
      inStock:item.inStock !== false,
      customizations:Array.isArray(item.customizations) ? item.customizations : []
    })).filter(item => item.price > 0) : [];

    menu.sort((a,b) => a.price-b.price || String(a.name).localeCompare(String(b.name)));
    return {
      id:String(r?.id || r?._id || ''),
      name:r?.name || 'Restaurant',
      image:r?.image || '',
      images:Array.isArray(r?.images) ? r.images : [],
      rating:num(r?.rating,0),
      ratingCount:r?.ratingCount ?? '',
      deliveryTime:String(r?.deliveryTime || ''),
      cuisine:Array.isArray(r?.cuisine) ? r.cuisine.join(', ') : String(r?.cuisine || ''),
      offer:String(r?.offer || ''),
      freeDeliveryAbove:r?.freeDeliveryAbove == null ? null : num(r.freeDeliveryAbove),
      deliveryFee:r?.deliveryFee,
      menu
    };
  }

  function passesFilters(r){
    const visible = r.menu.filter(item => {
      if(item.price > maxPrice) return false;
      if(vegOnly && !item.isVeg) return false;
      if(discountOnly && !(num(item.discountPercent) >= 20)) return false;
      return true;
    });
    return { visible, qualifies: visible.length > 0 };
  }

  function render(){
    const list=$('under99-list');
    const skeleton=$('skeleton-feed');
    if(!list)return;

    let groups = allRestaurants.map(r => ({r, ...passesFilters(r)})).filter(x => x.qualifies);
    if(sortMode==='rating') groups.sort((a,b)=>b.r.rating-a.r.rating);
    if(sortMode==='price') groups.sort((a,b)=>(a.visible[0]?.price||Infinity)-(b.visible[0]?.price||Infinity));

    skeleton.style.display='none';
    list.style.display='flex';
    $('item-count').textContent = groups.length
      ? `${groups.length} Restaurant${groups.length===1?'':'s'}`
      : 'Deals for you';

    if(!groups.length){
      list.innerHTML='<div class="empty"><div style="font-size:35px">₹</div><h3>No deals match these filters</h3><p>Try another price or food preference.</p></div>';
      return;
    }

    list.innerHTML='';
    groups.forEach(({r, visible}, index) => {
      // The component receives the restaurant's COMPLETE menu, not only the filtered items.
      const cardData={...r, menu:r.menu};
      const host=window.Eatswada99Card.createRestaurantCard(cardData);
      host.style.animation=`fadeUp .3s ease both`;
      host.style.animationDelay=`${Math.min(index*.035,.25)}s`;
      list.appendChild(host);
    });
    if(typeof window.updateGlobalCart==='function') window.updateGlobalCart();
  }

  window.toggleVegFilter=()=>{
    vegOnly=!vegOnly;
    $('veg-btn').classList.toggle('active',vegOnly);
    render();
  };

  window.toggleDiscount=()=>{
    discountOnly=!discountOnly;
    $('discount-btn').classList.toggle('active',discountOnly);
    render();
  };

  window.cyclePrice=()=>{
    const btn=$('price-btn');
    if(maxPrice===99){maxPrice=149;btn.innerHTML='₹149 &amp; under <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m7 10 5 5 5-5"/></svg>';}
    else if(maxPrice===149){maxPrice=1000;btn.innerHTML='₹1000 &amp; under <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m7 10 5 5 5-5"/></svg>';}
    else {maxPrice=99;btn.innerHTML='₹99 &amp; under <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m7 10 5 5 5-5"/></svg>';}
    render();
  };

  window.cycleSort=()=>{
    sortMode=sortMode==='default'?'rating':sortMode==='rating'?'price':'default';
    $('sort-btn').classList.toggle('active',sortMode!=='default');
    render();
  };

  async function load(){
    const skeleton=$('skeleton-feed');
    const list=$('under99-list');
    try{
      const response=await fetch(API,{headers:{Accept:'application/json'},cache:'no-store'});
      if(!response.ok) throw new Error(`HTTP ${response.status}`);
      const result=await response.json();
      const raw=Array.isArray(result?.data) ? result.data : (Array.isArray(result) ? result : []);
      allRestaurants=raw.map(normalizeRestaurant).filter(r=>r.id && r.menu.length);
      if(!allRestaurants.length) throw new Error('No restaurant menu data returned');
      render();
    }catch(error){
      console.error('[99 Store] load failed:',error);
      if(skeleton)skeleton.style.display='none';
      if(list){
        list.style.display='flex';
        list.innerHTML='<div class="empty"><div style="font-size:35px">!</div><h3>Couldn’t load deals</h3><p>We could not load the restaurant menu data right now.</p><button id="u99-retry" style="margin-top:14px;border:0;border-radius:10px;padding:10px 16px;background:#e11d8d;color:#fff;font-weight:800">Retry</button></div>';
        $('u99-retry')?.addEventListener('click',load);
      }
    }
  }

  document.addEventListener('DOMContentLoaded',load);
})();
</script>
<style>
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
</style>
</body>
</html>
