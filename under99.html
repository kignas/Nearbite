<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="view-transition" content="same-origin">
  <title>99 Store – Eatswada</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap" rel="stylesheet">
</head>

<style>
:root{
  --ink:#101828; --muted:#747B87; --soft:#FAFBFD; --line:#E7E9ED;
  --pink:#EC168C; --pink-soft:#FFF1F8; --green:#159A62; --gold:#F5B51B;
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{
  margin:0;padding:0;background:var(--soft);color:var(--ink);
  font-family:var(--font);-webkit-font-smoothing:antialiased;
}
button,a{font:inherit} button{cursor:pointer} svg{display:block}
body{padding-bottom:82px}

.store-header{
  position:sticky;top:0;z-index:1000;background:rgba(255,255,255,.98);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid #ECEEF1;
}
.header-top{
  min-height:78px;padding:10px 20px 8px;display:flex;align-items:center;gap:12px;
}
.header-left{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.icon-btn{
  width:48px;height:48px;flex:0 0 48px;border:1px solid #E4E7EB;border-radius:50%;
  background:#fff;color:#101828;display:grid;place-items:center;
  box-shadow:0 1px 2px rgba(16,24,40,.03);-webkit-tap-highlight-color:transparent;
}
.icon-btn:active{transform:scale(.96);background:#F8F9FA}
.icon-btn svg{width:23px;height:23px}
.header-copy{min-width:0}
.header-title{
  margin:0;font-size:21px;line-height:1.08;font-weight:800;letter-spacing:-.7px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.header-sub{
  margin:4px 0 0;font-size:12.5px;line-height:1.25;color:#747B87;font-weight:500;
  white-space:nowrap;
}
.header-top>.icon-btn{margin-left:auto}

.loc-pill{
  display:flex;align-items:center;gap:9px;min-width:0;flex:1;
  padding:6px 11px;border:1px solid #E4E7EB;border-radius:14px;
  background:#fff;color:#101828;text-align:left;
  box-shadow:0 1px 2px rgba(16,24,40,.03);-webkit-tap-highlight-color:transparent;
}
.loc-pill:active{transform:scale(.99);background:#F8F9FA}
.loc-pin{width:20px;height:20px;flex:0 0 20px;color:var(--pink)}
.loc-text{min-width:0;display:flex;flex-direction:column;gap:1px}
.loc-name-row{display:flex;align-items:center;gap:4px;min-width:0}
.loc-name{
  font-size:15px;font-weight:800;letter-spacing:-.3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.loc-caret{width:16px;height:16px;flex:0 0 16px;color:#747B87}
.loc-sub{
  font-size:11.5px;font-weight:600;color:#747B87;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.loc-pill.loc-unset .loc-name{color:var(--pink)}
@media(max-width:430px){
  .loc-name{font-size:14.5px}
  .loc-sub{font-size:11px}
}

.filter-row{
  display:flex;gap:9px;overflow-x:auto;padding:0 20px 12px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.filter-row::-webkit-scrollbar{display:none}
.filter-pill{
  height:44px;flex:0 0 auto;padding:0 15px;border:1px solid #DCE1E8;border-radius:999px;
  background:#fff;color:#202936;font-size:13px;font-weight:600;white-space:nowrap;
  display:flex;align-items:center;gap:8px;box-shadow:none;
}
.filter-pill.active{
  color:var(--pink);border-color:#F1B4D5;background:var(--pink-soft);font-weight:700;
}
.filter-pill svg{width:18px;height:18px;flex:none}
.filter-pill.active svg{stroke:var(--pink)}

main{max-width:920px;margin:0 auto;padding:18px 20px 28px}
.items-found-label{display:none}
.restaurant-feed{display:flex;flex-direction:column;gap:24px}
.skeleton-feed{display:flex;flex-direction:column;gap:24px}
.skeleton-card{
  background:#fff;border:1px solid var(--line);border-radius:26px;padding:18px;
}
.skeleton-big{height:42px;border-radius:9px;margin-bottom:14px}
.skeleton-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.skeleton-img{aspect-ratio:1.42/1;border-radius:14px}
.skeleton-line{height:11px;border-radius:6px;margin-top:9px}
.skeleton{
  background:linear-gradient(90deg,#F0F2F5 25%,#FAFBFD 37%,#F0F2F5 63%);
  background-size:400% 100%;animation:shimmer 1.25s ease-in-out infinite
}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}

.empty{
  background:#fff;border:1px solid var(--line);border-radius:26px;text-align:center;
  padding:55px 20px;color:var(--muted)
}
.empty h3{margin:12px 0 5px;color:var(--ink);font-size:16px;font-weight:800}
.empty p{margin:0;font-size:12px;font-weight:500}

.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:9999;height:72px;
  padding-bottom:env(safe-area-inset-bottom);display:flex;background:rgba(255,255,255,.98);
  border-top:1px solid #ECEEF1;box-shadow:0 -5px 24px rgba(7,21,45,.05)
}
.nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  color:#9AA3B1;text-decoration:none;font-size:11px;font-weight:700
}
.nav-item.active{color:var(--pink)}
.nav-item svg{width:22px;height:22px}
.nav-item.active svg{stroke:var(--pink)}
.toast{
  position:fixed;left:50%;bottom:88px;z-index:12000;transform:translateX(-50%);
  display:none;background:#17191d;color:#fff;padding:10px 14px;border-radius:12px;
  font-size:12px;font-weight:700;box-shadow:0 8px 25px rgba(0,0,0,.2);white-space:nowrap
}
@media(max-width:430px){
  .header-top{min-height:76px;padding:9px 16px 8px;gap:10px}
  .header-left{gap:10px}
  .icon-btn{width:46px;height:46px;flex-basis:46px}
  .icon-btn svg{width:22px;height:22px}
  .header-title{font-size:20px;letter-spacing:-.65px}
  .header-sub{font-size:11.5px;margin-top:4px}
  .filter-row{gap:8px;padding:0 16px 11px}
  .filter-pill{height:44px;font-size:12.5px;padding:0 14px}
  main{padding:16px 16px 26px}
  .restaurant-feed{gap:24px}
}
@media(prefers-reduced-motion:reduce){
  .skeleton{animation:none}
  .icon-btn{transition:none}
}

/* 99 STORE FILTER SHEETS — header/filter step only */
.filter-pill{ -webkit-tap-highlight-color:transparent; }
.filter-pill:active{transform:scale(.985)}
.filter-pill.has-filter{border-color:#E8A6CD;background:#FFF1F8;color:var(--pink)}
.filter-sheet-backdrop{
  position:fixed;inset:0;z-index:15000;background:rgba(7,21,45,.58);
  opacity:0;visibility:hidden;transition:opacity .22s ease,visibility .22s ease;
}
.filter-sheet-backdrop.open{opacity:1;visibility:visible}
.filter-sheet{
  position:absolute;left:0;right:0;bottom:0;background:#fff;
  border-radius:28px 28px 0 0;padding:26px 24px 22px;
  padding-bottom:calc(22px + env(safe-area-inset-bottom));
  transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
  max-height:min(72vh,620px);overflow:auto;
}
.filter-sheet-backdrop.open .filter-sheet{transform:translateY(0)}
.filter-sheet-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}
.filter-sheet-title{margin:0;font-size:20px;line-height:1.2;font-weight:800;letter-spacing:-.45px;color:var(--ink)}
.filter-sheet-close{
  width:34px;height:34px;border:0;background:transparent;color:#6B7280;
  display:grid;place-items:center;border-radius:50%;font-size:28px;line-height:1;padding:0;
}
.filter-options{display:flex;flex-direction:column;gap:5px}
.filter-option{
  min-height:66px;display:flex;align-items:center;gap:16px;border:0;background:#fff;
  padding:8px 4px;color:#69707C;text-align:left;font-size:17px;font-weight:600;
}
.filter-option input{
  appearance:none;-webkit-appearance:none;width:30px;height:30px;flex:0 0 30px;
  border:2px solid #B8BCC3;background:#fff;position:relative;
}
.filter-option input[type=radio]{border-radius:50%}
.filter-option input[type=checkbox]{border-radius:3px}
.filter-option input:checked{border-color:var(--pink)}
.filter-option input:checked::after{
  content:"";position:absolute;inset:6px;border-radius:50%;background:var(--pink);
}
.filter-option input[type=checkbox]:checked::after{
  inset:4px;border-radius:2px;background:var(--pink);
}
.filter-option input[type=checkbox]:checked::before{
  content:"✓";position:absolute;z-index:1;left:5px;top:1px;color:#fff;font-size:18px;font-weight:800;
}
.filter-actions{margin-top:18px}
.filter-apply{
  width:100%;height:54px;border:0;border-radius:15px;background:#07943A;color:#fff;
  font-size:17px;font-weight:800;
}
.filter-clear{
  width:100%;height:48px;border:0;background:transparent;color:#92959B;
  font-size:16px;font-weight:700;
}
body.filter-open{overflow:hidden}
@media(max-width:430px){
  .filter-sheet{padding-left:24px;padding-right:24px}
  .filter-sheet-title{font-size:19px}
  .filter-option{font-size:16px}
}


/* ===== 99 STORE BACKEND-CONTROLLED HERO ===== */
.u99-hero{
  position:relative;
  overflow:hidden;
  min-height:190px;
  margin:0;
  padding:24px 20px 22px;
  color:#fff;
  background:linear-gradient(135deg,#f01891 0%,#e31382 58%,#c80b72 100%);
  border-radius:0 0 30px 30px;
  isolation:isolate;
}
.u99-hero::before{
  content:"";
  position:absolute;
  width:230px;height:230px;
  right:-80px;top:-105px;
  border-radius:50%;
  background:rgba(255,255,255,.12);
  z-index:-1;
}
.u99-hero::after{
  content:"";
  position:absolute;
  width:180px;height:180px;
  right:95px;bottom:-135px;
  border-radius:50%;
  background:rgba(255,255,255,.08);
  z-index:-1;
}
.u99-hero-inner{
  position:relative;
  min-height:144px;
  display:flex;
  align-items:center;
}
.u99-hero-copy{
  position:relative;
  z-index:3;
  width:62%;
  min-width:0;
}
.u99-hero-kicker{
  display:inline-flex;
  align-items:center;
  min-height:26px;
  padding:5px 10px;
  border-radius:999px;
  background:rgba(255,255,255,.18);
  border:1px solid rgba(255,255,255,.24);
  font-size:10px;
  line-height:1;
  font-weight:800;
  letter-spacing:.7px;
  text-transform:uppercase;
}
.u99-hero-title{
  margin:9px 0 0;
  font-size:30px;
  line-height:1.02;
  font-weight:850;
  letter-spacing:-1.15px;
}
.u99-hero-price{
  margin:5px 0 0;
  font-size:43px;
  line-height:.95;
  font-weight:900;
  letter-spacing:-2px;
}
.u99-hero-sub{
  margin:8px 0 0;
  max-width:230px;
  font-size:12px;
  line-height:1.35;
  font-weight:600;
  color:rgba(255,255,255,.9);
}
.u99-hero-cta{
  display:inline-flex;
  align-items:center;
  gap:7px;
  margin-top:12px;
  min-height:34px;
  padding:0 13px;
  border:0;
  border-radius:999px;
  background:#fff;
  color:#d80e7b;
  font-size:12px;
  font-weight:850;
  text-decoration:none;
  box-shadow:0 5px 16px rgba(75,0,42,.16);
}
.u99-hero-cta svg{width:14px;height:14px}
.u99-hero-art{
  position:absolute;
  z-index:2;
  right:-4px;
  bottom:-24px;
  width:min(45%,260px);
  max-height:185px;
  object-fit:contain;
  object-position:center bottom;
  filter:drop-shadow(0 14px 15px rgba(71,0,39,.20));
  pointer-events:none;
}
.u99-hero-empty{display:none}
@media(max-width:430px){
  .u99-hero{
    min-height:184px;
    padding:22px 16px 20px;
    border-radius:0 0 26px 26px;
  }
  .u99-hero-inner{min-height:142px}
  .u99-hero-copy{width:61%}
  .u99-hero-title{font-size:27px;letter-spacing:-1px}
  .u99-hero-price{font-size:39px}
  .u99-hero-sub{font-size:11px;max-width:205px}
  .u99-hero-art{right:-7px;bottom:-20px;width:47%;max-height:176px}
}

</style>

<header class="store-header">
  <div class="header-top">
    <div class="header-left">
      <a href="index.html" class="icon-btn" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
      </a>

<script>
(() => {
  const API = 'https://eatswada.onrender.com/api/restaurants/under99';
  const $ = id => document.getElementById(id);
  const esc = value => String(value ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
  const num = (value, fallback=0) => {
    const n = Number(value);
    return Number.isFinite(n) ? n : fallback;
  };

  let allRestaurants = [];
  let discountOnly = true;

  function showToast(message){
    const t=$('toast');
    if(!t)return;
    t.textContent=message;
    t.style.display='block';
    clearTimeout(window.__toastTimer);
    window.__toastTimer=setTimeout(()=>t.style.display='none',1800);
  }
  window.showToast = showToast;

  function normalizeRestaurant(raw){
    const r = raw?.restaurant && typeof raw.restaurant === 'object'
      ? raw.restaurant : raw;
    const menu = Array.isArray(raw?.menu) ? raw.menu.map(item => ({
      id:item.id || item._id || '',
      name:item.name || 'Item',
      description:item.description || '',
      price:num(item.price),
      originalPrice:item.originalPrice == null ? null : num(item.originalPrice),
      discountPercent:item.discountPercent == null ? null : num(item.discountPercent),
      image:item.image || '',
      isVeg:Boolean(item.isVeg),
      category:item.category || 'Recommended',
      isUnder99:Boolean(item.isUnder99 ?? num(item.price) <= 99),
      isBestseller:Boolean(item.isBestseller),
      isRecommended:Boolean(item.isRecommended),
      inStock:item.inStock !== false,
      customizations:Array.isArray(item.customizations) ? item.customizations : []
    })).filter(item => item.price > 0) : [];

    menu.sort((a,b) => a.price-b.price || String(a.name).localeCompare(String(b.name)));
    return {
      id:String(r?.id || r?._id || ''),
      name:r?.name || 'Restaurant',
      image:r?.image || '',
      images:Array.isArray(r?.images) ? r.images : [],
      rating:num(r?.rating,0),
      ratingCount:r?.ratingCount ?? '',
      deliveryTime:String(r?.deliveryTime || ''),
      cuisine:Array.isArray(r?.cuisine) ? r.cuisine.join(', ') : String(r?.cuisine || ''),
      offer:String(r?.offer || ''),
      freeDeliveryAbove:r?.freeDeliveryAbove == null ? null : num(r.freeDeliveryAbove),
      deliveryFee:r?.deliveryFee,
      menu
    };
  }

  function passesFilters(r){
    const visible = r.menu.filter(item => {
      if(item.price > 99) return false;
      if(foodType==='veg' && !item.isVeg) return false;
      if(foodType==='nonveg' && item.isVeg) return false;
      if(priceRanges.length){
        const inRange = priceRanges.some(range => {
          const [lo,hi]=range.split('-').map(Number);
          return item.price >= lo && item.price <= hi;
        });
        if(!inRange) return false;
      }
      if(discountOnly && !(num(item.discountPercent) >= 20)) return false;
      return true;
    });
    return { visible, qualifies: visible.length > 0 };
  }

  function render(){
    const list=$('under99-list');
    const skeleton=$('skeleton-feed');
    if(!list)return;

    let groups = allRestaurants.map(r => ({r, ...passesFilters(r)})).filter(x => x.qualifies);
    if(sortMode==='rating') groups.sort((a,b)=>b.r.rating-a.r.rating);
    if(sortMode==='price') groups.sort((a,b)=>(a.visible[0]?.price||Infinity)-(b.visible[0]?.price||Infinity));

    skeleton.style.display='none';
    list.style.display='flex';
    $('item-count').textContent = groups.length
      ? `${groups.length} Restaurant${groups.length===1?'':'s'}`
      : 'Deals for you';

    if(!groups.length){
      list.innerHTML='<div class="empty"><div style="font-size:35px">₹</div><h3>No deals match these filters</h3><p>Try another price or food preference.</p></div>';
      return;
    }

    list.innerHTML='';
    groups.forEach(({r, visible}, index) => {
      // The component receives the restaurant's COMPLETE menu, not only the filtered items.
      const cardData={...r, menu:r.menu};
      const host=window.Eatswada99Card.createRestaurantCard(cardData);
      host.style.animation=`fadeUp .3s ease both`;
      host.style.animationDelay=`${Math.min(index*.035,.25)}s`;
      list.appendChild(host);
    });
    if(typeof window.updateGlobalCart==='function') window.updateGlobalCart();
  }

  window.toggleDiscount=()=>{
    discountOnly=!discountOnly;
    $('discount-btn').classList.toggle('active',discountOnly);
    render();
  };

  let activeSheet = null;
  let deliveryLimit = null;
  let foodType = 'all';
  let priceRanges = [];

  function getSheet(name){
    return name==='delivery' ? $('delivery-sheet') : name==='veg' ? $('veg-sheet') : $('price-sheet');
  }
  function openFilter(name){
    const backdrop=$('filter-backdrop');
    if(!backdrop)return;
    document.querySelectorAll('.filter-sheet').forEach(s=>{
      s.hidden = s.id !== `${name}-sheet`;
    });
    activeSheet=name;
    backdrop.classList.add('open');
    backdrop.setAttribute('aria-hidden','false');
    document.body.classList.add('filter-open');
    syncSheetInputs(name);
  }
  function closeFilter(){
    const backdrop=$('filter-backdrop');
    if(!backdrop)return;
    backdrop.classList.remove('open');
    backdrop.setAttribute('aria-hidden','true');
    document.body.classList.remove('filter-open');
    setTimeout(()=>document.querySelectorAll('.filter-sheet').forEach(s=>s.hidden=true),240);
    activeSheet=null;
  }
  function syncSheetInputs(name){
    if(name==='delivery'){
      document.querySelectorAll('input[name="delivery-time"]').forEach(i=>i.checked=Number(i.value)===deliveryLimit);
    }else if(name==='veg'){
      document.querySelectorAll('input[name="food-type"]').forEach(i=>i.checked=i.value===foodType);
    }else{
      document.querySelectorAll('input[name="price-range"]').forEach(i=>i.checked=priceRanges.includes(i.value));
    }
  }
  function applyFilter(){
    if(activeSheet==='delivery'){
      const checked=document.querySelector('input[name="delivery-time"]:checked');
      deliveryLimit=checked ? Number(checked.value) : null;
      $('sort-btn').classList.toggle('has-filter',deliveryLimit!==null);
    }else if(activeSheet==='veg'){
      const checked=document.querySelector('input[name="food-type"]:checked');
      foodType=checked ? checked.value : 'all';
      $('veg-btn').classList.toggle('active',foodType!=='all');
    }else if(activeSheet==='price'){
      priceRanges=[...document.querySelectorAll('input[name="price-range"]:checked')].map(i=>i.value);
      $('price-btn').classList.toggle('active',priceRanges.length>0);
    }
    closeFilter();
    render();
  }
  function clearFilter(){
    if(activeSheet==='delivery'){
      deliveryLimit=null;
      document.querySelectorAll('input[name="delivery-time"]').forEach(i=>i.checked=false);
      $('sort-btn').classList.remove('has-filter');
    }else if(activeSheet==='veg'){
      foodType='all';
      document.querySelectorAll('input[name="food-type"]').forEach(i=>i.checked=false);
      $('veg-btn').classList.remove('active');
    }else if(activeSheet==='price'){
      priceRanges=[];
      document.querySelectorAll('input[name="price-range"]').forEach(i=>i.checked=false);
      $('price-btn').classList.remove('active');
    }
    closeFilter();
    render();
  }

  function deliveryMaxMinutes(value){
    const matches=String(value||'').match(/\d+/g);
    return matches && matches.length ? Math.max(...matches.map(Number)) : Infinity;
  }

  document.addEventListener('click', event=>{
    const open=event.target.closest('[data-open-filter]');
    if(open){ openFilter(open.dataset.openFilter); return; }
    if(event.target.closest('[data-close-filter]')){ closeFilter(); return; }
    if(event.target.closest('[data-apply-filter]')){ applyFilter(); return; }
    if(event.target.closest('[data-clear-filter]')){ clearFilter(); return; }
    if(event.target=== $('filter-backdrop')) closeFilter();
  });

  document.addEventListener('keydown', event=>{
    if(event.key==='Escape' && activeSheet) closeFilter();
  });


  /* 99 Store hero is managed from Admin > Home Banners > Placement: 99 Store. */
  const HERO_API = 'https://eatswada.onrender.com/api/home-banners?placement=under99';

  async function loadUnder99Hero(){
    const hero = $('u99-hero');
    const art = $('u99-hero-art');
    const title = $('u99-hero-title');
    const price = $('u99-hero-price');
    const sub = $('u99-hero-sub');
    const kicker = $('u99-hero-kicker');
    const cta = $('u99-hero-cta');

    try{
      const response = await fetch(HERO_API,{headers:{Accept:'application/json'},cache:'no-store'});
      if(!response.ok) throw new Error(`Hero HTTP ${response.status}`);

      const result = await response.json();
      const banners = Array.isArray(result?.data) ? result.data : [];
      const banner = banners[0];
      if(!banner) return;

      if(hero && banner.background){
        hero.style.background = String(banner.background);
      }

      if(kicker) kicker.textContent = String(banner.badgeText || banner.offerText || '99 STORE').trim();

      const rawTitle = String(banner.title || '').trim();
      if(title) title.textContent = rawTitle || 'Meals Under';

      const rawOffer = String(banner.offerText || '').trim();
      if(price) price.textContent = rawOffer || '₹99';

      if(sub) sub.textContent = String(
        banner.subtitle || 'Great food. Lower prices. Everyday.'
      ).trim();

      if(cta){
        const ctaText = String(banner.ctaText || 'Explore deals').trim();
        cta.childNodes[0].nodeValue = ctaText + ' ';
        const url = String(banner.ctaUrl || '').trim();
        cta.href = url || '#under99-list';
        if(/^https?:\/\//i.test(url)){
          cta.target = '_blank';
          cta.rel = 'noopener noreferrer';
        }else{
          cta.removeAttribute('target');
          cta.removeAttribute('rel');
        }
      }

      const image = String(banner.mobileImage || banner.image || '').trim();
      if(image && art){
        art.src = image;
        art.hidden = false;
      }
    }catch(error){
      console.warn('[99 Store Hero] Could not load backend banner:',error);
    }
  }

  async function load(){
    const skeleton=$('skeleton-feed');
    const list=$('under99-list');
    try{
      const response=await fetch(API,{headers:{Accept:'application/json'},cache:'no-store'});
      if(!response.ok) throw new Error(`HTTP ${response.status}`);
      const result=await response.json();
      const raw=Array.isArray(result?.data) ? result.data : (Array.isArray(result) ? result : []);
      allRestaurants=raw.map(normalizeRestaurant).filter(r=>r.id && r.menu.length);
      if(!allRestaurants.length) throw new Error('No restaurant menu data returned');
      render();
    }catch(error){
      console.error('[99 Store] load failed:',error);
      if(skeleton)skeleton.style.display='none';
      if(list){
        list.style.display='flex';
        list.innerHTML='<div class="empty"><div style="font-size:35px">!</div><h3>Couldn’t load deals</h3><p>We could not load the restaurant menu data right now.</p><button id="u99-retry" style="margin-top:14px;border:0;border-radius:10px;padding:10px 16px;background:#e11d8d;color:#fff;font-weight:800">Retry</button></div>';
        $('u99-retry')?.addEventListener('click',load);
      }
    }
  }

  document.addEventListener('DOMContentLoaded',()=>{ loadUnder99Hero(); load(); });
})();
</script>
<style>
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
</style>

<script>
/* ===== 99 STORE HEADER — REAL DELIVERY LOCATION (no hard-coded city) ===== */
(() => {
  // CONFIG — these MUST match what your home page / location-onboarding.html
  // actually uses. Confirm the real key + page name and adjust if different.
  const LOCATION_KEYS = ['eatswada_location','userLocation','deliveryLocation','selectedLocation','location'];
  const CHANGE_LOCATION_URL = 'location-onboarding.html';

  function readSavedLocation(){
    for(const key of LOCATION_KEYS){
      let val;
      try{ val = localStorage.getItem(key); }catch{ return null; }
      if(!val) continue;
      try{
        const obj = JSON.parse(val);
        const name = obj && (obj.area || obj.locality || obj.name || obj.label || obj.address || obj.city);
        if(name) return String(name).trim();
      }catch{
        if(val.trim()) return val.trim();
      }
    }
    return null;
  }

  document.addEventListener('DOMContentLoaded', () => {
    const pill = document.getElementById('loc-pill');
    const nameEl = document.getElementById('loc-name');
    const subEl = document.getElementById('loc-sub');
    if(!pill || !nameEl) return;

    const saved = readSavedLocation();
    if(saved){
      nameEl.textContent = saved;
      if(subEl) subEl.textContent = 'Within 10 km';
      pill.classList.remove('loc-unset');
    }else{
      // No real location saved yet — prompt to set it, never invent one.
      nameEl.textContent = 'Set location';
      if(subEl) subEl.textContent = 'Tap to choose your area';
      pill.classList.add('loc-unset');
    }

    pill.addEventListener('click', () => { window.location.href = CHANGE_LOCATION_URL; });
  });
})();
</script>
