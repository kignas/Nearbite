<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>₹99 Store – Nearbite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
<style>
:root{--orange:#fc8019;--orange-dark:#e0530a;--ink:#171a21;--muted:#7c8490;--line:#eceef1;--bg:#f7f7f8;--green:#159a62}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Poppins,sans-serif;padding-bottom:92px}
.hidden{display:none!important}
.store-header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.97);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.header-top{padding:13px 16px 10px;display:flex;align-items:center;justify-content:space-between}.header-left{display:flex;align-items:center;gap:11px}.icon-btn{width:40px;height:40px;border:0;border-radius:50%;background:#f3f4f6;display:flex;align-items:center;justify-content:center;color:#20242b;text-decoration:none;-webkit-tap-highlight-color:transparent}.icon-btn:active{transform:scale(.94)}.header-title-row{display:flex;align-items:center;gap:7px}.header-title{font-size:19px;font-weight:900;letter-spacing:-.5px;margin:0}.pro-badge{font-size:7px;font-weight:900;background:var(--orange);color:#fff;border-radius:6px;padding:3px 6px;letter-spacing:.7px}.header-sub{margin:1px 0 0;color:#a0a5ad;font-size:10px;font-weight:600}.header-actions{display:flex;gap:8px}

/* ── Deal hero ── */
.hero{margin:4px 12px 12px;padding:17px 18px;border-radius:20px;background:linear-gradient(135deg,#fff1e0,#ffe4c4 65%,#ffd9ae);border:1px solid #ffdcae;display:flex;align-items:center;justify-content:space-between;gap:14px;position:relative;overflow:hidden}
.hero-text{min-width:0}
.hero-flame{display:inline-block;font-size:10.5px;font-weight:900;letter-spacing:.3px;color:var(--orange-dark);background:#fff;padding:4px 9px;border-radius:8px;margin-bottom:7px}
.hero-text strong{display:block;font-size:19px;line-height:1.18;font-weight:900;color:#201608;letter-spacing:-.3px}
.hero-sub{display:block;margin-top:6px;font-size:11px;font-weight:700;color:#8a5a24}
.hero-save{display:inline-block;margin-top:8px;font-size:10px;font-weight:900;color:#fff;background:var(--orange-dark);padding:3px 8px;border-radius:7px}
.hero-badge{width:52px;height:52px;flex:0 0 52px;border-radius:16px;background:#fff;box-shadow:0 8px 20px rgba(224,83,10,.18);display:flex;align-items:center;justify-content:center;color:var(--orange);font-size:21px}

.filter-row{display:flex;align-items:center;gap:8px;padding:0 16px 12px;overflow-x:auto}.filter-row::-webkit-scrollbar{display:none}.filter-pill{flex:0 0 auto;height:38px;padding:0 14px;border:1px solid #e2e4e8;border-radius:999px;background:#fff;color:#727985;font:700 11px Poppins;white-space:nowrap;-webkit-tap-highlight-color:transparent}.filter-pill:active{transform:scale(.96)}.filter-pill.active{background:#191b20;border-color:#191b20;color:#fff;box-shadow:0 5px 13px rgba(0,0,0,.12)}.filter-pill.orange-active{border-color:#ffd3b2;color:var(--orange);background:#fff8f3}.filter-sep{width:1px;height:22px;background:#e7e8eb;align-self:center;flex-shrink:0}

.subbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:#fff;border-top:1px solid #f0f1f3;border-bottom:1px solid #f0f1f3}.toggle{display:flex;align-items:center;gap:7px;color:#7b818b;font-size:10px;font-weight:800;text-transform:uppercase}.switch{width:35px;height:19px;background:#dfe1e5;border-radius:999px;padding:2px;cursor:pointer}.switch span{display:block;width:15px;height:15px;background:#fff;border-radius:50%;box-shadow:0 1px 4px #0002;transition:.2s}.switch.on{background:#19a36a}.switch.on span{transform:translateX(16px)}.countdown{font-size:10px;font-weight:900;color:#e54848}.countdown i{font-size:7px;margin-right:4px}

main{padding:16px 14px 20px}.section-label{display:flex;align-items:center;justify-content:space-between;margin:0 2px 14px}.section-label strong{font-size:11px;color:#8c929b;letter-spacing:.9px}.section-label span{font-size:10px;color:#a7acb3}
.sub-section{margin-bottom:24px}.sub-section:last-child{margin-bottom:0}.sub-section-label{font-size:13.5px;font-weight:900;margin:0 2px 12px;color:var(--ink)}
.product-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 11px}

.card{background:#fff;border:1px solid #eceef1;border-radius:18px;overflow:hidden;box-shadow:0 5px 18px rgba(16,24,40,.055);min-width:0;animation:up .35s ease both}.image-wrap{position:relative;aspect-ratio:1/0.93;background:#f1f3f5;overflow:hidden}.image-wrap img{width:100%;height:100%;display:block;object-fit:cover}.deal-chip{position:absolute;left:9px;top:9px;background:#191b20;color:#fff;border-radius:7px;padding:4px 7px;font-size:8px;font-weight:900;letter-spacing:.3px}.veg-dot{position:absolute;right:9px;top:9px;width:17px;height:17px;border-radius:5px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px #0002}.veg-dot i{font-size:8px}.veg-dot.veg i{color:#16975f}.veg-dot.non i{color:#d64040}.card-body{padding:10px 10px 11px}.item-name{font-size:13px;font-weight:800;line-height:1.25;min-height:32px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.rating-row{display:flex;align-items:center;gap:6px;margin-top:6px}.rating{background:#eef9f3;color:var(--green);padding:3px 6px;border-radius:6px;font-size:9px;font-weight:900}.restaurant{font-size:10px;color:#7f858d;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}.meta{margin-top:7px;display:flex;align-items:flex-end;justify-content:space-between;gap:5px}.price-old{font-size:9px;color:#a4a8ae;text-decoration:line-through}.price{font-size:15px;font-weight:900;color:#17191d}.price mark{background:#fff0a8;padding:1px 4px;border-radius:4px}.add-btn{height:34px;min-width:70px;border-radius:10px;border:1.3px solid #ffd7bb;background:#fff;color:var(--orange);font:800 11px Poppins;box-shadow:0 3px 10px rgba(252,128,25,.09);-webkit-tap-highlight-color:transparent}.add-btn:active{transform:scale(.96);background:#fff7f1}.card-link{display:block;text-decoration:none;color:inherit}.card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:8px}.eta{font-size:9px;color:#9aa0a8;font-weight:700}.restaurant-link{display:flex;align-items:center;gap:4px;color:#858b94;font-size:9px;font-weight:700;text-decoration:none}.restaurant-link i{font-size:7px}

.skeleton-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 11px}.skeleton-card{height:265px;border-radius:18px;background:linear-gradient(90deg,#f0f1f3 25%,#e7e8ea 37%,#f0f1f3 63%);background-size:400% 100%;animation:shimmer 1.35s infinite}.empty{text-align:center;background:#fff;border-radius:18px;padding:60px 20px}.empty i{font-size:40px;color:#e2e4e7}.empty strong{display:block;margin-top:12px;font-size:15px}.empty span{display:block;margin-top:5px;color:#9aa0a8;font-size:11px}

.bottom-nav{position:fixed;left:0;right:0;bottom:0;height:68px;background:rgba(255,255,255,.98);backdrop-filter:blur(15px);border-top:1px solid #eceef1;display:flex;z-index:9999;box-shadow:0 -5px 24px rgba(0,0,0,.06)}.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-decoration:none;color:#9aa2ad;font-size:10px;font-weight:700}.nav-item.active{color:var(--orange)}.nav-item i{font-size:19px}.nav-new{position:absolute;margin-top:-38px;background:#ef4444;color:#fff;border-radius:7px;padding:2px 5px;font-size:7px;font-weight:900}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(min-width:650px){.product-grid,.skeleton-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.hero{max-width:760px;margin-left:auto;margin-right:auto}main{max-width:900px;margin:auto}}
</style>
</head>
<body>
<header class="store-header">
  <div class="header-top">
    <div class="header-left"><a href="index.html" class="icon-btn" aria-label="Back"><i class="fa-solid fa-arrow-left"></i></a><div><div class="header-title-row"><h1 class="header-title">₹99 Store</h1><span class="pro-badge">PRO</span></div><p class="header-sub">Quality guaranteed · Free delivery</p></div></div>
    <div class="header-actions"><a class="icon-btn" href="search.html" aria-label="Search"><i class="fa-solid fa-magnifying-glass"></i></a><button class="icon-btn" type="button" onclick="shareStore()" aria-label="More options"><i class="fa-solid fa-ellipsis-vertical"></i></button></div>
  </div>
  <div class="hero">
    <div class="hero-text">
      <span class="hero-flame">🔥 UNDER ₹99</span>
      <strong>Big cravings.<br>Small prices.</strong>
      <span id="hero-sub" class="hero-sub">Fresh deals, updated daily</span><br>
      <span id="hero-save" class="hero-save hidden"></span>
    </div>
    <div class="hero-badge"><i class="fa-solid fa-tags"></i></div>
  </div>
  <div class="filter-row">
    <button class="filter-pill active" id="price99" onclick="setPrice(99)">₹99 Store</button>
    <div class="filter-sep"></div>
    <button class="filter-pill" id="sortBtn" onclick="toggleSort()">Sort <i class="fa-solid fa-chevron-down"></i></button>
    <button class="filter-pill" id="ratingBtn" onclick="toggleRating()">⭐ 4.0+</button>
    <button class="filter-pill hidden" id="etaBtn" onclick="toggleEta()">Delivery time</button>
  </div>
  <div class="subbar"><div class="toggle"><span>Veg only</span><div class="switch" id="vegSwitch" role="switch" aria-checked="false" onclick="toggleVeg()"><span></span></div></div><div class="countdown"><i class="fa-solid fa-circle"></i><span id="timer">ENDS IN 3:00:00</span></div></div>
</header>
<main>
  <div class="section-label"><strong id="item-count">LOADING DEALS</strong><span>Tap ADD to open restaurant</span></div>
  <div id="skeleton" class="skeleton-grid"><div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div></div>
  <div id="under99-list" style="display:none"></div>
</main>
<nav class="bottom-nav"><a href="index.html" class="nav-item"><i class="fa-solid fa-bowl-food"></i><span>Food</span></a><a href="under99.html" class="nav-item active"><i class="fa-solid fa-tag"></i><span>99 Store</span><b class="nav-new">NEW</b></a><a href="orders.html" class="nav-item"><i class="fa-solid fa-receipt"></i><span>Orders</span></a></nav>
<script>
const API='https://eatswada.onrender.com/api';let allItems=[];let vegOnly=false,sortHigh=false,ratingOnly=false,etaOn=false;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// Guaranteed-to-render inline placeholder (no network dependency) so a product
// image that fails to load never leaves an empty box or a broken-image icon.
const PLACEHOLDER_IMG="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23f4f1ea'/%3E%3Cpath d='M35 25v20a6 6 0 0 0 6 6v24a3 3 0 0 0 6 0V51a6 6 0 0 0 6-6V25a2 2 0 0 0-4 0v16a2 2 0 0 1-2 2V27a2 2 0 0 0-4 0v16a2 2 0 0 1-2-2V25a2 2 0 0 0-4 0Z' fill='%23fc8019'/%3E%3Cpath d='M64 25c-5 0-8 6-8 14s3 12 6 13v23a3 3 0 0 0 6 0V26a1 1 0 0 0-1-1Z' fill='%23fc8019'/%3E%3C/svg%3E";
function handleCardImgError(img){
 if(!img.dataset.fallback){img.dataset.fallback='1';img.onerror=null;img.src=PLACEHOLDER_IMG;img.style.objectFit='contain';img.style.padding='20%';}
}

function mapItem(x){
 let price=Number(x.price);if(!Number.isFinite(price))price=parseFloat(String(x.price||'').replace(/[^\d.]/g,''))||99;
 let r=x.restaurant;let rid=x.restaurantId||x.resId||x.restaurant_id||'unknown',rn=x.resName||x.restaurantName||'Nearbite partner',rr=x.resRating||x.restaurantRating||4;
 if(r&&typeof r==='object'){rid=r._id||r.id||rid;rn=r.name||rn;rr=r.rating||rr}
 else if(typeof r==='string'&&r)rid=r;
 const eta=x.deliveryTime||x.eta||x.resDeliveryTime||(r&&typeof r==='object'?(r.deliveryTime||r.eta):null)||null;
 return {id:x._id||x.id||'',name:x.name||'Special item',price,isVeg:!!x.isVeg,img:x.image||x.img||'',resId:rid,resName:rn,resRating:Number(rr)||4,eta};
}
function oldPrice(x){return Math.max(Math.ceil(x.price*1.45),x.price+10);}
function discountPct(x){const old=oldPrice(x);return Math.round((old-x.price)/old*100);}

async function load(){
 const list=document.getElementById('under99-list'),sk=document.getElementById('skeleton');
 try{
  const r=await fetch(`${API}/restaurants/under99`,{cache:'no-store'});const j=await r.json();const raw=Array.isArray(j?.data)?j.data:(Array.isArray(j)?j:[]);allItems=raw.map(mapItem).filter(x=>x.price<=99&&x.resId!=='unknown');
  if(allItems.length){
   const minPrice=Math.min(...allItems.map(x=>x.price));
   document.getElementById('hero-sub').textContent=`Top deals starting from ₹${minPrice}`;
   const maxDisc=Math.max(...allItems.map(discountPct));
   if(maxDisc>0){const hs=document.getElementById('hero-save');hs.textContent=`Save up to ${maxDisc}%`;hs.classList.remove('hidden');}
   document.getElementById('etaBtn').classList.toggle('hidden',!allItems.some(x=>x.eta));
  }
  render();sk.style.display='none';
 }catch(e){
  sk.style.display='none';list.style.display='block';
  list.innerHTML=`<div class="empty"><i class="fa-solid fa-wifi"></i><strong>Couldn't load deals</strong><span>Check your connection and try again.</span><button class="add-btn" style="margin-top:16px" onclick="load()">Try again</button></div>`;
 }
}

function sectionHTML(title,items){
 return `<div class="sub-section"><div class="sub-section-label">${esc(title)}</div><div class="product-grid">${items.map((x,i)=>cardHTML(x,i)).join('')}</div></div>`;
}
function cardHTML(x,i){
 const old=oldPrice(x);const id=encodeURIComponent(String(x.resId));const item=encodeURIComponent(x.name);
 const etaLabel=x.eta?(/min/i.test(String(x.eta))?String(x.eta):`~${x.eta} min`):'';
 return `<article class="card" style="animation-delay:${Math.min(i,12)*.035}s">
  <a class="card-link" href="restaurant.html?id=${id}&item=${item}"><div class="image-wrap"><img src="${esc(x.img)}" alt="${esc(x.name)}" loading="lazy" onerror="handleCardImgError(this)"><span class="deal-chip">UNDER ₹99</span><span class="veg-dot ${x.isVeg?'veg':'non'}"><i class="fa-solid ${x.isVeg?'fa-circle':'fa-caret-up'}"></i></span></div></a>
  <div class="card-body"><div class="item-name">${esc(x.name)}</div><div class="rating-row"><span class="rating">${x.resRating.toFixed(1)} ★</span><span class="restaurant">${esc(x.resName)}</span></div><div class="meta"><div><div class="price-old">₹${old}</div><div class="price"><mark>₹${x.price}</mark></div></div><button class="add-btn" type="button" onclick="openRestaurant(event,'${id}','${item}')">ADD</button></div><div class="card-foot"><span class="eta">${esc(etaLabel)}</span><a class="restaurant-link" href="restaurant.html?id=${id}&item=${item}">View restaurant <i class="fa-solid fa-arrow-right"></i></a></div></div>
 </article>`;
}

function render(){
 const list=document.getElementById('under99-list');
 const filtered=allItems.filter(x=>(!vegOnly||x.isVeg)&&(!ratingOnly||x.resRating>=4));
 let data=[...filtered];
 if(etaOn) data.sort((a,b)=>(parseFloat(a.eta)||999)-(parseFloat(b.eta)||999));
 else if(sortHigh) data.sort((a,b)=>b.resRating-a.resRating);
 else data.sort((a,b)=>a.price-b.price);

 document.getElementById('item-count').textContent=`${data.length} DEAL${data.length===1?'':'S'}`;
 list.style.display='block';

 if(!allItems.length){list.innerHTML=`<div class="empty"><i class="fa-solid fa-tag"></i><strong>No deals available right now</strong><span>Check back soon for fresh offers.</span></div>`;return}
 if(!data.length){list.innerHTML=`<div class="empty"><i class="fa-solid fa-filter"></i><strong>No deals match these filters</strong><span>Try changing the filters.</span></div>`;return}

 const filtersActive=vegOnly||ratingOnly||etaOn||sortHigh;
 if(filtersActive||data.length<6){
  list.innerHTML=`<div class="product-grid">${data.map((x,i)=>cardHTML(x,i)).join('')}</div>`;
  return;
 }
 let html='';
 const byDiscount=[...data].sort((a,b)=>discountPct(b)-discountPct(a)).slice(0,8);
 if(byDiscount.length>=4) html+=sectionHTML('🔥 Top deals',byDiscount);
 const rated=data.filter(x=>x.resRating>=4.3).sort((a,b)=>b.resRating-a.resRating).slice(0,8);
 if(rated.length>=4) html+=sectionHTML('⭐ Highly rated',rated);
 html+=sectionHTML('🍗 Best under ₹99',data);
 list.innerHTML=html;
}
function openRestaurant(e,id,item){e.preventDefault();e.stopPropagation();window.location.href=`restaurant.html?id=${id}&item=${item}`}
function toggleVeg(){vegOnly=!vegOnly;const s=document.getElementById('vegSwitch');s.classList.toggle('on',vegOnly);s.setAttribute('aria-checked',String(vegOnly));render()}
function toggleRating(){ratingOnly=!ratingOnly;document.getElementById('ratingBtn').classList.toggle('orange-active',ratingOnly);render()}
function toggleSort(){sortHigh=!sortHigh;document.getElementById('sortBtn').classList.toggle('orange-active',sortHigh);render()}
function toggleEta(){etaOn=!etaOn;document.getElementById('etaBtn').classList.toggle('orange-active',etaOn);render()}
function setPrice(v){document.getElementById('price99').classList.add('active');render()}
function shareStore(){if(navigator.share)navigator.share({title:'Nearbite ₹99 Store',text:'Food deals under ₹99 on Nearbite',url:location.href}).catch(()=>{});else navigator.clipboard?.writeText(location.href)}
function startTimer(){let s=10800;setInterval(()=>{s=s>0?s-1:10800;const h=String(Math.floor(s/3600)).padStart(2,'0'),m=String(Math.floor(s%3600/60)).padStart(2,'0'),x=String(s%60).padStart(2,'0');document.getElementById('timer').textContent=`ENDS IN ${h}:${m}:${x}`},1000)}
document.addEventListener('DOMContentLoaded',()=>{load();startTimer()});
</script>
</body></html>
