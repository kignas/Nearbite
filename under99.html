<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="view-transition" content="same-origin">
  <title>₹99 Store – </title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    :root{
      --ink:#111827;
      --muted:#6b7280;
      --line:#e7e7ea;
      --pink:#e51b8b;
      --pink-soft:#fff0f8;
      --green:#168653;
      --green-soft:#eaf7f0;
      --red:#e21d3e;
      --surface:#fff;
      --page:#f7f8fa;
    }
    *{box-sizing:border-box}
    html{background:#fff}
    body{
      margin:0;
      background:var(--page);
      color:var(--ink);
      font-family:'Poppins',sans-serif;
      padding-bottom:82px;
      -webkit-font-smoothing:antialiased;
    }

    /* Compact mobile header — no logo/banner */
    .store-header{
      position:sticky;
      top:0;
      z-index:1000;
      background:rgba(255,255,255,.97);
      backdrop-filter:blur(16px);
      -webkit-backdrop-filter:blur(16px);
      border-bottom:1px solid rgba(0,0,0,.07);
    }
    .header-top{
      height:70px;
      padding:10px 16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    .header-left{display:flex;align-items:center;gap:12px;min-width:0}
    .icon-btn{
      width:42px;height:42px;flex:0 0 42px;
      border:1px solid #e5e7eb;border-radius:50%;
      background:#fff;color:#111827;
      display:flex;align-items:center;justify-content:center;
      text-decoration:none;cursor:pointer;
      box-shadow:0 1px 3px rgba(0,0,0,.03);
    }
    .icon-btn:active{transform:scale(.96)}
    .icon-btn i{font-size:16px}
    .header-title-wrap{min-width:0}
    .header-title-row{display:flex;align-items:center;gap:7px}
    .header-title{
      margin:0;
      font-size:20px;
      line-height:1.15;
      font-weight:900;
      white-space:nowrap;
      letter-spacing:-.5px;
    }
    .official-badge{display:none}
    .header-sub{
      margin:2px 0 0;
      color:#8b919a;
      font-size:10px;
      font-weight:500;
      white-space:nowrap;
    }
    .header-actions{display:flex;gap:8px}

    .filter-row{
      display:flex;
      gap:8px;
      padding:0 16px 11px;
      overflow-x:auto;
      scrollbar-width:none;
      -webkit-overflow-scrolling:touch;
    }
    .filter-row::-webkit-scrollbar{display:none}
    .filter-pill{
      flex:0 0 auto;
      min-height:40px;
      padding:0 15px;
      border:1px solid #dedfe4;
      border-radius:22px;
      background:#fff;
      color:#25282d;
      font-family:inherit;
      font-size:12px;
      font-weight:600;
      white-space:nowrap;
    }
    .filter-pill.active{
      color:var(--pink);
      border-color:#f4b7d8;
      background:var(--pink-soft);
    }
    .filter-pill i{font-size:9px;margin-left:4px}
    .filter-sep{display:none}

    .sub-bar{display:none}

    main{
      max-width:760px;
      margin:0 auto;
      padding:16px 12px 24px;
    }
    .items-found-label{
      margin:0 4px 12px;
      font-size:18px;
      line-height:1.2;
      font-weight:800;
      letter-spacing:-.35px;
      color:#151922;
      text-transform:none;
    }

    /* Restaurant deal cards */
    .product-grid{
      display:flex!important;
      flex-direction:column;
      gap:16px!important;
    }
    .restaurant-deal{
      width:100%;
      background:#fff;
      border:1px solid #e4e5e8;
      border-radius:20px;
      padding:14px;
      overflow:hidden;
      box-shadow:0 3px 14px rgba(0,0,0,.045);
      animation:cardFadeUp .28s ease both;
    }
    .deal-head{
      position:relative;
      min-width:0;
      padding-right:64px;
    }
    .deal-discount{
      display:inline-block;
      margin:0 0 4px;
      padding:0;
      color:var(--pink);
      font-size:15px;
      line-height:1.2;
      font-weight:900;
      letter-spacing:-.25px;
    }
    .deal-name{
      margin:0 0 7px;
      font-size:21px;
      line-height:1.14;
      font-weight:900;
      letter-spacing:-.55px;
      color:#111827;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .deal-stamp{
      position:absolute;
      right:-5px;
      top:-4px;
      width:70px;
      height:70px;
      border:2px solid rgba(229,27,139,.25);
      border-radius:50%;
      color:rgba(229,27,139,.34);
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      font-size:7px;
      line-height:1.15;
      font-weight:900;
      transform:rotate(-11deg);
      pointer-events:none;
    }
    .deal-meta{
      display:flex;
      align-items:center;
      flex-wrap:wrap;
      gap:6px;
      min-width:0;
      color:#3f4650;
      font-size:12px;
      font-weight:600;
    }
    .deal-rating{
      display:inline-flex;
      align-items:center;
      gap:5px;
      color:#fff;
      background:var(--green);
      border-radius:999px;
      padding:4px 8px;
      font-size:12px;
      font-weight:800;
    }
    .deal-rating .star{font-size:11px;color:#fff}
    .deal-rating-count{color:#777e88;font-weight:500}
    .deal-sep{color:#a6abb2}
    .deal-time{white-space:nowrap}
    .deal-cuisine{
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:42%;
    }
    .deal-free{
      display:flex;
      align-items:center;
      gap:7px;
      margin-top:8px;
      color:#222a31;
      font-size:12px;
      font-weight:700;
    }
    .deal-free-icon{
      width:23px;height:23px;flex:0 0 23px;
      display:flex;align-items:center;justify-content:center;
      color:var(--green);
      background:var(--green-soft);
      border-radius:7px;
      font-size:11px;
    }

    .deal-items{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:10px;
      margin-top:13px;
    }
    .deal-item{min-width:0}
    .deal-image{
      position:relative;
      width:100%;
      aspect-ratio:1.18/1;
      border:1px solid #e9eaed;
      border-radius:15px;
      overflow:hidden;
      background:#f2f3f5;
    }
    .deal-image img{
      width:100%;height:100%;
      display:block;
      object-fit:cover;
    }
    .deal-image-fallback{
      width:100%;height:100%;
      display:flex;align-items:center;justify-content:center;
      color:#c4c8cd;font-size:25px;
    }
    .deal-popular{
      position:absolute;
      left:7px;top:7px;
      z-index:2;
      background:#fff;
      color:var(--green);
      border-radius:999px;
      padding:5px 9px;
      font-size:10px;
      line-height:1;
      font-weight:900;
      box-shadow:0 2px 7px rgba(0,0,0,.08);
    }
    .deal-plus{
      position:absolute;
      right:7px;
      bottom:7px;
      width:42px;height:42px;
      border-radius:50%;
      border:3px solid #ff8fc8;
      background:#fff;
      color:var(--pink);
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:inherit;
      font-size:27px;
      font-weight:500;
      line-height:1;
      box-shadow:0 3px 9px rgba(0,0,0,.12);
      cursor:pointer;
      z-index:3;
    }
    .deal-plus:active{transform:scale(.94)}
    .deal-qty{
      position:absolute;
      right:7px;
      bottom:7px;
      z-index:3;
      height:36px;
      min-width:86px;
      padding:0 5px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      background:#fff;
      border:1.5px solid #f08abf;
      border-radius:12px;
      box-shadow:0 3px 9px rgba(0,0,0,.11);
    }
    .deal-qty button{
      width:27px;height:30px;
      border:0;background:transparent;
      color:var(--pink);
      font:900 17px/1 'Poppins',sans-serif;
      cursor:pointer;
    }
    .deal-qty span{font-size:12px;font-weight:900;color:#111827}

    .deal-item-name{
      display:flex;
      align-items:flex-start;
      gap:5px;
      margin:8px 3px 0;
      min-height:34px;
      font-size:14px;
      line-height:1.25;
      font-weight:700;
      color:#171a20;
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
      overflow:hidden;
    }
    .veg-mark{
      width:16px;height:16px;
      flex:0 0 16px;
      margin-top:1px;
      border:1.6px solid var(--green);
      border-radius:3px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
    }
    .veg-mark::after{
      content:"";
      width:7px;height:7px;border-radius:50%;
      background:var(--green);
    }
    .veg-mark.non{border-color:var(--red)}
    .veg-mark.non::after{
      width:0;height:0;border-radius:0;background:transparent;
      border-left:4px solid transparent;
      border-right:4px solid transparent;
      border-bottom:7px solid var(--red);
    }
    .deal-price-row{
      display:flex;
      align-items:center;
      flex-wrap:wrap;
      gap:5px;
      margin:7px 3px 0;
    }
    .deal-price{font-size:18px;font-weight:900;color:#111827}
    .deal-old{font-size:12px;color:#8f959d;text-decoration:line-through}
    .deal-off{
      padding:4px 8px;
      border-radius:999px;
      background:var(--pink-soft);
      color:var(--pink);
      font-size:10px;
      line-height:1;
      font-weight:900;
      white-space:nowrap;
    }

    .skel-card{
      background:#fff;
      border-radius:20px;
      padding:14px;
      border:1px solid #e5e6e9;
    }
    .skel-img{height:150px;border-radius:15px}
    .skel-body{padding:12px 0}
    .empty-state{padding:50px 20px;text-align:center}
    .empty-state i{font-size:40px;color:#d8dbe0}
    .empty-state h3{font-size:16px;margin:12px 0 4px}
    .empty-state p{font-size:12px;color:#8b9199}

    .bottom-nav{
      position:fixed;
      left:0;right:0;bottom:0;
      height:68px;
      padding-bottom:env(safe-area-inset-bottom);
      background:rgba(255,255,255,.98);
      border-top:1px solid rgba(0,0,0,.06);
      box-shadow:0 -4px 22px rgba(0,0,0,.06);
      display:flex;
      z-index:9999;
    }
    .nav-item{
      flex:1;
      color:#9aa3b2;
      text-decoration:none;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:4px;
      font-size:9px;
      font-weight:700;
    }
    .nav-item.active{color:var(--pink)}
    .nav-icon{font-size:19px}
    .nav-food-circle{
      width:34px;height:34px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      background:#f1f3f6;
      font-size:16px;
    }
    .nav-item.active .nav-food-circle{background:var(--pink);color:#fff}
    .nav-new-badge{display:none}

    .toast{
      position:fixed;
      left:50%;
      bottom:88px;
      transform:translateX(-50%);
      z-index:11000;
      background:#17191d;
      color:#fff;
      padding:10px 15px;
      border-radius:12px;
      font-size:12px;
      font-weight:700;
      box-shadow:0 8px 25px rgba(0,0,0,.2);
      display:none;
    }

    @keyframes cardFadeUp{
      from{opacity:0;transform:translateY(8px)}
      to{opacity:1;transform:translateY(0)}
    }

    /* Tablet / wider phones: preserve the same card, simply breathe a little more. */
    @media (min-width:560px){
      main{padding-left:18px;padding-right:18px}
      .restaurant-deal{padding:16px}
      .deal-items{gap:14px}
      .deal-name{font-size:23px}
      .deal-image{border-radius:17px}
    }
    @media (max-width:380px){
      .header-title{font-size:18px}
      .header-sub{font-size:9px}
      .deal-name{font-size:19px}
      .deal-discount{font-size:14px}
      .deal-meta,.deal-free{font-size:11px}
      .deal-item-name{font-size:12px}
      .deal-price{font-size:16px}
      .deal-plus{width:38px;height:38px;font-size:24px}
      .deal-qty{min-width:78px;height:34px}
      .deal-qty button{width:24px}
    }
  </style>
</head>

    <div class="skel-card"><div class="skel-img skeleton"></div><div class="skel-body"><div class="skeleton" style="height:14px;width:70%;border-radius:6px"></div><div class="skeleton" style="height:11px;width:50%;border-radius:6px;margin-top:8px"></div></div></div>

<script src="home.js"></script>
<script src="under99.js"></script>
<script src="cart-bar.js"></script>
<script>
  // ── RESTAURANT DEAL FEED ──
  const API_BASE_URL = 'https://eatswada.onrender.com/api';
  let currentMaxPrice = 99;
  let vegOnly99 = false;
  let sortByRating = false;
  let discountOnly = true;

  function esc(v){
    return String(v == null ? '' : v)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
  }
  function getField(obj, paths, fallback=''){
    for(const p of paths){
      let cur=obj;
      for(const k of p.split('.')){
        if(cur==null) break;
        cur=cur[k];
      }
      if(cur!==undefined && cur!==null && cur!=='') return cur;
    }
    return fallback;
  }
  function money(v){ return Math.round(Number(v)||0); }

  function normalizeItem(dbItem){
    let price = money(dbItem.price);
    let restaurant = (dbItem.restaurant && typeof dbItem.restaurant === 'object') ? dbItem.restaurant : {};
    let rId = restaurant._id || restaurant.id || dbItem.restaurant || 'unknown';
    let rName = restaurant.name || dbItem.restaurantName || 'EatSwada Partner';
    let rRating = restaurant.rating ?? dbItem.resRating ?? 0;

    let delivery = getField(dbItem,[
      'deliveryTime','deliveryTimeText','eta','deliveryEta','delivery_time'
    ],'');
    if(!delivery) delivery=getField(restaurant,[
      'deliveryTime','deliveryTimeText','eta','deliveryEta','delivery_time','estimatedDeliveryTime'
    ],'');

    let freeAbove = getField(dbItem,[
      'freeDeliveryAbove','free_delivery_above'
    ],null);
    if(freeAbove==null) freeAbove=getField(restaurant,[
      'freeDeliveryAbove','free_delivery_above','freeDeliveryThreshold'
    ],null);

    let cuisine = getField(dbItem,['cuisine','cuisines','category'], '');
    if(!cuisine) cuisine=getField(restaurant,['cuisine','cuisines','category'], '');
    if(Array.isArray(cuisine)) cuisine=cuisine.join(', ');

    let original = getField(dbItem,['originalPrice','mrp','compareAtPrice','oldPrice'],null);
    let discount = getField(dbItem,['discountPercentage','discountPercent','discount'],null);
    if(original==null && discount!=null && Number(discount)>0){
      original = Math.round(price/(1-Number(discount)/100));
    }
    if(original==null && price>0) original=Math.round(price*1.4);
    let discountPct = (original && original>price)
      ? Math.round((1-price/original)*100)
      : (Number(discount)||0);

    return {
      id: dbItem._id || dbItem.id || '',
      name: dbItem.name || 'Special Item',
      price,
      originalPrice: money(original),
      discountPct,
      isVeg: Boolean(dbItem.isVeg),
      img: dbItem.image || dbItem.img || '',
      resId:String(rId),
      resName:rName,
      resRating:Number(rRating)||0,
      ratingCount:getField(dbItem,['ratingCount','ratingsCount','reviewCount'], getField(restaurant,['ratingCount','ratingsCount','reviewCount'],'')),
      delivery:String(delivery||''),
      cuisine:String(cuisine||''),
      freeAbove: freeAbove==null ? null : money(freeAbove),
      popular:Boolean(dbItem.isBestseller || dbItem.isPopular || dbItem.popular || dbItem.bestseller),
      menuItem:dbItem._id || dbItem.id || ''
    };
  }

  function readCart(){
    try{return JSON.parse(localStorage.getItem('nearbite_cart'))||{};}catch(e){return {};}
  }
  function itemQty(item, cart){
    if(cart[item.name] && cart[item.name].quantity) return cart[item.name].quantity;
    return 0;
  }

  function renderItems(items){
    const listEl=document.getElementById('under99-list');
    const skeleton=document.getElementById('skeleton-grid');
    const countEl=document.getElementById('item-count');
    if(!listEl) return;

    let filtered=items.filter(item=>{
      if(currentMaxPrice===99 && item.price>99) return false;
      if(currentMaxPrice===149 && item.price>149) return false;
      if(vegOnly99 && !item.isVeg) return false;
      if(sortByRating && item.resRating<4) return false;
      return true;
    });

    const groups={};
    filtered.forEach(item=>{
      const key=item.resId || ('unknown-'+item.resName);
      if(!groups[key]) groups[key]=[];
      groups[key].push(item);
    });

    let restaurants=Object.values(groups).map(itemsInRestaurant=>{
      itemsInRestaurant.sort((a,b)=>a.price-b.price);
      return {items:itemsInRestaurant};
    });

    if(sortByRating){
      restaurants.sort((a,b)=>b.items[0].resRating-a.items[0].resRating);
    }else{
      restaurants.sort((a,b)=>a.items[0].price-b.items[0].price);
    }

    if(skeleton) skeleton.style.display='none';
    listEl.style.display='flex';

    if(countEl){
      countEl.textContent=restaurants.length
        ? restaurants.length+' Restaurant'+(restaurants.length===1?'':'s')
        : 'Deals for you';
    }

    if(!restaurants.length){
      listEl.innerHTML='<div class="empty-state"><i class="fa-solid fa-tag"></i><h3>No deals match these filters</h3><p>Try changing the price or food preference.</p></div>';
      return;
    }

    const cart=readCart();

    listEl.innerHTML=restaurants.map((r,index)=>{
      const first=r.items[0];
      const rating=first.resRating ? first.resRating.toFixed(1) : '—';
      const ratingCount=first.ratingCount ? '('+esc(first.ratingCount)+')' : '';
      const delivery=first.delivery || '30–40 mins';
      const cuisine=first.cuisine || '';
      const freeAbove=first.freeAbove;
      const lowest=first.price;

      const itemsHtml=r.items.slice(0,3).map(item=>{
        const qty=itemQty(item,cart);
        const vegMark='<span class="veg-mark '+(item.isVeg?'':'non')+'"></span>';
        const btn=qty>0
          ? '<div class="deal-qty">'+
              '<button onclick="event.stopPropagation();updateCart(\\''+escJs(item.name)+'\\',-1,'+item.price+',\\''+escJs(item.resId)+'\\')">−</button>'+
              '<span>'+qty+'</span>'+
              '<button onclick="event.stopPropagation();updateCart(\\''+escJs(item.name)+'\\',1,'+item.price+',\\''+escJs(item.resId)+'\\')">+</button>'+
            '</div>'
          : '<button class="deal-plus" onclick="event.stopPropagation();updateCart(\\''+escJs(item.name)+'\\',1,'+item.price+',\\''+escJs(item.resId)+'\\')" aria-label="Add '+esc(item.name)+'">+</button>';

        return '<div class="deal-item">'+
          '<div class="deal-image">'+
            (item.popular?'<span class="deal-popular">Popular</span>':'')+
            (item.img
              ? '<img src="'+esc(item.img)+'" alt="'+esc(item.name)+'" loading="lazy" onerror="this.style.display=\\'none\\'">'
              : '<div class="deal-image-fallback"><i class="fa-solid fa-utensils"></i></div>')+
            btn+
          '</div>'+
          '<div class="deal-item-name">'+vegMark+'<span>'+esc(item.name)+'</span></div>'+
          '<div class="deal-price-row">'+
            '<span class="deal-price">₹'+item.price+'</span>'+
            (item.originalPrice>item.price?'<span class="deal-old">₹'+item.originalPrice+'</span>':'')+
            (item.discountPct>0?'<span class="deal-off">'+item.discountPct+'% OFF</span>':'')+
          '</div>'+
        '</div>';
      }).join('');

      return '<article class="restaurant-deal" style="animation-delay:'+Math.min(index*.035,.3)+'s">'+
        '<div class="deal-head">'+
          '<div class="deal-discount">'+(first.discountPct>0?first.discountPct:15)+'% LOWER PRICES</div>'+
          '<h2 class="deal-name">'+esc(first.resName)+'</h2>'+
          '<div class="deal-stamp">EVERYDAY<br>LOWEST PRICE<br>EVERYDAY</div>'+
          '<div class="deal-meta">'+
            '<span class="deal-rating"><span class="star">★</span> '+rating+'</span>'+
            (ratingCount?'<span class="deal-rating-count">'+ratingCount+'</span>':'')+
            '<span class="deal-sep">•</span>'+
            '<span class="deal-time">'+esc(delivery)+'</span>'+
            (cuisine?'<span class="deal-sep">•</span><span class="deal-cuisine">'+esc(cuisine)+'</span>':'')+
          '</div>'+
          '<div class="deal-free">'+
            '<span class="deal-free-icon"><i class="fa-solid fa-percent"></i></span>'+
            (freeAbove!=null
              ? 'Free delivery above ₹'+freeAbove
              : 'Free delivery')+
          '</div>'+
        '</div>'+
        '<div class="deal-items">'+itemsHtml+'</div>'+
      '</article>';
    }).join('');

    if(typeof window.renderCartBar==='function') window.renderCartBar();
  }

  function escJs(v){
    return String(v==null?'':v).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
  }

  window.renderItems=async function(){
    const skeleton=document.getElementById('skeleton-grid');
    const listEl=document.getElementById('under99-list');
    const cached=sessionStorage.getItem('es_under99_data_v9');
    let items=[];

    if(cached && cached!=='[]'){
      try{items=JSON.parse(cached);}catch(e){items=[];}
    }

    if(!items.length){
      try{
        if(skeleton) skeleton.style.display='flex';
        const response=await fetch(API_BASE_URL+'/restaurants/under99');
        const result=await response.json();
        const raw=Array.isArray(result.data)?result.data:(Array.isArray(result)?result:[]);
        items=raw.map(normalizeItem).filter(item=>item.price<=99);
        sessionStorage.setItem('es_under99_data_v9',JSON.stringify(items));
      }catch(error){
        if(skeleton) skeleton.style.display='none';
        if(listEl){
          listEl.style.display='flex';
          listEl.innerHTML='<div class="empty-state"><i class="fa-solid fa-wifi"></i><h3>Couldn’t load deals</h3><p>Please try again.</p><button onclick="sessionStorage.removeItem(\\'es_under99_data_v9\\');location.reload()" style="margin-top:14px;padding:10px 16px;border:0;border-radius:10px;background:#e51b8b;color:#fff;font-weight:800">Retry</button></div>';
        }
        return;
      }
    }
    window.__under99Items=items;
    renderItems(items);
  };

  window.updateCart=function(itemName,change,price,rId){
    let cart=readCart();
    if(!cart[itemName]) cart[itemName]={quantity:0,price:price,resId:rId};
    cart[itemName].quantity+=change;
    if(cart[itemName].quantity<=0) delete cart[itemName];
    localStorage.setItem('nearbite_cart',JSON.stringify(cart));

    if(window.__under99Items) renderItems(window.__under99Items);
    if(typeof window.updateGlobalCart==='function') window.updateGlobalCart();
    if(typeof window.renderCartBar==='function') window.renderCartBar();
  };

  window.setPriceFilter=function(max){
    currentMaxPrice=max;
    document.querySelectorAll('.filter-pill').forEach(b=>b.classList.remove('active'));
    const target=document.getElementById(max===99?'filter-99':'filter-149');
    if(target) target.classList.add('active');
    if(window.__under99Items) renderItems(window.__under99Items);
  };
  window.setRatingFilter=function(){
    sortByRating=!sortByRating;
    const b=document.getElementById('rating-btn');
    if(b) b.classList.toggle('active',sortByRating);
    if(window.__under99Items) renderItems(window.__under99Items);
  };
  window.setDiscountFilter=function(){
    discountOnly=!discountOnly;
    const b=document.getElementById('discount-btn');
    if(b) b.classList.toggle('active',discountOnly);
    if(window.__under99Items) renderItems(window.__under99Items);
  };
  window.setVegFilter=function(){
    vegOnly99=!vegOnly99;
    const b=document.getElementById('veg-filter');
    if(b) b.classList.toggle('active',vegOnly99);
    if(window.__under99Items) renderItems(window.__under99Items);
  };
  window.setSortFilter=function(){
    sortByRating=!sortByRating;
    if(window.__under99Items) renderItems(window.__under99Items);
  };

  window.addEventListener('DOMContentLoaded',window.renderItems);

  const bottomNav=document.querySelector('.bottom-nav');
  let lastScrollTop=0;
  window.addEventListener('scroll',()=>{
    const current=window.pageYOffset||document.documentElement.scrollTop;
    if(Math.abs(lastScrollTop-current)<=15)return;
    if(current>lastScrollTop && current>180){
      if(bottomNav)bottomNav.classList.add('bottom-nav-hidden');
    }else{
      if(bottomNav)bottomNav.classList.remove('bottom-nav-hidden');
    }
    lastScrollTop=current;
  },{passive:true});

  // ── 3. FILTER & SCROLL LOGIC ──
  window.toggleVeg = function() {
    if(typeof vegOnly99 !== 'undefined') vegOnly99 = !vegOnly99;
    const sw = document.getElementById('veg99-switch');
    if (sw) sw.classList.toggle('on');
    window.renderItems(); 
  };

  window.addEventListener('DOMContentLoaded', window.renderItems);

  const bottomNav = document.querySelector('.bottom-nav'); 
  let lastScrollTop = 0;
  window.addEventListener('scroll', () => {
    let currentScroll = window.pageYOffset || document.documentElement.scrollTop;
    if (Math.abs(lastScrollTop - currentScroll) <= 15) return;
    if (currentScroll > lastScrollTop && currentScroll > 180) {
      if (bottomNav) bottomNav.classList.add('bottom-nav-hidden'); 
    } else {
      if (bottomNav) bottomNav.classList.remove('bottom-nav-hidden'); 
    }
    lastScrollTop = currentScroll;
  }, { passive: true }); 
</script>

</body>
</html>
