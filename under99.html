<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#FBD5E1">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Eatswada">
  <meta name="view-transition" content="same-origin">
  <title>99 Store – Eatswada</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap" rel="stylesheet">
</head>

<style>
:root{
  --ink:#101828; --muted:#747B87; --soft:#FAFBFD; --line:#E7E9ED;
  --pink:#EC168C; --pink-soft:#FFF1F8; --green:#159A62; --gold:#F5B51B;
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{
  margin:0;padding:0;background:var(--soft);color:var(--ink);
  font-family:var(--font);-webkit-font-smoothing:antialiased;
}
button,a{font:inherit} button{cursor:pointer} svg{display:block}
body{padding-bottom:0}

/* Header, location pill and hero are defined in the "BENCHMARK HERO" block below. */
.loc-pill:active{transform:scale(.99)}

.filter-row{
  display:flex;gap:7px;overflow-x:auto;padding:5px 16px 8px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;background:#fff;
  border-top:1px solid rgba(16,24,40,.035);
}
.filter-row::-webkit-scrollbar{display:none}
.filter-pill{
  height:40px;min-height:40px;flex:0 0 auto;padding:0 13px;border:1px solid #DCE1E8;border-radius:999px;
  background:#fff;color:#202936;font-size:12.5px;font-weight:650;white-space:nowrap;
  display:flex;align-items:center;justify-content:center;gap:7px;box-shadow:none;
  -webkit-tap-highlight-color:transparent;
}
.filter-pill.active{
  color:var(--pink);border-color:#F1B4D5;background:var(--pink-soft);font-weight:750;
}
.filter-pill svg{width:17px;height:17px;flex:none}
.filter-pill.active svg{stroke:var(--pink)}
.filter-icon-pill{width:40px;padding:0;border-radius:50%;flex-basis:40px}
.filter-icon-pill svg{width:18px;height:18px}
.pill-pct{
  width:20px;height:20px;flex:0 0 20px;border-radius:50%;
  background:var(--pink);color:#fff;font-size:12px;font-weight:800;
  display:grid;place-items:center;line-height:1;letter-spacing:0;
}

main{max-width:920px;margin:0 auto;padding:10px 16px 28px}
.items-found-label{display:none}
.restaurant-feed{display:flex;flex-direction:column;gap:18px}
.skeleton-feed{display:flex;flex-direction:column;gap:24px}
.skeleton-card{
  background:#fff;border:1px solid var(--line);border-radius:26px;padding:18px;
}
.skeleton-big{height:42px;border-radius:9px;margin-bottom:14px}
.skeleton-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.skeleton-img{aspect-ratio:1.42/1;border-radius:14px}
.skeleton-line{height:11px;border-radius:6px;margin-top:9px}
.skeleton{
  background:linear-gradient(90deg,#F0F2F5 25%,#FAFBFD 37%,#F0F2F5 63%);
  background-size:400% 100%;animation:shimmer 1.25s ease-in-out infinite
}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}

.empty{
  background:#fff;border:1px solid var(--line);border-radius:26px;text-align:center;
  padding:55px 20px;color:var(--muted)
}
.empty h3{margin:12px 0 5px;color:var(--ink);font-size:16px;font-weight:800}
.empty p{margin:0;font-size:12px;font-weight:500}
.toast{
  position:fixed;left:50%;bottom:88px;z-index:12000;transform:translateX(-50%);
  display:none;background:#17191d;color:#fff;padding:10px 14px;border-radius:12px;
  font-size:12px;font-weight:700;box-shadow:0 8px 25px rgba(0,0,0,.2);white-space:nowrap
}
@media(max-width:430px){
  .header-left{gap:10px}
  .icon-btn{width:42px;height:42px;flex-basis:42px}
  .icon-btn svg{width:22px;height:22px}
  .header-title{font-size:20px;letter-spacing:-.65px}
  .header-sub{font-size:11.5px;margin-top:4px}
  .filter-row{gap:7px;padding:7px 12px 8px}
  .filter-pill{height:42px;font-size:12px;padding:0 12px}
  main{padding:16px 16px 26px}
  .restaurant-feed{gap:24px}
}
@media(prefers-reduced-motion:reduce){
  .skeleton{animation:none}
  .icon-btn{transition:none}
}

/* 99 STORE FILTER SHEETS — header/filter step only */
.filter-pill{ -webkit-tap-highlight-color:transparent; }
.filter-pill:active{transform:scale(.985)}
.filter-pill.has-filter{border-color:#E8A6CD;background:#FFF1F8;color:var(--pink)}
.filter-sheet-backdrop{
  position:fixed;inset:0;z-index:15000;background:rgba(7,21,45,.58);
  opacity:0;visibility:hidden;transition:opacity .22s ease,visibility .22s ease;
}
.filter-sheet-backdrop.open{opacity:1;visibility:visible}
.filter-sheet{
  position:absolute;left:0;right:0;bottom:0;background:#fff;
  border-radius:24px 24px 0 0;padding:22px 20px 18px;
  padding-bottom:calc(22px + env(safe-area-inset-bottom));
  transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
  max-height:min(76vh,640px);overflow:auto;
}
.filter-sheet-backdrop.open .filter-sheet{transform:translateY(0)}
.filter-sheet-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}
.filter-sheet-title{margin:0;font-size:20px;line-height:1.2;font-weight:800;letter-spacing:-.45px;color:var(--ink)}
.filter-sheet-close{
  width:34px;height:34px;border:0;background:transparent;color:#6B7280;
  display:grid;place-items:center;border-radius:50%;font-size:28px;line-height:1;padding:0;
}
.filter-group{margin:0 0 14px;padding-bottom:8px;border-bottom:1px solid #F0F1F3}
.filter-group:last-of-type{border-bottom:0;margin-bottom:0}
.filter-group-title{font-size:12px;font-weight:800;letter-spacing:.2px;color:#8A909A;text-transform:uppercase;margin:0 0 4px}
.filter-toggle-option{min-height:48px}
.filter-options{display:flex;flex-direction:column;gap:5px}
.filter-option{
  min-height:66px;display:flex;align-items:center;gap:16px;border:0;background:#fff;
  padding:8px 4px;color:#69707C;text-align:left;font-size:17px;font-weight:600;
}
.filter-option input{
  appearance:none;-webkit-appearance:none;width:30px;height:30px;flex:0 0 30px;
  border:2px solid #B8BCC3;background:#fff;position:relative;
}
.filter-option input[type=radio]{border-radius:50%}
.filter-option input[type=checkbox]{border-radius:3px}
.filter-option input:checked{border-color:var(--pink)}
.filter-option input:checked::after{
  content:"";position:absolute;inset:6px;border-radius:50%;background:var(--pink);
}
.filter-option input[type=checkbox]:checked::after{
  inset:4px;border-radius:2px;background:var(--pink);
}
.filter-option input[type=checkbox]:checked::before{
  content:"✓";position:absolute;z-index:1;left:5px;top:1px;color:#fff;font-size:18px;font-weight:800;
}
.filter-actions{margin-top:18px}
.filter-apply{
  width:100%;height:54px;border:0;border-radius:15px;background:#07943A;color:#fff;
  font-size:17px;font-weight:800;
}
.filter-clear{
  width:100%;height:48px;border:0;background:transparent;color:#92959B;
  font-size:16px;font-weight:700;
}
body.filter-open{overflow:hidden}
@media(max-width:430px){
  .filter-sheet{padding-left:24px;padding-right:24px}
  .filter-sheet-title{font-size:19px}
  .filter-option{font-size:16px}
}


/* ===== 99 STORE — BENCHMARK HERO ===== */
.store-header{position:relative;z-index:1000;background:#FBD5E1;border:0}
.header-top{position:absolute;z-index:20;top:0;left:0;right:0;min-height:66px;padding:calc(9px + env(safe-area-inset-top, 0px)) 16px 6px;display:flex;align-items:center;gap:10px;background:transparent}
.header-left{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.icon-btn{width:44px;height:44px;flex:0 0 44px;border:1px solid rgba(255,255,255,.48);border-radius:50%;background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:#101828;display:grid;place-items:center;box-shadow:0 2px 8px rgba(89,36,55,.08)}
.icon-btn:active{transform:scale(.96)}
.icon-btn svg{width:22px;height:22px}
.loc-pill{display:flex;align-items:center;gap:9px;min-width:0;flex:0 1 auto;width:auto;max-width:210px;min-height:54px;padding:7px 15px;border:1px solid rgba(255,255,255,.52);border-radius:999px;background:rgba(255,255,255,.52);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#101828;text-align:left;box-shadow:0 2px 8px rgba(89,36,55,.06)}
.loc-pin{width:19px;height:19px;flex:0 0 19px;color:var(--pink)}
.loc-text{min-width:0;display:flex;flex-direction:column;gap:1px}
.loc-name-row{display:flex;align-items:center;gap:4px;min-width:0}
.loc-name{font-size:16px;font-weight:800;letter-spacing:-.25px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loc-caret{width:15px;height:15px;flex:0 0 15px;color:#747B87}
.loc-sub{font-size:12px;font-weight:600;color:#6B7280;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loc-pill.loc-unset .loc-name{color:var(--pink)}
.filter-row{background:#fff;border-top:1px solid rgba(16,24,40,.04);border-bottom:1px solid #ECEEF1;padding:7px 12px 8px;gap:7px}

.u99-hero{position:relative;overflow:hidden;min-height:184px;margin:0;padding:0 16px;color:#101828;background:linear-gradient(180deg,#FBD5E1 0%,#FCE0EB 100%);border-radius:0 0 26px 26px;isolation:isolate}
.u99-hero::before{content:"";position:absolute;width:120px;height:120px;right:-34px;top:-46px;border-radius:50%;background:rgba(245,183,210,.30)}
.u99-hero::after{content:"";position:absolute;width:170px;height:170px;left:-84px;top:120px;border-radius:50%;background:rgba(255,255,255,.14)}
.u99-hero-inner{position:relative;min-height:184px;display:block}
.u99-hero-copy{position:relative;z-index:4;width:58%;padding-top:96px;padding-left:16px}
.u99-hero-kicker{display:flex;align-items:center;gap:5px;padding:0;background:none;border:0;font-size:20px;line-height:1.02;font-weight:800;letter-spacing:-.7px;color:#071532}
.sparkle-icon{width:18px;height:18px;flex-shrink:0}
.u99-hero-title{display:none}
.u99-hero-price{margin:2px 0 0;color:#D9096E;line-height:1;white-space:nowrap}
.currency-symbol{display:inline-block;font-size:42px;font-weight:800;vertical-align:top;line-height:1;margin-top:9px;margin-right:-2px}
.price-number{display:inline-block;font-size:84px;line-height:.88;font-weight:800;letter-spacing:-4.1px}
.u99-hero-sub{margin:9px 0 0;max-width:285px;font-size:13px;line-height:1.3;font-weight:650;color:#574F63;white-space:nowrap}
.u99-hero-cta{display:none}
.u99-hero-art{position:absolute;z-index:3;right:-10px;bottom:-10px;width:68%;max-width:none;max-height:184px;height:auto;object-fit:contain;object-position:right bottom;filter:drop-shadow(0 10px 13px rgba(89,36,55,.12));pointer-events:none}
@media(max-width:430px){
  .header-top{min-height:60px;padding:calc(7px + env(safe-area-inset-top, 0px)) 14px 4px;gap:8px}
  .icon-btn{width:44px;height:44px;flex-basis:44px}
  .loc-pill{flex:0 1 auto;width:210px;max-width:210px;min-height:54px;border-radius:999px}
  .u99-hero{min-height:184px;padding:0 14px;border-radius:0 0 22px 22px}
  .u99-hero-inner{min-height:184px}
  .u99-hero-copy{width:58%;padding-top:96px;padding-left:16px}
  .u99-hero-kicker{font-size:20px;letter-spacing:-.55px}
  .price-number{font-size:84px;letter-spacing:-4.2px}
  .u99-hero-sub{font-size:13px;max-width:285px;margin-top:9px}
  .u99-hero-art{right:-10px;bottom:-10px;width:70%;max-width:none;max-height:182px}
}
</style>

<body>
<header class="store-header">
  <div class="header-top">
    <div class="header-left">
      <a href="index.html" class="icon-btn" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
      </a>
      <button type="button" class="loc-pill loc-unset" id="loc-pill" aria-label="Change delivery location">
        <svg class="loc-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-5.686 7-11a7 7 0 1 0-14 0c0 5.314 7 11 7 11Z"/><circle cx="12" cy="10" r="2.4"/></svg>
        <span class="loc-text">
          <span class="loc-name-row">
            <span id="loc-name" class="loc-name">Set location</span>
            <svg class="loc-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m7 10 5 5 5-5"/></svg>
          </span>
          <span id="loc-sub" class="loc-sub">Tap to choose your area</span>
        </span>
      </button>
    </div>
    <button class="icon-btn" onclick="window.location.href='search.html'" aria-label="Search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><circle cx="11" cy="11" r="7.5"/><path d="m17 17 4 4"/></svg>
    </button>
  </div>


  <section id="u99-hero" class="u99-hero" aria-label="Meals under 99">
    <div class="u99-hero-inner">
      <div class="u99-hero-copy">
        <span class="u99-hero-kicker">
          MEALS UNDER
          <svg class="sparkle-icon" viewBox="0 0 24 24" fill="none" stroke="#D9096E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 14V6M7 11l4-5M17 11l-4-5"/>
          </svg>
        </span>
        <div class="u99-hero-price">
          <span class="currency-symbol">₹</span><span class="price-number">99</span>
        </div>
        <p class="u99-hero-sub">Great food. Lower prices. Everyday.</p>
      </div>
      <img id="u99-hero-art" class="u99-hero-art" alt="" hidden>
    </div>
  </section>

  <div class="filter-row" aria-label="99 Store filters">
    <button class="filter-pill filter-icon-pill" id="sort-btn" type="button" data-open-filter="all" aria-label="All filters">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 7h16"/><circle cx="9" cy="7" r="2.2" fill="white"/>
        <path d="M4 17h16"/><circle cx="15" cy="17" r="2.2" fill="white"/>
      </svg>
    </button>
    <button class="filter-pill active" id="discount-btn" type="button" onclick="toggleDiscount()">
      <span class="pill-pct" aria-hidden="true">%</span>40–60% Lower Prices
    </button>
    <button class="filter-pill" id="veg-btn" type="button" data-open-filter="veg">
      Veg/Non-Veg
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="m7 10 5 5 5-5"/></svg>
    </button>
    <button class="filter-pill" id="price-btn" type="button" data-open-filter="price">
      ₹99 &amp; under
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="m7 10 5 5 5-5"/></svg>
    </button>
    <button class="filter-pill" id="delivery-btn" type="button" data-open-filter="delivery">
      Delivery time
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="m7 10 5 5 5-5"/></svg>
    </button>
  </div>
</header>

<main>
  <p id="item-count" class="items-found-label">Deals for you</p>

  <section id="skeleton-feed" class="skeleton-feed" aria-hidden="true">
    <div class="skeleton-card">
      <div class="skeleton skeleton-big"></div>
      <div class="skeleton-row">
        <div><div class="skeleton skeleton-img"></div><div class="skeleton skeleton-line"></div></div>
        <div><div class="skeleton skeleton-img"></div><div class="skeleton skeleton-line"></div></div>
        <div><div class="skeleton skeleton-img"></div><div class="skeleton skeleton-line"></div></div>
      </div>
    </div>
    <div class="skeleton-card">
      <div class="skeleton skeleton-big"></div>
      <div class="skeleton-row">
        <div><div class="skeleton skeleton-img"></div><div class="skeleton skeleton-line"></div></div>
        <div><div class="skeleton skeleton-img"></div><div class="skeleton skeleton-line"></div></div>
        <div><div class="skeleton skeleton-img"></div><div class="skeleton skeleton-line"></div></div>
      </div>
    </div>
  </section>

  <section id="under99-list" class="restaurant-feed" style="display:none"></section>
</main>


<!-- Working filter sheets -->
<div id="filter-backdrop" class="filter-sheet-backdrop" aria-hidden="true">
  <section id="all-sheet" class="filter-sheet" role="dialog" aria-modal="true" aria-labelledby="all-title" hidden>
    <div class="filter-sheet-head">
      <h2 id="all-title" class="filter-sheet-title">Filters</h2>
      <button class="filter-sheet-close" data-close-filter aria-label="Close">×</button>
    </div>
    <div class="filter-group">
      <div class="filter-group-title">Deals</div>
      <label class="filter-option filter-toggle-option"><input id="all-discount" type="checkbox"><span>40–60% Lower Prices</span></label>
    </div>
    <div class="filter-group">
      <div class="filter-group-title">Food preference</div>
      <label class="filter-option"><input type="radio" name="all-food-type" value="all"><span>All</span></label>
      <label class="filter-option"><input type="radio" name="all-food-type" value="veg"><span>Veg</span></label>
      <label class="filter-option"><input type="radio" name="all-food-type" value="nonveg"><span>Non Veg</span></label>
    </div>
    <div class="filter-group">
      <div class="filter-group-title">Price</div>
      <label class="filter-option"><input type="checkbox" name="all-price-range" value="0-49"><span>₹0 - ₹49</span></label>
      <label class="filter-option"><input type="checkbox" name="all-price-range" value="49-99"><span>₹49 - ₹99</span></label>
    </div>
    <div class="filter-actions">
      <button class="filter-apply" data-apply-filter>Apply filters</button>
      <button class="filter-clear" data-clear-filter>Clear all</button>
    </div>
  </section>

  
  <section id="delivery-sheet" class="filter-sheet" role="dialog" aria-modal="true" aria-labelledby="delivery-title">
    <div class="filter-sheet-head">
      <h2 id="delivery-title" class="filter-sheet-title">Delivery time</h2>
      <button class="filter-sheet-close" data-close-filter aria-label="Close">×</button>
    </div>
    <div class="filter-options">
      <label class="filter-option"><input type="radio" name="delivery-time" value="20"><span>less than 20 minutes</span></label>
      <label class="filter-option"><input type="radio" name="delivery-time" value="30"><span>less than 30 minutes</span></label>
      <label class="filter-option"><input type="radio" name="delivery-time" value="45"><span>less than 45 minutes</span></label>
    </div>
    <div class="filter-actions">
      <button class="filter-apply" data-apply-filter>Apply</button>
      <button class="filter-clear" data-clear-filter>Clear Filters</button>
    </div>
  </section>

  <section id="veg-sheet" class="filter-sheet" role="dialog" aria-modal="true" aria-labelledby="veg-title" hidden>
    <div class="filter-sheet-head">
      <h2 id="veg-title" class="filter-sheet-title">Veg/Non-Veg</h2>
      <button class="filter-sheet-close" data-close-filter aria-label="Close">×</button>
    </div>
    <div class="filter-options">
      <label class="filter-option"><input type="radio" name="food-type" value="veg"><span>Veg</span></label>
      <label class="filter-option"><input type="radio" name="food-type" value="nonveg"><span>Non Veg</span></label>
    </div>
    <div class="filter-actions">
      <button class="filter-apply" data-apply-filter>Apply</button>
      <button class="filter-clear" data-clear-filter>Clear Filters</button>
    </div>
  </section>

  <section id="price-sheet" class="filter-sheet" role="dialog" aria-modal="true" aria-labelledby="price-title" hidden>
    <div class="filter-sheet-head">
      <h2 id="price-title" class="filter-sheet-title">Rs 99 and under</h2>
      <button class="filter-sheet-close" data-close-filter aria-label="Close">×</button>
    </div>
    <div class="filter-options">
      <label class="filter-option"><input type="checkbox" name="price-range" value="49-99"><span>₹49 - ₹99</span></label>
      <label class="filter-option"><input type="checkbox" name="price-range" value="0-49"><span>₹0 - ₹49</span></label>
    </div>
    <div class="filter-actions">
      <button class="filter-apply" data-apply-filter>Apply</button>
      <button class="filter-clear" data-clear-filter>Clear Filters</button>
    </div>
  </section>
</div>
<div id="toast" class="toast"></div>

<script>
(() => {
  const API = 'https://eatswada.onrender.com/api/restaurants/under99';
  const $ = id => document.getElementById(id);
  const esc = value => String(value ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
  const num = (value, fallback=0) => {
    const n = Number(value);
    return Number.isFinite(n) ? n : fallback;
  };

  let allRestaurants = [];
  let discountOnly = true;

  function showToast(message){
    const t=$('toast');
    if(!t)return;
    t.textContent=message;
    t.style.display='block';
    clearTimeout(window.__toastTimer);
    window.__toastTimer=setTimeout(()=>t.style.display='none',1800);
  }
  window.showToast = showToast;

  function normalizeRestaurant(raw){
    const r = raw?.restaurant && typeof raw.restaurant === 'object'
      ? raw.restaurant : raw;
    const menu = Array.isArray(raw?.menu) ? raw.menu.map(item => ({
      id:item.id || item._id || '',
      name:item.name || 'Item',
      description:item.description || '',
      price:num(item.price),
      originalPrice:item.originalPrice == null ? null : num(item.originalPrice),
      discountPercent:item.discountPercent == null ? null : num(item.discountPercent),
      image:item.image || '',
      isVeg:Boolean(item.isVeg),
      category:item.category || 'Recommended',
      isUnder99:Boolean(item.isUnder99 ?? num(item.price) <= 99),
      isBestseller:Boolean(item.isBestseller),
      isRecommended:Boolean(item.isRecommended),
      inStock:item.inStock !== false,
      customizations:Array.isArray(item.customizations) ? item.customizations : []
    })).filter(item => item.price > 0) : [];

    menu.sort((a,b) => a.price-b.price || String(a.name).localeCompare(String(b.name)));
    return {
      id:String(r?.id || r?._id || ''),
      name:r?.name || 'Restaurant',
      image:r?.image || '',
      images:Array.isArray(r?.images) ? r.images : [],
      rating:num(r?.rating,0),
      ratingCount:r?.ratingCount ?? '',
      deliveryTime:String(r?.deliveryTime || ''),
      cuisine:Array.isArray(r?.cuisine) ? r.cuisine.join(', ') : String(r?.cuisine || ''),
      offer:String(r?.offer || ''),
      freeDeliveryAbove:r?.freeDeliveryAbove == null ? null : num(r.freeDeliveryAbove),
      deliveryFee:r?.deliveryFee,
      menu
    };
  }

  function passesFilters(r){
    if(deliveryLimit !== null && deliveryMaxMinutes(r.deliveryTime) > deliveryLimit){
      return { visible:[], qualifies:false };
    }
    const visible = r.menu.filter(item => {
      if(item.price > 99) return false;
      if(foodType==='veg' && !item.isVeg) return false;
      if(foodType==='nonveg' && item.isVeg) return false;
      if(priceRanges.length){
        const inRange = priceRanges.some(range => {
          const [lo,hi]=range.split('-').map(Number);
          return item.price >= lo && item.price <= hi;
        });
        if(!inRange) return false;
      }
      if(discountOnly && item.discountPercent != null && num(item.discountPercent) < 20) return false;
      return true;
    });
    return { visible, qualifies: visible.length > 0 };
  }

  function render(){
    const list=$('under99-list');
    const skeleton=$('skeleton-feed');
    if(!list)return;

    let groups = allRestaurants.map(r => ({r, ...passesFilters(r)})).filter(x => x.qualifies);
    if(sortMode==='rating') groups.sort((a,b)=>b.r.rating-a.r.rating);
    if(sortMode==='price') groups.sort((a,b)=>(a.visible[0]?.price||Infinity)-(b.visible[0]?.price||Infinity));

    skeleton.style.display='none';
    list.style.display='flex';
    $('item-count').textContent = groups.length
      ? `${groups.length} Restaurant${groups.length===1?'':'s'}`
      : 'Deals for you';

    if(!groups.length){
      list.innerHTML='<div class="empty"><div style="font-size:35px">₹</div><h3>No deals match these filters</h3><p>Try another price or food preference.</p></div>';
      return;
    }

    list.innerHTML='';
    groups.forEach(({r, visible}, index) => {
      // The component receives the restaurant's COMPLETE menu, not only the filtered items.
      const cardData={...r, menu:r.menu};
      const host=window.Eatswada99Card.createRestaurantCard(cardData);
      host.style.animation=`fadeUp .3s ease both`;
      host.style.animationDelay=`${Math.min(index*.035,.25)}s`;
      list.appendChild(host);
    });
    if(typeof window.updateGlobalCart==='function') window.updateGlobalCart();
  }

  window.toggleDiscount=()=>{
    discountOnly=!discountOnly;
    updateFilterButtons();
    render();
  };

  let activeSheet = null;
  let deliveryLimit = null;
  let foodType = 'all';
  let priceRanges = [];

  function getSheet(name){
    if(name==='all') return $('all-sheet');
    if(name==='delivery') return $('delivery-sheet');
    if(name==='veg') return $('veg-sheet');
    return $('price-sheet');
  }

  function openFilter(name){
    const backdrop=$('filter-backdrop');
    if(!backdrop)return;
    document.querySelectorAll('.filter-sheet').forEach(s=>{
      s.hidden = s.id !== `${name}-sheet`;
    });
    activeSheet=name;
    backdrop.classList.add('open');
    backdrop.setAttribute('aria-hidden','false');
    document.body.classList.add('filter-open');
    syncSheetInputs(name);
  }

  function closeFilter(){
    const backdrop=$('filter-backdrop');
    if(!backdrop)return;
    backdrop.classList.remove('open');
    backdrop.setAttribute('aria-hidden','true');
    document.body.classList.remove('filter-open');
    setTimeout(()=>document.querySelectorAll('.filter-sheet').forEach(s=>s.hidden=true),240);
    activeSheet=null;
  }

  function syncSheetInputs(name){
    if(name==='all'){
      const d=$('all-discount');
      if(d)d.checked=discountOnly;
      document.querySelectorAll('input[name="all-food-type"]').forEach(i=>i.checked=i.value===foodType);
      document.querySelectorAll('input[name="all-price-range"]').forEach(i=>i.checked=priceRanges.includes(i.value));
    }else if(name==='delivery'){
      document.querySelectorAll('input[name="delivery-time"]').forEach(i=>i.checked=Number(i.value)===deliveryLimit);
    }else if(name==='veg'){
      document.querySelectorAll('input[name="food-type"]').forEach(i=>i.checked=i.value===foodType);
    }else{
      document.querySelectorAll('input[name="price-range"]').forEach(i=>i.checked=priceRanges.includes(i.value));
    }
  }

  function updateFilterButtons(){
    $('discount-btn')?.classList.toggle('active',discountOnly);
    $('veg-btn')?.classList.toggle('active',foodType!=='all');$('price-btn')?.classList.toggle('active',priceRanges.length>0);
    $('delivery-btn')?.classList.toggle('active',deliveryLimit!==null);$('sort-btn')?.classList.toggle('has-filter',
      foodType!=='all'||priceRanges.length>0||deliveryLimit!==null||!discountOnly);
  }

  function applyFilter(){
    if(activeSheet==='all'){
      discountOnly=Boolean($('all-discount')?.checked);
      const food=document.querySelector('input[name="all-food-type"]:checked');
      foodType=food ? food.value : 'all';
      priceRanges=[...document.querySelectorAll('input[name="all-price-range"]:checked')].map(i=>i.value);
    }else if(activeSheet==='delivery'){
      const checked=document.querySelector('input[name="delivery-time"]:checked');
      deliveryLimit=checked ? Number(checked.value) : null;
    }else if(activeSheet==='veg'){
      const checked=document.querySelector('input[name="food-type"]:checked');
      foodType=checked ? checked.value : 'all';
    }else if(activeSheet==='price'){
      priceRanges=[...document.querySelectorAll('input[name="price-range"]:checked')].map(i=>i.value);
    }
    updateFilterButtons();
    closeFilter();
    render();
  }

  function clearFilter(){
    if(activeSheet==='all'){
      discountOnly=true;
      foodType='all';
      priceRanges=[];
      deliveryLimit=null;
    }else if(activeSheet==='delivery'){
      deliveryLimit=null;
    }else if(activeSheet==='veg'){
      foodType='all';
    }else if(activeSheet==='price'){
      priceRanges=[];
    }
    updateFilterButtons();
    closeFilter();
    render();
  }

  function deliveryMaxMinutes(value){
    const matches=String(value||'').match(/\d+/g);
    return matches && matches.length ? Math.max(...matches.map(Number)) : Infinity;
  }

  document.addEventListener('click', event=>{
    const open=event.target.closest('[data-open-filter]');
    if(open){ openFilter(open.dataset.openFilter); return; }
    if(event.target.closest('[data-close-filter]')){ closeFilter(); return; }
    if(event.target.closest('[data-apply-filter]')){ applyFilter(); return; }
    if(event.target.closest('[data-clear-filter]')){ clearFilter(); return; }
    if(event.target=== $('filter-backdrop')) closeFilter();
  });

  document.addEventListener('keydown', event=>{
    if(event.key==='Escape' && activeSheet) closeFilter();
  });


  /* 99 Store artwork only. The benchmark visual/text/background are fixed.
   Backend/Admin may provide the transparent food artwork only. */
  const HERO_API='https://eatswada.onrender.com/api/home-banners?placement=under99';

  async function loadUnder99Hero(){
    const art=$('u99-hero-art');
    try{
      const response=await fetch(HERO_API,{headers:{Accept:'application/json'},cache:'no-store'});
      if(!response.ok) throw new Error(`Hero HTTP ${response.status}`);
      const result=await response.json();
      const banners=Array.isArray(result?.data)?result.data:[];
      const banner=banners[0];
      const image=String(banner?.mobileImage||banner?.image||'').trim();
      if(image&&art){art.src=image;art.hidden=false;}
    }catch(error){
      console.warn('[99 Store] Artwork could not be loaded:',error);
    }
  }

  async function fetchJson(url, timeoutMs=12000){
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),timeoutMs);
    try{
      const response=await fetch(url,{
        headers:{Accept:'application/json'},
        cache:'no-store',
        signal:controller.signal
      });
      if(!response.ok) throw new Error(`HTTP ${response.status}`);
      return await response.json();
    }finally{
      clearTimeout(timer);
    }
  }

  function flattenMenuPayload(payload){
    const data=payload?.data ?? payload;
    if(Array.isArray(data)) return data;
    if(!data || typeof data!=='object') return [];

    for(const key of ['menu','items','results']){
      if(Array.isArray(data[key])) return data[key];
    }

    const groups=[];
    for(const value of Object.values(data)){
      if(Array.isArray(value)) groups.push(...value);
      else if(value && typeof value==='object'){
        for(const nested of Object.values(value)){
          if(Array.isArray(nested)) groups.push(...nested);
        }
      }
    }
    return groups;
  }

  function extractArray(payload, preferredKeys=[]){
    const seen=new Set();
    function walk(value, depth=0){
      if(depth>5 || value==null) return [];
      if(Array.isArray(value)) return value;
      if(typeof value!=='object' || seen.has(value)) return [];
      seen.add(value);
      for(const key of preferredKeys){
        if(Array.isArray(value[key])) return value[key];
      }
      for(const key of ['data','restaurants','items','results','docs','records','list']){
        if(Array.isArray(value[key])) return value[key];
      }
      for(const child of Object.values(value)){
        const found=walk(child,depth+1);
        if(found.length) return found;
      }
      return [];
    }
    return walk(payload);
  }

  async function loadRestaurantsWithMenus(){
    const result=await fetchJson(
      'https://eatswada.onrender.com/api/restaurants?limit=50&sort=rating',
      30000
    );
    const restaurants=extractArray(result,['restaurants','data']);
    if(!restaurants.length) throw new Error('Restaurant list returned no usable data');

    const enriched=await Promise.all(restaurants.slice(0,50).map(async r=>{
      const existingMenu=Array.isArray(r?.menu) ? r.menu : [];
      if(existingMenu.length) return {...r,menu:existingMenu};

      const id=String(r?._id||r?.id||r?.restaurantId||'');
      if(!id) return null;

      try{
        const menuPayload=await fetchJson(
          `https://eatswada.onrender.com/api/restaurants/${encodeURIComponent(id)}/menu`,
          15000
        );
        const menu=flattenMenuPayload(menuPayload);
        return {...r,menu};
      }catch(error){
        console.warn('[99 Store] menu load failed for',id,error);
        return null;
      }
    }));

    return enriched.filter(r=>r && Array.isArray(r.menu) && r.menu.length);
  }

  function showLoadError(message){
    const skeleton=$('skeleton-feed');
    const list=$('under99-list');
    if(skeleton)skeleton.style.display='none';
    if(!list)return;

    list.style.display='flex';
    list.innerHTML=`
      <div class="empty">
        <div style="font-size:35px">!</div>
        <h3>Couldn’t load deals</h3>
        <p>${esc(message || 'We could not load the restaurant menu data right now.')}</p>
        <button id="u99-retry" style="margin-top:14px;border:0;border-radius:999px;padding:11px 20px;background:#e11d8d;color:#fff;font-weight:800">Retry</button>
      </div>`;
    $('u99-retry')?.addEventListener('click',load);
  }

  async function load(){
    const skeleton=$('skeleton-feed');
    const list=$('under99-list');
    const MAX_ATTEMPTS=3;

    if(skeleton)skeleton.style.display='flex';
    if(list)list.style.display='none';

    let lastError=null;

    for(let attempt=1; attempt<=MAX_ATTEMPTS; attempt++){
      try{
        /*
         * PRIMARY SOURCE:
         * The current backend returns:
         * { success, count, data: [{ restaurant: {...}, menu: [...] }] }
         * from GET /api/restaurants/under99.
         */
        const result=await fetchJson(
          'https://eatswada.onrender.com/api/restaurants/under99?cb='+Date.now(),
          30000
        );

        if(result?.success===false){
          throw new Error(result.message || '99 Store API returned success:false');
        }

        const raw=Array.isArray(result?.data)
          ? result.data
          : (Array.isArray(result) ? result : []);

        console.info('[99 Store] API response:', {
          success: result?.success,
          count: result?.count,
          rows: raw.length
        });

        if(raw.length){
          const normalized=raw
            .map(rawItem=>normalizeRestaurant(rawItem))
            .filter(r=>r.id && r.menu.length);

          if(normalized.length){
            allRestaurants=normalized;
            updateFilterButtons();
            render();
            return;
          }

          throw new Error('99 Store returned rows, but no usable restaurant/menu data was found');
        }

        /*
         * If the dedicated endpoint is empty, use the normal restaurant
         * + menu endpoints as a fallback. This also helps while older
         * restaurant documents are being migrated.
         */
        console.warn('[99 Store] Dedicated endpoint returned no rows; trying restaurant/menu fallback.');
        const fallback=await loadRestaurantsWithMenus();

        const normalizedFallback=fallback
          .map(rawItem=>normalizeRestaurant(rawItem))
          .filter(r=>r.id && r.menu.length);

        if(normalizedFallback.length){
          allRestaurants=normalizedFallback;
          updateFilterButtons();
          render();
          return;
        }

        // This is a valid empty state, not a network/server error.
        allRestaurants=[];
        if(skeleton)skeleton.style.display='none';
        if(list){
          list.style.display='flex';
          list.innerHTML='<div class="empty"><div style="font-size:35px">₹</div><h3>No ₹99 deals available</h3><p>There are no qualifying restaurant deals available right now.</p></div>';
        }
        return;

      }catch(error){
        lastError=error;
        console.error(`[99 Store] load attempt ${attempt} failed:`,error);

        if(attempt<MAX_ATTEMPTS){
          await new Promise(res=>setTimeout(res, attempt*2000));
        }
      }
    }

    showLoadError(
      lastError?.message
        ? `We could not load the restaurant data. (${lastError.message})`
        : 'We could not load the restaurant menu data right now.'
    );
  }

  document.addEventListener('DOMContentLoaded',()=>{ loadUnder99Hero(); load(); });
})();
</script>
<style>
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
</style>

<script>
/* ===== 99 STORE — SHARED EATSWADA LOCATION ===== */
(() => {
  const LOCATION_KEYS=[
    'nearbite_address','nearbite_selected_address','nearbite_onboarding_geocode','nearbite_onboarding_location',
    'eatswada_location','userLocation','deliveryLocation',
    'selectedLocation','location'
  ];
  const CHANGE_LOCATION_URL='location-onboarding.html';

  function parseValue(value){
    if(value==null)return null;
    if(typeof value==='string'){
      const t=value.trim(); if(!t)return null;
      try{return parseValue(JSON.parse(t));}catch{return t;}
    }
    if(Array.isArray(value)){
      for(const item of value){const found=parseValue(item);if(found)return found;}
      return null;
    }
    if(typeof value==='object'){
      const preferred=[
        value.area,value.locality,value.neighborhood,value.suburb,
        value.formattedAddress,value.formatted_address,value.addressLine,value.addressLine1,
        value.localityName,value.areaName,value.neighborhoodName,value.street,
        value.address,value.label,value.name,value.city,value.town
      ];
      for(const item of preferred)if(typeof item==='string'&&item.trim())return item.trim();
      for(const key of ['addressData','address','location','geocode','data']){
        if(value[key]&&typeof value[key]==='object'){
          const found=parseValue(value[key]);if(found)return found;
        }
      }
    }
    return null;
  }

  function readSavedLocation(){
    for(const key of LOCATION_KEYS){
      try{const found=parseValue(localStorage.getItem(key));if(found)return found;}catch{}
    }
    return null;
  }

  function updateLocationUI(){
    const pill=document.getElementById('loc-pill');
    const nameEl=document.getElementById('loc-name');
    const subEl=document.getElementById('loc-sub');
    if(!pill||!nameEl)return;
    const saved=readSavedLocation();
    if(saved){
      nameEl.textContent=saved;
      if(subEl)subEl.textContent='Within 10 km';
      pill.classList.remove('loc-unset');
    }else{
      nameEl.textContent='Set location';
      if(subEl)subEl.textContent='Tap to choose your area';
      pill.classList.add('loc-unset');
    }
  }

  document.addEventListener('DOMContentLoaded',()=>{
    updateLocationUI();
    const pill=document.getElementById('loc-pill');
    if(pill)pill.addEventListener('click',()=>{window.location.href=CHANGE_LOCATION_URL;});
    window.addEventListener('storage',updateLocationUI);
  });
})();
</script>
