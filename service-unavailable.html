<!doctype html>
<html lang="en">
<head>
<meta name="color-scheme" content="light dark">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<script>(function(){try{var t=localStorage.getItem('eatswada_theme');if(t==='dark')document.documentElement.dataset.ewTheme='dark';}catch(e){}})();</script>
<script src="https://cdn.jsdelivr.net/npm/darkreader@4.9.133/darkreader.js" data-ew-dark-reader></script>
<script src="eatswada-theme.js"></script>
<meta name="theme-color" content="#10284d">
<title>We'll be there soon · Eatswada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--navy:#10284d;--ink:#172033;--muted:#727987;--pink:#c50057;--line:#e9ebef;--font:'Manrope',system-ui,-apple-system,sans-serif;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:var(--font);color:var(--ink);background:#fff}
body{min-height:100svh}
.page{min-height:100svh;display:flex;flex-direction:column;background:#fff}
.hero{position:relative;overflow:hidden;height:57svh;min-height:430px;max-height:620px;background:var(--navy);color:#fff;border-radius:0 0 50% 8%/0 0 8% 8%;isolation:isolate}
.hero:after{content:'';position:absolute;left:-10%;right:-10%;bottom:-78px;height:150px;background:#fff;border-radius:50% 50% 0 0/100% 100% 0 0;z-index:2}
.top{position:relative;z-index:5;padding:calc(20px + var(--safe-t)) 20px 0;display:flex;align-items:center;justify-content:space-between}
.back{width:40px;height:40px;border:0;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);color:#fff;font-size:15px;cursor:pointer}
.logo{font-size:18px;font-weight:800;letter-spacing:-.5px}
.illustration{position:absolute;inset:78px 0 36px;z-index:1;display:grid;place-items:center}
.orbit{position:absolute;border:1.5px solid rgba(255,255,255,.7);border-radius:50%;width:235px;height:78px;transform:rotate(-8deg)}
.orbit.o2{width:320px;height:105px;transform:rotate(18deg);opacity:.55}
.planet{width:154px;height:92px;border-radius:50%;background:#ff123f;transform:rotate(8deg);box-shadow:inset 0 -17px 0 rgba(196,0,43,.32),0 15px 30px rgba(0,0,0,.16);position:relative}
.planet:before{content:'';position:absolute;left:24px;right:24px;top:25px;height:13px;border-radius:50%;background:#f9e84d;box-shadow:45px 7px 0 #f9e84d,82px -4px 0 #f9e84d}
.food{position:absolute;font-size:42px;filter:drop-shadow(0 8px 7px rgba(0,0,0,.12));animation:float 4s ease-in-out infinite}
.food.f1{right:7%;top:12%;font-size:72px;animation-delay:-1s}.food.f2{left:5%;bottom:10%;font-size:54px;animation-delay:-2.2s}.food.f3{right:11%;bottom:20%;font-size:22px;animation-delay:-.4s}.food.f4{left:29%;top:18%;font-size:20px;animation-delay:-2.8s}
.star{position:absolute;width:5px;height:5px;background:#fff;border-radius:50%;opacity:.8}.s1{left:9%;top:35%}.s2{right:29%;top:27%}.s3{left:45%;bottom:21%}.s4{right:6%;bottom:17%}.s5{left:18%;bottom:31%}
@keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-9px) rotate(3deg)}}
.content{position:relative;z-index:4;margin-top:-6px;padding:0 24px calc(26px + var(--safe-b));text-align:center;flex:1;display:flex;flex-direction:column;align-items:center}
.content h1{margin:0;font-size:25px;line-height:1.2;letter-spacing:-.8px;font-weight:800;color:#172033}
.content p{max-width:420px;margin:9px auto 0;font-size:14px;line-height:1.55;font-weight:500;color:var(--muted)}
.location-card{width:min(100%,460px);margin:24px auto 0;padding:13px 15px;border:1px solid var(--line);border-radius:15px;background:#fbfcfd;display:flex;align-items:center;gap:11px;text-align:left}
.location-icon{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#fce7f3;color:var(--pink);flex:none;font-size:13px}.location-copy{min-width:0}.location-label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#9aa0aa;font-weight:800}.location-value{margin-top:3px;font-size:13px;font-weight:700;color:#303746;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{width:min(100%,460px);margin-top:22px;display:grid;gap:10px}.btn{min-height:49px;border-radius:13px;border:0;font-family:inherit;font-size:14px;font-weight:800;cursor:pointer}.btn-primary{background:var(--pink);color:#fff;box-shadow:0 8px 20px rgba(197,0,87,.16)}.btn-secondary{background:#fff;color:#353b47;border:1px solid #dfe2e7}.btn:active{transform:scale(.985)}
.note{margin:17px 0 0;font-size:11px;color:#9aa0aa;font-weight:500}
@media(prefers-reduced-motion:reduce){.food{animation:none}}
</style>
<link rel="stylesheet" href="css/eatswada-ui-system.css?v=20260923-typography">
<link rel="stylesheet" href="eatswada-theme.css">
</head>
<body>
<main class="page">
  <section class="hero" aria-label="Eatswada service area">
    <div class="top"><button class="back" type="button" id="backBtn" aria-label="Back"><i class="fa-solid fa-arrow-left"></i></button><div class="logo">Eatswada</div><div style="width:40px"></div></div>
    <div class="illustration" aria-hidden="true">
      <div class="orbit"></div><div class="orbit o2"></div><div class="planet"></div>
      <span class="food f1">🍩</span><span class="food f2">🍕</span><span class="food f3">✦</span><span class="food f4">✦</span>
      <i class="star s1"></i><i class="star s2"></i><i class="star s3"></i><i class="star s4"></i><i class="star s5"></i>
    </div>
  </section>
  <section class="content">
    <h1>We’ll be there soon — hang tight!</h1>
    <p>Looks like online ordering isn’t available at your selected location yet. We’re expanding our delivery area.</p>
    <div class="location-card">
      <span class="location-icon"><i class="fa-solid fa-location-dot"></i></span>
      <div class="location-copy"><div class="location-label">Selected location</div><div class="location-value" id="locationValue">Your selected location</div></div>
    </div>
    <div class="actions">
      <button class="btn btn-primary" id="changeBtn">Change location</button>
      <button class="btn btn-secondary" id="exploreBtn">Explore Eatswada</button>
    </div>
    <div class="note">Eatswada currently delivers within a maximum 10 km radius of each available restaurant.</div>
  </section>
</main>
<script src="config.js"></script>
<script>
(function(){
  'use strict';
  function safe(v){return String(v||'').replace(/\s+/g,' ').trim()}
  function getLocationLabel(){
    try{
      const a=JSON.parse(localStorage.getItem('nearbite_address')||'null');
      if(a){const text=[a.house,a.area,a.city].map(safe).filter(Boolean).join(', ');if(text)return text}
    }catch(e){}
    try{
      const g=JSON.parse(localStorage.getItem('nearbite_onboarding_geocode')||'null');
      const text=safe(g?.display_name);if(text)return text;
    }catch(e){}
    return 'Your selected location';
  }
  document.getElementById('locationValue').textContent=getLocationLabel();
  document.getElementById('changeBtn').onclick=function(){location.href='address.html?view=select'};
  document.getElementById('exploreBtn').onclick=function(){location.href='index.html?allowOutside=1'};
  document.getElementById('backBtn').onclick=function(){history.length>1?history.back():location.href='index.html?allowOutside=1'};
})();
</script>
<script src="navigation.js"></script>
</body>
</html>
